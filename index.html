<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 教师 · 主页</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="container">
  <header class="topbar">
    <span class="brand">AI 教师 <small>家庭知识课件库</small></span>
    <a class="btn-home" href="dict.html" style="margin-left:auto">🔍 查词</a>
    <a class="btn-home" href="map.html">🗺 地图</a>
    <a class="btn-home" href="settings.html">⚙ 设置</a>
  </header>

  <div class="hero">
    <h1>今天想学点什么？</h1>
    <p>语文 · 数学 · 英语 · 自然科学，从教材知识清单开始，一点一点打牢基础。</p>
  </div>

  <div id="today" class="today-card"></div>

  <div id="subj" class="subject-cards"></div>

  <div class="home-search-title">全局搜索知识点</div>
  <input id="home-search" class="search" type="search" placeholder="输入关键词，如：小数、乘法、观潮…" autocomplete="off">
  <div id="home-results" class="list" style="margin-top:10px"></div>

  <footer class="foot">
    <div>AI 教师 · 单一数据源驱动</div>
    <div class="ver" id="ver"></div>
  </footer>
</div>

<script src="assets/knowledge-base.js"></script>
<script src="assets/kb-utils.js"></script>
<script src="assets/record.js"></script>
<script>
(function () {
  "use strict";
  try {
    var util = window.KB;
    var KB = window.KNOWLEDGE_BASE;
    if (!util || !KB) { console.error("[主页] 数据源未加载"); return; }

    /* 今日任务卡片（回顾系统驱动） */
    var todayEl = document.getElementById("today");
    if (todayEl && window.Record) {
      try {
        var rec = window.Record;
        var st = rec.stats();
        var task = rec.dailyTask();
        var todayDoneSet = {};
        rec.todayDone().forEach(function (k) { todayDoneSet[k] = true; });
        var weakSet = {};
        rec.weakIds().forEach(function (k) { weakSet[k] = true; });
        var taskKps = ((task && task.ids) || []).map(function (id) { return util.get(id); }).filter(Boolean);

        /* 年级设置 */
        var settings = rec.getTaskSettings();
        var gradeLabel = settings.grades ? settings.grades.join("、") + " 年级" : "全部年级";
        var gradeOptions = [];
        KB.knowledgePoints.forEach(function (k) {
          if (k.status === "已完成" && gradeOptions.indexOf(k.grade) === -1) { gradeOptions.push(k.grade); }
        });
        gradeOptions.sort(function (a, b) { return a - b; });
        var panelOpen = window.__taskPanelOpen ? "block" : "none";
        var panelHtml = '<div class="task-settings-panel" id="task-settings-panel" style="display:' + panelOpen + '">';
        panelHtml += '<div class="set-title">每日任务抽取年级</div>';
        panelHtml += '<div class="set-opts">';
        panelHtml += '<label class="set-opt"><input type="radio" name="sg" value="all"' + (!settings.grades ? " checked" : "") + '><span>全部年级</span></label>';
        gradeOptions.forEach(function (g) {
          panelHtml += '<label class="set-opt"><input type="radio" name="sg" value="' + g + '"' + (settings.grades && settings.grades.indexOf(g) !== -1 ? " checked" : "") + '><span>' + g + " 年级</span></label>";
        });
        panelHtml += "</div>";
        panelHtml += '<div class="set-actions"><button class="set-save" onclick="saveTaskSettings()">保存并重新生成今日任务</button></div>';
        panelHtml += "</div>";

        var h = '<div class="today-head"><span>今日任务</span>' +
          '<button class="task-settings-btn" onclick="toggleTaskSettings()">⚙ 年级设置：' + gradeLabel + "</button></div>";
        h += '<div class="today-stat">今日已学 <b>' + st.today + '</b> 个 · 连续学习 <b>' + st.streak + '</b> 天 · 共得 <b>' + st.totalStars + '</b> 星</div>';
        h += panelHtml;

        if (taskKps.length) {
          h += '<div class="today-list">';
          taskKps.forEach(function (kp) {
            var done = !!todayDoneSet[kp.id];
            var isWeak = !!weakSet[kp.id];
            h += '<div class="today-reco' + (done ? " done" : "") + '">';
            h += '<div class="today-reco-label">' + (done ? "✓ 已完成" : (isWeak ? "薄弱点复习：" : "今天学这个：")) + "</div>";
            h += '<a class="today-reco-name" href="' + kp.file + '">' + kp.name + "</a>";
            h += '<div class="today-reco-meta"><span class="tag">' + util.subjectName(kp.subject) + '</span><span class="tag grade">' + kp.grade + "年级·" + (kp.term || "") + "</span>";
            if (isWeak) { h += '<span class="tag diff-挑战">薄弱点</span>'; }
            h += "</div>";
            h += '<div class="today-reco-sum">' + kp.summary + "</div>";
            h += done ? '<div class="today-done-badge">已完成</div>' : '<a class="today-btn" href="' + kp.file + '">开始学习 →</a>';
            h += "</div>";
          });
          h += "</div>";
          if (taskKps.every(function (kp) { return todayDoneSet[kp.id]; })) {
            h += '<div class="today-all-done">今日任务全部完成，明天继续！</div>';
          }
        } else {
          h += '<div class="today-done">当前设置下暂无可学习的知识点，试试调整抽取年级～</div>';
        }
        todayEl.innerHTML = h;
      } catch (e) { console.error("[主页] 今日任务渲染失败:", e); }
    }

    /* 学科入口卡片 */
    var subjEl = document.getElementById("subj");
    if (subjEl) {
      var html = "";
      KB.subjects.forEach(function (s) {
        var list = util.bySubject(s.id);
        var done = list.filter(function (k) { return k.status === "已完成"; }).length;
        html += '<a class="subj" href="' + (s.dir || s.id) + '/index.html">';
        html += '<div class="sname">' + s.name + "</div>";
        html += '<div class="smeta">' + list.length + " 个知识点 · 已完成 " + done + " 个</div>";
        html += "</a>";
      });
      subjEl.innerHTML = html;
    }

    /* 全局搜索 */
    var box = document.getElementById("home-search");
    var res = document.getElementById("home-results");
    if (box && res) {
      box.addEventListener("input", function () {
        var q = box.value.trim();
        if (!q) { res.innerHTML = ""; return; }
        var hits = util.search(q).slice(0, 20);
        if (!hits.length) { res.innerHTML = '<div class="empty">没有找到「' + q + "」，换个关键词试试～</div>"; return; }
        var h = "";
        hits.forEach(function (k) {
          var ok = k.status === "已完成" && k.file;
          h += '<a class="kp' + (ok ? "" : " todo") + '" href="' + (ok ? k.file : "javascript:void(0)") + '">';
          h += '<div class="name">' + k.name + ' <span class="tag">' + util.subjectName(k.subject) + "</span></div>";
          h += '<div class="summary">' + k.summary + "</div>";
          h += '<div class="tags"><span class="tag grade">' + k.grade + "年级·" + (k.term || "") + "</span>";
          h += '<span class="tag">' + (k.status === "已完成" ? "已完成" : "课件制作中") + "</span></div>";
          h += "</a>";
        });
        res.innerHTML = h;
      });
    }

    var verEl = document.getElementById("ver");
    if (verEl) { verEl.textContent = "数据版本 v" + KB.version + " · 更新于 " + KB.updatedAt; }
  } catch (e) {
    console.error("[主页] 渲染失败:", e);
  }
})();

/* 任务设置：年级选择面板 */
function toggleTaskSettings() {
  var p = document.getElementById("task-settings-panel");
  if (!p) { return; }
  var open = p.style.display === "none";
  p.style.display = open ? "block" : "none";
  window.__taskPanelOpen = open;
}
function saveTaskSettings() {
  var sel = document.querySelector('input[name="sg"]:checked');
  if (!sel || !window.Record) { return; }
  var val = sel.value;
  var s = val === "all" ? { grades: null } : { grades: [parseInt(val, 10)] };
  window.Record.saveTaskSettings(s);
  window.__taskPanelOpen = false;
  location.reload();
}
</script>
</body>
</html>
