<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>含括号的四则混合运算 · AI 教师</title>
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="../assets/course.css">
<style>
  .mx-box { margin: 12px 0; }
  .mx-tip { font-size: 15px; font-weight: 700; min-height: 26px; margin: 8px 0; color: var(--accent-deep); }
  .mx-rule { display: inline-block; background: #e8f6ff; border: 1px solid #91caff; color: #0b5e91; border-radius: 10px; padding: 6px 14px; font-size: 15px; font-weight: 700; margin-top: 8px; }
  .mx-expr { font-size: 32px; font-weight: 800; color: #d97706; text-align: center; margin: 10px 0; }
  .mx-expr span { display: inline-block; padding: 0 6px; border-radius: 8px; transition: all .35s; }
  .mx-expr .d2 { background: #ffefd5; }
  .mx-expr .d1 { background: #dceaff; }
  .mx-step { font-size: 22px; font-weight: 800; text-align: center; min-height: 34px; color: #2e7d32; }
  .mx-vs { display: flex; justify-content: center; gap: 26px; align-items: stretch; flex-wrap: wrap; }
  .mx-vs .card { border: 2px solid var(--border); border-radius: 14px; padding: 12px 18px; width: 240px; text-align: center; background: #fafcff; }
  .mx-vs .card b { font-size: 26px; color: var(--accent-deep); }
  .mx-vs .card .res { font-size: 20px; font-weight: 800; color: #2e7d32; }
  .mx-vs .card.diff { border-color: #e8890c; background: #fff8ec; }
</style>
</head>
<body>
<div class="container">
  <header class="topbar">
    <a class="btn-home" href="index.html">← 数学</a>
    <span class="brand">含括号的四则混合运算 <small>4年级·下册</small></span>
  </header>

  <div class="player">
    <div class="task-line" id="task-line"></div>
    <div class="stage" id="stage"></div>
    <div class="dots" id="dots"></div>
    <div class="controls">
      <button class="cbtn" id="btn-prev">上一步</button>
      <button class="cbtn" id="btn-auto">▶ 自动播放</button>
      <button class="cbtn" id="btn-voice">🔊 语音</button>
      <button class="cbtn main" id="btn-next">下一步</button>
    </div>
    <div class="score-row" id="score-row"></div>
  </div>

  <details class="parent-panel">
    <summary>家长模式（点击展开）</summary>
    <div class="pbody">
      <p><b>本课一句话总结：</b>四则运算顺序：先乘除后加减，有括号先算括号里面；加减是一级运算，乘除是二级运算。</p>
      <p><b>孩子容易走神的地方：</b>有括号仍先算乘除；强调"括号最大，先算括号"，再算乘除，最后加减。</p>
      <p><b>建议：</b>本课约 8 分钟；同一道算式摆"有括号"和"没括号"两种，对比结果不同。</p>
    </div>
  </details>

  <footer class="foot">
    <div>AI 教师 · 示范课件 math-4-032</div>
  </footer>
</div>

<script src="../assets/voice.js"></script>
<script src="../assets/player-core.js"></script>
<script>
(function () {
  "use strict";
  var apiRef = null;

  /* ========== 五段式步骤 ========== */
  var steps = [
    {
      id: "s1",
      title: "情境引入",
      task: "咱们这一步要做的：想想 25+18×2 先算什么！",
      voice: "25 加 18 乘 2，先算哪一步？记住：先乘除，后加减。所以先算 18 乘 2。今天学混合运算的顺序。",
      body: function () {
        return '' +
          '<h2>运算有顺序</h2>' +
          '<p class="mx-expr">25 + 18 × 2 = ?</p>' +
          '<div class="hint">👆 先乘除，后加减</div>';
      }
    },
    {
      id: "s2",
      title: "无括号运算顺序动画",
      task: "咱们这一步要做的：看动画先乘后加！",
      voice: "看动画。25 加 18 乘 2。先做乘：18 乘 2 等于 36。再做加：25 加 36 等于 61。记住了，先乘除后加减！",
      body: function () {
        return '' +
          '<h2>看动画：25 + 18 × 2</h2>' +
          '<div class="mx-box" id="d1">' +
          '<div class="mx-expr" id="mx1">25 + <span class="d2">18 × 2</span></div>' +
          '<div class="mx-step" id="st1">？</div>' +
          "</div>" +
          '<div class="mx-tip" id="d1-tip">准备开始…</div>' +
          '<div class="mx-rule">先乘除（二级），后加减（一级）</div>';
      }
    },
    {
      id: "s3",
      title: "括号改变顺序动画",
      task: "咱们这一步要做的：看动画括号优先！",
      voice: "看动画。给算式加上括号，变成括号里 25 加 18。括号最大，先算括号：25 加 18 等于 43，再乘 2 等于 86。看，没括号是 61，有括号是 86，结果不一样！",
      body: function () {
        return '' +
          '<h2>看动画：(25 + 18) × 2</h2>' +
          '<div class="mx-box" id="d2">' +
          '<div class="mx-expr" id="mx2"><span class="d1">(25 + 18)</span> × 2</div>' +
          '<div class="mx-step" id="st2">？</div>' +
          '<div class="mx-vs">' +
          '<div class="card"><b>无括号</b><div>25 + 18 × 2 = 61</div></div>' +
          '<div class="card diff"><b>有括号</b><div>(25 + 18) × 2 = <span class="res">86</span></div></div>' +
          "</div>" +
          "</div>" +
          '<div class="mx-tip" id="d2-tip">准备开始…</div>' +
          '<div class="mx-rule">括号 > 乘除 > 加减</div>';
      }
    },
    {
      id: "s4",
      title: "互动练习",
      task: "咱们这一步要做的：连闯 3 道混合运算题！",
      voice: "现在考考你！先算哪一步。",
      body: function () {
        return '' +
          '<h2>闯关练习</h2>' +
          '<div class="quiz" id="quiz"></div>';
      }
    },
    {
      id: "s5",
      title: "Boss 关",
      task: "咱们这一步要做的：算 (12+8)×3，领奖！",
      voice: "Boss 来啦！括号里 12 加 8 等于 20，再乘 3 等于 60！",
      body: function () {
        return '' +
          '<h2>Boss 关：(12 + 8) × 3 = ?</h2>' +
          '<div class="quiz" id="boss-quiz"></div>' +
          '<div class="result-big" id="result-stars"></div>';
      }
    }
  ];

  function runD1() {
    var tip = document.getElementById("d1-tip");
    var st = document.getElementById("st1");
    setTimeout(function () { if (tip) { tip.textContent = "① 先找乘除：18 × 2（高亮）"; } st.textContent = "先算 18 × 2"; }, 800);
    setTimeout(function () {
      var mx = document.getElementById("mx1");
      mx.innerHTML = "25 + <span class='d2'>36</span>";
      if (tip) { tip.textContent = "② 18 × 2 = 36"; }
      st.textContent = "18 × 2 = 36";
    }, 2600);
    setTimeout(function () {
      var mx = document.getElementById("mx1");
      mx.innerHTML = "<span class='d2'>61</span>";
      if (tip) { tip.textContent = "③ 25 + 36 = 61 ✅ 先乘后加"; }
      st.textContent = "25 + 36 = 61";
    }, 4400);
  }
  function runD2() {
    var tip = document.getElementById("d2-tip");
    var st = document.getElementById("st2");
    setTimeout(function () { if (tip) { tip.textContent = "① 括号最大：先算 (25 + 18)（高亮）"; } st.textContent = "先算括号 25 + 18"; }, 800);
    setTimeout(function () {
      var mx = document.getElementById("mx2");
      mx.innerHTML = "<span class='d1'>43</span> × 2";
      if (tip) { tip.textContent = "② 25 + 18 = 43"; }
      st.textContent = "25 + 18 = 43";
    }, 2600);
    setTimeout(function () {
      var mx = document.getElementById("mx2");
      mx.innerHTML = "<span class='d1'>86</span>";
      if (tip) { tip.textContent = "③ 43 × 2 = 86 ✅ 有括号和没括号结果不一样"; }
      st.textContent = "43 × 2 = 86";
    }, 4400);
  }

  /* ========== S4 练习 ========== */
  var QUIZ = [
    { q: "12 + 8 × 3 先算哪一步？", right: "8 × 3", opts: ["8 × 3", "12 + 8", "随便"] },
    { q: "(12 + 8) × 3 先算哪一步？", right: "12 + 8", opts: ["12 + 8", "8 × 3", "随便"] },
    { q: "20 + 30 ÷ 5 = ?", right: "26", opts: ["26", "10", "50"] }
  ];
  var quizDone = { q1: false, q2: false, q3: false };
  function startQuiz() {
    quizDone = { q1: false, q2: false, q3: false };
    renderQuiz();
  }
  function renderQuiz() {
    var box = document.getElementById("quiz");
    if (!box) { return; }
    var idx = -1;
    ["q1", "q2", "q3"].forEach(function (k, i) { if (!quizDone[k] && idx === -1) { idx = i; } });
    if (idx === -1) { box.innerHTML = '<div class="q">全部完成！⭐ 你真棒</div>'; return; }
    var q = QUIZ[idx];
    box.innerHTML = '<div class="q">第 ' + (idx + 1) + " 题：" + q.q + "</div>" +
      '<div class="opts">' + q.opts.map(function (o) {
        return '<div class="opt" data-ok="' + (o === q.right ? "1" : "0") + '">' + o + "</div>";
      }).join("") + "</div>" +
      "<div class='qmsg'></div><button class='qnext' disabled>下一题</button>";
    var tried = false;
    var opts = box.querySelectorAll(".opt");
    opts.forEach(function (o) {
      o.addEventListener("click", function () {
        if (tried) { return; }
        var ok = o.getAttribute("data-ok") === "1";
        var msg = box.querySelector(".qmsg");
        if (ok) {
          o.classList.add("right");
          opts.forEach(function (x) { x.classList.add("locked"); });
          apiRef.addStars(1); apiRef.comboHit();
          msg.className = "qmsg ok";
          msg.textContent = "对啦！⭐ +1" + (apiRef.state.combo >= 2 ? "（连击 +" + apiRef.state.combo + "）" : "");
          box.querySelector(".qnext").disabled = false;
        } else {
          o.classList.add("wrong");
          tried = true;
          apiRef.comboReset();
          msg.className = "qmsg no";
          msg.textContent = "括号最大 → 再乘除 → 后加减";
          setTimeout(function () { o.classList.remove("wrong"); tried = false; }, 1700);
        }
      });
    });
    box.querySelector(".qnext").addEventListener("click", function () {
      quizDone["q" + (idx + 1)] = true;
      renderQuiz();
    });
  }

  /* ========== S5 Boss ========== */
  function startBoss() {
    var box = document.getElementById("boss-quiz");
    if (!box) { return; }
    box.innerHTML = '<div class="q">(12 + 8) × 3 = ?</div>' +
      '<div class="opts">' +
      '<div class="opt" data-ok="1">60</div>' +
      '<div class="opt" data-ok="0">44</div>' +
      '<div class="opt" data-ok="0">36</div>' +
      "</div><div class='qmsg'></div>";
    var rs = document.getElementById("result-stars");
    var tried = false;
    box.querySelectorAll(".opt").forEach(function (o) {
      o.addEventListener("click", function () {
        if (tried) { return; }
        var ok = o.getAttribute("data-ok") === "1";
        var msg = box.querySelector(".qmsg");
        if (ok) {
          o.classList.add("right");
          box.querySelectorAll(".opt").forEach(function (x) { x.classList.add("locked"); });
          apiRef.addStars(2); apiRef.comboHit();
          msg.className = "qmsg ok";
          msg.textContent = "Boss 击败！⭐ +2 混合运算你掌握啦！";
          if (rs) {
            var n = apiRef.stars();
            rs.innerHTML = "🏆 共获得 <b>" + n + "</b> 颗星" +
              (n >= 8 ? "（全部拿下！）" : n >= 5 ? "（很不错！）" : "（下次再来！）");
          }
        } else {
          o.classList.add("wrong");
          tried = true;
          apiRef.comboReset();
          msg.className = "qmsg no";
          msg.textContent = "先算括号：12+8=20，20×3=60";
          setTimeout(function () { o.classList.remove("wrong"); tried = false; }, 1600);
        }
      });
    });
  }

  /* ========== 启动 ========== */
  function onEnterStep(step, api) {
    apiRef = api;
    if (step.id === "s2") { runD1(); }
    if (step.id === "s3") { runD2(); }
    if (step.id === "s4") { startQuiz(); }
    if (step.id === "s5") { startBoss(); }
  }

  PlayerCore.init({
    steps: steps,
    parent: {
      summary: "四则运算顺序：先乘除后加减，有括号先算括号里面；加减是一级运算，乘除是二级运算。",
      attention: "孩子有括号时仍先算乘除；强调「括号最大，先算括号」，再算乘除，最后加减。",
      tip: "本课约 8 分钟；同一道算式摆「有括号」和「没括号」两种，对比结果不同。"
    },
    onEnterStep: onEnterStep,
    settings: { autoStopSteps: [3, 4], pauseMs: 2500 }
  });
})();
</script>
</body>
</html>
