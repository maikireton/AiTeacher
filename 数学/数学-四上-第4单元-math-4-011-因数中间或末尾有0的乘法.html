<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>因数中间或末尾有 0 的乘法 · AI 教师</title>
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="../assets/course.css">
<style>
  .z-wrap { display: flex; gap: 18px; justify-content: center; align-items: center; flex-wrap: wrap; margin: 14px 0; }
  .z-cell { font-size: 30px; font-weight: 800; background: var(--card); border: 2px solid var(--border); border-radius: 14px; padding: 14px 20px; transition: all .4s; }
  .z-cell.hl { border-color: var(--accent-deep); background: rgba(155,187,244,.16); }
  .z-cell.gray { color: #b0b7c3; border-style: dashed; }
  .z-cell.red { border-color: var(--red); color: #c23a3d; background: rgba(234,102,104,.1); }
  .z-cell.green { border-color: #8bc34a; color: #2e7d32; background: rgba(139,195,74,.14); }
  .z-cell .zero { display: inline-block; animation: zPop .45s ease; }
  .z-cell .zero.mid { color: #c23a3d; }
  @keyframes zPop { 0% { transform: scale(0); opacity: 0; } 70% { transform: scale(1.4); } 100% { transform: scale(1); } }
  .z-arrow { font-size: 30px; color: var(--text-2); }
  .z-tip { font-size: 15px; font-weight: 700; min-height: 26px; margin: 10px 0; color: var(--accent-deep); }
  .z-rule { display: inline-block; background: #fff7e6; border: 1px solid #ffd591; color: #ad6800; border-radius: 10px; padding: 6px 12px; font-size: 14px; margin-top: 8px; }
</style>
</head>
<body>
<div class="container">
  <header class="topbar">
    <a class="btn-home" href="index.html">← 数学</a>
    <span class="brand">因数中间或末尾有 0 的乘法 <small>4年级·上册</small></span>
  </header>

  <div class="player">
    <div class="task-line" id="task-line"></div>
    <div class="stage" id="stage"></div>
    <div class="dots" id="dots"></div>
    <div class="controls">
      <button class="cbtn" id="btn-prev">上一步</button>
      <button class="cbtn" id="btn-auto">▶ 自动播放</button>
      <button class="cbtn" id="btn-voice">🔊 语音</button>
      <button class="cbtn main" id="btn-next">下一步</button>
    </div>
    <div class="score-row" id="score-row"></div>
  </div>

  <details class="parent-panel">
    <summary>家长模式（点击展开）</summary>
    <div class="pbody">
      <p><b>本课一句话总结：</b>因数末尾有 0：先把 0 前面的数相乘，再在积的末尾添上相应个数的 0；中间的 0 要照常参与计算。</p>
      <p><b>孩子容易走神的地方：</b>末尾添 0 的个数算错（两个因数末尾各有几个 0 要加起来）；或把中间的 0 也省掉。</p>
      <p><b>建议：</b>本课约 8 分钟；重点对比「末尾的 0 最后添、中间的 0 要照算」。</p>
    </div>
  </details>

  <footer class="foot">
    <div>AI 教师 · 示范课件 math-4-011</div>
  </footer>
</div>

<script src="../assets/voice.js"></script>
<script src="../assets/player-core.js"></script>
<script src="../assets/record.js"></script>
<script>
(function () {
  "use strict";
  var apiRef = null;

  /* ========== 五段式步骤 ========== */
  var steps = [
    {
      id: "s1",
      title: "情境引入",
      task: "咱们这一步要做的：快速算出 160 × 30！",
      voice: "一百六十乘三十，后面跟着零，数起来好多。有没有又快又不会错的办法？今天学因数末尾有零的乘法秘诀。",
      body: function () {
        return '' +
          '<h2>160 × 30 = ？</h2>' +
          '<p class="big">160 × 30</p>' +
          '<p>两个因数后面都带着 0，直接列竖式又慢又容易错。</p>' +
          '<div class="hint">👆 想一想：能不能先把 0 放一边再算？</div>';
      }
    },
    {
      id: "s2",
      title: "末尾有 0 的乘法动画",
      task: "咱们这一步要做的：看动画学会「先算非零部分，再添 0」！",
      voice: "看动画。一百六十乘三十。先把两个因数末尾的零放一边，算十六乘三等于四十八。因数末尾一共有两个零，就在四十八后面添两个零，变成四千八百。",
      body: function () {
        return '' +
          '<h2>看动画：160 × 30</h2>' +
          '<div class="z-wrap" id="z1"></div>' +
          '<div class="z-tip" id="z1-tip">准备开始…</div>' +
          '<div class="z-rule">末尾的 0 最后添：因数末尾共有 2 个 0 → 积末尾添 2 个 0</div>';
      }
    },
    {
      id: "s3",
      title: "中间有 0 的乘法动画",
      task: "咱们这一步要做的：看动画分清「中间的 0 要照算」！",
      voice: "再看中间有零的：一百零六乘三十。注意，中间这个零要参加计算，不能省。先算一百零六乘三等于三百一十八，末尾一个零，添上，就是三千一百八十。",
      body: function () {
        return '' +
          '<h2>看动画：106 × 30</h2>' +
          '<div class="z-wrap" id="z2"></div>' +
          '<div class="z-tip" id="z2-tip">准备开始…</div>' +
          '<div class="z-rule">中间的 0 要照算，只有末尾的 0 才最后添</div>';
      }
    },
    {
      id: "s4",
      title: "互动练习",
      task: "咱们这一步要做的：连闯 3 道带 0 乘法！",
      voice: "现在轮到你啦！记住：末尾的零最后添，中间的零要照算。",
      body: function () {
        return '' +
          '<h2>闯关练习</h2>' +
          '<div class="quiz" id="quiz"></div>';
      }
    },
    {
      id: "s5",
      title: "Boss 关",
      task: "咱们这一步要做的：算一个大数带 0 的乘法，领奖！",
      voice: "Boss 来啦！二百五十乘六十，先算二十五乘六等于一百五十，两个因数末尾一共有两个零，添上变成一万五千。",
      body: function () {
        return '' +
          '<h2>Boss 关：250 × 60 = ?</h2>' +
          '<div class="quiz" id="boss-quiz"></div>' +
          '<div class="result-big" id="result-stars"></div>';
      }
    }
  ];

  function zcell(cls, html) {
    return '<span class="z-cell ' + cls + '">' + html + "</span>";
  }

  /* ========== S2 动画：160 × 30 = 4800 ========== */
  function runZ1() {
    var box = document.getElementById("z1");
    if (!box) { return; }
    var tip = document.getElementById("z1-tip");
    box.innerHTML = zcell("", "160 × 30") + '<span class="z-arrow">→</span>' +
      zcell("", "16 × 3 = 48") + '<span class="z-arrow">→</span>' +
      zcell("green", "4800");
    var cells = box.querySelectorAll(".z-cell");
    setTimeout(function () {
      if (tip) { tip.textContent = "① 把两个因数末尾的 0 先放一边：160→16，30→3"; }
      if (cells[0]) { cells[0].classList.add("gray"); }
    }, 500);
    setTimeout(function () {
      if (tip) { tip.textContent = "② 先算 16 × 3 = 48（0 先不参与）"; }
      if (cells[1]) { cells[1].classList.add("hl"); }
    }, 2200);
    setTimeout(function () {
      if (tip) { tip.textContent = "③ 因数末尾一共有 2 个 0 → 在 48 后面添 2 个 0"; }
      if (cells[2]) { cells[2].classList.add("hl"); }
    }, 3800);
    setTimeout(function () {
      if (tip) { tip.textContent = "✅ 160 × 30 = 4800"; }
    }, 5000);
  }

  /* ========== S3 动画：106 × 30 = 3180 ========== */
  function runZ2() {
    var box = document.getElementById("z2");
    if (!box) { return; }
    var tip = document.getElementById("z2-tip");
    box.innerHTML = zcell("", "106 × 30") + '<span class="z-arrow">→</span>' +
      zcell("", "106 × 3 = 318") + '<span class="z-arrow">→</span>' +
      zcell("green", "3180");
    var cells = box.querySelectorAll(".z-cell");
    setTimeout(function () {
      if (tip) { tip.textContent = "① 看：106 中间有个 0——它要参加计算，不能省！"; }
      if (cells[0]) { cells[0].classList.add("hl"); }
    }, 500);
    setTimeout(function () {
      if (tip) { tip.textContent = "② 先算 106 × 3 = 318（中间 0 照算）"; }
      if (cells[1]) { cells[1].classList.add("hl"); }
    }, 2400);
    setTimeout(function () {
      if (tip) { tip.textContent = "③ 末尾 1 个 0 → 添上 → 3180"; }
      if (cells[2]) { cells[2].classList.add("hl"); }
    }, 4200);
    setTimeout(function () {
      if (tip) { tip.textContent = "✅ 106 × 30 = 3180（对比：中间 0 不算就会错成 318）"; }
    }, 5400);
  }

  /* ========== S4 练习 ========== */
  var QUIZ = [
    { q: "240 × 20 = ?", right: "4800", opts: ["4800", "480", "48000"] },
    { q: "350 × 40 = ?", right: "14000", opts: ["14000", "1400", "140"] },
    { q: "106 × 40 = ?", right: "4240", opts: ["4240", "424", "40024"] }
  ];
  var quizDone = { q1: false, q2: false, q3: false };
  function startQuiz() {
    quizDone = { q1: false, q2: false, q3: false };
    renderQuiz();
  }
  function renderQuiz() {
    var box = document.getElementById("quiz");
    if (!box) { return; }
    var idx = -1;
    ["q1", "q2", "q3"].forEach(function (k, i) { if (!quizDone[k] && idx === -1) { idx = i; } });
    if (idx === -1) {
      box.innerHTML = '<div class="q">全部完成！⭐ 你真棒</div>';
      return;
    }
    var q = QUIZ[idx];
    box.innerHTML = '<div class="q">第 ' + (idx + 1) + " 题：" + q.q + "</div>" +
      '<div class="opts">' + q.opts.map(function (o) {
        return '<div class="opt" data-ok="' + (o === q.right ? "1" : "0") + '">' + o + "</div>";
      }).join("") + "</div>" +
      "<div class='qmsg'></div><button class='qnext' disabled>下一题</button>";
    var tried = false;
    var opts = box.querySelectorAll(".opt");
    opts.forEach(function (o) {
      o.addEventListener("click", function () {
        if (tried) { return; }
        var ok = o.getAttribute("data-ok") === "1";
        var msg = box.querySelector(".qmsg");
        if (ok) {
          o.classList.add("right");
          opts.forEach(function (x) { x.classList.add("locked"); });
          apiRef.addStars(1); apiRef.comboHit();
          msg.className = "qmsg ok";
          msg.textContent = "对啦！⭐ +1" + (apiRef.state.combo >= 2 ? "（连击 +" + apiRef.state.combo + "）" : "");
          box.querySelector(".qnext").disabled = false;
        } else {
          o.classList.add("wrong");
          tried = true;
          apiRef.comboReset();
          msg.className = "qmsg no";
          msg.textContent = "末尾 0 的个数要相加：因数末尾共几个 0，积末尾添几个 0";
          setTimeout(function () { o.classList.remove("wrong"); tried = false; }, 1500);
        }
      });
    });
    box.querySelector(".qnext").addEventListener("click", function () {
      quizDone["q" + (idx + 1)] = true;
      renderQuiz();
    });
  }

  /* ========== S5 Boss ========== */
  function startBoss() {
    var box = document.getElementById("boss-quiz");
    if (!box) { return; }
    box.innerHTML = '<div class="q">250 × 60 = ?</div>' +
      '<div class="opts">' +
      '<div class="opt" data-ok="1">15000</div>' +
      '<div class="opt" data-ok="0">1500</div>' +
      '<div class="opt" data-ok="0">150</div>' +
      "</div><div class='qmsg'></div>";
    var rs = document.getElementById("result-stars");
    var tried = false;
    box.querySelectorAll(".opt").forEach(function (o) {
      o.addEventListener("click", function () {
        if (tried) { return; }
        var ok = o.getAttribute("data-ok") === "1";
        var msg = box.querySelector(".qmsg");
        if (ok) {
          o.classList.add("right");
          box.querySelectorAll(".opt").forEach(function (x) { x.classList.add("locked"); });
          apiRef.addStars(2); apiRef.comboHit();
          msg.className = "qmsg ok";
          msg.textContent = "Boss 击败！⭐ +2 带 0 乘法你过关啦！";
          if (rs) {
            var n = apiRef.stars();
            rs.innerHTML = "🏆 共获得 <b>" + n + "</b> 颗星" +
              (n >= 8 ? "（全部拿下！）" : n >= 5 ? "（很不错！）" : "（下次再来！）");
          }
        } else {
          o.classList.add("wrong");
          tried = true;
          apiRef.comboReset();
          msg.className = "qmsg no";
          msg.textContent = "25×6=150，末尾共 2 个 0 → 15000";
          setTimeout(function () { o.classList.remove("wrong"); tried = false; }, 1600);
        }
      });
    });
  }

  /* ========== 启动 ========== */
  function onEnterStep(step, api) {
    apiRef = api;
    if (step.id === "s2") { runZ1(); }
    if (step.id === "s3") { runZ2(); }
    if (step.id === "s4") { startQuiz(); }
    if (step.id === "s5") { startBoss(); }
  }

  PlayerCore.init({
    steps: steps,
    parent: {
      summary: "因数末尾有 0：先把 0 前面的数相乘，再在积的末尾添上相应个数的 0；中间的 0 要照常参与计算。",
      attention: "孩子容易把末尾添 0 的个数算错（两个因数末尾的 0 要相加），或把中间的 0 也省掉。",
      tip: "本课约 8 分钟；重点对比「末尾的 0 最后添、中间的 0 要照算」。"
    },
    onEnterStep: onEnterStep,
    settings: { autoStopSteps: [3, 4], pauseMs: 2500 }
  });
})();
</script>
</body>
</html>
