<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小数的意义和读写法 · AI 教师</title>
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="../assets/course.css">
<style>
  .dy-box { margin: 12px 0; }
  .dy-tip { font-size: 15px; font-weight: 700; min-height: 26px; margin: 8px 0; color: var(--accent-deep); }
  .dy-rule { display: inline-block; background: #e8f6ff; border: 1px solid #91caff; color: #0b5e91; border-radius: 10px; padding: 6px 14px; font-size: 15px; font-weight: 700; margin-top: 8px; }
  .strip { display: flex; width: 230px; height: 26px; border: 2px solid var(--border); border-radius: 6px; overflow: hidden; margin: 4px auto; }
  .strip .c { flex: 1; background: #eef2f7; border-right: 1px solid #fff; transition: background .3s; }
  .strip .c:last-child { border-right: none; }
  .strip .c.fill { background: linear-gradient(180deg,#7eb6ff,#4a7fe0); }
  .dy-grid { display: grid; grid-template-columns: repeat(10, 15px); gap: 1px; justify-content: center; width: fit-content; margin: 6px auto; }
  .dy-grid .g { width: 15px; height: 15px; background: #eef2f7; border-radius: 2px; transition: background .3s; }
  .dy-grid .g.fill { background: linear-gradient(180deg,#7eb6ff,#4a7fe0); }
  .dy-set { text-align: center; }
  .dy-sets { display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; }
  .dy-lab { font-size: 20px; font-weight: 800; color: #d97706; margin-top: 4px; }
  .dy-expr { font-size: 28px; font-weight: 800; color: #2e7d32; text-align: center; margin: 8px 0; }
</style>
</head>
<body>
<div class="container">
  <header class="topbar">
    <a class="btn-home" href="index.html">← 数学</a>
    <span class="brand">小数的意义和读写法 <small>4年级·下册</small></span>
  </header>

  <div class="player">
    <div class="task-line" id="task-line"></div>
    <div class="stage" id="stage"></div>
    <div class="dots" id="dots"></div>
    <div class="controls">
      <button class="cbtn" id="btn-prev">上一步</button>
      <button class="cbtn" id="btn-auto">▶ 自动播放</button>
      <button class="cbtn" id="btn-voice">🔊 语音</button>
      <button class="cbtn main" id="btn-next">下一步</button>
    </div>
    <div class="score-row" id="score-row"></div>
  </div>

  <details class="parent-panel">
    <summary>家长模式（点击展开）</summary>
    <div class="pbody">
      <p><b>本课一句话总结：</b>把 1 平均分成 10 份，1 份是 1/10=0.1；分成 100 份，1 份是 1/100=0.01。一位小数=十分之几，两位小数=百分之几。0.05 读作"零点零五"。</p>
      <p><b>孩子容易走神的地方：</b>读小数时把 0.05 读成"零点五"；用格子图理解 0.01 是很小的 1 小格。</p>
      <p><b>建议：</b>本课约 8 分钟；用"10 格条"找一位小数、"100 格"找两位小数。</p>
    </div>
  </details>

  <footer class="foot">
    <div>AI 教师 · 示范课件 math-4-037</div>
  </footer>
</div>

<script src="../assets/voice.js"></script>
<script src="../assets/player-core.js"></script>
<script>
(function () {
  "use strict";
  var apiRef = null;

  function strip(fills) {
    var h = "";
    for (var i = 0; i < 10; i++) { h += '<span class="c ' + (fills.indexOf(i) >= 0 ? "fill" : "") + '"></span>'; }
    return '<div class="strip">' + h + "</div>";
  }
  function grid(n) {
    var h = "";
    for (var i = 0; i < 100; i++) { h += '<span class="g' + (i < n ? " fill" : "") + '"></span>'; }
    return '<div class="dy-grid">' + h + "</div>";
  }

  /* ========== 五段式步骤 ========== */
  var steps = [
    {
      id: "s1",
      title: "情境引入",
      task: "咱们这一步要做的：想想 0.1 是多少！",
      voice: "0.1 是多少？把 1 平均分成 10 份，1 份就是 0.1。今天认识小数的意义。",
      body: function () {
        return '' +
          '<h2>0.1 是多大</h2>' +
          '<p class="dy-expr">1 ÷ 10 = 0.1（十分之一）</p>' +
          '<div class="hint">👆 一位小数 = 十分之几</div>';
      }
    },
    {
      id: "s2",
      title: "十分之几变小数动画",
      task: "咱们这一步要做的：看动画 3/10 = 0.3！",
      voice: "看动画。一条带子分成 10 份。涂 1 份是 0.1。涂 3 份，就是 3 个 0.1，等于 0.3，也就是十分之三。",
      body: function () {
        return '' +
          '<h2>看动画：3/10 = 0.3</h2>' +
          '<div class="dy-box" id="d1">' +
          '<div class="dy-set"><div id="s1-strip"></div><div class="dy-lab" id="s1-lab">? /10</div></div>' +
          "</div>" +
          '<div class="dy-tip" id="d1-tip">准备开始…</div>' +
          '<div class="dy-rule">一位小数 = 十分之几：1/10=0.1</div>';
      }
    },
    {
      id: "s3",
      title: "百分之几变小数动画",
      task: "咱们这一步要做的：看动画 5/100 = 0.05！",
      voice: "看动画。一个大正方形分成 100 份。1 小份是 0.01。涂 5 小份就是 0.05，读作零点零五。注意中间要读一个零！",
      body: function () {
        return '' +
          '<h2>看动画：5/100 = 0.05</h2>' +
          '<div class="dy-box" id="d2">' +
          '<div class="dy-set"><div id="s2-grid"></div><div class="dy-lab" id="s2-lab">? /100</div></div>' +
          "</div>" +
          '<div class="dy-tip" id="d2-tip">准备开始…</div>' +
          '<div class="dy-rule">两位小数 = 百分之几：5/100 = 0.05，读作零点零五</div>';
      }
    },
    {
      id: "s4",
      title: "互动练习",
      task: "咱们这一步要做的：连闯 3 道小数读写题！",
      voice: "现在考考你！小数的意义和读写。",
      body: function () {
        return '' +
          '<h2>闯关练习</h2>' +
          '<div class="quiz" id="quiz"></div>';
      }
    },
    {
      id: "s5",
      title: "Boss 关",
      task: "咱们这一步要做的：读 0.08，领奖！",
      voice: "Boss 来啦！0.08 读作什么？0.08 是百分之八，读作零点零八！",
      body: function () {
        return '' +
          '<h2>Boss 关：0.08 读作？</h2>' +
          '<div class="quiz" id="boss-quiz"></div>' +
          '<div class="result-big" id="result-stars"></div>';
      }
    }
  ];

  function runD1() {
    var tip = document.getElementById("d1-tip");
    var lab = document.getElementById("s1-lab");
    setTimeout(function () { document.getElementById("s1-strip").innerHTML = strip([0]); if (tip) { tip.textContent = "① 分成 10 份，涂 1 份 = 0.1（十分之一）"; } }, 700);
    setTimeout(function () {
      document.getElementById("s1-strip").innerHTML = strip([0, 1, 2]);
      lab.textContent = "3/10 = 0.3";
      if (tip) { tip.textContent = "② 涂 3 份 = 0.3 ✅ 一位小数=十分之几"; }
    }, 2500);
    setTimeout(function () {
      document.getElementById("s1-strip").innerHTML = strip([0, 1, 2, 3, 4, 5, 6, 7]);
      lab.textContent = "7/10 = 0.7";
      if (tip) { tip.textContent = "③ 7 份 = 0.7（7 个 0.1）"; }
    }, 4300);
  }
  function runD2() {
    var tip = document.getElementById("d2-tip");
    var lab = document.getElementById("s2-lab");
    setTimeout(function () { document.getElementById("s2-grid").innerHTML = grid(1); if (tip) { tip.textContent = "① 分成 100 份，1 小份 = 0.01（百分之一）"; } }, 700);
    setTimeout(function () {
      document.getElementById("s2-grid").innerHTML = grid(5);
      lab.textContent = "5/100 = 0.05";
      if (tip) { tip.textContent = "② 涂 5 小份 = 0.05，读作零点零五"; }
    }, 2500);
    setTimeout(function () {
      document.getElementById("s2-grid").innerHTML = grid(23);
      lab.textContent = "23/100 = 0.23";
      if (tip) { tip.textContent = "③ 23 小份 = 0.23，读作零点二三"; }
    }, 4300);
  }

  /* ========== S4 练习 ========== */
  var QUIZ = [
    { q: "十分之六用小数表示？", right: "0.6", opts: ["0.6", "6.0", "0.06"] },
    { q: "0.01 表示？", right: "百分之一", opts: ["百分之一", "十分之一", "千分之一"] },
    { q: "0.05 读作？", right: "零点零五", opts: ["零点零五", "零点五", "零点十五"] }
  ];
  var quizDone = { q1: false, q2: false, q3: false };
  function startQuiz() {
    quizDone = { q1: false, q2: false, q3: false };
    renderQuiz();
  }
  function renderQuiz() {
    var box = document.getElementById("quiz");
    if (!box) { return; }
    var idx = -1;
    ["q1", "q2", "q3"].forEach(function (k, i) { if (!quizDone[k] && idx === -1) { idx = i; } });
    if (idx === -1) { box.innerHTML = '<div class="q">全部完成！⭐ 你真棒</div>'; return; }
    var q = QUIZ[idx];
    box.innerHTML = '<div class="q">第 ' + (idx + 1) + " 题：" + q.q + "</div>" +
      '<div class="opts">' + q.opts.map(function (o) {
        return '<div class="opt" data-ok="' + (o === q.right ? "1" : "0") + '">' + o + "</div>";
      }).join("") + "</div>" +
      "<div class='qmsg'></div><button class='qnext' disabled>下一题</button>";
    var tried = false;
    var opts = box.querySelectorAll(".opt");
    opts.forEach(function (o) {
      o.addEventListener("click", function () {
        if (tried) { return; }
        var ok = o.getAttribute("data-ok") === "1";
        var msg = box.querySelector(".qmsg");
        if (ok) {
          o.classList.add("right");
          opts.forEach(function (x) { x.classList.add("locked"); });
          apiRef.addStars(1); apiRef.comboHit();
          msg.className = "qmsg ok";
          msg.textContent = "对啦！⭐ +1" + (apiRef.state.combo >= 2 ? "（连击 +" + apiRef.state.combo + "）" : "");
          box.querySelector(".qnext").disabled = false;
        } else {
          o.classList.add("wrong");
          tried = true;
          apiRef.comboReset();
          msg.className = "qmsg no";
          msg.textContent = "一位小数=十分之几，两位小数=百分之几；0.05 读零点零五";
          setTimeout(function () { o.classList.remove("wrong"); tried = false; }, 1800);
        }
      });
    });
    box.querySelector(".qnext").addEventListener("click", function () {
      quizDone["q" + (idx + 1)] = true;
      renderQuiz();
    });
  }

  /* ========== S5 Boss ========== */
  function startBoss() {
    var box = document.getElementById("boss-quiz");
    if (!box) { return; }
    box.innerHTML = '<div class="q">0.08 读作？</div>' +
      '<div class="opts">' +
      '<div class="opt" data-ok="1">零点零八</div>' +
      '<div class="opt" data-ok="0">零点八</div>' +
      '<div class="opt" data-ok="0">零点八零</div>' +
      "</div><div class='qmsg'></div>";
    var rs = document.getElementById("result-stars");
    var tried = false;
    box.querySelectorAll(".opt").forEach(function (o) {
      o.addEventListener("click", function () {
        if (tried) { return; }
        var ok = o.getAttribute("data-ok") === "1";
        var msg = box.querySelector(".qmsg");
        if (ok) {
          o.classList.add("right");
          box.querySelectorAll(".opt").forEach(function (x) { x.classList.add("locked"); });
          apiRef.addStars(2); apiRef.comboHit();
          msg.className = "qmsg ok";
          msg.textContent = "Boss 击败！⭐ +2 小数的意义你掌握啦！";
          if (rs) {
            var n = apiRef.stars();
            rs.innerHTML = "🏆 共获得 <b>" + n + "</b> 颗星" +
              (n >= 8 ? "（全部拿下！）" : n >= 5 ? "（很不错！）" : "（下次再来！）");
          }
        } else {
          o.classList.add("wrong");
          tried = true;
          apiRef.comboReset();
          msg.className = "qmsg no";
          msg.textContent = "0.08 是百分之八 → 读作零点零八（中间要读 0）";
          setTimeout(function () { o.classList.remove("wrong"); tried = false; }, 1800);
        }
      });
    });
  }

  /* ========== 启动 ========== */
  function onEnterStep(step, api) {
    apiRef = api;
    if (step.id === "s2") { runD1(); }
    if (step.id === "s3") { runD2(); }
    if (step.id === "s4") { startQuiz(); }
    if (step.id === "s5") { startBoss(); }
  }

  PlayerCore.init({
    steps: steps,
    parent: {
      summary: "把 1 平均分成 10 份，1 份是 1/10=0.1；分成 100 份，1 份是 1/100=0.01。一位小数=十分之几，两位小数=百分之几。0.05 读作「零点零五」。",
      attention: "孩子读小数时把 0.05 读成「零点五」；用格子图理解 0.01 是 100 小格里的 1 格。",
      tip: "本课约 8 分钟；用「10 格条」找一位小数、「100 格」找两位小数。"
    },
    onEnterStep: onEnterStep,
    settings: { autoStopSteps: [3, 4], pauseMs: 2500 }
  });
})();
</script>
</body>
</html>
