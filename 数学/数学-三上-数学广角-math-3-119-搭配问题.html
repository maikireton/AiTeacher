<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>搭配问题（数学广角） · AI 教师</title>
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="../assets/course.css">
<style>
  .dp-box { margin: 12px 0; }
  .dp-cols { display: flex; justify-content: center; gap: 30px; align-items: center; flex-wrap: wrap; }
  .dp-col { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .dp-item { font-size: 34px; }
  .dp-name { font-size: 13px; color: var(--text-2); }
  .dp-x { font-size: 28px; color: var(--accent-deep); font-weight: 800; }
  .dp-grid { display: grid; grid-template-columns: repeat(3, 64px); gap: 8px; justify-content: center; margin: 10px 0; }
  .dp-cell { display: flex; flex-direction: column; align-items: center; gap: 2px; border: 2px dashed var(--border); border-radius: 10px; padding: 6px 4px; opacity: 0; transition: all .35s; }
  .dp-cell.show { opacity: 1; }
  .dp-cell.hl { border-style: solid; border-color: var(--accent-deep); background: rgba(155,187,244,.12); }
  .dp-cell .ic { font-size: 22px; }
  .dp-tip { font-size: 15px; font-weight: 700; min-height: 26px; margin: 8px 0; color: var(--accent-deep); }
  .dp-rule { display: inline-block; background: #e8f6ff; border: 1px solid #91caff; color: #0b5e91; border-radius: 10px; padding: 6px 14px; font-size: 15px; font-weight: 700; margin-top: 8px; }
  .dp-count { font-size: 22px; font-weight: 800; color: #2e7d32; min-height: 28px; }
</style>
</head>
<body>
<div class="container">
  <header class="topbar">
    <a class="btn-home" href="index.html">← 数学</a>
    <span class="brand">搭配问题（数学广角） <small>3年级·上册</small></span>
  </header>

  <div class="player">
    <div class="task-line" id="task-line"></div>
    <div class="stage" id="stage"></div>
    <div class="dots" id="dots"></div>
    <div class="controls">
      <button class="cbtn" id="btn-prev">上一步</button>
      <button class="cbtn" id="btn-auto">▶ 自动播放</button>
      <button class="cbtn" id="btn-voice">🔊 语音</button>
      <button class="cbtn main" id="btn-next">下一步</button>
    </div>
    <div class="score-row" id="score-row"></div>
  </div>

  <details class="parent-panel">
    <summary>家长模式（点击展开）</summary>
    <div class="pbody">
      <p><b>本课一句话总结：</b>搭配问题：按顺序一件一件配，不重不漏；种数 = 第一类种数 × 第二类种数。</p>
      <p><b>孩子容易走神的地方：</b>乱配漏掉几种；教他"固定一个，轮换另一个"的有序方法。</p>
      <p><b>建议：</b>本课约 8 分钟；用家里的衣服玩具摆一摆，数一数有几种穿法。</p>
    </div>
  </details>

  <footer class="foot">
    <div>AI 教师 · 示范课件 math-3-119</div>
  </footer>
</div>

<script src="../assets/voice.js"></script>
<script src="../assets/player-core.js"></script>
<script>
(function () {
  "use strict";
  var apiRef = null;

  /* ========== 五段式步骤 ========== */
  var steps = [
    {
      id: "s1",
      title: "情境引入",
      task: "咱们这一步要做的：想想穿衣服有几种搭配！",
      voice: "有两件上衣，三条裤子，一共有几种穿法？别急，今天教你一个方法：一件一件配，不重不漏。",
      body: function () {
        return '' +
          '<h2>衣服搭配</h2>' +
          '<p>👕👚 2 件上衣 × 👖👖👖 3 条裤子</p>' +
          '<p>一共有多少种穿法？</p>' +
          '<div class="hint">👆 有序搭配，不重不漏</div>';
      }
    },
    {
      id: "s2",
      title: "衣服搭配动画",
      task: "咱们这一步要做的：看动画数出 6 种穿法！",
      voice: "看动画。先固定红色上衣，配三条裤子，三种穿法。再固定蓝色上衣，配三条裤子，又三种穿法。二乘三等于六，一共六种！",
      body: function () {
        return '' +
          '<h2>看动画：2 上衣 × 3 裤子 = 6</h2>' +
          '<div class="dp-box" id="dp1">' +
          '<div class="dp-cols">' +
          '<div class="dp-col"><span class="dp-item">👕</span><span class="dp-name">红上衣</span></div>' +
          '<div class="dp-col"><span class="dp-item">👚</span><span class="dp-name">蓝上衣</span></div>' +
          '<span class="dp-x">×</span>' +
          '<div class="dp-col"><span class="dp-item">👖</span><span class="dp-name">黑裤</span></div>' +
          '<div class="dp-col"><span class="dp-item">👖</span><span class="dp-name">白裤</span></div>' +
          '<div class="dp-col"><span class="dp-item">👖</span><span class="dp-name">灰裤</span></div>' +
          "</div>" +
          '<div class="dp-grid" id="grid1"></div>' +
          '<div class="dp-count" id="c1"></div>' +
          "</div>" +
          '<div class="dp-tip" id="dp1-tip">准备开始…</div>' +
          '<div class="dp-rule">2 × 3 = 6（种）</div>';
      }
    },
    {
      id: "s3",
      title: "早餐搭配动画",
      task: "咱们这一步要做的：看动画学会用乘法算种数！",
      voice: "看动画。早餐有面包、包子两种主食，牛奶、豆浆、果汁三种饮料。面包配三种饮料，三种。包子配三种饮料，又三种。二乘三等于六，一共六种搭配！",
      body: function () {
        return '' +
          '<h2>看动画：2 主食 × 3 饮料 = 6</h2>' +
          '<div class="dp-box" id="dp2">' +
          '<div class="dp-cols">' +
          '<div class="dp-col"><span class="dp-item">🍞</span><span class="dp-name">面包</span></div>' +
          '<div class="dp-col"><span class="dp-item">🍔</span><span class="dp-name">包子</span></div>' +
          '<span class="dp-x">×</span>' +
          '<div class="dp-col"><span class="dp-item">🥛</span><span class="dp-name">牛奶</span></div>' +
          '<div class="dp-col"><span class="dp-item">🧃</span><span class="dp-name">豆浆</span></div>' +
          '<div class="dp-col"><span class="dp-item">🥤</span><span class="dp-name">果汁</span></div>' +
          "</div>" +
          '<div class="dp-grid" id="grid2"></div>' +
          '<div class="dp-count" id="c2"></div>' +
          "</div>" +
          '<div class="dp-tip" id="dp2-tip">准备开始…</div>' +
          '<div class="dp-rule">2 × 3 = 6（种）</div>';
      }
    },
    {
      id: "s4",
      title: "互动练习",
      task: "咱们这一步要做的：连闯 3 道搭配题！",
      voice: "现在考考你！搭配问题用乘法。",
      body: function () {
        return '' +
          '<h2>闯关练习</h2>' +
          '<div class="quiz" id="quiz"></div>';
      }
    },
    {
      id: "s5",
      title: "Boss 关",
      task: "咱们这一步要做的：算走法总数，领奖！",
      voice: "Boss 来啦！从家到学校要先坐公交车（两条线路），再换地铁（三条线路），一共有几种走法？二乘三等于六种！",
      body: function () {
        return '' +
          '<h2>Boss 关：2 × 3 = ? 种走法</h2>' +
          '<div class="quiz" id="boss-quiz"></div>' +
          '<div class="result-big" id="result-stars"></div>';
      }
    }
  ];

  function runGrid(gridId, countId, tipId, items, delay) {
    var grid = document.getElementById(gridId);
    var count = document.getElementById(countId);
    var tip = document.getElementById(tipId);
    if (!grid) { return; }
    var h = "";
    for (var i = 0; i < items.length; i++) {
      h += '<div class="dp-cell" data-k="' + i + '"><span class="ic">' + items[i] + "</span></div>";
    }
    grid.innerHTML = h;
    var cells = grid.querySelectorAll(".dp-cell");
    var n = items.length;
    cells.forEach(function (c, i) {
      setTimeout(function () {
        c.classList.add("show", "hl");
        if (count) { count.textContent = "已有 " + (i + 1) + " 种搭配"; }
        if (tip) {
          if (i === 0) { tip.textContent = "① 先配第 1 行（固定一种，轮换三种）…"; }
          if (i === 2) { tip.textContent = "② 第一件配完 3 种，换第二件…"; }
          if (i === n - 1) { tip.textContent = "✅ 一共 " + n + " 种搭配，不重不漏！"; }
        }
      }, delay * (i + 1));
    });
    setTimeout(function () {
      if (count) { count.textContent = "共 " + n + " 种（" + (n / 3) + " × 3）"; }
    }, delay * (n + 1) + 400);
  }
  function runDp1() {
    runGrid("grid1", "c1", "dp1-tip", ["👕+👖", "👕+👖", "👕+👖", "👚+👖", "👚+👖", "👚+👖"], 700);
  }
  function runDp2() {
    runGrid("grid2", "c2", "dp2-tip", ["🍞+🥛", "🍞+🧃", "🍞+🥤", "🍔+🥛", "🍔+🧃", "🍔+🥤"], 700);
  }

  /* ========== S4 练习 ========== */
  var QUIZ = [
    { q: "2 件上衣 × 2 条裤子 = 几种穿法？", right: "4", opts: ["4", "2", "6"] },
    { q: "3 种主食 × 2 种饮料 = 几种？", right: "6", opts: ["6", "5", "3"] },
    { q: "搭配时怎样才不重不漏？", right: "有序地一件件配", opts: ["有序地一件件配", "随便乱配", "只配一次"] }
  ];
  var quizDone = { q1: false, q2: false, q3: false };
  function startQuiz() {
    quizDone = { q1: false, q2: false, q3: false };
    renderQuiz();
  }
  function renderQuiz() {
    var box = document.getElementById("quiz");
    if (!box) { return; }
    var idx = -1;
    ["q1", "q2", "q3"].forEach(function (k, i) { if (!quizDone[k] && idx === -1) { idx = i; } });
    if (idx === -1) { box.innerHTML = '<div class="q">全部完成！⭐ 你真棒</div>'; return; }
    var q = QUIZ[idx];
    box.innerHTML = '<div class="q">第 ' + (idx + 1) + " 题：" + q.q + "</div>" +
      '<div class="opts">' + q.opts.map(function (o) {
        return '<div class="opt" data-ok="' + (o === q.right ? "1" : "0") + '">' + o + "</div>";
      }).join("") + "</div>" +
      "<div class='qmsg'></div><button class='qnext' disabled>下一题</button>";
    var tried = false;
    var opts = box.querySelectorAll(".opt");
    opts.forEach(function (o) {
      o.addEventListener("click", function () {
        if (tried) { return; }
        var ok = o.getAttribute("data-ok") === "1";
        var msg = box.querySelector(".qmsg");
        if (ok) {
          o.classList.add("right");
          opts.forEach(function (x) { x.classList.add("locked"); });
          apiRef.addStars(1); apiRef.comboHit();
          msg.className = "qmsg ok";
          msg.textContent = "对啦！⭐ +1" + (apiRef.state.combo >= 2 ? "（连击 +" + apiRef.state.combo + "）" : "");
          box.querySelector(".qnext").disabled = false;
        } else {
          o.classList.add("wrong");
          tried = true;
          apiRef.comboReset();
          msg.className = "qmsg no";
          msg.textContent = "种数 = 第一类 × 第二类";
          setTimeout(function () { o.classList.remove("wrong"); tried = false; }, 1500);
        }
      });
    });
    box.querySelector(".qnext").addEventListener("click", function () {
      quizDone["q" + (idx + 1)] = true;
      renderQuiz();
    });
  }

  /* ========== S5 Boss ========== */
  function startBoss() {
    var box = document.getElementById("boss-quiz");
    if (!box) { return; }
    box.innerHTML = '<div class="q">2 条公交线 × 3 条地铁线 = ? 种走法</div>' +
      '<div class="opts">' +
      '<div class="opt" data-ok="1">6</div>' +
      '<div class="opt" data-ok="0">5</div>' +
      '<div class="opt" data-ok="0">8</div>' +
      "</div><div class='qmsg'></div>";
    var rs = document.getElementById("result-stars");
    var tried = false;
    box.querySelectorAll(".opt").forEach(function (o) {
      o.addEventListener("click", function () {
        if (tried) { return; }
        var ok = o.getAttribute("data-ok") === "1";
        var msg = box.querySelector(".qmsg");
        if (ok) {
          o.classList.add("right");
          box.querySelectorAll(".opt").forEach(function (x) { x.classList.add("locked"); });
          apiRef.addStars(2); apiRef.comboHit();
          msg.className = "qmsg ok";
          msg.textContent = "Boss 击败！⭐ +2 搭配问题你掌握啦！";
          if (rs) {
            var n = apiRef.stars();
            rs.innerHTML = "🏆 共获得 <b>" + n + "</b> 颗星" +
              (n >= 8 ? "（全部拿下！）" : n >= 5 ? "（很不错！）" : "（下次再来！）");
          }
        } else {
          o.classList.add("wrong");
          tried = true;
          apiRef.comboReset();
          msg.className = "qmsg no";
          msg.textContent = "2 × 3 = 6（种）";
          setTimeout(function () { o.classList.remove("wrong"); tried = false; }, 1400);
        }
      });
    });
  }

  /* ========== 启动 ========== */
  function onEnterStep(step, api) {
    apiRef = api;
    if (step.id === "s2") { runDp1(); }
    if (step.id === "s3") { runDp2(); }
    if (step.id === "s4") { startQuiz(); }
    if (step.id === "s5") { startBoss(); }
  }

  PlayerCore.init({
    steps: steps,
    parent: {
      summary: "搭配问题：按顺序一件一件配，不重不漏；种数 = 第一类种数 × 第二类种数。",
      attention: "孩子容易乱配漏掉几种；教他「固定一个，轮换另一个」的有序方法。",
      tip: "本课约 8 分钟；用家里的衣服玩具摆一摆，数一数有几种穿法。"
    },
    onEnterStep: onEnterStep,
    settings: { autoStopSteps: [3, 4], pauseMs: 2500 }
  });
})();
</script>
</body>
</html>
