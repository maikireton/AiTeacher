<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小数的性质和大小比较 · AI 教师</title>
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="../assets/course.css">
<style>
  .dx-box { margin: 12px 0; }
  .dx-tip { font-size: 15px; font-weight: 700; min-height: 26px; margin: 8px 0; color: var(--accent-deep); }
  .dx-rule { display: inline-block; background: #e8f6ff; border: 1px solid #91caff; color: #0b5e91; border-radius: 10px; padding: 6px 14px; font-size: 15px; font-weight: 700; margin-top: 8px; }
  .strip { display: flex; width: 220px; height: 26px; border: 2px solid var(--border); border-radius: 6px; overflow: hidden; margin: 4px auto; }
  .strip .c { flex: 1; background: #eef2f7; border-right: 1px solid #fff; transition: background .3s; }
  .strip .c:last-child { border-right: none; }
  .strip .c.fill { background: linear-gradient(180deg,#7eb6ff,#4a7fe0); }
  .dx-grid { display: grid; grid-template-columns: repeat(10, 14px); gap: 1px; justify-content: center; width: fit-content; margin: 4px auto; }
  .dx-grid .g { width: 14px; height: 14px; background: #eef2f7; border-radius: 2px; transition: background .3s; }
  .dx-grid .g.fill { background: linear-gradient(180deg,#7eb6ff,#4a7fe0); }
  .dx-set { text-align: center; min-width: 230px; }
  .dx-sets { display: flex; justify-content: center; gap: 24px; align-items: flex-start; flex-wrap: wrap; }
  .dx-lab { font-size: 20px; font-weight: 800; color: #d97706; margin-top: 4px; }
  .dx-eq { font-size: 34px; font-weight: 800; color: #2e7d32; }
  .cmp-row { display: flex; justify-content: center; gap: 20px; align-items: center; flex-wrap: wrap; margin: 10px 0; }
  .cmp-num { font-size: 34px; font-weight: 800; }
  .cmp-num .dig { display: inline-block; padding: 0 4px; border-radius: 6px; }
  .cmp-num .dig.hit { background: #ffd591; }
  .cmp-sym { font-size: 40px; font-weight: 800; color: var(--accent-deep); }
</style>
</head>
<body>
<div class="container">
  <header class="topbar">
    <a class="btn-home" href="index.html">← 数学</a>
    <span class="brand">小数的性质和大小比较 <small>4年级·下册</small></span>
  </header>

  <div class="player">
    <div class="task-line" id="task-line"></div>
    <div class="stage" id="stage"></div>
    <div class="dots" id="dots"></div>
    <div class="controls">
      <button class="cbtn" id="btn-prev">上一步</button>
      <button class="cbtn" id="btn-auto">▶ 自动播放</button>
      <button class="cbtn" id="btn-voice">🔊 语音</button>
      <button class="cbtn main" id="btn-next">下一步</button>
    </div>
    <div class="score-row" id="score-row"></div>
  </div>

  <details class="parent-panel">
    <summary>家长模式（点击展开）</summary>
    <div class="pbody">
      <p><b>本课一句话总结：</b>小数末尾添上 0 或去掉 0，大小不变（0.5=0.50）；比大小先比整数部分，再比十分位、百分位。</p>
      <p><b>孩子容易走神的地方：</b>以为 0.5&lt;0.50；强调"末尾"添 0 才不变，中间添 0 会变（0.5≠0.05）。</p>
      <p><b>建议：</b>本课约 8 分钟；用 10 格条和 100 格对照 0.5=0.50，再对齐数位比大小。</p>
    </div>
  </details>

  <footer class="foot">
    <div>AI 教师 · 示范课件 math-4-038</div>
  </footer>
</div>

<script src="../assets/voice.js"></script>
<script src="../assets/player-core.js"></script>
<script src="../assets/record.js"></script>
<script>
(function () {
  "use strict";
  var apiRef = null;

  function strip(n) {
    var h = "";
    for (var i = 0; i < 10; i++) { h += '<span class="c ' + (i < n ? "fill" : "") + '"></span>'; }
    return '<div class="strip">' + h + "</div>";
  }
  function grid(n) {
    var h = "";
    for (var i = 0; i < 100; i++) { h += '<span class="g' + (i < n ? " fill" : "") + '"></span>'; }
    return '<div class="dx-grid">' + h + "</div>";
  }

  /* ========== 五段式步骤 ========== */
  var steps = [
    {
      id: "s1",
      title: "情境引入",
      task: "咱们这一步要做的：想想 0.5 和 0.50 谁大！",
      voice: "0.5 和 0.50 谁大？其实一样大！因为小数末尾添 0 大小不变。今天学小数的性质。",
      body: function () {
        return '' +
          '<h2>0.5 和 0.50</h2>' +
          '<p class="dx-eq" style="text-align:center">0.5 = 0.50</p>' +
          '<div class="hint">👆 末尾添 0 或去 0，大小不变</div>';
      }
    },
    {
      id: "s2",
      title: "小数性质动画",
      task: "咱们这一步要做的：看动画 0.5 和 0.50 一样大！",
      voice: "看动画。上面一条分成 10 份，涂 5 份是 0.5。下面大正方形分成 100 份，涂 50 份是 0.50。看，两块涂的面积一样大！所以 0.5 等于 0.50。",
      body: function () {
        return '' +
          '<h2>看动画：0.5 = 0.50</h2>' +
          '<div class="dx-box" id="d1">' +
          '<div class="dx-sets">' +
          '<div class="dx-set"><div id="s1a"></div><div class="dx-lab">0.5</div></div>' +
          '<span class="dx-eq">=</span>' +
          '<div class="dx-set"><div id="s1b"></div><div class="dx-lab">0.50</div></div>' +
          "</div>" +
          "</div>" +
          '<div class="dx-tip" id="d1-tip">准备开始…</div>' +
          '<div class="dx-rule">小数末尾添 0 或去 0，大小不变</div>';
      }
    },
    {
      id: "s3",
      title: "小数比大小动画",
      task: "咱们这一步要做的：看动画对齐数位比大小！",
      voice: "看动画。0.6 和 0.48 谁大？先看整数部分，都是 0。再看十分位：0.6 的十分位是 6，0.48 的十分位是 4。6 比 4 大，所以 0.6 大！不用再看后面的了。",
      body: function () {
        return '' +
          '<h2>看动画：0.6 ○ 0.48</h2>' +
          '<div class="dx-box" id="d2">' +
          '<div class="cmp-row">' +
          '<span class="cmp-num"><span class="dig" data-v="int">0</span>.<span class="dig" data-v="t">6</span><span class="dig" data-v="h">0</span></span>' +
          '<span class="cmp-sym" id="sym">?</span>' +
          '<span class="cmp-num"><span class="dig" data-v="int2">0</span>.<span class="dig" data-v="t2">4</span><span class="dig" data-v="h2">8</span></span>' +
          "</div>" +
          "</div>" +
          '<div class="dx-tip" id="d2-tip">准备开始…</div>' +
          '<div class="dx-rule">先比整数部分，再比十分位、百分位</div>';
      }
    },
    {
      id: "s4",
      title: "互动练习",
      task: "咱们这一步要做的：连闯 3 道小数比较题！",
      voice: "现在考考你！小数性质和比大小。",
      body: function () {
        return '' +
          '<h2>闯关练习</h2>' +
          '<div class="quiz" id="quiz"></div>';
      }
    },
    {
      id: "s5",
      title: "Boss 关",
      task: "咱们这一步要做的：比 0.09 和 0.1，领奖！",
      voice: "Boss 来啦！0.09 和 0.1 谁大？十分位：0.09 是 0，0.1 是 1。0 比 1 小，所以 0.09 小于 0.1！",
      body: function () {
        return '' +
          '<h2>Boss 关：0.09 ○ 0.1</h2>' +
          '<div class="quiz" id="boss-quiz"></div>' +
          '<div class="result-big" id="result-stars"></div>';
      }
    }
  ];

  function runD1() {
    var tip = document.getElementById("d1-tip");
    setTimeout(function () { document.getElementById("s1a").innerHTML = strip(5); if (tip) { tip.textContent = "① 0.5 = 10 份里涂 5 份"; } }, 700);
    setTimeout(function () { document.getElementById("s1b").innerHTML = grid(50); if (tip) { tip.textContent = "② 0.50 = 100 份里涂 50 份"; } }, 2300);
    setTimeout(function () { if (tip) { tip.textContent = "③ 涂色部分一样大 → 0.5 = 0.50 ✅"; } }, 4300);
  }
  function runD2() {
    var tip = document.getElementById("d2-tip");
    setTimeout(function () {
      document.querySelector('#d2 .dig[data-v="int"]').classList.add("hit");
      document.querySelector('#d2 .dig[data-v="int2"]').classList.add("hit");
      if (tip) { tip.textContent = "① 先比整数部分：都是 0，一样 → 看十分位"; }
    }, 800);
    setTimeout(function () {
      document.querySelector('#d2 .dig[data-v="t"]').classList.add("hit");
      document.querySelector('#d2 .dig[data-v="t2"]').classList.add("hit");
      if (tip) { tip.textContent = "② 十分位：6 > 4 → 0.6 大 ✅"; }
      document.getElementById("sym").textContent = ">";
    }, 2800);
  }

  /* ========== S4 练习 ========== */
  var QUIZ = [
    { q: "下面哪个和 0.5 一样大？", right: "0.50", opts: ["0.50", "0.05", "5.0"] },
    { q: "0.3 和 0.28 谁大？", right: "0.3", opts: ["0.3", "0.28", "一样大"] },
    { q: "1.2 和 0.9 谁大？", right: "1.2", opts: ["1.2", "0.9", "一样大"] }
  ];
  var quizDone = { q1: false, q2: false, q3: false };
  function startQuiz() {
    quizDone = { q1: false, q2: false, q3: false };
    renderQuiz();
  }
  function renderQuiz() {
    var box = document.getElementById("quiz");
    if (!box) { return; }
    var idx = -1;
    ["q1", "q2", "q3"].forEach(function (k, i) { if (!quizDone[k] && idx === -1) { idx = i; } });
    if (idx === -1) { box.innerHTML = '<div class="q">全部完成！⭐ 你真棒</div>'; return; }
    var q = QUIZ[idx];
    box.innerHTML = '<div class="q">第 ' + (idx + 1) + " 题：" + q.q + "</div>" +
      '<div class="opts">' + q.opts.map(function (o) {
        return '<div class="opt" data-ok="' + (o === q.right ? "1" : "0") + '">' + o + "</div>";
      }).join("") + "</div>" +
      "<div class='qmsg'></div><button class='qnext' disabled>下一题</button>";
    var tried = false;
    var opts = box.querySelectorAll(".opt");
    opts.forEach(function (o) {
      o.addEventListener("click", function () {
        if (tried) { return; }
        var ok = o.getAttribute("data-ok") === "1";
        var msg = box.querySelector(".qmsg");
        if (ok) {
          o.classList.add("right");
          opts.forEach(function (x) { x.classList.add("locked"); });
          apiRef.addStars(1); apiRef.comboHit();
          msg.className = "qmsg ok";
          msg.textContent = "对啦！⭐ +1" + (apiRef.state.combo >= 2 ? "（连击 +" + apiRef.state.combo + "）" : "");
          box.querySelector(".qnext").disabled = false;
        } else {
          o.classList.add("wrong");
          tried = true;
          apiRef.comboReset();
          msg.className = "qmsg no";
          msg.textContent = "末尾添 0 不变；比大小：整数→十分位→百分位";
          setTimeout(function () { o.classList.remove("wrong"); tried = false; }, 1800);
        }
      });
    });
    box.querySelector(".qnext").addEventListener("click", function () {
      quizDone["q" + (idx + 1)] = true;
      renderQuiz();
    });
  }

  /* ========== S5 Boss ========== */
  function startBoss() {
    var box = document.getElementById("boss-quiz");
    if (!box) { return; }
    box.innerHTML = '<div class="q">0.09 ○ 0.1，选哪个？</div>' +
      '<div class="opts">' +
      '<div class="opt" data-ok="1">&lt;（0.09 更小）</div>' +
      '<div class="opt" data-ok="0">&gt;（0.09 更大）</div>' +
      '<div class="opt" data-ok="0">=</div>' +
      "</div><div class='qmsg'></div>";
    var rs = document.getElementById("result-stars");
    var tried = false;
    box.querySelectorAll(".opt").forEach(function (o) {
      o.addEventListener("click", function () {
        if (tried) { return; }
        var ok = o.getAttribute("data-ok") === "1";
        var msg = box.querySelector(".qmsg");
        if (ok) {
          o.classList.add("right");
          box.querySelectorAll(".opt").forEach(function (x) { x.classList.add("locked"); });
          apiRef.addStars(2); apiRef.comboHit();
          msg.className = "qmsg ok";
          msg.textContent = "Boss 击败！⭐ +2 小数比大小你掌握啦！";
          if (rs) {
            var n = apiRef.stars();
            rs.innerHTML = "🏆 共获得 <b>" + n + "</b> 颗星" +
              (n >= 8 ? "（全部拿下！）" : n >= 5 ? "（很不错！）" : "（下次再来！）");
          }
        } else {
          o.classList.add("wrong");
          tried = true;
          apiRef.comboReset();
          msg.className = "qmsg no";
          msg.textContent = "十分位：0.09 是 0，0.1 是 1 → 0.09 < 0.1";
          setTimeout(function () { o.classList.remove("wrong"); tried = false; }, 1800);
        }
      });
    });
  }

  /* ========== 启动 ========== */
  function onEnterStep(step, api) {
    apiRef = api;
    if (step.id === "s2") { runD1(); }
    if (step.id === "s3") { runD2(); }
    if (step.id === "s4") { startQuiz(); }
    if (step.id === "s5") { startBoss(); }
  }

  PlayerCore.init({
    steps: steps,
    parent: {
      summary: "小数末尾添上 0 或去掉 0，大小不变（0.5=0.50）；比大小先比整数部分，再比十分位、百分位。",
      attention: "孩子以为 0.5<0.50；强调「末尾」添 0 才不变，中间添 0 会变（0.5≠0.05）。",
      tip: "本课约 8 分钟；用 10 格条和 100 格对照 0.5=0.50，再对齐数位比大小。"
    },
    onEnterStep: onEnterStep,
    settings: { autoStopSteps: [3, 4], pauseMs: 2500 }
  });
})();
</script>
</body>
</html>
