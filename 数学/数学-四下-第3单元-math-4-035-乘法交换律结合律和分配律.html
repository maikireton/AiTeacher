<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>乘法交换律、结合律和分配律 · AI 教师</title>
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="../assets/course.css">
<style>
  .mc-box { margin: 12px 0; }
  .mc-tip { font-size: 15px; font-weight: 700; min-height: 26px; margin: 8px 0; color: var(--accent-deep); }
  .mc-rule { display: inline-block; background: #e8f6ff; border: 1px solid #91caff; color: #0b5e91; border-radius: 10px; padding: 6px 14px; font-size: 15px; font-weight: 700; margin-top: 8px; }
  .mc-expr { font-size: 28px; font-weight: 800; color: #d97706; text-align: center; margin: 8px 0; }
  .dot-grid { display: grid; gap: 2px; justify-content: center; width: fit-content; margin: 8px auto; }
  .dot-grid .dg { width: 24px; height: 24px; border-radius: 4px; opacity: 0; transition: all .3s; }
  .dot-grid .dg.on { opacity: 1; }
  .dot-grid .dg.bl { background: linear-gradient(180deg,#82b1ff,#3d5afe); }
  .dot-grid .dg.or { background: linear-gradient(180deg,#ffd591,#ffa940); }
  .mc-side { display: inline-block; min-width: 90px; font-size: 20px; font-weight: 800; text-align: center; }
  .mc-sides { display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; margin-top: 8px; }
  .mc-count { font-size: 19px; font-weight: 800; color: #2e7d32; text-align: center; min-height: 24px; }
  .mc-step { font-size: 22px; font-weight: 800; text-align: center; min-height: 34px; color: #2e7d32; }
</style>
</head>
<body>
<div class="container">
  <header class="topbar">
    <a class="btn-home" href="index.html">← 数学</a>
    <span class="brand">乘法交换律、结合律和分配律 <small>4年级·下册</small></span>
  </header>

  <div class="player">
    <div class="task-line" id="task-line"></div>
    <div class="stage" id="stage"></div>
    <div class="dots" id="dots"></div>
    <div class="controls">
      <button class="cbtn" id="btn-prev">上一步</button>
      <button class="cbtn" id="btn-auto">▶ 自动播放</button>
      <button class="cbtn" id="btn-voice">🔊 语音</button>
      <button class="cbtn main" id="btn-next">下一步</button>
    </div>
    <div class="score-row" id="score-row"></div>
  </div>

  <details class="parent-panel">
    <summary>家长模式（点击展开）</summary>
    <div class="pbody">
      <p><b>本课一句话总结：</b>乘法交换律 a×b=b×a；结合律 (a×b)×c=a×(b×c)；分配律 a×(b+c)=a×b+a×c。</p>
      <p><b>孩子容易走神的地方：</b>分配律只乘到一边（漏乘）；用"面积格子图"理解：分两块分别算再相加。</p>
      <p><b>建议：</b>本课约 8 分钟；记住 25×4=100、125×8=1000，搭配律好用。</p>
    </div>
  </details>

  <footer class="foot">
    <div>AI 教师 · 示范课件 math-4-035</div>
  </footer>
</div>

<script src="../assets/voice.js"></script>
<script src="../assets/player-core.js"></script>
<script>
(function () {
  "use strict";
  var apiRef = null;

  /* ========== 五段式步骤 ========== */
  var steps = [
    {
      id: "s1",
      title: "情境引入",
      task: "咱们这一步要做的：想想 3×5 和 5×3 一样吗！",
      voice: "3 乘 5 等于 15，5 乘 3 也等于 15。交换因数，积不变！今天学乘法的交换律、结合律和分配律。",
      body: function () {
        return '' +
          '<h2>换位置积不变</h2>' +
          '<p class="mc-expr">3 × 5 = 5 × 3</p>' +
          '<div class="hint">👆 乘法也有交换律</div>';
      }
    },
    {
      id: "s2",
      title: "交换律与结合律动画",
      task: "咱们这一步要做的：看动画 3×5 旋转成 5×3！",
      voice: "看动画。3 行 5 列的点子图，转一下，变成 5 行 3 列。点的总数还是 15！这就是乘法交换律。三个数相乘，可以先乘前两个，也可以先乘后两个，积不变，是结合律。",
      body: function () {
        return '' +
          '<h2>看动画：3 × 5 = 5 × 3</h2>' +
          '<div class="mc-box" id="d1">' +
          '<div class="mc-expr" id="ex1">3 × 5 = ?</div>' +
          '<div class="dot-grid" id="grid1" style="grid-template-columns:repeat(5,24px)"></div>' +
          "</div>" +
          '<div class="mc-tip" id="d1-tip">准备开始…</div>' +
          '<div class="mc-rule">a×b=b×a；(a×b)×c=a×(b×c)</div>';
      }
    },
    {
      id: "s3",
      title: "乘法分配律动画",
      task: "咱们这一步要做的：看动画 4×(3+2) 分两半算！",
      voice: "看动画。4 乘（3 加 2）。左边蓝色 3 列，右边橙色 2 列，一共 5 列，4 行。先算左边 4 乘 3 等于 12，再算右边 4 乘 2 等于 8，12 加 8 等于 20。和 4 乘 5 一样！",
      body: function () {
        return '' +
          '<h2>看动画：4 × (3 + 2) = 4×3 + 4×2</h2>' +
          '<div class="mc-box" id="d2">' +
          '<div class="mc-expr" id="ex2">4 × (3 + 2) = ?</div>' +
          '<div class="dot-grid" id="grid2" style="grid-template-columns:repeat(5,24px)"></div>' +
          '<div class="mc-sides">' +
          '<div class="mc-side"><div>蓝色 4×3</div><div class="mc-count" id="cntL">?</div></div>' +
          '<div class="mc-side"><div>橙色 4×2</div><div class="mc-count" id="cntR">?</div></div>' +
          "</div>" +
          "</div>" +
          '<div class="mc-tip" id="d2-tip">准备开始…</div>' +
          '<div class="mc-rule">a×(b+c) = a×b + a×c（分配律）</div>';
      }
    },
    {
      id: "s4",
      title: "互动练习",
      task: "咱们这一步要做的：连闯 3 道乘法定律题！",
      voice: "现在考考你！乘法交换律、结合律、分配律。",
      body: function () {
        return '' +
          '<h2>闯关练习</h2>' +
          '<div class="quiz" id="quiz"></div>';
      }
    },
    {
      id: "s5",
      title: "Boss 关",
      task: "咱们这一步要做的：用分配律算 6×(4+1)，领奖！",
      voice: "Boss 来啦！6 乘（4 加 1）。用分配律：6 乘 4 等于 24，6 乘 1 等于 6，24 加 6 等于 30。和 6 乘 5 一样！",
      body: function () {
        return '' +
          '<h2>Boss 关：6 × (4 + 1) = ?</h2>' +
          '<div class="quiz" id="boss-quiz"></div>' +
          '<div class="result-big" id="result-stars"></div>';
      }
    }
  ];

  function runD1() {
    var tip = document.getElementById("d1-tip");
    var g = document.getElementById("grid1");
    var ex = document.getElementById("ex1");
    var h = "";
    for (var i = 0; i < 15; i++) { h += '<div class="dg bl"></div>'; }
    g.innerHTML = h;
    var cells = g.querySelectorAll(".dg");
    cells.forEach(function (c, i) { setTimeout(function () { c.classList.add("on"); }, 60 * i); });
    setTimeout(function () { if (tip) { tip.textContent = "① 3 行 × 5 列 = 15 个点（3×5）"; } }, 60 * 15 + 300);
    setTimeout(function () {
      g.style.gridTemplateColumns = "repeat(3,24px)";
      g.style.gridAutoFlow = "column";
      if (tip) { tip.textContent = "② 转成 5 行 × 3 列，还是 15 个 → 交换律 ✅"; }
      ex.innerHTML = "3 × 5 = 5 × 3 = <b>15</b>";
    }, 60 * 15 + 2600);
    setTimeout(function () { if (tip) { tip.textContent = "✅ 结合律：三数连乘可先乘任意两个"; } }, 60 * 15 + 4400);
  }
  function runD2() {
    var tip = document.getElementById("d2-tip");
    var g = document.getElementById("grid2");
    var h = "";
    for (var r = 0; r < 4; r++) {
      for (var c = 0; c < 5; c++) {
        h += '<div class="dg ' + (c < 3 ? "bl" : "or") + '"></div>';
      }
    }
    g.innerHTML = h;
    var cells = g.querySelectorAll(".dg");
    cells.forEach(function (cell, i) {
      setTimeout(function () { cell.classList.add("on"); }, 70 * i);
    });
    setTimeout(function () { if (tip) { tip.textContent = "① 4 行，每行左边 3 蓝 + 右边 2 橙 = 5"; } }, 70 * 20 + 300);
    setTimeout(function () {
      document.getElementById("cntL").textContent = "4 × 3 = 12";
      document.getElementById("cntR").textContent = "4 × 2 = 8";
      if (tip) { tip.textContent = "② 分开算：蓝 12 + 橙 8 = 20"; }
    }, 70 * 20 + 2400);
    setTimeout(function () {
      if (tip) { tip.textContent = "③ 4×3 + 4×2 = 12+8 = 20 = 4×5 ✅ 分配律"; }
      document.getElementById("ex2").innerHTML = "4 × (3+2) = 4×3 + 4×2 = <b>20</b>";
    }, 70 * 20 + 4400);
  }

  /* ========== S4 练习 ========== */
  var QUIZ = [
    { q: "7 × 8 = 8 × ?", right: "7", opts: ["7", "8", "56"] },
    { q: "25 × 47 × 4 = ?（先凑 25×4）", right: "4700", opts: ["4700", "470", "1175"] },
    { q: "5 × (3 + 4) = 5×3 + 5×4 = ?", right: "35", opts: ["35", "27", "60"] }
  ];
  var quizDone = { q1: false, q2: false, q3: false };
  function startQuiz() {
    quizDone = { q1: false, q2: false, q3: false };
    renderQuiz();
  }
  function renderQuiz() {
    var box = document.getElementById("quiz");
    if (!box) { return; }
    var idx = -1;
    ["q1", "q2", "q3"].forEach(function (k, i) { if (!quizDone[k] && idx === -1) { idx = i; } });
    if (idx === -1) { box.innerHTML = '<div class="q">全部完成！⭐ 你真棒</div>'; return; }
    var q = QUIZ[idx];
    box.innerHTML = '<div class="q">第 ' + (idx + 1) + " 题：" + q.q + "</div>" +
      '<div class="opts">' + q.opts.map(function (o) {
        return '<div class="opt" data-ok="' + (o === q.right ? "1" : "0") + '">' + o + "</div>";
      }).join("") + "</div>" +
      "<div class='qmsg'></div><button class='qnext' disabled>下一题</button>";
    var tried = false;
    var opts = box.querySelectorAll(".opt");
    opts.forEach(function (o) {
      o.addEventListener("click", function () {
        if (tried) { return; }
        var ok = o.getAttribute("data-ok") === "1";
        var msg = box.querySelector(".qmsg");
        if (ok) {
          o.classList.add("right");
          opts.forEach(function (x) { x.classList.add("locked"); });
          apiRef.addStars(1); apiRef.comboHit();
          msg.className = "qmsg ok";
          msg.textContent = "对啦！⭐ +1" + (apiRef.state.combo >= 2 ? "（连击 +" + apiRef.state.combo + "）" : "");
          box.querySelector(".qnext").disabled = false;
        } else {
          o.classList.add("wrong");
          tried = true;
          apiRef.comboReset();
          msg.className = "qmsg no";
          msg.textContent = "交换律换位置、结合律先乘任意两个、分配律分别乘再加";
          setTimeout(function () { o.classList.remove("wrong"); tried = false; }, 1800);
        }
      });
    });
    box.querySelector(".qnext").addEventListener("click", function () {
      quizDone["q" + (idx + 1)] = true;
      renderQuiz();
    });
  }

  /* ========== S5 Boss ========== */
  function startBoss() {
    var box = document.getElementById("boss-quiz");
    if (!box) { return; }
    box.innerHTML = '<div class="q">6 × (4 + 1) = ?（用分配律）</div>' +
      '<div class="opts">' +
      '<div class="opt" data-ok="1">30</div>' +
      '<div class="opt" data-ok="0">25</div>' +
      '<div class="opt" data-ok="0">24</div>' +
      "</div><div class='qmsg'></div>";
    var rs = document.getElementById("result-stars");
    var tried = false;
    box.querySelectorAll(".opt").forEach(function (o) {
      o.addEventListener("click", function () {
        if (tried) { return; }
        var ok = o.getAttribute("data-ok") === "1";
        var msg = box.querySelector(".qmsg");
        if (ok) {
          o.classList.add("right");
          box.querySelectorAll(".opt").forEach(function (x) { x.classList.add("locked"); });
          apiRef.addStars(2); apiRef.comboHit();
          msg.className = "qmsg ok";
          msg.textContent = "Boss 击败！⭐ +2 乘法定律你掌握啦！";
          if (rs) {
            var n = apiRef.stars();
            rs.innerHTML = "🏆 共获得 <b>" + n + "</b> 颗星" +
              (n >= 8 ? "（全部拿下！）" : n >= 5 ? "（很不错！）" : "（下次再来！）");
          }
        } else {
          o.classList.add("wrong");
          tried = true;
          apiRef.comboReset();
          msg.className = "qmsg no";
          msg.textContent = "6×4 + 6×1 = 24 + 6 = 30";
          setTimeout(function () { o.classList.remove("wrong"); tried = false; }, 1600);
        }
      });
    });
  }

  /* ========== 启动 ========== */
  function onEnterStep(step, api) {
    apiRef = api;
    if (step.id === "s2") { runD1(); }
    if (step.id === "s3") { runD2(); }
    if (step.id === "s4") { startQuiz(); }
    if (step.id === "s5") { startBoss(); }
  }

  PlayerCore.init({
    steps: steps,
    parent: {
      summary: "乘法交换律 a×b=b×a；结合律 (a×b)×c=a×(b×c)；分配律 a×(b+c)=a×b+a×c。",
      attention: "孩子用分配律时容易漏乘一边；用「面积格子图」理解：分两块分别算再相加。",
      tip: "本课约 8 分钟；记住 25×4=100、125×8=1000，结合律好用。"
    },
    onEnterStep: onEnterStep,
    settings: { autoStopSteps: [3, 4], pauseMs: 2500 }
  });
})();
</script>
</body>
</html>
