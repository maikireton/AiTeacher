<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>乘法模型：总价/路程/工作总量 · AI 教师</title>
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="../assets/course.css">
<style>
  .mx-box { margin: 12px 0; }
  .mx-zone { display: flex; gap: 10px; justify-content: center; align-items: flex-end; flex-wrap: wrap; }
  .mx-group { display: flex; flex-direction: column; gap: 5px; align-items: center; border: 2px dashed var(--border); border-radius: 12px; padding: 8px 10px; transition: all .4s; opacity: 0; }
  .mx-group.show { opacity: 1; }
  .mx-group.hl { border-color: var(--accent-deep); border-style: solid; background: rgba(155,187,244,.1); }
  .mx-item { width: 26px; height: 26px; border-radius: 6px; background: #4a7fe0; }
  .mx-group .mx-lab { font-size: 12px; color: var(--text-2); }
  .mx-tip { font-size: 15px; font-weight: 700; min-height: 26px; margin: 10px 0; color: var(--accent-deep); }
  .mx-eq { font-size: 24px; font-weight: 800; margin-top: 6px; color: #2e7d32; }
  .mx-run { display: inline-block; background: rgba(155,187,244,.18); border: 2px solid var(--accent-deep); border-radius: 10px; padding: 6px 12px; font-size: 15px; font-weight: 700; opacity: 0; transition: all .4s; }
  .mx-run.show { opacity: 1; }
  .model { display: inline-block; background: #e8f6ff; border: 1px solid #91caff; color: #0b5e91; border-radius: 10px; padding: 6px 14px; font-size: 15px; font-weight: 700; margin-top: 8px; }
</style>
</head>
<body>
<div class="container">
  <header class="topbar">
    <a class="btn-home" href="index.html">← 数学</a>
    <span class="brand">乘法模型：总价/路程/工作总量 <small>4年级·上册</small></span>
  </header>

  <div class="player">
    <div class="task-line" id="task-line"></div>
    <div class="stage" id="stage"></div>
    <div class="dots" id="dots"></div>
    <div class="controls">
      <button class="cbtn" id="btn-prev">上一步</button>
      <button class="cbtn" id="btn-auto">▶ 自动播放</button>
      <button class="cbtn" id="btn-voice">🔊 语音</button>
      <button class="cbtn main" id="btn-next">下一步</button>
    </div>
    <div class="score-row" id="score-row"></div>
  </div>

  <details class="parent-panel">
    <summary>家长模式（点击展开）</summary>
    <div class="pbody">
      <p><b>本课一句话总结：</b>单价×数量=总价；速度×时间=路程；工作效率×工作时间=工作总量。</p>
      <p><b>孩子容易走神的地方：</b>把单价/数量弄反、或忘记模型公式；可先让他说出"谁是单价谁是数量"。</p>
      <p><b>建议：</b>本课约 8 分钟；带孩子逛超市看价签，套用"单价×数量=总价"。</p>
    </div>
  </details>

  <footer class="foot">
    <div>AI 教师 · 示范课件 math-4-022</div>
  </footer>
</div>

<script src="../assets/voice.js"></script>
<script src="../assets/player-core.js"></script>
<script src="../assets/record.js"></script>
<script>
(function () {
  "use strict";
  var apiRef = null;

  /* ========== 五段式步骤 ========== */
  var steps = [
    {
      id: "s1",
      title: "情境引入",
      task: "咱们这一步要做的：看看买东西和走路里藏着什么规律！",
      voice: "一支笔三元，买五支要多少钱？三乘五等于十五。这里藏着乘法的模型：单价乘数量等于总价。还有速度乘时间等于路程。今天我们认识它们。",
      body: function () {
        return '' +
          '<h2>乘法的三个模型</h2>' +
          '<p>一支笔 3 元，买 5 支 → <span class="big">3 × 5 = 15 元</span></p>' +
          '<p>汽车每小时 60 千米，走 3 小时 → <span class="big">60 × 3 = 180 千米</span></p>' +
          '<div class="hint">👆 都是乘法，但一个是"买"，一个是"走"。</div>';
      }
    },
    {
      id: "s2",
      title: "单价 × 数量动画",
      task: "咱们这一步要做的：看动画理解「单价×数量=总价」！",
      voice: "看动画。一支笔三元，是单价。买五支，是数量。每一支都是三元，一共五份。三乘五等于十五，总价十五元。单价乘数量等于总价。",
      body: function () {
        return '' +
          '<h2>看动画：3 元 × 5 支 = 15 元</h2>' +
          '<div class="mx-zone" id="mx1"></div>' +
          '<div class="mx-tip" id="mx1-tip">准备开始…</div>' +
          '<div class="model">模型：单价 × 数量 = 总价</div>';
      }
    },
    {
      id: "s3",
      title: "速度 × 时间动画",
      task: "咱们这一步要做的：看动画理解「速度×时间=路程」！",
      voice: "再看一个。汽车每小时走六十千米，这是速度。走三小时，这是时间。三个六十加起来，一百八十千米，这就是路程。速度乘时间等于路程。",
      body: function () {
        return '' +
          '<h2>看动画：60 千米/时 × 3 时 = 180 千米</h2>' +
          '<div class="mx-zone" id="mx2"></div>' +
          '<div class="mx-tip" id="mx2-tip">准备开始…</div>' +
          '<div class="model">模型：速度 × 时间 = 路程</div>';
      }
    },
    {
      id: "s4",
      title: "互动练习",
      task: "咱们这一步要做的：连闯 3 道，套用模型！",
      voice: "现在考考你！三个乘法模型你会用吗？先说出模型，再算答案。",
      body: function () {
        return '' +
          '<h2>闯关练习</h2>' +
          '<div class="quiz" id="quiz"></div>';
      }
    },
    {
      id: "s5",
      title: "Boss 关",
      task: "咱们这一步要做的：用工作总量模型解题，领奖！",
      voice: "Boss 来啦！工人叔叔每小时做八个零件，做四小时，一共做多少个？用工作效率乘工作时间。",
      body: function () {
        return '' +
          '<h2>Boss 关：工作总量</h2>' +
          '<p class="big">每小时做 8 个零件，做 4 小时，共做 ? 个</p>' +
          '<div class="quiz" id="boss-quiz"></div>' +
          '<div class="result-big" id="result-stars"></div>';
      }
    }
  ];

  /* ========== S2：3元 × 5支 = 15元 ========== */
  function runMx1() {
    var box = document.getElementById("mx1");
    if (!box) { return; }
    var tip = document.getElementById("mx1-tip");
    var h = "";
    for (var i = 0; i < 5; i++) {
      h += '<div class="mx-group" id="mx1-g' + i + '">' +
        '<span class="mx-item"></span><span class="mx-item"></span><span class="mx-item"></span>' +
        '<span class="mx-lab">' + (i + 1) + "支</span></div>";
    }
    box.innerHTML = h;
    var total = 0;
    for (var i = 0; i < 5; i++) {
      (function (i) {
        setTimeout(function () {
          var g = document.getElementById("mx1-g" + i);
          g.classList.add("show", "hl");
          total = (i + 1) * 3;
          if (tip) { tip.textContent = "第 " + (i + 1) + " 支 +3 元 → 累计 " + total + " 元"; }
        }, 900 + i * 700);
      })(i);
    }
    setTimeout(function () {
      if (tip) { tip.textContent = "✅ 3 × 5 = 15（单价 × 数量 = 总价）"; }
    }, 5000);
  }

  /* ========== S3：60km/h × 3h = 180km ========== */
  function runMx2() {
    var box = document.getElementById("mx2");
    if (!box) { return; }
    var tip = document.getElementById("mx2-tip");
    var h = "";
    for (var i = 0; i < 3; i++) {
      h += '<div class="mx-group mx-run" id="mx2-g' + i + '"><span class="mx-item" style="width:64px"></span><span class="mx-lab">60 千米 · 第' + (i + 1) + "小时</span></div>";
    }
    box.innerHTML = h;
    var total = 0;
    for (var i = 0; i < 3; i++) {
      (function (i) {
        setTimeout(function () {
          var g = document.getElementById("mx2-g" + i);
          g.classList.add("show", "hl");
          total = (i + 1) * 60;
          if (tip) { tip.textContent = "走了 " + (i + 1) + " 小时 → 累计 " + total + " 千米"; }
        }, 900 + i * 900);
      })(i);
    }
    setTimeout(function () {
      if (tip) { tip.textContent = "✅ 60 × 3 = 180（速度 × 时间 = 路程）"; }
    }, 5200);
  }

  /* ========== S4 练习 ========== */
  var QUIZ = [
    { q: "一支笔 3 元，买 5 支，一共多少元？", right: "15", opts: ["15", "8", "20"] },
    { q: "汽车每小时 60 千米，走 3 小时，路程是？", right: "180 千米", opts: ["180 千米", "60 千米", "20 千米"] },
    { q: "总价 = 单价 × ?", right: "数量", opts: ["数量", "时间", "路程"] }
  ];
  var quizDone = { q1: false, q2: false, q3: false };
  function startQuiz() {
    quizDone = { q1: false, q2: false, q3: false };
    renderQuiz();
  }
  function renderQuiz() {
    var box = document.getElementById("quiz");
    if (!box) { return; }
    var idx = -1;
    ["q1", "q2", "q3"].forEach(function (k, i) { if (!quizDone[k] && idx === -1) { idx = i; } });
    if (idx === -1) {
      box.innerHTML = '<div class="q">全部完成！⭐ 你真棒</div>';
      return;
    }
    var q = QUIZ[idx];
    box.innerHTML = '<div class="q">第 ' + (idx + 1) + " 题：" + q.q + "</div>" +
      '<div class="opts">' + q.opts.map(function (o) {
        return '<div class="opt" data-ok="' + (o === q.right ? "1" : "0") + '">' + o + "</div>";
      }).join("") + "</div>" +
      "<div class='qmsg'></div><button class='qnext' disabled>下一题</button>";
    var tried = false;
    var opts = box.querySelectorAll(".opt");
    opts.forEach(function (o) {
      o.addEventListener("click", function () {
        if (tried) { return; }
        var ok = o.getAttribute("data-ok") === "1";
        var msg = box.querySelector(".qmsg");
        if (ok) {
          o.classList.add("right");
          opts.forEach(function (x) { x.classList.add("locked"); });
          apiRef.addStars(1); apiRef.comboHit();
          msg.className = "qmsg ok";
          msg.textContent = "对啦！⭐ +1" + (apiRef.state.combo >= 2 ? "（连击 +" + apiRef.state.combo + "）" : "");
          box.querySelector(".qnext").disabled = false;
        } else {
          o.classList.add("wrong");
          tried = true;
          apiRef.comboReset();
          msg.className = "qmsg no";
          msg.textContent = "模型：单价×数量=总价，速度×时间=路程";
          setTimeout(function () { o.classList.remove("wrong"); tried = false; }, 1600);
        }
      });
    });
    box.querySelector(".qnext").addEventListener("click", function () {
      quizDone["q" + (idx + 1)] = true;
      renderQuiz();
    });
  }

  /* ========== S5 Boss ========== */
  function startBoss() {
    var box = document.getElementById("boss-quiz");
    if (!box) { return; }
    box.innerHTML = '<div class="q">4 小时共做多少个零件？</div>' +
      '<div class="opts">' +
      '<div class="opt" data-ok="1">32</div>' +
      '<div class="opt" data-ok="0">12</div>' +
      '<div class="opt" data-ok="0">84</div>' +
      "</div><div class='qmsg'></div>";
    var rs = document.getElementById("result-stars");
    var tried = false;
    box.querySelectorAll(".opt").forEach(function (o) {
      o.addEventListener("click", function () {
        if (tried) { return; }
        var ok = o.getAttribute("data-ok") === "1";
        var msg = box.querySelector(".qmsg");
        if (ok) {
          o.classList.add("right");
          box.querySelectorAll(".opt").forEach(function (x) { x.classList.add("locked"); });
          apiRef.addStars(2); apiRef.comboHit();
          msg.className = "qmsg ok";
          msg.textContent = "Boss 击败！⭐ +2 乘法模型你会用啦！";
          if (rs) {
            var n = apiRef.stars();
            rs.innerHTML = "🏆 共获得 <b>" + n + "</b> 颗星" +
              (n >= 8 ? "（全部拿下！）" : n >= 5 ? "（很不错！）" : "（下次再来！）");
          }
        } else {
          o.classList.add("wrong");
          tried = true;
          apiRef.comboReset();
          msg.className = "qmsg no";
          msg.textContent = "工作效率 × 工作时间 = 工作总量：8 × 4 = 32";
          setTimeout(function () { o.classList.remove("wrong"); tried = false; }, 1600);
        }
      });
    });
  }

  /* ========== 启动 ========== */
  function onEnterStep(step, api) {
    apiRef = api;
    if (step.id === "s2") { runMx1(); }
    if (step.id === "s3") { runMx2(); }
    if (step.id === "s4") { startQuiz(); }
    if (step.id === "s5") { startBoss(); }
  }

  PlayerCore.init({
    steps: steps,
    parent: {
      summary: "单价×数量=总价；速度×时间=路程；工作效率×工作时间=工作总量。",
      attention: "孩子容易把单价/数量弄反、或忘记模型公式；可先让他说出「谁是单价谁是数量」。",
      tip: "本课约 8 分钟；带孩子逛超市看价签，套用「单价×数量=总价」。"
    },
    onEnterStep: onEnterStep,
    settings: { autoStopSteps: [3, 4], pauseMs: 2500 }
  });
})();
</script>
</body>
</html>
