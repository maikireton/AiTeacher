<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>认识角：直角、锐角、钝角 · AI 教师</title>
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="../assets/course.css">
<style>
  .ang-box { margin: 12px 0; }
  .ang-3d { display: flex; justify-content: center; }
  .ang-3d svg { max-width: 220px; width: 100%; }
  .ang-tip { font-size: 15px; font-weight: 700; min-height: 26px; margin: 8px 0; color: var(--accent-deep); }
  .ang-rule { display: inline-block; background: #e8f6ff; border: 1px solid #91caff; color: #0b5e91; border-radius: 10px; padding: 6px 14px; font-size: 15px; font-weight: 700; margin-top: 8px; }
  .ang-cards { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 6px; }
  .angc { border: 2px solid var(--border); border-radius: 12px; padding: 8px 12px; text-align: center; background: var(--card); opacity: 0; transition: all .4s; }
  .angc.show { opacity: 1; }
  .angc.hl { border-color: var(--accent-deep); }
  .angc svg { width: 90px; height: 70px; }
  .angc .n { font-weight: 800; margin-top: 2px; }
</style>
</head>
<body>
<div class="container">
  <header class="topbar">
    <a class="btn-home" href="index.html">← 数学</a>
    <span class="brand">认识角：直角、锐角、钝角 <small>3年级·上册</small></span>
  </header>

  <div class="player">
    <div class="task-line" id="task-line"></div>
    <div class="stage" id="stage"></div>
    <div class="dots" id="dots"></div>
    <div class="controls">
      <button class="cbtn" id="btn-prev">上一步</button>
      <button class="cbtn" id="btn-auto">▶ 自动播放</button>
      <button class="cbtn" id="btn-voice">🔊 语音</button>
      <button class="cbtn main" id="btn-next">下一步</button>
    </div>
    <div class="score-row" id="score-row"></div>
  </div>

  <details class="parent-panel">
    <summary>家长模式（点击展开）</summary>
    <div class="pbody">
      <p><b>本课一句话总结：</b>角由一个顶点和两条边组成；锐角比直角小，钝角比直角大（小于 180°），直角是 90°。</p>
      <p><b>孩子容易走神的地方：</b>把角的"张口大小"和边的长短混淆；记住角的大小看张口。</p>
      <p><b>建议：</b>本课约 8 分钟；用两根小棒摆角，比一比谁大谁小；三角尺的直角当"标准尺"。</p>
    </div>
  </details>

  <footer class="foot">
    <div>AI 教师 · 示范课件 math-3-115</div>
  </footer>
</div>

<script src="../assets/voice.js"></script>
<script src="../assets/player-core.js"></script>
<script>
(function () {
  "use strict";
  var apiRef = null;
  var NS = "http://www.w3.org/2000/svg";
  function svgEl(tag, attrs) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) { e.setAttribute(k, attrs[k]); }
    return e;
  }

  function angleSVG(x2, y2, isRight, label, labX, labY) {
    var svg = svgEl("svg", { viewBox: "0 0 120 100", width: "120", height: "100" });
    var b = svgEl("line", { x1: "18", y1: "88", x2: "108", y2: "88", stroke: "#4a7fe0", "stroke-width": 4, "stroke-linecap": "round" });
    var s = svgEl("line", { x1: "18", y1: "88", x2: x2, y2: y2, stroke: "#4a7fe0", "stroke-width": 4, "stroke-linecap": "round" });
    var v = svgEl("circle", { cx: "18", cy: "88", r: 6, fill: "#ffa940", stroke: "#fff", "stroke-width": 2 });
    svg.appendChild(b); svg.appendChild(s); svg.appendChild(v);
    if (isRight) {
      var r = svgEl("rect", { x: "18", y: "58", width: "24", height: "24", fill: "none", stroke: "#ffa940", "stroke-width": 2 });
      svg.appendChild(r);
    } else {
      var arc = svgEl("path", { d: "M 45 88 A 30 30 0 " + (label === "锐角" ? "0" : "1") + " 0 " + arcEnd(x2, y2), fill: "none", stroke: "#ffa940", "stroke-width": 3 });
      svg.appendChild(arc);
    }
    var t = svgEl("text", { x: labX || 55, y: labY || 55, "font-size": "13", "font-weight": "bold", fill: "#d97706" });
    t.textContent = label;
    svg.appendChild(t);
    return svg;
  }
  function arcEnd(x2, y2) {
    // 从 (45,88) 绕圆心 (18,88) 半径 27 到斜边上的点
    var dx = x2 - 18, dy = y2 - 88;
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    var ex = 18 + (dx / len) * 27, ey = 88 + (dy / len) * 27;
    return ex.toFixed(1) + " " + ey.toFixed(1);
  }

  /* ========== 五段式步骤 ========== */
  var steps = [
    {
      id: "s1",
      title: "情境引入",
      task: "咱们这一步要做的：看看扇子打开有多大！",
      voice: "扇子打开一小点，是小小的角；打开成拐弯，是直角；再打开大一点，是钝角。今天认识三种角！",
      body: function () {
        return '' +
          '<h2>三种角</h2>' +
          '<p>🪭 扇子张口小 = 锐角；张口正好 = 直角；张口大 = 钝角</p>' +
          '<div class="hint">👆 角的大小看"张口"，不看边的长短</div>';
      }
    },
    {
      id: "s2",
      title: "认识角",
      task: "咱们这一步要做的：看动画找角的顶点和两条边！",
      voice: "看动画。一个角，有一个尖尖的顶点，和两条直直的边。记住：角 = 一个顶点 + 两条边。角的大小，看两条边张开的程度。",
      body: function () {
        return '' +
          '<h2>看动画：角的组成</h2>' +
          '<div class="ang-box" id="a1">' +
          '<div class="ang-3d" id="svgA"></div>' +
          "</div>" +
          '<div class="ang-tip" id="a1-tip">准备开始…</div>' +
          '<div class="ang-rule">角：一个顶点 + 两条边</div>';
      }
    },
    {
      id: "s3",
      title: "三种角动画",
      task: "咱们这一步要做的：看动画认识锐角、直角、钝角！",
      voice: "看动画。张口小小的，比直角小，是锐角。张口正正的，像墙角，是直角，九十度。张口大大的，比直角大，是钝角。用三角尺的直角一比就知道。",
      body: function () {
        return '' +
          '<h2>看动画：锐角 / 直角 / 钝角</h2>' +
          '<div class="ang-cards" id="cards">' +
          '<div class="angc" data-k="r"><span id="svgr"></span><div class="n">锐角（比直角小）</div></div>' +
          '<div class="angc" data-k="z"><span id="svgz"></span><div class="n">直角（90°）</div></div>' +
          '<div class="angc" data-k="d"><span id="svgd"></span><div class="n">钝角（比直角大）</div></div>' +
          "</div>" +
          '<div class="ang-tip" id="a2-tip">准备开始…</div>' +
          '<div class="ang-rule">锐角 &lt; 直角 &lt; 钝角（用三角尺比）</div>';
      }
    },
    {
      id: "s4",
      title: "互动练习",
      task: "咱们这一步要做的：连闯 3 道角分类题！",
      voice: "现在考考你！三种角你会分吗？",
      body: function () {
        return '' +
          '<h2>闯关练习</h2>' +
          '<div class="quiz" id="quiz"></div>';
      }
    },
    {
      id: "s5",
      title: "Boss 关",
      task: "咱们这一步要做的：判断角的类型，领奖！",
      voice: "Boss 来啦！一个角，比直角小，是什么角？当然是锐角！",
      body: function () {
        return '' +
          '<h2>Boss 关：比直角小是？</h2>' +
          '<div class="quiz" id="boss-quiz"></div>' +
          '<div class="result-big" id="result-stars"></div>';
      }
    }
  ];

  function runA1() {
    var svg = angleSVG(88, 30, false, "角", 60, 50);
    document.getElementById("svgA").appendChild(svg);
    var tip = document.getElementById("a1-tip");
    setTimeout(function () { if (tip) { tip.textContent = "① 这个尖尖的点叫「顶点」"; } }, 800);
    setTimeout(function () { if (tip) { tip.textContent = "② 从顶点伸出的两条直直的线叫「边」"; } }, 2600);
    setTimeout(function () { if (tip) { tip.textContent = "✅ 角的大小看两条边张开的程度"; } }, 4600);
  }
  function runA2() {
    document.getElementById("svgr").appendChild(angleSVG(60, 62, false, "锐角", 52, 66));
    document.getElementById("svgz").appendChild(angleSVG(18, 30, true, "直角", 52, 48));
    document.getElementById("svgd").appendChild(angleSVG(100, 30, false, "钝角", 58, 42));
    var tip = document.getElementById("a2-tip");
    var cards = document.querySelectorAll("#cards .angc");
    var order = [["r", "锐角：张口小，比直角小"], ["z", "直角：正正方方，90°"], ["d", "钝角：张口大，比直角大"]];
    order.forEach(function (o, i) {
      setTimeout(function () {
        cards.forEach(function (c) { c.classList.remove("hl"); });
        cards[i].classList.add("show", "hl");
        if (tip) { tip.textContent = o[1]; }
      }, 800 + i * 2000);
    });
    setTimeout(function () {
      cards.forEach(function (c) { c.classList.remove("hl"); });
      if (tip) { tip.textContent = "✅ 锐角 < 直角 < 钝角"; }
    }, 7000);
  }

  /* ========== S4 练习 ========== */
  var QUIZ = [
    { q: "比直角小的是？", right: "锐角", opts: ["锐角", "钝角", "平角"] },
    { q: "比直角大的是？", right: "钝角", opts: ["钝角", "锐角", "直角"] },
    { q: "一个角由什么组成？", right: "一个顶点两条边", opts: ["一个顶点两条边", "两个顶点", "三条边"] }
  ];
  var quizDone = { q1: false, q2: false, q3: false };
  function startQuiz() {
    quizDone = { q1: false, q2: false, q3: false };
    renderQuiz();
  }
  function renderQuiz() {
    var box = document.getElementById("quiz");
    if (!box) { return; }
    var idx = -1;
    ["q1", "q2", "q3"].forEach(function (k, i) { if (!quizDone[k] && idx === -1) { idx = i; } });
    if (idx === -1) { box.innerHTML = '<div class="q">全部完成！⭐ 你真棒</div>'; return; }
    var q = QUIZ[idx];
    box.innerHTML = '<div class="q">第 ' + (idx + 1) + " 题：" + q.q + "</div>" +
      '<div class="opts">' + q.opts.map(function (o) {
        return '<div class="opt" data-ok="' + (o === q.right ? "1" : "0") + '">' + o + "</div>";
      }).join("") + "</div>" +
      "<div class='qmsg'></div><button class='qnext' disabled>下一题</button>";
    var tried = false;
    var opts = box.querySelectorAll(".opt");
    opts.forEach(function (o) {
      o.addEventListener("click", function () {
        if (tried) { return; }
        var ok = o.getAttribute("data-ok") === "1";
        var msg = box.querySelector(".qmsg");
        if (ok) {
          o.classList.add("right");
          opts.forEach(function (x) { x.classList.add("locked"); });
          apiRef.addStars(1); apiRef.comboHit();
          msg.className = "qmsg ok";
          msg.textContent = "对啦！⭐ +1" + (apiRef.state.combo >= 2 ? "（连击 +" + apiRef.state.combo + "）" : "");
          box.querySelector(".qnext").disabled = false;
        } else {
          o.classList.add("wrong");
          tried = true;
          apiRef.comboReset();
          msg.className = "qmsg no";
          msg.textContent = "锐角 < 直角（90°）< 钝角";
          setTimeout(function () { o.classList.remove("wrong"); tried = false; }, 1400);
        }
      });
    });
    box.querySelector(".qnext").addEventListener("click", function () {
      quizDone["q" + (idx + 1)] = true;
      renderQuiz();
    });
  }

  /* ========== S5 Boss ========== */
  function startBoss() {
    var box = document.getElementById("boss-quiz");
    if (!box) { return; }
    box.innerHTML = '<div class="q">比直角小的是什么角？</div>' +
      '<div class="opts">' +
      '<div class="opt" data-ok="1">锐角</div>' +
      '<div class="opt" data-ok="0">钝角</div>' +
      '<div class="opt" data-ok="0">直角</div>' +
      "</div><div class='qmsg'></div>";
    var rs = document.getElementById("result-stars");
    var tried = false;
    box.querySelectorAll(".opt").forEach(function (o) {
      o.addEventListener("click", function () {
        if (tried) { return; }
        var ok = o.getAttribute("data-ok") === "1";
        var msg = box.querySelector(".qmsg");
        if (ok) {
          o.classList.add("right");
          box.querySelectorAll(".opt").forEach(function (x) { x.classList.add("locked"); });
          apiRef.addStars(2); apiRef.comboHit();
          msg.className = "qmsg ok";
          msg.textContent = "Boss 击败！⭐ +2 三种角你掌握啦！";
          if (rs) {
            var n = apiRef.stars();
            rs.innerHTML = "🏆 共获得 <b>" + n + "</b> 颗星" +
              (n >= 8 ? "（全部拿下！）" : n >= 5 ? "（很不错！）" : "（下次再来！）");
          }
        } else {
          o.classList.add("wrong");
          tried = true;
          apiRef.comboReset();
          msg.className = "qmsg no";
          msg.textContent = "比直角小 → 锐角";
          setTimeout(function () { o.classList.remove("wrong"); tried = false; }, 1300);
        }
      });
    });
  }

  /* ========== 启动 ========== */
  function onEnterStep(step, api) {
    apiRef = api;
    if (step.id === "s2") { runA1(); }
    if (step.id === "s3") { runA2(); }
    if (step.id === "s4") { startQuiz(); }
    if (step.id === "s5") { startBoss(); }
  }

  PlayerCore.init({
    steps: steps,
    parent: {
      summary: "角由一个顶点和两条边组成；锐角比直角小，钝角比直角大（小于 180°），直角是 90°。",
      attention: "孩子容易把角的「张口大小」和边的长短混淆；记住角的大小看张口。",
      tip: "本课约 8 分钟；用两根小棒摆角比大小；三角尺的直角当「标准尺」。"
    },
    onEnterStep: onEnterStep,
    settings: { autoStopSteps: [3, 4], pauseMs: 2500 }
  });
})();
</script>
</body>
</html>
