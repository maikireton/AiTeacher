<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小数点移动引起小数大小的变化 · AI 教师</title>
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="../assets/course.css">
<style>
  .dp-box { margin: 12px 0; }
  .dp-tip { font-size: 15px; font-weight: 700; min-height: 26px; margin: 8px 0; color: var(--accent-deep); }
  .dp-rule { display: inline-block; background: #e8f6ff; border: 1px solid #91caff; color: #0b5e91; border-radius: 10px; padding: 6px 14px; font-size: 15px; font-weight: 700; margin-top: 8px; }
  .numline { display: flex; justify-content: center; align-items: center; gap: 8px; font-size: 44px; font-weight: 800; font-family: "SFMono-Regular", Consolas, monospace; color: #2e3b52; margin: 14px 0; }
  .numline .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #e53935; transition: all .4s; }
  .numline .dg { display: inline-block; }
  .dp-arrow { font-size: 30px; color: var(--accent-deep); font-weight: 800; }
  .dp-lab { font-size: 20px; font-weight: 800; color: #d97706; text-align: center; min-height: 28px; }
  .dp-step { font-size: 20px; font-weight: 800; text-align: center; min-height: 28px; color: #2e7d32; }
</style>
</head>
<body>
<div class="container">
  <header class="topbar">
    <a class="btn-home" href="index.html">← 数学</a>
    <span class="brand">小数点移动引起小数大小的变化 <small>4年级·下册</small></span>
  </header>

  <div class="player">
    <div class="task-line" id="task-line"></div>
    <div class="stage" id="stage"></div>
    <div class="dots" id="dots"></div>
    <div class="controls">
      <button class="cbtn" id="btn-prev">上一步</button>
      <button class="cbtn" id="btn-auto">▶ 自动播放</button>
      <button class="cbtn" id="btn-voice">🔊 语音</button>
      <button class="cbtn main" id="btn-next">下一步</button>
    </div>
    <div class="score-row" id="score-row"></div>
  </div>

  <details class="parent-panel">
    <summary>家长模式（点击展开）</summary>
    <div class="pbody">
      <p><b>本课一句话总结：</b>小数点右移一位×10、两位×100、三位×1000；左移一位÷10、两位÷100。</p>
      <p><b>孩子容易走神的地方：</b>左右方向和乘除对应记反；口诀"右大左小"：小数点往右移数变大，往左移数变小。</p>
      <p><b>建议：</b>本课约 8 分钟；让小数点"跳格子"，跳一位乘 10、跳两位乘 100。</p>
    </div>
  </details>

  <footer class="foot">
    <div>AI 教师 · 示范课件 math-4-039</div>
  </footer>
</div>

<script src="../assets/voice.js"></script>
<script src="../assets/player-core.js"></script>
<script>
(function () {
  "use strict";
  var apiRef = null;

  /* ========== 五段式步骤 ========== */
  var steps = [
    {
      id: "s1",
      title: "情境引入",
      task: "咱们这一步要做的：想想小数点向右跳会怎样！",
      voice: "0.1 的小数点往右跳一步，会变成多少？变成 1！小数变大了 10 倍。今天学小数点移动的秘密。",
      body: function () {
        return '' +
          '<h2>小数点会变魔术</h2>' +
          '<p class="dp-lab">0.1 小数点右移 1 位 = 1（×10）</p>' +
          '<div class="hint">👆 右移变大，左移变小</div>';
      }
    },
    {
      id: "s2",
      title: "小数点右移动画",
      task: "咱们这一步要做的：看动画小数点往右跳！",
      voice: "看动画。0.1 的小数点往右跳一步，变成 1，扩大了 10 倍。再跳一步，变成 10，扩大了 100 倍！右移一位乘 10，右移两位乘 100。",
      body: function () {
        return '' +
          '<h2>看动画：0.1 → 1 → 10（右移）</h2>' +
          '<div class="dp-box" id="d1">' +
          '<div class="numline" id="nl1">0.1</div>' +
          '<div class="dp-lab" id="l1">0.1</div>' +
          '<div class="dp-step" id="st1">？</div>' +
          "</div>" +
          '<div class="dp-tip" id="d1-tip">准备开始…</div>' +
          '<div class="dp-rule">右移一位 ×10，右移两位 ×100</div>';
      }
    },
    {
      id: "s3",
      title: "小数点左移动画",
      task: "咱们这一步要做的：看动画小数点往左跳！",
      voice: "看动画。10 的小数点往左跳一步，变成 1，缩小了 10 倍。再跳一步，变成 0.1，缩小了 100 倍！左移一位除 10，左移两位除 100。",
      body: function () {
        return '' +
          '<h2>看动画：10 → 1 → 0.1（左移）</h2>' +
          '<div class="dp-box" id="d2">' +
          '<div class="numline" id="nl2">10</div>' +
          '<div class="dp-lab" id="l2">10</div>' +
          '<div class="dp-step" id="st2">？</div>' +
          "</div>" +
          '<div class="dp-tip" id="d2-tip">准备开始…</div>' +
          '<div class="dp-rule">左移一位 ÷10，左移两位 ÷100</div>';
      }
    },
    {
      id: "s4",
      title: "互动练习",
      task: "咱们这一步要做的：连闯 3 道小数点移动题！",
      voice: "现在考考你！小数点移动。",
      body: function () {
        return '' +
          '<h2>闯关练习</h2>' +
          '<div class="quiz" id="quiz"></div>';
      }
    },
    {
      id: "s5",
      title: "Boss 关",
      task: "咱们这一步要做的：算 0.03 右移两位，领奖！",
      voice: "Boss 来啦！0.03 的小数点右移两位是多少？右移一位变 0.3，再移一位变 3！所以是 3，扩大了 100 倍！",
      body: function () {
        return '' +
          '<h2>Boss 关：0.03 右移 2 位 = ?</h2>' +
          '<div class="quiz" id="boss-quiz"></div>' +
          '<div class="result-big" id="result-stars"></div>';
      }
    }
  ];

  function runD1() {
    var tip = document.getElementById("d1-tip");
    var nl = document.getElementById("nl1");
    var l = document.getElementById("l1");
    var st = document.getElementById("st1");
    setTimeout(function () { if (tip) { tip.textContent = "① 起点：0.1"; } }, 700);
    setTimeout(function () {
      nl.textContent = "1.0"; l.textContent = "1（×10）"; st.textContent = "右移 1 位：×10";
      if (tip) { tip.textContent = "② 小数点右移 1 位 → 1，×10 ✅"; }
    }, 2500);
    setTimeout(function () {
      nl.textContent = "10.0"; l.textContent = "10（×100）"; st.textContent = "右移 2 位：×100";
      if (tip) { tip.textContent = "③ 再右移 1 位 → 10，一共 ×100 ✅"; }
    }, 4500);
  }
  function runD2() {
    var tip = document.getElementById("d2-tip");
    var nl = document.getElementById("nl2");
    var l = document.getElementById("l2");
    var st = document.getElementById("st2");
    setTimeout(function () { if (tip) { tip.textContent = "① 起点：10"; } }, 700);
    setTimeout(function () {
      nl.textContent = "1.0"; l.textContent = "1（÷10）"; st.textContent = "左移 1 位：÷10";
      if (tip) { tip.textContent = "② 小数点左移 1 位 → 1，÷10 ✅"; }
    }, 2500);
    setTimeout(function () {
      nl.textContent = "0.1"; l.textContent = "0.1（÷100）"; st.textContent = "左移 2 位：÷100";
      if (tip) { tip.textContent = "③ 再左移 1 位 → 0.1，一共 ÷100 ✅"; }
    }, 4500);
  }

  /* ========== S4 练习 ========== */
  var QUIZ = [
    { q: "2.5 小数点右移 1 位 = ?", right: "25", opts: ["25", "0.25", "2.50"] },
    { q: "800 小数点左移 2 位 = ?", right: "8", opts: ["8", "0.8", "80"] },
    { q: "0.4 × 10 = ?", right: "4", opts: ["4", "0.04", "40"] }
  ];
  var quizDone = { q1: false, q2: false, q3: false };
  function startQuiz() {
    quizDone = { q1: false, q2: false, q3: false };
    renderQuiz();
  }
  function renderQuiz() {
    var box = document.getElementById("quiz");
    if (!box) { return; }
    var idx = -1;
    ["q1", "q2", "q3"].forEach(function (k, i) { if (!quizDone[k] && idx === -1) { idx = i; } });
    if (idx === -1) { box.innerHTML = '<div class="q">全部完成！⭐ 你真棒</div>'; return; }
    var q = QUIZ[idx];
    box.innerHTML = '<div class="q">第 ' + (idx + 1) + " 题：" + q.q + "</div>" +
      '<div class="opts">' + q.opts.map(function (o) {
        return '<div class="opt" data-ok="' + (o === q.right ? "1" : "0") + '">' + o + "</div>";
      }).join("") + "</div>" +
      "<div class='qmsg'></div><button class='qnext' disabled>下一题</button>";
    var tried = false;
    var opts = box.querySelectorAll(".opt");
    opts.forEach(function (o) {
      o.addEventListener("click", function () {
        if (tried) { return; }
        var ok = o.getAttribute("data-ok") === "1";
        var msg = box.querySelector(".qmsg");
        if (ok) {
          o.classList.add("right");
          opts.forEach(function (x) { x.classList.add("locked"); });
          apiRef.addStars(1); apiRef.comboHit();
          msg.className = "qmsg ok";
          msg.textContent = "对啦！⭐ +1" + (apiRef.state.combo >= 2 ? "（连击 +" + apiRef.state.combo + "）" : "");
          box.querySelector(".qnext").disabled = false;
        } else {
          o.classList.add("wrong");
          tried = true;
          apiRef.comboReset();
          msg.className = "qmsg no";
          msg.textContent = "右移×10/100，左移÷10/100；右大左小";
          setTimeout(function () { o.classList.remove("wrong"); tried = false; }, 1700);
        }
      });
    });
    box.querySelector(".qnext").addEventListener("click", function () {
      quizDone["q" + (idx + 1)] = true;
      renderQuiz();
    });
  }

  /* ========== S5 Boss ========== */
  function startBoss() {
    var box = document.getElementById("boss-quiz");
    if (!box) { return; }
    box.innerHTML = '<div class="q">0.03 的小数点右移 2 位 = ?</div>' +
      '<div class="opts">' +
      '<div class="opt" data-ok="1">3</div>' +
      '<div class="opt" data-ok="0">0.3</div>' +
      '<div class="opt" data-ok="0">30</div>' +
      "</div><div class='qmsg'></div>";
    var rs = document.getElementById("result-stars");
    var tried = false;
    box.querySelectorAll(".opt").forEach(function (o) {
      o.addEventListener("click", function () {
        if (tried) { return; }
        var ok = o.getAttribute("data-ok") === "1";
        var msg = box.querySelector(".qmsg");
        if (ok) {
          o.classList.add("right");
          box.querySelectorAll(".opt").forEach(function (x) { x.classList.add("locked"); });
          apiRef.addStars(2); apiRef.comboHit();
          msg.className = "qmsg ok";
          msg.textContent = "Boss 击败！⭐ +2 小数点移动你掌握啦！";
          if (rs) {
            var n = apiRef.stars();
            rs.innerHTML = "🏆 共获得 <b>" + n + "</b> 颗星" +
              (n >= 8 ? "（全部拿下！）" : n >= 5 ? "（很不错！）" : "（下次再来！）");
          }
        } else {
          o.classList.add("wrong");
          tried = true;
          apiRef.comboReset();
          msg.className = "qmsg no";
          msg.textContent = "右移两位 ×100：0.03 → 3";
          setTimeout(function () { o.classList.remove("wrong"); tried = false; }, 1600);
        }
      });
    });
  }

  /* ========== 启动 ========== */
  function onEnterStep(step, api) {
    apiRef = api;
    if (step.id === "s2") { runD1(); }
    if (step.id === "s3") { runD2(); }
    if (step.id === "s4") { startQuiz(); }
    if (step.id === "s5") { startBoss(); }
  }

  PlayerCore.init({
    steps: steps,
    parent: {
      summary: "小数点右移一位×10、两位×100、三位×1000；左移一位÷10、两位÷100。",
      attention: "孩子容易把左右方向和乘除对应记反；口诀「右大左小」：小数点往右移数变大，往左移数变小。",
      tip: "本课约 8 分钟；让小数点「跳格子」，跳一位乘 10、跳两位乘 100。"
    },
    onEnterStep: onEnterStep,
    settings: { autoStopSteps: [3, 4], pauseMs: 2500 }
  });
})();
</script>
</body>
</html>
