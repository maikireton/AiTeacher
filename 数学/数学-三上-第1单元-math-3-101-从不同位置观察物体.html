<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>从不同位置观察物体 · AI 教师</title>
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="../assets/course.css">
<style>
  .obs-box { margin: 12px 0; }
  .obs-3d { display: flex; justify-content: center; margin-bottom: 6px; }
  .obs-3d svg { max-width: 170px; width: 100%; }
  .view-cards { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
  .vcard { display: flex; flex-direction: column; align-items: center; gap: 6px; background: var(--card); border: 2px solid var(--border); border-radius: 12px; padding: 10px 16px; opacity: .25; transition: all .4s; }
  .vcard.show { opacity: 1; }
  .vcard.hl { border-color: var(--accent-deep); }
  .vc-shape { width: 40px; height: 40px; }
  .vc-name { font-size: 13px; color: var(--text-2); }
  .shape-sq { width: 40px; height: 40px; background: linear-gradient(135deg,#7eb6ff,#4a7fe0); border-radius: 4px; }
  .shape-rect { width: 56px; height: 34px; background: linear-gradient(135deg,#ffd591,#ffa940); border-radius: 4px; }
  .shape-circle { width: 40px; height: 40px; background: linear-gradient(135deg,#b5e3c0,#8bc34a); border-radius: 50%; }
  .obs-tip { font-size: 15px; font-weight: 700; min-height: 26px; margin: 8px 0; color: var(--accent-deep); }
</style>
</head>
<body>
<div class="container">
  <header class="topbar">
    <a class="btn-home" href="index.html">← 数学</a>
    <span class="brand">从不同位置观察物体 <small>3年级·上册</small></span>
  </header>

  <div class="player">
    <div class="task-line" id="task-line"></div>
    <div class="stage" id="stage"></div>
    <div class="dots" id="dots"></div>
    <div class="controls">
      <button class="cbtn" id="btn-prev">上一步</button>
      <button class="cbtn" id="btn-auto">▶ 自动播放</button>
      <button class="cbtn" id="btn-voice">🔊 语音</button>
      <button class="cbtn main" id="btn-next">下一步</button>
    </div>
    <div class="score-row" id="score-row"></div>
  </div>

  <details class="parent-panel">
    <summary>家长模式（点击展开）</summary>
    <div class="pbody">
      <p><b>本课一句话总结：</b>同一个物体，从正面、上面、侧面看，看到的形状可能相同（正方体）也可能不同（圆柱、长方体）。</p>
      <p><b>孩子容易走神的地方：</b>把"从上面看"和"从正面看"搞混；可以让他用手挡住物体只留一个面，或用手机拍照对比。</p>
      <p><b>建议：</b>本课约 8 分钟；用家里的盒子、圆柱罐子当教具，让孩子围着转一圈看。</p>
    </div>
  </details>

  <footer class="foot">
    <div>AI 教师 · 示范课件 math-3-101</div>
  </footer>
</div>

<script src="../assets/voice.js"></script>
<script src="../assets/player-core.js"></script>
<script>
(function () {
  "use strict";
  var apiRef = null;

  function svgEl(tag, attrs) {
    var e = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (var k in attrs) { e.setAttribute(k, attrs[k]); }
    return e;
  }
  /* 正方体（等轴测） */
  function cubeSVG() {
    var svg = svgEl("svg", { viewBox: "0 0 150 130", width: "150", height: "130" });
    var g = [["70,15 135,45 135,100 70,130 5,100 5,45", "#cfe0f7"],
             ["70,15 135,45 135,100 70,130", "#e6f0fc"],
             ["70,15 135,45 5,45 5,100 70,130 70,15", "#a9c8f0"]];
    g.forEach(function (p) {
      var poly = svgEl("polygon", { points: p[0], fill: p[1], stroke: "#4a7fe0", "stroke-width": 2 });
      svg.appendChild(poly);
    });
    return svg;
  }
  /* 圆柱体 */
  function cylSVG() {
    var svg = svgEl("svg", { viewBox: "0 0 150 130", width: "150", height: "130" });
    var body = svgEl("rect", { x: "35", y: "35", width: "80", height: "85", fill: "#ffd591", stroke: "#e8890c", "stroke-width": 2 });
    var top = svgEl("ellipse", { cx: "75", cy: "35", rx: "40", ry: "18", fill: "#ffe9c2", stroke: "#e8890c", "stroke-width": 2 });
    svg.appendChild(body); svg.appendChild(top);
    return svg;
  }
  /* 长方体（牙膏盒） */
  function boxSVG() {
    var svg = svgEl("svg", { viewBox: "0 0 180 130", width: "180", height: "130" });
    [["25,30 155,30 155,115 25,115", "#e6f0fc", "#4a7fe0"],
     ["25,115 155,115 170,125 40,125", "#cfe0f7", "#4a7fe0"],
     ["155,30 170,40 170,125 155,115", "#a9c8f0", "#4a7fe0"]].forEach(function (p) {
      var rect = svgEl("polygon", { points: p[0], fill: p[1], stroke: p[2], "stroke-width": 2 });
      svg.appendChild(rect);
    });
    return svg;
  }

  function vcards(html) {
    return '<div class="view-cards">' + html + "</div>";
  }
  function vc(key, shape, name) {
    return '<div class="vcard" data-k="' + key + '"><span class="vc-shape shape-' + shape + '"></span><span class="vc-name">' + name + "</span></div>";
  }
  function showCards(box, keys) {
    keys.forEach(function (k) {
      var c = box.querySelector('[data-k="' + k + '"]');
      if (c) { c.classList.add("show", "hl"); }
    });
  }

  /* ========== 五段式步骤 ========== */
  var steps = [
    {
      id: "s1",
      title: "情境引入",
      task: "咱们这一步要做的：想想同一个盒子，不同方向看会一样吗！",
      voice: "同一个物体，从正面看、从上面看、从侧面看，看到的样子会一样吗？今天我们当小侦探，从三个方向观察物体。",
      body: function () {
        return '' +
          '<h2>换个方向看看</h2>' +
          '<p>一个牙膏盒，正面写着字，侧面是空的，上面是盖子。</p>' +
          '<p>从不同方向看，看到的东西一样吗？</p>' +
          '<div class="hint">👆 猜猜：从上面看牙膏盒，能看到字吗？</div>';
      }
    },
    {
      id: "s2",
      title: "观察正方体",
      task: "咱们这一步要做的：看动画发现正方体三个面都一样！",
      voice: "看动画。这是一个正方体，六个面都是正方形。从正面看，是正方形。从上面看，还是正方形。从侧面看，也是正方形。所以正方体从哪看都是正方形。",
      body: function () {
        return '' +
          '<h2>看动画：观察正方体</h2>' +
          '<div class="obs-box" id="obs1">' +
          '<div class="obs-3d" id="cube3d"></div>' +
          vcards(vc("f", "sq", "正面看") + vc("u", "sq", "上面看") + vc("s", "sq", "侧面看")) +
          "</div>" +
          '<div class="obs-tip" id="obs1-tip">准备开始…</div>';
      }
    },
    {
      id: "s3",
      title: "观察圆柱体",
      task: "咱们这一步要做的：看动画发现圆柱三个面不一样！",
      voice: "看动画。这是一个圆柱体，像易拉罐。从正面看，是长方形。从上面看，是圆形。从侧面看，也是长方形。圆柱体从不同方向看，形状不一样。",
      body: function () {
        return '' +
          '<h2>看动画：观察圆柱体</h2>' +
          '<div class="obs-box" id="obs2">' +
          '<div class="obs-3d" id="cyl3d"></div>' +
          vcards(vc("f", "rect", "正面看") + vc("u", "circle", "上面看") + vc("s", "rect", "侧面看")) +
          "</div>" +
          '<div class="obs-tip" id="obs2-tip">准备开始…</div>';
      }
    },
    {
      id: "s4",
      title: "互动练习",
      task: "咱们这一步要做的：连闯 3 道观察题！",
      voice: "现在考考你！想一想，再选答案。",
      body: function () {
        return '' +
          '<h2>闯关练习</h2>' +
          '<div class="quiz" id="quiz"></div>';
      }
    },
    {
      id: "s5",
      title: "Boss 关",
      task: "咱们这一步要做的：猜球球从哪看都一样，领奖！",
      voice: "Boss 来啦！一个圆滚滚的球，不管从正面、上面、侧面看，看到的是什么形状？",
      body: function () {
        return '' +
          '<h2>Boss 关：观察球</h2>' +
          '<div class="obs-3d" style="font-size:72px">⚽</div>' +
          '<div class="quiz" id="boss-quiz"></div>' +
          '<div class="result-big" id="result-stars"></div>';
      }
    }
  ];

  /* ========== S2 正方体 ========== */
  function runObs1() {
    var box = document.getElementById("obs1");
    if (!box) { return; }
    document.getElementById("cube3d").appendChild(cubeSVG());
    var tip = document.getElementById("obs1-tip");
    setTimeout(function () { if (tip) { tip.textContent = "① 从正面看 → 正方形"; } showCards(box, ["f"]); }, 700);
    setTimeout(function () { if (tip) { tip.textContent = "② 从上面看 → 也是正方形"; } showCards(box, ["u"]); }, 2500);
    setTimeout(function () { if (tip) { tip.textContent = "③ 从侧面看 → 还是正方形"; } showCards(box, ["s"]); }, 4300);
    setTimeout(function () { if (tip) { tip.textContent = "✅ 正方体从哪看都是正方形！"; } }, 6000);
  }

  /* ========== S3 圆柱体 ========== */
  function runObs2() {
    var box = document.getElementById("obs2");
    if (!box) { return; }
    document.getElementById("cyl3d").appendChild(cylSVG());
    var tip = document.getElementById("obs2-tip");
    setTimeout(function () { if (tip) { tip.textContent = "① 从正面看 → 长方形"; } showCards(box, ["f"]); }, 700);
    setTimeout(function () { if (tip) { tip.textContent = "② 从上面看 → 圆形"; } showCards(box, ["u"]); }, 2500);
    setTimeout(function () { if (tip) { tip.textContent = "③ 从侧面看 → 还是长方形"; } showCards(box, ["s"]); }, 4300);
    setTimeout(function () { if (tip) { tip.textContent = "✅ 圆柱体从不同方向看，形状不一样！"; } }, 6000);
  }

  /* ========== S4 练习 ========== */
  var QUIZ = [
    { q: "从正方体的正面看，看到的是？", right: "正方形", opts: ["正方形", "长方形", "圆形"] },
    { q: "从圆柱的上面看，看到的是？", right: "圆形", opts: ["圆形", "长方形", "三角形"] },
    { q: "从牙膏盒（长方体）的侧面看，看到的是？", right: "长方形", opts: ["长方形", "正方形", "圆形"] }
  ];
  var quizDone = { q1: false, q2: false, q3: false };
  function startQuiz() {
    quizDone = { q1: false, q2: false, q3: false };
    renderQuiz();
  }
  function renderQuiz() {
    var box = document.getElementById("quiz");
    if (!box) { return; }
    var idx = -1;
    ["q1", "q2", "q3"].forEach(function (k, i) { if (!quizDone[k] && idx === -1) { idx = i; } });
    if (idx === -1) { box.innerHTML = '<div class="q">全部完成！⭐ 你真棒</div>'; return; }
    var q = QUIZ[idx];
    box.innerHTML = '<div class="q">第 ' + (idx + 1) + " 题：" + q.q + "</div>" +
      '<div class="opts">' + q.opts.map(function (o) {
        return '<div class="opt" data-ok="' + (o === q.right ? "1" : "0") + '">' + o + "</div>";
      }).join("") + "</div>" +
      "<div class='qmsg'></div><button class='qnext' disabled>下一题</button>";
    var tried = false;
    var opts = box.querySelectorAll(".opt");
    opts.forEach(function (o) {
      o.addEventListener("click", function () {
        if (tried) { return; }
        var ok = o.getAttribute("data-ok") === "1";
        var msg = box.querySelector(".qmsg");
        if (ok) {
          o.classList.add("right");
          opts.forEach(function (x) { x.classList.add("locked"); });
          apiRef.addStars(1); apiRef.comboHit();
          msg.className = "qmsg ok";
          msg.textContent = "对啦！⭐ +1" + (apiRef.state.combo >= 2 ? "（连击 +" + apiRef.state.combo + "）" : "");
          box.querySelector(".qnext").disabled = false;
        } else {
          o.classList.add("wrong");
          tried = true;
          apiRef.comboReset();
          msg.className = "qmsg no";
          msg.textContent = "想想哪个面正对着你：正面/上面/侧面看到的形状";
          setTimeout(function () { o.classList.remove("wrong"); tried = false; }, 1500);
        }
      });
    });
    box.querySelector(".qnext").addEventListener("click", function () {
      quizDone["q" + (idx + 1)] = true;
      renderQuiz();
    });
  }

  /* ========== S5 Boss ========== */
  function startBoss() {
    var box = document.getElementById("boss-quiz");
    if (!box) { return; }
    box.innerHTML = '<div class="q">球从任何方向看都是？</div>' +
      '<div class="opts">' +
      '<div class="opt" data-ok="1">圆形</div>' +
      '<div class="opt" data-ok="0">正方形</div>' +
      '<div class="opt" data-ok="0">长方形</div>' +
      "</div><div class='qmsg'></div>";
    var rs = document.getElementById("result-stars");
    var tried = false;
    box.querySelectorAll(".opt").forEach(function (o) {
      o.addEventListener("click", function () {
        if (tried) { return; }
        var ok = o.getAttribute("data-ok") === "1";
        var msg = box.querySelector(".qmsg");
        if (ok) {
          o.classList.add("right");
          box.querySelectorAll(".opt").forEach(function (x) { x.classList.add("locked"); });
          apiRef.addStars(2); apiRef.comboHit();
          msg.className = "qmsg ok";
          msg.textContent = "Boss 击败！⭐ +2 观察小侦探就是你！";
          if (rs) {
            var n = apiRef.stars();
            rs.innerHTML = "🏆 共获得 <b>" + n + "</b> 颗星" +
              (n >= 8 ? "（全部拿下！）" : n >= 5 ? "（很不错！）" : "（下次再来！）");
          }
        } else {
          o.classList.add("wrong");
          tried = true;
          apiRef.comboReset();
          msg.className = "qmsg no";
          msg.textContent = "球圆圆滚滚，从任何方向看都是圆形";
          setTimeout(function () { o.classList.remove("wrong"); tried = false; }, 1400);
        }
      });
    });
  }

  /* ========== 启动 ========== */
  function onEnterStep(step, api) {
    apiRef = api;
    if (step.id === "s2") { runObs1(); }
    if (step.id === "s3") { runObs2(); }
    if (step.id === "s4") { startQuiz(); }
    if (step.id === "s5") { startBoss(); }
  }

  PlayerCore.init({
    steps: steps,
    parent: {
      summary: "同一个物体，从正面、上面、侧面看，看到的形状可能相同（正方体）也可能不同（圆柱、长方体）。",
      attention: "孩子容易把「从上面看」和「从正面看」搞混；可让他用手挡住物体只留一个面，或用手机拍照对比。",
      tip: "本课约 8 分钟；用家里的盒子、圆柱罐子当教具，让孩子围着转一圈看。"
    },
    onEnterStep: onEnterStep,
    settings: { autoStopSteps: [3, 4], pauseMs: 2500 }
  });
})();
</script>
</body>
</html>
