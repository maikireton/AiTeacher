<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>加减法的意义和各部分间的关系 · AI 教师</title>
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="../assets/course.css">
<style>
  .mo-box { margin: 12px 0; }
  .mo-tip { font-size: 15px; font-weight: 700; min-height: 26px; margin: 8px 0; color: var(--accent-deep); }
  .mo-rule { display: inline-block; background: #e8f6ff; border: 1px solid #91caff; color: #0b5e91; border-radius: 10px; padding: 6px 14px; font-size: 15px; font-weight: 700; margin-top: 8px; }
  .apple-row { display: flex; justify-content: center; gap: 10px; align-items: center; flex-wrap: wrap; min-height: 60px; }
  .apple { font-size: 40px; transition: all .4s; }
  .apple.zoom { transform: scale(1.25); }
  .op-sym { font-size: 34px; font-weight: 800; color: var(--accent-deep); }
  .mo-expr { font-size: 28px; font-weight: 800; color: #d97706; text-align: center; margin: 8px 0; }
  .tri { display: flex; justify-content: center; gap: 30px; align-items: center; flex-wrap: wrap; margin: 6px 0; }
  .tri-card { background: #f4f8ff; border: 2px solid var(--border); border-radius: 14px; padding: 10px 18px; text-align: center; opacity: 0; transition: all .35s; }
  .tri-card.show { opacity: 1; }
  .tri-card.hl { border-color: var(--accent-deep); background: #e8f1ff; }
  .tri-card b { font-size: 24px; color: #2e7d32; }
  .tri-card .n { font-size: 18px; font-weight: 800; color: var(--text-2); }
</style>
</head>
<body>
<div class="container">
  <header class="topbar">
    <a class="btn-home" href="index.html">← 数学</a>
    <span class="brand">加减法的意义和各部分间的关系 <small>4年级·下册</small></span>
  </header>

  <div class="player">
    <div class="task-line" id="task-line"></div>
    <div class="stage" id="stage"></div>
    <div class="dots" id="dots"></div>
    <div class="controls">
      <button class="cbtn" id="btn-prev">上一步</button>
      <button class="cbtn" id="btn-auto">▶ 自动播放</button>
      <button class="cbtn" id="btn-voice">🔊 语音</button>
      <button class="cbtn main" id="btn-next">下一步</button>
    </div>
    <div class="score-row" id="score-row"></div>
  </div>

  <details class="parent-panel">
    <summary>家长模式（点击展开）</summary>
    <div class="pbody">
      <p><b>本课一句话总结：</b>加法是把两个数合并成一个数；减法是已知和与一个加数求另一个加数。加数+加数=和；被减数−减数=差，加减互逆。</p>
      <p><b>孩子容易走神的地方：</b>"被减数=差+减数""减数=被减数−差"这三组关系记混；用「三角关系图」记：大数=两个小数之和。</p>
      <p><b>建议：</b>本课约 8 分钟；用 3+2=5 推 5−2=3 和 5−3=2，把三式连起来记。</p>
    </div>
  </details>

  <footer class="foot">
    <div>AI 教师 · 示范课件 math-4-030</div>
  </footer>
</div>

<script src="../assets/voice.js"></script>
<script src="../assets/player-core.js"></script>
<script>
(function () {
  "use strict";
  var apiRef = null;

  /* ========== 五段式步骤 ========== */
  var steps = [
    {
      id: "s1",
      title: "情境引入",
      task: "咱们这一步要做的：看看 3+2 到底是什么意思！",
      voice: "篮子里有 3 个苹果，又拿来 2 个，一共几个？这就是加法：把两部分合并起来。今天学加减法的意义。",
      body: function () {
        return '' +
          '<h2>苹果合并</h2>' +
          '<p>🍎🍎🍎 + 🍎🍎 = ?</p>' +
          '<div class="hint">👆 加法就是把两个数合并成一个数</div>';
      }
    },
    {
      id: "s2",
      title: "加法的意义动画",
      task: "咱们这一步要做的：看动画 3+2 合并成 5！",
      voice: "看动画。左边 3 个苹果，右边 2 个苹果，合并到一起，一共 5 个苹果。3 加 2 等于 5。3 和 2 叫加数，5 叫和。",
      body: function () {
        return '' +
          '<h2>看动画：3 + 2 = 5</h2>' +
          '<div class="mo-box" id="d1">' +
          '<div class="apple-row" id="row1">' +
          '<div class="apple">🍎</div><div class="apple">🍎</div><div class="apple">🍎</div>' +
          '<span class="op-sym">+</span>' +
          '<div class="apple">🍎</div><div class="apple">🍎</div>' +
          '<span class="op-sym">=</span><span class="op-sym">?</span>' +
          "</div>" +
          "</div>" +
          '<div class="mo-tip" id="d1-tip">准备开始…</div>' +
          '<div class="mo-rule">加数 + 加数 = 和</div>';
      }
    },
    {
      id: "s3",
      title: "加减互逆关系动画",
      task: "咱们这一步要做的：看动画三角关系！",
      voice: "看动画。5 是老大，3 和 2 是它的两个小兄弟。3 加 2 等于 5。反过来，5 减 3 等于 2，5 减 2 等于 3。一加两减，三个算式一家亲。",
      body: function () {
        return '' +
          '<h2>看动画：加减互逆三角关系</h2>' +
          '<div class="mo-box" id="d2">' +
          '<div class="tri">' +
          '<div class="tri-card" id="tc1"><b>5</b><div class="n">（老大）</div></div>' +
          '<div class="tri-card" id="tc2"><b>3</b><div class="n">小兄弟 A</div></div>' +
          '<div class="tri-card" id="tc3"><b>2</b><div class="n">小兄弟 B</div></div>' +
          "</div>" +
          '<div class="mo-expr" id="tri-expr">3 + 2 = 5</div>' +
          "</div>" +
          '<div class="mo-tip" id="d2-tip">准备开始…</div>' +
          '<div class="mo-rule">5−3=2，5−2=3；大数 = 两个小数之和</div>';
      }
    },
    {
      id: "s4",
      title: "互动练习",
      task: "咱们这一步要做的：连闯 3 道加减关系题！",
      voice: "现在考考你！加减法各部分关系。",
      body: function () {
        return '' +
          '<h2>闯关练习</h2>' +
          '<div class="quiz" id="quiz"></div>';
      }
    },
    {
      id: "s5",
      title: "Boss 关",
      task: "咱们这一步要做的：求被减数，领奖！",
      voice: "Boss 来啦！被减数减 3 等于 8，被减数是多少？被减数等于差加减数，8 加 3 等于 11！",
      body: function () {
        return '' +
          '<h2>Boss 关：□ − 3 = 8</h2>' +
          '<div class="quiz" id="boss-quiz"></div>' +
          '<div class="result-big" id="result-stars"></div>';
      }
    }
  ];

  function runD1() {
    var tip = document.getElementById("d1-tip");
    var row = document.getElementById("row1");
    setTimeout(function () { if (tip) { tip.textContent = "① 左边 3 个加数，右边 2 个加数"; } }, 700);
    setTimeout(function () {
      var apples = row.querySelectorAll(".apple");
      apples.forEach(function (a, i) { setTimeout(function () { a.classList.add("zoom"); }, i * 120); });
      if (tip) { tip.textContent = "② 5 个苹果合到一起 → 3 + 2 = 5"; }
      var syms = row.querySelectorAll(".op-sym");
      if (syms.length) { syms[syms.length - 1].textContent = "5"; }
    }, 2400);
    setTimeout(function () { if (tip) { tip.textContent = "✅ 3 和 2 是加数，5 是和"; } }, 4400);
  }
  function runD2() {
    var tip = document.getElementById("d2-tip");
    var expr = document.getElementById("tri-expr");
    setTimeout(function () { document.getElementById("tc1").classList.add("show", "hl"); if (tip) { tip.textContent = "① 5 是老大（总数）"; } }, 700);
    setTimeout(function () { document.getElementById("tc2").classList.add("show"); if (tip) { tip.textContent = "② 3 和 2 是它的两个小兄弟"; } }, 1800);
    setTimeout(function () { document.getElementById("tc3").classList.add("show"); }, 2200);
    setTimeout(function () { if (tip) { tip.textContent = "③ 3 + 2 = 5（相加得老大）"; } expr.textContent = "3 + 2 = 5"; }, 3200);
    setTimeout(function () { if (tip) { tip.textContent = "④ 5 − 3 = 2（老大减一个兄弟）"; } expr.textContent = "5 − 3 = 2"; }, 4600);
    setTimeout(function () { if (tip) { tip.textContent = "⑤ 5 − 2 = 3 ✅ 一加两减三式一家"; } expr.textContent = "5 − 2 = 3"; }, 6000);
  }

  /* ========== S4 练习 ========== */
  var QUIZ = [
    { q: "7 + 8 = 15 中，哪个是「和」？", right: "15", opts: ["15", "7", "8"] },
    { q: "被减数 − 6 = 9，被减数 = ?", right: "15", opts: ["15", "3", "54"] },
    { q: "由 4 + 5 = 9 可知 9 − 5 = ?", right: "4", opts: ["4", "5", "9"] }
  ];
  var quizDone = { q1: false, q2: false, q3: false };
  function startQuiz() {
    quizDone = { q1: false, q2: false, q3: false };
    renderQuiz();
  }
  function renderQuiz() {
    var box = document.getElementById("quiz");
    if (!box) { return; }
    var idx = -1;
    ["q1", "q2", "q3"].forEach(function (k, i) { if (!quizDone[k] && idx === -1) { idx = i; } });
    if (idx === -1) { box.innerHTML = '<div class="q">全部完成！⭐ 你真棒</div>'; return; }
    var q = QUIZ[idx];
    box.innerHTML = '<div class="q">第 ' + (idx + 1) + " 题：" + q.q + "</div>" +
      '<div class="opts">' + q.opts.map(function (o) {
        return '<div class="opt" data-ok="' + (o === q.right ? "1" : "0") + '">' + o + "</div>";
      }).join("") + "</div>" +
      "<div class='qmsg'></div><button class='qnext' disabled>下一题</button>";
    var tried = false;
    var opts = box.querySelectorAll(".opt");
    opts.forEach(function (o) {
      o.addEventListener("click", function () {
        if (tried) { return; }
        var ok = o.getAttribute("data-ok") === "1";
        var msg = box.querySelector(".qmsg");
        if (ok) {
          o.classList.add("right");
          opts.forEach(function (x) { x.classList.add("locked"); });
          apiRef.addStars(1); apiRef.comboHit();
          msg.className = "qmsg ok";
          msg.textContent = "对啦！⭐ +1" + (apiRef.state.combo >= 2 ? "（连击 +" + apiRef.state.combo + "）" : "");
          box.querySelector(".qnext").disabled = false;
        } else {
          o.classList.add("wrong");
          tried = true;
          apiRef.comboReset();
          msg.className = "qmsg no";
          msg.textContent = "加数=和−另一加数；被减数=差+减数；减数=被减数−差";
          setTimeout(function () { o.classList.remove("wrong"); tried = false; }, 1700);
        }
      });
    });
    box.querySelector(".qnext").addEventListener("click", function () {
      quizDone["q" + (idx + 1)] = true;
      renderQuiz();
    });
  }

  /* ========== S5 Boss ========== */
  function startBoss() {
    var box = document.getElementById("boss-quiz");
    if (!box) { return; }
    box.innerHTML = '<div class="q">□ − 3 = 8，□ 里是多少？</div>' +
      '<div class="opts">' +
      '<div class="opt" data-ok="1">11</div>' +
      '<div class="opt" data-ok="0">5</div>' +
      '<div class="opt" data-ok="0">24</div>' +
      "</div><div class='qmsg'></div>";
    var rs = document.getElementById("result-stars");
    var tried = false;
    box.querySelectorAll(".opt").forEach(function (o) {
      o.addEventListener("click", function () {
        if (tried) { return; }
        var ok = o.getAttribute("data-ok") === "1";
        var msg = box.querySelector(".qmsg");
        if (ok) {
          o.classList.add("right");
          box.querySelectorAll(".opt").forEach(function (x) { x.classList.add("locked"); });
          apiRef.addStars(2); apiRef.comboHit();
          msg.className = "qmsg ok";
          msg.textContent = "Boss 击败！⭐ +2 加减关系你掌握啦！";
          if (rs) {
            var n = apiRef.stars();
            rs.innerHTML = "🏆 共获得 <b>" + n + "</b> 颗星" +
              (n >= 8 ? "（全部拿下！）" : n >= 5 ? "（很不错！）" : "（下次再来！）");
          }
        } else {
          o.classList.add("wrong");
          tried = true;
          apiRef.comboReset();
          msg.className = "qmsg no";
          msg.textContent = "被减数 = 差 + 减数 = 8 + 3 = 11";
          setTimeout(function () { o.classList.remove("wrong"); tried = false; }, 1600);
        }
      });
    });
  }

  /* ========== 启动 ========== */
  function onEnterStep(step, api) {
    apiRef = api;
    if (step.id === "s2") { runD1(); }
    if (step.id === "s3") { runD2(); }
    if (step.id === "s4") { startQuiz(); }
    if (step.id === "s5") { startBoss(); }
  }

  PlayerCore.init({
    steps: steps,
    parent: {
      summary: "加法是把两个数合并成一个数；减法是已知和与一个加数求另一个加数。加数+加数=和；被减数−减数=差，加减互逆。",
      attention: "孩子容易把「被减数=差+减数」「减数=被减数−差」记混；用三角关系图记：大数=两个小数之和。",
      tip: "本课约 8 分钟；用 3+2=5 推 5−2=3 和 5−3=2，把三式连起来记。"
    },
    onEnterStep: onEnterStep,
    settings: { autoStopSteps: [3, 4], pauseMs: 2500 }
  });
})();
</script>
</body>
</html>
