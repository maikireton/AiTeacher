<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>面积：面积单位与长方形正方形面积 · AI 教师</title>
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="../assets/course.css">
<style>
  .ar-box { margin: 12px 0; }
  .ar-tip { font-size: 15px; font-weight: 700; min-height: 26px; margin: 8px 0; color: var(--accent-deep); }
  .ar-rule { display: inline-block; background: #e8f6ff; border: 1px solid #91caff; color: #0b5e91; border-radius: 10px; padding: 6px 14px; font-size: 15px; font-weight: 700; margin-top: 8px; }
  .ar-grid { display: grid; gap: 1px; justify-content: center; margin: 8px auto; width: fit-content; }
  .ar-grid .cell { width: 30px; height: 30px; background: #eef2f7; border-radius: 3px; transition: background .25s, transform .25s; }
  .ar-grid .cell.fill { background: linear-gradient(180deg,#7eb6ff,#4a7fe0); transform: scale(1.05); }
  .ar-count { font-size: 20px; font-weight: 800; color: #2e7d32; text-align: center; min-height: 26px; }
  .ar-anno { display: flex; justify-content: center; gap: 30px; align-items: center; flex-wrap: wrap; }
  .ar-rect { text-align: center; }
  .ar-dim { font-size: 14px; color: var(--text-2); font-weight: 700; }
</style>
</head>
<body>
<div class="container">
  <header class="topbar">
    <a class="btn-home" href="index.html">← 数学</a>
    <span class="brand">面积：面积单位与长方形正方形面积 <small>3年级·下册</small></span>
  </header>

  <div class="player">
    <div class="task-line" id="task-line"></div>
    <div class="stage" id="stage"></div>
    <div class="dots" id="dots"></div>
    <div class="controls">
      <button class="cbtn" id="btn-prev">上一步</button>
      <button class="cbtn" id="btn-auto">▶ 自动播放</button>
      <button class="cbtn" id="btn-voice">🔊 语音</button>
      <button class="cbtn main" id="btn-next">下一步</button>
    </div>
    <div class="score-row" id="score-row"></div>
  </div>

  <details class="parent-panel">
    <summary>家长模式（点击展开）</summary>
    <div class="pbody">
      <p><b>本课一句话总结：</b>面积 = 表面大小，用面积单位（1 平方厘米等）来量；长方形面积 = 长 × 宽，正方形面积 = 边长 × 边长。</p>
      <p><b>孩子容易走神的地方：</b>把面积和周长搞混；强调"面积看里面铺多少格，周长看外面一圈长度"。</p>
      <p><b>建议：</b>本课约 8 分钟；用方格纸画长方形数格子，再对比长×宽。</p>
    </div>
  </details>

  <footer class="foot">
    <div>AI 教师 · 示范课件 math-3-004</div>
  </footer>
</div>

<script src="../assets/voice.js"></script>
<script src="../assets/player-core.js"></script>
<script src="../assets/record.js"></script>
<script>
(function () {
  "use strict";
  var apiRef = null;

  /* ========== 五段式步骤 ========== */
  var steps = [
    {
      id: "s1",
      title: "情境引入",
      task: "咱们这一步要做的：想想桌面有多大！",
      voice: "桌面和手掌哪个大？桌面大！我们说桌面的面积大。今天认识面积，还要会算长方形和正方形的面积。",
      body: function () {
        return '' +
          '<h2>面积是什么</h2>' +
          '<p>🖐️ 手掌 < 桌面 → 桌面<b>面积</b>大</p>' +
          '<p>面积 = 物体表面的大小。</p>' +
          '<div class="hint">👆 面积看「里面能铺多少小方块」</div>';
      }
    },
    {
      id: "s2",
      title: "面积单位与铺格动画",
      task: "咱们这一步要做的：看动画用 1cm² 铺满长方形！",
      voice: "看动画。一个边长 1 厘米的小方块，面积是 1 平方厘米。用它铺满一个长方形，长 5 厘米宽 3 厘米。一行放 5 个，放 3 行，一共 15 个！面积就是 15 平方厘米。",
      body: function () {
        return '' +
          '<h2>看动画：用 1cm² 小方块铺满</h2>' +
          '<div class="ar-box" id="d1">' +
          '<div class="ar-grid" id="g53"></div>' +
          '<div class="ar-count" id="c53">长 5cm × 宽 3cm</div>' +
          "</div>" +
          '<div class="ar-tip" id="d1-tip">准备开始…</div>' +
          '<div class="ar-rule">面积 = 铺了多少个面积单位</div>';
      }
    },
    {
      id: "s3",
      title: "面积公式动画",
      task: "咱们这一步要做的：看动画发现 长×宽 的秘密！",
      voice: "看动画。长方形长 4 厘米，宽 3 厘米。一行 4 个，放 3 行，四乘三等于 12。所以长方形面积等于长乘宽！正方形边长 3，三乘三等于 9，正方形面积等于边长乘边长。",
      body: function () {
        return '' +
          '<h2>看动画：长方形与正方形面积</h2>' +
          '<div class="ar-box" id="d2">' +
          '<div class="ar-anno">' +
          '<div class="ar-rect"><div class="ar-grid" id="g43"></div><div class="ar-dim">长4 × 宽3</div><div class="ar-count" id="c43"></div></div>' +
          '<div class="ar-rect"><div class="ar-grid" id="g33"></div><div class="ar-dim">边长3 × 3</div><div class="ar-count" id="c33"></div></div>' +
          "</div>" +
          "</div>" +
          '<div class="ar-tip" id="d2-tip">准备开始…</div>' +
          '<div class="ar-rule">长方形：长 × 宽；正方形：边长 × 边长</div>';
      }
    },
    {
      id: "s4",
      title: "互动练习",
      task: "咱们这一步要做的：连闯 3 道面积题！",
      voice: "现在考考你！长方形和正方形面积。",
      body: function () {
        return '' +
          '<h2>闯关练习</h2>' +
          '<div class="quiz" id="quiz"></div>';
      }
    },
    {
      id: "s5",
      title: "Boss 关",
      task: "咱们这一步要做的：算长方形面积，领奖！",
      voice: "Boss 来啦！长 7 厘米，宽 4 厘米的长方形，面积是多少？7 乘 4 等于 28 平方厘米！",
      body: function () {
        return '' +
          '<h2>Boss 关：长7 宽4 面积 = ?</h2>' +
          '<div class="quiz" id="boss-quiz"></div>' +
          '<div class="result-big" id="result-stars"></div>';
      }
    }
  ];

  function fillGrid(rows, cols, contId, cntId, tipId, tipDone, tipStart) {
    var cont = document.getElementById(contId);
    if (!cont) { return; }
    cont.innerHTML = "";
    cont.style.gridTemplateColumns = "repeat(" + cols + ", 30px)";
    var n = rows * cols;
    var tip = document.getElementById(tipId);
    if (tip && tipStart) { tip.textContent = tipStart; }
    for (var i = 0; i < n; i++) {
      var d = document.createElement("div");
      d.className = "cell";
      cont.appendChild(d);
      (function (idx, el) {
        setTimeout(function () {
          el.classList.add("fill");
          var c = document.getElementById(cntId);
          if (c) { c.textContent = "已铺 " + (idx + 1) + " 格"; }
        }, 130 * idx);
      })(i, d);
    }
    setTimeout(function () {
      var c = document.getElementById(cntId);
      if (c) { c.textContent = "共 " + n + " 个 1cm² → " + n + " cm²"; }
      if (tip && tipDone) { tip.textContent = tipDone; }
    }, 130 * n + 350);
  }

  function runD1() {
    fillGrid(3, 5, "g53", "c53", "d1-tip",
      "✅ 5×3=15 个 → 面积 15 cm²",
      "① 每行 5 个 1cm²，一共 3 行，逐个铺…");
  }
  function runD2() {
    fillGrid(3, 4, "g43", "c43", "d2-tip",
      "✅ 长4 × 宽3 = 12 → 12 cm²",
      "① 长方形：一行 4 个，放 3 行…");
    fillGrid(3, 3, "g33", "c33", null, null, null);
    setTimeout(function () {
      var tip = document.getElementById("d2-tip");
      if (tip) { tip.textContent = "② 正方形：3×3=9 → 9 cm²（长=宽）"; }
    }, 130 * 9 + 800);
  }

  /* ========== S4 练习 ========== */
  var QUIZ = [
    { q: "长方形长 5、宽 3，面积 = ?", right: "15", opts: ["15", "8", "16"] },
    { q: "正方形边长 4，面积 = ?", right: "16", opts: ["16", "8", "20"] },
    { q: "长方形长 6、宽 2，面积 = ?", right: "12", opts: ["12", "8", "36"] }
  ];
  var quizDone = { q1: false, q2: false, q3: false };
  function startQuiz() {
    quizDone = { q1: false, q2: false, q3: false };
    renderQuiz();
  }
  function renderQuiz() {
    var box = document.getElementById("quiz");
    if (!box) { return; }
    var idx = -1;
    ["q1", "q2", "q3"].forEach(function (k, i) { if (!quizDone[k] && idx === -1) { idx = i; } });
    if (idx === -1) { box.innerHTML = '<div class="q">全部完成！⭐ 你真棒</div>'; return; }
    var q = QUIZ[idx];
    box.innerHTML = '<div class="q">第 ' + (idx + 1) + " 题：" + q.q + "</div>" +
      '<div class="opts">' + q.opts.map(function (o) {
        return '<div class="opt" data-ok="' + (o === q.right ? "1" : "0") + '">' + o + "</div>";
      }).join("") + "</div>" +
      "<div class='qmsg'></div><button class='qnext' disabled>下一题</button>";
    var tried = false;
    var opts = box.querySelectorAll(".opt");
    opts.forEach(function (o) {
      o.addEventListener("click", function () {
        if (tried) { return; }
        var ok = o.getAttribute("data-ok") === "1";
        var msg = box.querySelector(".qmsg");
        if (ok) {
          o.classList.add("right");
          opts.forEach(function (x) { x.classList.add("locked"); });
          apiRef.addStars(1); apiRef.comboHit();
          msg.className = "qmsg ok";
          msg.textContent = "对啦！⭐ +1" + (apiRef.state.combo >= 2 ? "（连击 +" + apiRef.state.combo + "）" : "");
          box.querySelector(".qnext").disabled = false;
        } else {
          o.classList.add("wrong");
          tried = true;
          apiRef.comboReset();
          msg.className = "qmsg no";
          msg.textContent = "长方形面积 = 长 × 宽（单位：平方厘米等）";
          setTimeout(function () { o.classList.remove("wrong"); tried = false; }, 1700);
        }
      });
    });
    box.querySelector(".qnext").addEventListener("click", function () {
      quizDone["q" + (idx + 1)] = true;
      renderQuiz();
    });
  }

  /* ========== S5 Boss ========== */
  function startBoss() {
    var box = document.getElementById("boss-quiz");
    if (!box) { return; }
    box.innerHTML = '<div class="q">长 7 厘米、宽 4 厘米的长方形，面积 = ?</div>' +
      '<div class="opts">' +
      '<div class="opt" data-ok="1">28 平方厘米</div>' +
      '<div class="opt" data-ok="0">22 平方厘米</div>' +
      '<div class="opt" data-ok="0">11 平方厘米</div>' +
      "</div><div class='qmsg'></div>";
    var rs = document.getElementById("result-stars");
    var tried = false;
    box.querySelectorAll(".opt").forEach(function (o) {
      o.addEventListener("click", function () {
        if (tried) { return; }
        var ok = o.getAttribute("data-ok") === "1";
        var msg = box.querySelector(".qmsg");
        if (ok) {
          o.classList.add("right");
          box.querySelectorAll(".opt").forEach(function (x) { x.classList.add("locked"); });
          apiRef.addStars(2); apiRef.comboHit();
          msg.className = "qmsg ok";
          msg.textContent = "Boss 击败！⭐ +2 面积你掌握啦！";
          if (rs) {
            var n = apiRef.stars();
            rs.innerHTML = "🏆 共获得 <b>" + n + "</b> 颗星" +
              (n >= 8 ? "（全部拿下！）" : n >= 5 ? "（很不错！）" : "（下次再来！）");
          }
        } else {
          o.classList.add("wrong");
          tried = true;
          apiRef.comboReset();
          msg.className = "qmsg no";
          msg.textContent = "7 × 4 = 28 平方厘米";
          setTimeout(function () { o.classList.remove("wrong"); tried = false; }, 1600);
        }
      });
    });
  }

  /* ========== 启动 ========== */
  function onEnterStep(step, api) {
    apiRef = api;
    if (step.id === "s2") { runD1(); }
    if (step.id === "s3") { runD2(); }
    if (step.id === "s4") { startQuiz(); }
    if (step.id === "s5") { startBoss(); }
  }

  PlayerCore.init({
    steps: steps,
    parent: {
      summary: "面积 = 表面大小，用面积单位（1 平方厘米等）来量；长方形面积 = 长 × 宽，正方形面积 = 边长 × 边长。",
      attention: "孩子容易把面积和周长搞混；强调「面积看里面铺多少格，周长看外面一圈长度」。",
      tip: "本课约 8 分钟；用方格纸画长方形数格子，再对比长×宽。"
    },
    onEnterStep: onEnterStep,
    settings: { autoStopSteps: [3, 4], pauseMs: 2500 }
  });
})();
</script>
</body>
</html>
