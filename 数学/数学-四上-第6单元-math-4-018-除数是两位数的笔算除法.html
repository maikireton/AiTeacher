<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>除数是两位数的笔算除法 · AI 教师</title>
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="../assets/course.css">
<style>
  .dv-wrap { display: flex; gap: 30px; justify-content: center; align-items: flex-start; flex-wrap: wrap; margin: 10px 0; }
  .dv { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 24px; line-height: 1.5; }
  .dv .r { opacity: 0; transition: all .35s; }
  .dv .r.show { opacity: 1; }
  .dv .r.hl { color: var(--accent-deep); font-weight: 800; }
  .dv .r.green { color: #2e7d32; font-weight: 800; }
  .dv .r.red { color: #c23a3d; font-weight: 800; }
  .dv .rule { border-top: 3px solid var(--text); height: 0; }
  .dv-tip { font-size: 15px; font-weight: 700; min-height: 26px; margin: 8px 0; color: var(--accent-deep); }
  .trial { display: inline-block; background: #fff7e6; border: 1px solid #ffd591; color: #ad6800; border-radius: 10px; padding: 6px 12px; font-size: 14px; margin-top: 8px; }
</style>
</head>
<body>
<div class="container">
  <header class="topbar">
    <a class="btn-home" href="index.html">← 数学</a>
    <span class="brand">除数是两位数的笔算除法 <small>4年级·上册</small></span>
  </header>

  <div class="player">
    <div class="task-line" id="task-line"></div>
    <div class="stage" id="stage"></div>
    <div class="dots" id="dots"></div>
    <div class="controls">
      <button class="cbtn" id="btn-prev">上一步</button>
      <button class="cbtn" id="btn-auto">▶ 自动播放</button>
      <button class="cbtn" id="btn-voice">🔊 语音</button>
      <button class="cbtn main" id="btn-next">下一步</button>
    </div>
    <div class="score-row" id="score-row"></div>
  </div>

  <details class="parent-panel">
    <summary>家长模式（点击展开）</summary>
    <div class="pbody">
      <p><b>本课一句话总结：</b>笔算除法：先看被除数前两位，够除就商（商写在那一位上），不够除看前三位；除数不是整十数可用四舍五入试商。</p>
      <p><b>孩子容易走神的地方：</b>商的位置写错、试商偏大偏小；重点是先判断前两位够不够除。</p>
      <p><b>建议：</b>本课约 8 分钟；让孩子先说「先看前两位够不够」，再动手写竖式。</p>
    </div>
  </details>

  <footer class="foot">
    <div>AI 教师 · 示范课件 math-4-018</div>
  </footer>
</div>

<script src="../assets/voice.js"></script>
<script src="../assets/player-core.js"></script>
<script>
(function () {
  "use strict";
  var apiRef = null;

  function srow(cls, html, data) { return '<div class="r ' + cls + '" ' + (data || "") + ">" + html + "</div>"; }
  function sh(box, sel) { var r = box.querySelector(sel); if (r) { r.classList.add("show"); } }

  /* ========== 五段式步骤 ========== */
  var steps = [
    {
      id: "s1",
      title: "情境引入",
      task: "咱们这一步要做的：把 96 ÷ 32 写成竖式！",
      voice: "除法笔算，除数是两位数。该从被除数的哪里开始除？商写在哪一位上？今天一步一步看清楚。",
      body: function () {
        return '' +
          '<h2>96 ÷ 32</h2>' +
          '<p>96 根小棒，每 32 根一份，能分几份？</p>' +
          '<p class="big">96 ÷ 32</p>' +
          '<div class="hint">👆 在草稿纸上列一列竖式。</div>';
      }
    },
    {
      id: "s2",
      title: "竖式动画（够除）",
      task: "咱们这一步要做的：看动画学会「前两位够除就商」！",
      voice: "看竖式。九十六除以三十二。先看被除数前两位，是九十六。三十二乘三等于九十六，正好除完。商三，写在个位上，余数是零。",
      body: function () {
        return '' +
          '<h2>看动画：96 ÷ 32</h2>' +
          '<div class="dv-wrap"><div class="dv" id="dv1">' +
            srow("q", "&nbsp;&nbsp;3", 'data-s="q"') +
            srow("", "32)96", 'data-s="l1"') +
            srow("", "&nbsp;&nbsp;96", 'data-s="p"') +
            srow("rule", "", 'data-s="ln"') +
            srow("", "&nbsp;&nbsp;&nbsp;0", 'data-s="rem"') +
          "</div></div>" +
          '<div class="dv-tip" id="dv1-tip">准备开始…</div>';
      }
    },
    {
      id: "s3",
      title: "竖式动画（试商）",
      task: "咱们这一步要做的：看动画学会「不够除看前三位 + 试商」！",
      voice: "再看二百四十五除以七十二。前两位二十四比七十二小，不够除，要看前三位。试商：把七十二看成七十，三乘七十是二百一十，先商三试试。七十二乘三等于二百一十六，二百四十五减二百一十六，余二十九。",
      body: function () {
        return '' +
          '<h2>看动画：245 ÷ 72</h2>' +
          '<div class="dv-wrap"><div class="dv" id="dv2">' +
            srow("q", "&nbsp;&nbsp;&nbsp;3", 'data-s="q"') +
            srow("", "72)245", 'data-s="l1"') +
            srow("", "&nbsp;&nbsp;216", 'data-s="p"') +
            srow("rule", "", 'data-s="ln"') +
            srow("", "&nbsp;&nbsp;&nbsp;29", 'data-s="rem"') +
          "</div></div>" +
          '<div class="dv-tip" id="dv2-tip">准备开始…</div>' +
          '<div class="trial">试商：72 ≈ 70（四舍五入看成整十数）</div>';
      }
    },
    {
      id: "s4",
      title: "互动练习",
      task: "咱们这一步要做的：连闯 3 道除法题！",
      voice: "现在轮到你啦！先判断前两位够不够除，再试商。",
      body: function () {
        return '' +
          '<h2>闯关练习</h2>' +
          '<div class="quiz" id="quiz"></div>';
      }
    },
    {
      id: "s5",
      title: "Boss 关",
      task: "咱们这一步要做的：口算一个整十数除法，领奖！",
      voice: "Boss 来啦！一百八十除以六十，想乘法：六十乘三等于一百八十，商就是三！",
      body: function () {
        return '' +
          '<h2>Boss 关：180 ÷ 60 = ?</h2>' +
          '<div class="quiz" id="boss-quiz"></div>' +
          '<div class="result-big" id="result-stars"></div>';
      }
    }
  ];

  /* ========== S2：96 ÷ 32 = 3 ========== */
  function runDv1() {
    var box = document.getElementById("dv1");
    if (!box) { return; }
    var tip = document.getElementById("dv1-tip");
    sh(box, '[data-s="l1"]');
    setTimeout(function () {
      if (tip) { tip.textContent = "① 先看被除数前两位：96。32×3=96，够除！"; }
      sh(box, '[data-s="q"]');
      var q = box.querySelector('[data-s="q"]');
      if (q) { q.classList.add("hl"); }
    }, 1200);
    setTimeout(function () {
      if (tip) { tip.textContent = "② 3×32=96，写下来相减"; }
      sh(box, '[data-s="p"]');
      var p = box.querySelector('[data-s="p"]');
      if (p) { p.classList.add("green"); }
    }, 3200);
    setTimeout(function () {
      if (tip) { tip.textContent = "③ 96−96=0，没有余数 → 商 3 ✅"; }
      sh(box, '[data-s="ln"]');
      sh(box, '[data-s="rem"]');
      var r = box.querySelector('[data-s="rem"]');
      if (r) { r.classList.add("green"); }
    }, 5000);
  }

  /* ========== S3：245 ÷ 72 = 3 余 29 ========== */
  function runDv2() {
    var box = document.getElementById("dv2");
    if (!box) { return; }
    var tip = document.getElementById("dv2-tip");
    sh(box, '[data-s="l1"]');
    setTimeout(function () {
      if (tip) { tip.textContent = "① 前两位 24 ＜ 72，不够除 → 要看前三位 245"; }
    }, 1000);
    setTimeout(function () {
      if (tip) { tip.textContent = "② 试商：72≈70，70×3=210，商 3 试试"; }
      sh(box, '[data-s="q"]');
      var q = box.querySelector('[data-s="q"]');
      if (q) { q.classList.add("hl"); }
    }, 2800);
    setTimeout(function () {
      if (tip) { tip.textContent = "③ 72×3=216，写下来（216 ＜ 245，商 3 合适）"; }
      sh(box, '[data-s="p"]');
      var p = box.querySelector('[data-s="p"]');
      if (p) { p.classList.add("green"); }
    }, 5000);
    setTimeout(function () {
      if (tip) { tip.textContent = "④ 245−216=29（余数）→ 245÷72 = 3 余 29 ✅"; }
      sh(box, '[data-s="ln"]');
      sh(box, '[data-s="rem"]');
      var r = box.querySelector('[data-s="rem"]');
      if (r) { r.classList.add("green"); }
    }, 6800);
  }

  /* ========== S4 练习 ========== */
  var QUIZ = [
    { q: "96 ÷ 32 = ?", right: "3", opts: ["3", "30", "32"] },
    { q: "前两位不够除时，要看被除数的？", right: "前三位", opts: ["前三位", "后两位", "全部重新来"] },
    { q: "150 ÷ 30 = ?", right: "5", opts: ["5", "50", "3"] }
  ];
  var quizDone = { q1: false, q2: false, q3: false };
  function startQuiz() {
    quizDone = { q1: false, q2: false, q3: false };
    renderQuiz();
  }
  function renderQuiz() {
    var box = document.getElementById("quiz");
    if (!box) { return; }
    var idx = -1;
    ["q1", "q2", "q3"].forEach(function (k, i) { if (!quizDone[k] && idx === -1) { idx = i; } });
    if (idx === -1) {
      box.innerHTML = '<div class="q">全部完成！⭐ 你真棒</div>';
      return;
    }
    var q = QUIZ[idx];
    box.innerHTML = '<div class="q">第 ' + (idx + 1) + " 题：" + q.q + "</div>" +
      '<div class="opts">' + q.opts.map(function (o) {
        return '<div class="opt" data-ok="' + (o === q.right ? "1" : "0") + '">' + o + "</div>";
      }).join("") + "</div>" +
      "<div class='qmsg'></div><button class='qnext' disabled>下一题</button>";
    var tried = false;
    var opts = box.querySelectorAll(".opt");
    opts.forEach(function (o) {
      o.addEventListener("click", function () {
        if (tried) { return; }
        var ok = o.getAttribute("data-ok") === "1";
        var msg = box.querySelector(".qmsg");
        if (ok) {
          o.classList.add("right");
          opts.forEach(function (x) { x.classList.add("locked"); });
          apiRef.addStars(1); apiRef.comboHit();
          msg.className = "qmsg ok";
          msg.textContent = "对啦！⭐ +1" + (apiRef.state.combo >= 2 ? "（连击 +" + apiRef.state.combo + "）" : "");
          box.querySelector(".qnext").disabled = false;
        } else {
          o.classList.add("wrong");
          tried = true;
          apiRef.comboReset();
          msg.className = "qmsg no";
          msg.textContent = "前两位够除就商，不够除看前三位；试商可用四舍五入看整十数";
          setTimeout(function () { o.classList.remove("wrong"); tried = false; }, 1600);
        }
      });
    });
    box.querySelector(".qnext").addEventListener("click", function () {
      quizDone["q" + (idx + 1)] = true;
      renderQuiz();
    });
  }

  /* ========== S5 Boss ========== */
  function startBoss() {
    var box = document.getElementById("boss-quiz");
    if (!box) { return; }
    box.innerHTML = '<div class="q">180 ÷ 60 = ?</div>' +
      '<div class="opts">' +
      '<div class="opt" data-ok="1">3</div>' +
      '<div class="opt" data-ok="0">30</div>' +
      '<div class="opt" data-ok="0">4</div>' +
      "</div><div class='qmsg'></div>";
    var rs = document.getElementById("result-stars");
    var tried = false;
    box.querySelectorAll(".opt").forEach(function (o) {
      o.addEventListener("click", function () {
        if (tried) { return; }
        var ok = o.getAttribute("data-ok") === "1";
        var msg = box.querySelector(".qmsg");
        if (ok) {
          o.classList.add("right");
          box.querySelectorAll(".opt").forEach(function (x) { x.classList.add("locked"); });
          apiRef.addStars(2); apiRef.comboHit();
          msg.className = "qmsg ok";
          msg.textContent = "Boss 击败！⭐ +2 除法笔算你过关啦！";
          if (rs) {
            var n = apiRef.stars();
            rs.innerHTML = "🏆 共获得 <b>" + n + "</b> 颗星" +
              (n >= 8 ? "（全部拿下！）" : n >= 5 ? "（很不错！）" : "（下次再来！）");
          }
        } else {
          o.classList.add("wrong");
          tried = true;
          apiRef.comboReset();
          msg.className = "qmsg no";
          msg.textContent = "想乘法：60×3=180 → 180÷60=3";
          setTimeout(function () { o.classList.remove("wrong"); tried = false; }, 1500);
        }
      });
    });
  }

  /* ========== 启动 ========== */
  function onEnterStep(step, api) {
    apiRef = api;
    if (step.id === "s2") { runDv1(); }
    if (step.id === "s3") { runDv2(); }
    if (step.id === "s4") { startQuiz(); }
    if (step.id === "s5") { startBoss(); }
  }

  PlayerCore.init({
    steps: steps,
    parent: {
      summary: "笔算除法：先看被除数前两位，够除就商（商写在那一位上），不够除看前三位；除数不是整十数可用四舍五入试商。",
      attention: "孩子容易商的位置写错、试商偏大偏小；重点是先判断前两位够不够除。",
      tip: "本课约 8 分钟；让孩子先说「先看前两位够不够」，再动手写竖式。"
    },
    onEnterStep: onEnterStep,
    settings: { autoStopSteps: [3, 4], pauseMs: 2500 }
  });
})();
</script>
</body>
</html>
