<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>求近似数（四舍五入）· AI 教师</title>
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="../assets/course.css">
<style>
  .ap-table { display: flex; gap: 4px; justify-content: center; align-items: center; margin: 14px 0; flex-wrap: wrap; }
  .ap-cell {
    width: 46px; height: 54px; border: 2px solid var(--border); border-radius: 10px;
    display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 800;
    background: var(--card); transition: all .4s;
  }
  .ap-cell.keep { border-color: #9c27b0; background: rgba(156,39,176,.1); color: #7b1fa2; box-shadow: 0 0 0 3px rgba(156,39,176,.25); }
  .ap-cell.watch { border-color: var(--red); background: rgba(234,102,104,.15); color: #c23a3d; transform: scale(1.08); }
  .ap-cell.out { opacity: 0; transform: translateY(-16px) scale(.6); }
  .ap-cell.bump { border-color: #8bc34a; background: rgba(139,195,74,.2); color: #2e7d32; animation: apPop .5s ease; }
  @keyframes apPop { 0% { transform: scale(1.4); } 100% { transform: scale(1); } }
  .ap-unit { font-size: 28px; font-weight: 800; color: #2e7d32; margin-left: 6px; animation: unitPop .5s ease; background: rgba(139,195,74,.2); border-radius: 10px; padding: 4px 10px; }
  @keyframes unitPop { 0% { transform: scale(0); opacity: 0; } 70% { transform: scale(1.3); } 100% { transform: scale(1); } }
  .ap-tip { font-size: 15px; font-weight: 700; min-height: 24px; margin: 8px 0; color: var(--accent-deep); }
  .ap-eq { font-size: 22px; font-weight: 800; margin-top: 6px; }
  .rule { display: inline-block; background: #fff7e6; border: 1px solid #ffd591; color: #ad6800; border-radius: 10px; padding: 6px 12px; font-size: 14px; margin-top: 10px; }
</style>
</head>
<body>
<div class="container">
  <header class="topbar">
    <a class="btn-home" href="index.html">← 数学</a>
    <span class="brand">求近似数（四舍五入）<small>4年级·上册</small></span>
  </header>

  <div class="player">
    <div class="task-line" id="task-line"></div>
    <div class="stage" id="stage"></div>
    <div class="dots" id="dots"></div>
    <div class="controls">
      <button class="cbtn" id="btn-prev">上一步</button>
      <button class="cbtn" id="btn-auto">▶ 自动播放</button>
      <button class="cbtn" id="btn-voice">🔊 语音</button>
      <button class="cbtn main" id="btn-next">下一步</button>
    </div>
    <div class="score-row" id="score-row"></div>
  </div>

  <details class="parent-panel">
    <summary>家长模式（点击展开）</summary>
    <div class="pbody">
      <p><b>本课一句话总结：</b>求近似数（四舍五入）：找到保留到哪一位，看它的下一位——≥5 进 1，＜5 舍去（后面全写 0）。</p>
      <p><b>孩子容易走神的地方：</b>看错"保留到哪一位"、或进 1 后忘记尾数补 0；尤其"满五进一"时万位加 1 容易漏。</p>
      <p><b>建议：</b>本课约 8 分钟；口诀「四舍五入看下一位，满五进一，不满五舍去」先背熟再用。</p>
    </div>
  </details>

  <footer class="foot">
    <div>AI 教师 · 示范课件 math-4-005</div>
  </footer>
</div>

<script src="../assets/voice.js"></script>
<script src="../assets/player-core.js"></script>
<script>
(function () {
  "use strict";
  var apiRef = null;

  /* ========== 近似数动画工具 ========== */
  function renderNum(boxId, digits) {
    var box = document.getElementById(boxId);
    if (!box) { return; }
    box.innerHTML = digits.map(function (d, i) {
      return '<span class="ap-cell" id="' + boxId + "-" + i + '">' + d + "</span>";
    }).join("");
  }
  function mark(boxId, i, cls) {
    var c = document.getElementById(boxId + "-" + i);
    if (c) { c.className = "ap-cell " + cls; }
  }
  function dropTail(boxId, from) {
    for (var i = from; i < 6; i++) {
      (function (i) {
        setTimeout(function () {
          var c = document.getElementById(boxId + "-" + i);
          if (c) { c.className = "ap-cell out"; }
        }, 300 + (i - from) * 250);
      })(i);
    }
  }
  function bump(boxId, i, val) {
    var c = document.getElementById(boxId + "-" + i);
    if (c) { c.textContent = val; c.className = "ap-cell bump"; }
  }
  function addUnit(boxId, unit) {
    var box = document.getElementById(boxId);
    if (!box) { return; }
    var u = document.createElement("span");
    u.className = "ap-unit";
    u.textContent = unit;
    box.appendChild(u);
  }

  /* ========== 五段式步骤 ========== */
  var steps = [
    {
      id: "s1",
      title: "情境引入",
      task: "咱们这一步要做的：认识「大约、约等于」——近似数！",
      voice: "你问学校有多少人？可能是 1800 人，也可能是 2100 人，我们常说大约两千人。大约两千，就是两千的近似数。今天学怎么求近似数。",
      body: function () {
        return '' +
          '<h2>大约有多少？</h2>' +
          '<p>学校有 <span class="big">684000</span> 名学生？</p>' +
          '<p>说起来太长啦！我们说它大约是 <span class="big">68 万</span>。</p>' +
          '<p>68 万不是准确数，是 <b>近似数</b>。那 684000 到底该约成 68 万还是 69 万？</p>' +
          '<div class="hint">👆 答案由它的下一位决定——这就是「四舍五入」。</div>';
      }
    },
    {
      id: "s2",
      title: "舍：千位小于 5",
      task: "咱们这一步要做的：看动画学会「下一位 < 5 就舍去」！",
      voice: "看 684000 省略万位后面的尾数。先找到万位，万位是八，用紫色圈住。再看万位后面的一位——千位，千位是四，用红色圈住。四比五小，就舍去，把四千和后面的零都舍掉。结果就是六十八万。",
      body: function () {
        return '' +
          '<h2>看动画：684000 ≈ 68 万</h2>' +
          '<div class="ap-table" id="ap1"></div>' +
          '<div class="ap-tip" id="ap1-tip">准备开始…</div>' +
          '<div class="rule">口诀：看保留位的下一位，&lt; 5 → 舍</div>';
      }
    },
    {
      id: "s3",
      title: "入：千位满 5 进一",
      task: "咱们这一步要做的：看动画学会「下一位 ≥ 5 就进一」！",
      voice: "看 686000。万位是八，千位是六。六满五了，就要向前进一。万位的八加一变成九，后面的尾数舍去。结果就是六十九万。记住：满五进一，不满五舍去。",
      body: function () {
        return '' +
          '<h2>看动画：686000 ≈ 69 万</h2>' +
          '<div class="ap-table" id="ap2"></div>' +
          '<div class="ap-tip" id="ap2-tip">准备开始…</div>' +
          '<div class="rule">口诀：看保留位的下一位，≥ 5 → 进 1</div>';
      }
    },
    {
      id: "s4",
      title: "互动练习",
      task: "咱们这一步要做的：连闯 3 道求近似数，找对下一位！",
      voice: "现在轮到你啦！求近似数，关键先找到保留到哪一位，再看它的下一位满不满五。",
      body: function () {
        return '' +
          '<h2>闯关练习</h2>' +
          '<div class="quiz" id="quiz"></div>';
      }
    },
    {
      id: "s5",
      title: "Boss 关",
      task: "咱们这一步要做的：求一个会进位的近似数，领奖！",
      voice: "Boss 来啦！把 749500 省略万位后面的尾数。小心，万位后面是九，九满五要进一，万位的四要加一变成五哦！",
      body: function () {
        return '' +
          '<h2>Boss 关：749500 ≈ ? 万</h2>' +
          '<div class="quiz" id="boss-quiz"></div>' +
          '<div class="result-big" id="result-stars"></div>';
      }
    }
  ];

  /* ========== S2 动画：684000 → 68 万（舍） ========== */
  function runAp1() {
    var box = document.getElementById("ap1");
    if (!box) { return; }
    renderNum("ap1", ["6", "8", "4", "0", "0", "0"]);
    var tip = document.getElementById("ap1-tip");
    setTimeout(function () {
      if (tip) { tip.textContent = "① 保留到万位 → 万位「8」紫圈，看它的下一位：千位"; }
      mark("ap1", 1, "keep");
      mark("ap1", 2, "watch");
    }, 500);
    setTimeout(function () {
      if (tip) { tip.textContent = "② 千位是 4，4 ＜ 5 → 舍！把尾数 4000 舍去"; }
      dropTail("ap1", 2);
    }, 2000);
    setTimeout(function () {
      if (tip) { tip.textContent = "③ 万位不变 → 68 万"; }
      addUnit("ap1", "万");
    }, 3400);
    setTimeout(function () {
      if (tip) { tip.textContent = "✅ 684000 ≈ 68 万（千位 4 ＜ 5，舍）"; }
    }, 4400);
  }

  /* ========== S3 动画：686000 → 69 万（入） ========== */
  function runAp2() {
    var box = document.getElementById("ap2");
    if (!box) { return; }
    renderNum("ap2", ["6", "8", "6", "0", "0", "0"]);
    var tip = document.getElementById("ap2-tip");
    setTimeout(function () {
      if (tip) { tip.textContent = "① 保留到万位 → 万位「8」紫圈，看千位"; }
      mark("ap2", 1, "keep");
      mark("ap2", 2, "watch");
    }, 500);
    setTimeout(function () {
      if (tip) { tip.textContent = "② 千位是 6，6 ≥ 5 → 进 1！万位 8 变成 9"; }
      bump("ap2", 1, "9");
      dropTail("ap2", 2);
    }, 2000);
    setTimeout(function () {
      if (tip) { tip.textContent = "③ 尾数舍去 → 69 万"; }
      addUnit("ap2", "万");
    }, 3400);
    setTimeout(function () {
      if (tip) { tip.textContent = "✅ 686000 ≈ 69 万（千位 6 ≥ 5，进 1）"; }
    }, 4400);
  }

  /* ========== S4 练习 ========== */
  var QUIZ = [
    { q: "684000 ≈ ? 万", right: "68", opts: ["68", "69", "684"] },
    { q: "519000 ≈ ? 万", right: "52", opts: ["51", "52", "519"] },
    { q: "350000 ≈ ? 万", right: "35", opts: ["35", "36", "350"] }
  ];
  var quizDone = { q1: false, q2: false, q3: false };
  function startQuiz() {
    quizDone = { q1: false, q2: false, q3: false };
    renderQuiz();
  }
  function renderQuiz() {
    var box = document.getElementById("quiz");
    if (!box) { return; }
    var idx = -1;
    ["q1", "q2", "q3"].forEach(function (k, i) { if (!quizDone[k] && idx === -1) { idx = i; } });
    if (idx === -1) {
      box.innerHTML = '<div class="q">全部完成！⭐ 你真棒</div>';
      return;
    }
    var q = QUIZ[idx];
    box.innerHTML = '<div class="q">第 ' + (idx + 1) + " 题：" + q.q + "</div>" +
      '<div class="opts">' + q.opts.map(function (o) {
        return '<div class="opt" data-ok="' + (o === q.right ? "1" : "0") + '">' + o + "</div>";
      }).join("") + "</div>" +
      "<div class='qmsg'></div><button class='qnext' disabled>下一题</button>";
    var tried = false;
    var opts = box.querySelectorAll(".opt");
    opts.forEach(function (o) {
      o.addEventListener("click", function () {
        if (tried) { return; }
        var ok = o.getAttribute("data-ok") === "1";
        var msg = box.querySelector(".qmsg");
        if (ok) {
          o.classList.add("right");
          opts.forEach(function (x) { x.classList.add("locked"); });
          apiRef.addStars(1); apiRef.comboHit();
          msg.className = "qmsg ok";
          msg.textContent = "对啦！⭐ +1" + (apiRef.state.combo >= 2 ? "（连击 +" + apiRef.state.combo + "）" : "");
          box.querySelector(".qnext").disabled = false;
        } else {
          o.classList.add("wrong");
          tried = true;
          apiRef.comboReset();
          msg.className = "qmsg no";
          msg.textContent = "先找万位，再看千位：千位满 5 进一，不满 5 舍去！";
          setTimeout(function () { o.classList.remove("wrong"); tried = false; }, 1300);
        }
      });
    });
    box.querySelector(".qnext").addEventListener("click", function () {
      quizDone["q" + (idx + 1)] = true;
      renderQuiz();
    });
  }

  /* ========== S5 Boss ========== */
  function startBoss() {
    var box = document.getElementById("boss-quiz");
    if (!box) { return; }
    box.innerHTML = '<div class="q">749500 ≈ ? 万</div>' +
      '<div class="opts">' +
      '<div class="opt" data-ok="1">75</div>' +
      '<div class="opt" data-ok="0">74</div>' +
      '<div class="opt" data-ok="0">749</div>' +
      "</div><div class='qmsg'></div>";
    var rs = document.getElementById("result-stars");
    var tried = false;
    box.querySelectorAll(".opt").forEach(function (o) {
      o.addEventListener("click", function () {
        if (tried) { return; }
        var ok = o.getAttribute("data-ok") === "1";
        var msg = box.querySelector(".qmsg");
        if (ok) {
          o.classList.add("right");
          box.querySelectorAll(".opt").forEach(function (x) { x.classList.add("locked"); });
          apiRef.addStars(2); apiRef.comboHit();
          msg.className = "qmsg ok";
          msg.textContent = "Boss 击败！⭐ +2 四舍五入你过关啦！";
          if (rs) {
            var n = apiRef.stars();
            rs.innerHTML = "🏆 共获得 <b>" + n + "</b> 颗星" +
              (n >= 8 ? "（全部拿下！）" : n >= 5 ? "（很不错！）" : "（下次再来！）");
          }
        } else {
          o.classList.add("wrong");
          tried = true;
          apiRef.comboReset();
          msg.className = "qmsg no";
          msg.textContent = "千位是 9，满 5 进一：74 万 + 1 万 = 75 万";
          setTimeout(function () { o.classList.remove("wrong"); tried = false; }, 1600);
        }
      });
    });
  }

  /* ========== 启动 ========== */
  function onEnterStep(step, api) {
    apiRef = api;
    if (step.id === "s2") { runAp1(); }
    if (step.id === "s3") { runAp2(); }
    if (step.id === "s4") { startQuiz(); }
    if (step.id === "s5") { startBoss(); }
  }

  PlayerCore.init({
    steps: steps,
    parent: {
      summary: "求近似数（四舍五入）：找到保留到哪一位，看它的下一位——≥5 进 1，＜5 舍去（后面全写 0）。",
      attention: "孩子容易看错保留位、或进 1 后忘记尾数补 0；「满五进一」时保留位加 1 容易漏，Boss 题专练这个。",
      tip: "本课约 8 分钟；口诀「四舍五入看下一位，满五进一，不满五舍去」先背熟再用。"
    },
    onEnterStep: onEnterStep,
    settings: { autoStopSteps: [3, 4], pauseMs: 2500 }
  });
})();
</script>
</body>
</html>
