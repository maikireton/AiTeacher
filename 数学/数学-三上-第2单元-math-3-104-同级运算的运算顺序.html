<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>同级运算的运算顺序 · AI 教师</title>
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="../assets/course.css">
<style>
  .calc-box { margin: 12px 0; }
  .calc-line { display: flex; justify-content: center; gap: 8px; font-size: 30px; font-weight: 800; align-items: center; flex-wrap: wrap; background: var(--card); border: 2px solid var(--border); border-radius: 14px; padding: 16px; }
  .calc-part { padding: 2px 8px; border-radius: 10px; transition: all .35s; }
  .calc-part.hl { background: #fff3bf; outline: 2px solid #ffa940; }
  .calc-part.done { color: #2e7d32; }
  .calc-step { font-size: 16px; font-weight: 700; min-height: 26px; margin-top: 10px; color: var(--accent-deep); }
  .calc-rule { display: inline-block; background: #e8f6ff; border: 1px solid #91caff; color: #0b5e91; border-radius: 10px; padding: 6px 14px; font-size: 15px; font-weight: 700; margin-top: 8px; }
</style>
</head>
<body>
<div class="container">
  <header class="topbar">
    <a class="btn-home" href="index.html">← 数学</a>
    <span class="brand">同级运算的运算顺序 <small>3年级·上册</small></span>
  </header>

  <div class="player">
    <div class="task-line" id="task-line"></div>
    <div class="stage" id="stage"></div>
    <div class="dots" id="dots"></div>
    <div class="controls">
      <button class="cbtn" id="btn-prev">上一步</button>
      <button class="cbtn" id="btn-auto">▶ 自动播放</button>
      <button class="cbtn" id="btn-voice">🔊 语音</button>
      <button class="cbtn main" id="btn-next">下一步</button>
    </div>
    <div class="score-row" id="score-row"></div>
  </div>

  <details class="parent-panel">
    <summary>家长模式（点击展开）</summary>
    <div class="pbody">
      <p><b>本课一句话总结：</b>只有加减法（或只有乘除法）的算式，按从左到右的顺序依次计算。</p>
      <p><b>孩子容易走神的地方：</b>看到"先算大的"乱序算；可让他边说边指：「先算这个，再算那个」。</p>
      <p><b>建议：</b>本课约 8 分钟；让孩子把每一步的结果写出来，再往下算。</p>
    </div>
  </details>

  <footer class="foot">
    <div>AI 教师 · 示范课件 math-3-104</div>
  </footer>
</div>

<script src="../assets/voice.js"></script>
<script src="../assets/player-core.js"></script>
<script>
(function () {
  "use strict";
  var apiRef = null;

  function eq(html) { return '<span class="calc-part">' + html + "</span>"; }
  function part(idx, html) { return '<span class="calc-part" data-i="' + idx + '">' + html + "</span>"; }

  /* 通用同级运算动画：partIdx 高亮顺序，result 每步结果 */
  function runCalc(boxId, tipId, lineHTML, stepsArr) {
    var box = document.getElementById(boxId);
    if (!box) { return; }
    var tip = document.getElementById(tipId);
    box.innerHTML = '<div class="calc-line">' + lineHTML + "</div>";
    stepsArr.forEach(function (st, i) {
      setTimeout(function () {
        st.parts.forEach(function (p) {
          var el = box.querySelector('[data-i="' + p + '"]');
          if (el) { el.classList.add("hl"); }
        });
        if (tip) { tip.textContent = st.msg; }
      }, 800 + i * 2400);
      setTimeout(function () {
        st.parts.forEach(function (p) {
          var el = box.querySelector('[data-i="' + p + '"]');
          if (el) { el.classList.remove("hl"); el.classList.add("done"); }
        });
      }, 2200 + i * 2400);
    });
    setTimeout(function () { if (tip) { tip.textContent = "✅ 从左到右依次算"; } }, 900 + stepsArr.length * 2400);
  }

  /* ========== 五段式步骤 ========== */
  var steps = [
    {
      id: "s1",
      title: "情境引入",
      task: "咱们这一步要做的：看看只有加减法的算式怎么算！",
      voice: "买糖果花二十八元，妈妈又给十二元，买水又花十五元。像这样只有加减法的算式，该从哪边开始算？今天学一个重要的规则：从左到右。",
      body: function () {
        return '' +
          '<h2>只有加减怎么办？</h2>' +
          '<p class="big">28 + 12 - 15 = ?</p>' +
          '<p>先加还是先减？有规定吗？</p>' +
          '<div class="hint">👆 猜猜：按从左到右的顺序来算！</div>';
      }
    },
    {
      id: "s2",
      title: "加减法：从左到右",
      task: "咱们这一步要做的：看动画学会「先左后右」！",
      voice: "看动画。二十八加十二减十五。按从左到右：先算二十八加十二等于四十，再算四十减十五等于二十五。从左往右，一步一步来。",
      body: function () {
        return '' +
          '<h2>看动画：28 + 12 - 15</h2>' +
          '<div class="calc-box" id="c1"></div>' +
          '<div class="calc-step" id="c1-tip">准备开始…</div>' +
          '<div class="calc-rule">只含加减法 → 从左到右依次算</div>';
      }
    },
    {
      id: "s3",
      title: "乘除法：也是从左到右",
      task: "咱们这一步要做的：看动画发现乘除也是从左到右！",
      voice: "看动画。三十六除以六乘四。还是从左到右：先算三十六除以六等于六，再算六乘四等于二十四。只有乘除法的算式，也是从左往右算。",
      body: function () {
        return '' +
          '<h2>看动画：36 ÷ 6 × 4</h2>' +
          '<div class="calc-box" id="c2"></div>' +
          '<div class="calc-step" id="c2-tip">准备开始…</div>' +
          '<div class="calc-rule">只含乘除法 → 从左到右依次算</div>';
      }
    },
    {
      id: "s4",
      title: "互动练习",
      task: "咱们这一步要做的：连闯 3 道运算顺序题！",
      voice: "现在考考你！同级运算的顺序。",
      body: function () {
        return '' +
          '<h2>闯关练习</h2>' +
          '<div class="quiz" id="quiz"></div>';
      }
    },
    {
      id: "s5",
      title: "Boss 关",
      task: "咱们这一步要做的：算一道同级运算，领奖！",
      voice: "Boss 来啦！四十减十五加八。从左到右：先四十减十五等于二十五，再加八等于三十三。",
      body: function () {
        return '' +
          '<h2>Boss 关：40 - 15 + 8 = ?</h2>' +
          '<div class="quiz" id="boss-quiz"></div>' +
          '<div class="result-big" id="result-stars"></div>';
      }
    }
  ];

  function runC1() {
    runCalc("c1", "c1-tip",
      part(0, "28") + '<span>+</span>' + part(1, "12") + '<span>−</span>' + part(2, "15") + '<span>=</span>' + part(3, "?") ,
      [
        { parts: [0, 1], msg: "① 先算最左边：28 + 12 = 40" },
        { parts: [2, 3], msg: "② 再算：40 − 15 = 25 ✅" }
      ]);
  }
  function runC2() {
    runCalc("c2", "c2-tip",
      part(0, "36") + '<span>÷</span>' + part(1, "6") + '<span>×</span>' + part(2, "4") + '<span>=</span>' + part(3, "?") ,
      [
        { parts: [0, 1], msg: "① 先算最左边：36 ÷ 6 = 6" },
        { parts: [2, 3], msg: "② 再算：6 × 4 = 24 ✅" }
      ]);
  }

  /* ========== S4 练习 ========== */
  var QUIZ = [
    { q: "25 + 10 - 5，第一步先算什么？", right: "25 + 10", opts: ["25 + 10", "10 - 5", "25 - 5"] },
    { q: "24 ÷ 3 × 2，第一步先算什么？", right: "24 ÷ 3", opts: ["24 ÷ 3", "3 × 2", "24 × 2"] },
    { q: "只有加减法（或只有乘除法）时按什么顺序算？", right: "从左到右", opts: ["从左到右", "从右到左", "随便算"] }
  ];
  var quizDone = { q1: false, q2: false, q3: false };
  function startQuiz() {
    quizDone = { q1: false, q2: false, q3: false };
    renderQuiz();
  }
  function renderQuiz() {
    var box = document.getElementById("quiz");
    if (!box) { return; }
    var idx = -1;
    ["q1", "q2", "q3"].forEach(function (k, i) { if (!quizDone[k] && idx === -1) { idx = i; } });
    if (idx === -1) { box.innerHTML = '<div class="q">全部完成！⭐ 你真棒</div>'; return; }
    var q = QUIZ[idx];
    box.innerHTML = '<div class="q">第 ' + (idx + 1) + " 题：" + q.q + "</div>" +
      '<div class="opts">' + q.opts.map(function (o) {
        return '<div class="opt" data-ok="' + (o === q.right ? "1" : "0") + '">' + o + "</div>";
      }).join("") + "</div>" +
      "<div class='qmsg'></div><button class='qnext' disabled>下一题</button>";
    var tried = false;
    var opts = box.querySelectorAll(".opt");
    opts.forEach(function (o) {
      o.addEventListener("click", function () {
        if (tried) { return; }
        var ok = o.getAttribute("data-ok") === "1";
        var msg = box.querySelector(".qmsg");
        if (ok) {
          o.classList.add("right");
          opts.forEach(function (x) { x.classList.add("locked"); });
          apiRef.addStars(1); apiRef.comboHit();
          msg.className = "qmsg ok";
          msg.textContent = "对啦！⭐ +1" + (apiRef.state.combo >= 2 ? "（连击 +" + apiRef.state.combo + "）" : "");
          box.querySelector(".qnext").disabled = false;
        } else {
          o.classList.add("wrong");
          tried = true;
          apiRef.comboReset();
          msg.className = "qmsg no";
          msg.textContent = "同级运算：从左到右，一步接一步";
          setTimeout(function () { o.classList.remove("wrong"); tried = false; }, 1400);
        }
      });
    });
    box.querySelector(".qnext").addEventListener("click", function () {
      quizDone["q" + (idx + 1)] = true;
      renderQuiz();
    });
  }

  /* ========== S5 Boss ========== */
  function startBoss() {
    var box = document.getElementById("boss-quiz");
    if (!box) { return; }
    box.innerHTML = '<div class="q">40 - 15 + 8 = ?</div>' +
      '<div class="opts">' +
      '<div class="opt" data-ok="1">33</div>' +
      '<div class="opt" data-ok="0">17</div>' +
      '<div class="opt" data-ok="0">23</div>' +
      "</div><div class='qmsg'></div>";
    var rs = document.getElementById("result-stars");
    var tried = false;
    box.querySelectorAll(".opt").forEach(function (o) {
      o.addEventListener("click", function () {
        if (tried) { return; }
        var ok = o.getAttribute("data-ok") === "1";
        var msg = box.querySelector(".qmsg");
        if (ok) {
          o.classList.add("right");
          box.querySelectorAll(".opt").forEach(function (x) { x.classList.add("locked"); });
          apiRef.addStars(2); apiRef.comboHit();
          msg.className = "qmsg ok";
          msg.textContent = "Boss 击败！⭐ +2 运算顺序你掌握啦！";
          if (rs) {
            var n = apiRef.stars();
            rs.innerHTML = "🏆 共获得 <b>" + n + "</b> 颗星" +
              (n >= 8 ? "（全部拿下！）" : n >= 5 ? "（很不错！）" : "（下次再来！）");
          }
        } else {
          o.classList.add("wrong");
          tried = true;
          apiRef.comboReset();
          msg.className = "qmsg no";
          msg.textContent = "从左到右：40−15=25，25+8=33";
          setTimeout(function () { o.classList.remove("wrong"); tried = false; }, 1500);
        }
      });
    });
  }

  /* ========== 启动 ========== */
  function onEnterStep(step, api) {
    apiRef = api;
    if (step.id === "s2") { runC1(); }
    if (step.id === "s3") { runC2(); }
    if (step.id === "s4") { startQuiz(); }
    if (step.id === "s5") { startBoss(); }
  }

  PlayerCore.init({
    steps: steps,
    parent: {
      summary: "只有加减法（或只有乘除法）的算式，按从左到右的顺序依次计算。",
      attention: "孩子容易看到「先算大的」乱序算；可让他边说边指：「先算这个，再算那个」。",
      tip: "本课约 8 分钟；让孩子把每一步的结果写出来，再往下算。"
    },
    onEnterStep: onEnterStep,
    settings: { autoStopSteps: [3, 4], pauseMs: 2500 }
  });
})();
</script>
</body>
</html>
