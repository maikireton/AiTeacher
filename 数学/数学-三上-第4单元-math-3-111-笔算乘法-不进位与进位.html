<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>笔算乘法（不进位与进位） · AI 教师</title>
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="../assets/course.css">
<style>
  .v-wrap { margin: 12px 0; text-align: center; }
  .vert { display: inline-block; text-align: right; background: var(--card); border: 2px solid var(--border); border-radius: 14px; padding: 18px 24px; font-size: 30px; font-weight: 800; font-family: "SF Mono", Menlo, Consolas, monospace; }
  .v-row { display: flex; justify-content: flex-end; gap: 6px; align-items: center; }
  .v-num { width: 34px; height: 38px; line-height: 38px; text-align: center; border-radius: 6px; transition: all .3s; }
  .v-num.hl { background: #fff3bf; outline: 2px solid #ffa940; }
  .v-num.res { background: #e0f2e9; outline: 2px solid #8bc34a; }
  .v-line { border-top: 3px solid var(--accent-deep); margin: 8px 0; }
  .v-carry { font-size: 15px; color: #e26d6d; font-weight: 800; width: 20px; opacity: 0; transition: opacity .3s; }
  .v-carry.show { opacity: 1; }
  .v-msg { font-size: 16px; font-weight: 700; min-height: 26px; margin-top: 10px; color: var(--accent-deep); }
  .v-rule { display: inline-block; background: #e8f6ff; border: 1px solid #91caff; color: #0b5e91; border-radius: 10px; padding: 6px 14px; font-size: 15px; font-weight: 700; margin-top: 8px; }
</style>
</head>
<body>
<div class="container">
  <header class="topbar">
    <a class="btn-home" href="index.html">← 数学</a>
    <span class="brand">笔算乘法（不进位与进位） <small>3年级·上册</small></span>
  </header>

  <div class="player">
    <div class="task-line" id="task-line"></div>
    <div class="stage" id="stage"></div>
    <div class="dots" id="dots"></div>
    <div class="controls">
      <button class="cbtn" id="btn-prev">上一步</button>
      <button class="cbtn" id="btn-auto">▶ 自动播放</button>
      <button class="cbtn" id="btn-voice">🔊 语音</button>
      <button class="cbtn main" id="btn-next">下一步</button>
    </div>
    <div class="score-row" id="score-row"></div>
  </div>

  <details class="parent-panel">
    <summary>家长模式（点击展开）</summary>
    <div class="pbody">
      <p><b>本课一句话总结：</b>笔算乘法从个位乘起，哪一位满几十就向前一位进几，进位别忘了加。</p>
      <p><b>孩子容易走神的地方：</b>进位后忘了加、或位置没对齐；竖式要"数位对齐、从个位算起"。</p>
      <p><b>建议：</b>本课约 8 分钟；先做不进位的建立信心，再攻进位的。</p>
    </div>
  </details>

  <footer class="foot">
    <div>AI 教师 · 示范课件 math-3-111</div>
  </footer>
</div>

<script src="../assets/voice.js"></script>
<script src="../assets/player-core.js"></script>
<script src="../assets/record.js"></script>
<script>
(function () {
  "use strict";
  var apiRef = null;

  function vert(nums, op, res) {
    var h = '<div class="v-row">' + nums.map(function (n, i) {
      return '<span class="v-num" data-i="' + (op ? "n" + i : "") + '">' + n + "</span>";
    }).join("") + "</div>";
    h += '<div class="v-row"><span class="v-op">' + op + "</span><span class='v-num' data-i='c'>" + (op ? op[1] : "") + "</span></div>";
    h += '<div class="v-line"></div>';
    h += '<div class="v-row">' + res.map(function (r, i) {
      return '<span class="v-num" data-i="r' + i + '">' + r + "</span>";
    }).join("") + "</div>";
    return h;
  }

  /* 手工写竖式容器 */
  function vertBox(html) {
    return '<div class="vert">' + html + "</div>";
  }

  /* ========== 五段式步骤 ========== */
  var steps = [
    {
      id: "s1",
      title: "情境引入",
      task: "咱们这一步要做的：看看 23×3 怎么列竖式！",
      voice: "二十三个一组，有三组，一共多少个？二十三乘三。口算很难吗？用竖式一步一步算，从个位开始，就不会错。",
      body: function () {
        return '' +
          '<h2>竖式来帮忙</h2>' +
          '<p class="big">23 × 3 = ?</p>' +
          '<p>从个位乘起，一位一位来。</p>' +
          '<div class="hint">👆 数位对齐，个位先算！</div>';
      }
    },
    {
      id: "s2",
      title: "不进位笔算动画",
      task: "咱们这一步要做的：看动画学会一步步算！",
      voice: "看动画。二十三乘三。先从个位算起：三乘三等于九，写在个位。再算十位：二乘三等于六，写在十位。合起来六十九！",
      body: function () {
        return '' +
          '<h2>看动画：23 × 3（不进位）</h2>' +
          '<div class="v-wrap" id="v1"></div>' +
          '<div class="v-msg" id="v1-msg">准备开始…</div>' +
          '<div class="v-rule">从个位乘起，一位一位乘</div>';
      }
    },
    {
      id: "s3",
      title: "进位笔算动画",
      task: "咱们这一步要做的：看动画学会进位！",
      voice: "看动画。十四乘三。个位：四乘三等于十二，写二进一。十位：一乘三等于三，加上进位的 一，等于四。结果是四十二！",
      body: function () {
        return '' +
          '<h2>看动画：14 × 3（进位）</h2>' +
          '<div class="v-wrap" id="v2"></div>' +
          '<div class="v-msg" id="v2-msg">准备开始…</div>' +
          '<div class="v-rule">满十进一，进位别忘了加</div>';
      }
    },
    {
      id: "s4",
      title: "互动练习",
      task: "咱们这一步要做的：连闯 3 道笔算题！",
      voice: "现在考考你！竖式乘法。",
      body: function () {
        return '' +
          '<h2>闯关练习</h2>' +
          '<div class="quiz" id="quiz"></div>';
      }
    },
    {
      id: "s5",
      title: "Boss 关",
      task: "咱们这一步要做的：算一道进位的，领奖！",
      voice: "Boss 来啦！十六乘三。个位：六乘三等于十八，写八进一。十位：一乘三等于三，加进位一等于四。四十八！",
      body: function () {
        return '' +
          '<h2>Boss 关：16 × 3 = ?</h2>' +
          '<div class="quiz" id="boss-quiz"></div>' +
          '<div class="result-big" id="result-stars"></div>';
      }
    }
  ];

  /* S2: 23×3 */
  function runV1() {
    var box = document.getElementById("v1");
    box.innerHTML = vertBox(
      '<div class="v-row"><span class="v-num" data-i="a">2</span><span class="v-num" data-i="b">3</span></div>' +
      '<div class="v-row"><span class="v-op">×</span><span class="v-num" data-i="c">3</span></div>' +
      '<div class="v-line"></div>' +
      '<div class="v-row"><span class="v-num" data-i="d">?</span><span class="v-num" data-i="e">?</span></div>'
    );
    var msg = document.getElementById("v1-msg");
    setTimeout(function () { box.querySelector('[data-i="b"]').classList.add("hl"); if (msg) { msg.textContent = "① 个位：3 × 3 = 9"; } }, 800);
    setTimeout(function () {
      box.querySelector('[data-i="e"]').textContent = "9";
      box.querySelector('[data-i="e"]').classList.add("res");
      box.querySelector('[data-i="b"]').classList.remove("hl");
    }, 2300);
    setTimeout(function () { box.querySelector('[data-i="a"]').classList.add("hl"); if (msg) { msg.textContent = "② 十位：2 × 3 = 6"; } }, 3300);
    setTimeout(function () {
      box.querySelector('[data-i="d"]').textContent = "6";
      box.querySelector('[data-i="d"]').classList.add("res");
      box.querySelector('[data-i="a"]').classList.remove("hl");
      if (msg) { msg.textContent = "✅ 23 × 3 = 69"; }
    }, 4900);
  }

  /* S3: 14×3 进位 */
  function runV2() {
    var box = document.getElementById("v2");
    box.innerHTML = vertBox(
      '<div class="v-row"><span class="v-carry" data-i="carry">1</span></div>' +
      '<div class="v-row"><span class="v-num" data-i="a">1</span><span class="v-num" data-i="b">4</span></div>' +
      '<div class="v-row"><span class="v-op">×</span><span class="v-num" data-i="c">3</span></div>' +
      '<div class="v-line"></div>' +
      '<div class="v-row"><span class="v-num" data-i="d">?</span><span class="v-num" data-i="e">?</span></div>'
    );
    var msg = document.getElementById("v2-msg");
    setTimeout(function () { box.querySelector('[data-i="b"]').classList.add("hl"); if (msg) { msg.textContent = "① 个位：4 × 3 = 12 → 写 2，进 1"; } }, 800);
    setTimeout(function () {
      box.querySelector('[data-i="e"]').textContent = "2";
      box.querySelector('[data-i="e"]').classList.add("res");
      box.querySelector('[data-i="carry"]').classList.add("show");
      box.querySelector('[data-i="b"]').classList.remove("hl");
    }, 2600);
    setTimeout(function () { box.querySelector('[data-i="a"]').classList.add("hl"); if (msg) { msg.textContent = "② 十位：1 × 3 = 3，加进位 1 = 4"; } }, 3900);
    setTimeout(function () {
      box.querySelector('[data-i="d"]').textContent = "4";
      box.querySelector('[data-i="d"]').classList.add("res");
      box.querySelector('[data-i="a"]').classList.remove("hl");
      if (msg) { msg.textContent = "✅ 14 × 3 = 42"; }
    }, 5600);
  }

  /* ========== S4 练习 ========== */
  var QUIZ = [
    { q: "21 × 4 = ?", right: "84", opts: ["84", "24", "48"] },
    { q: "13 × 3 = ?", right: "39", opts: ["39", "36", "93"] },
    { q: "12 × 4 = ?", right: "48", opts: ["48", "84", "46"] }
  ];
  var quizDone = { q1: false, q2: false, q3: false };
  function startQuiz() {
    quizDone = { q1: false, q2: false, q3: false };
    renderQuiz();
  }
  function renderQuiz() {
    var box = document.getElementById("quiz");
    if (!box) { return; }
    var idx = -1;
    ["q1", "q2", "q3"].forEach(function (k, i) { if (!quizDone[k] && idx === -1) { idx = i; } });
    if (idx === -1) { box.innerHTML = '<div class="q">全部完成！⭐ 你真棒</div>'; return; }
    var q = QUIZ[idx];
    box.innerHTML = '<div class="q">第 ' + (idx + 1) + " 题：" + q.q + "</div>" +
      '<div class="opts">' + q.opts.map(function (o) {
        return '<div class="opt" data-ok="' + (o === q.right ? "1" : "0") + '">' + o + "</div>";
      }).join("") + "</div>" +
      "<div class='qmsg'></div><button class='qnext' disabled>下一题</button>";
    var tried = false;
    var opts = box.querySelectorAll(".opt");
    opts.forEach(function (o) {
      o.addEventListener("click", function () {
        if (tried) { return; }
        var ok = o.getAttribute("data-ok") === "1";
        var msg = box.querySelector(".qmsg");
        if (ok) {
          o.classList.add("right");
          opts.forEach(function (x) { x.classList.add("locked"); });
          apiRef.addStars(1); apiRef.comboHit();
          msg.className = "qmsg ok";
          msg.textContent = "对啦！⭐ +1" + (apiRef.state.combo >= 2 ? "（连击 +" + apiRef.state.combo + "）" : "");
          box.querySelector(".qnext").disabled = false;
        } else {
          o.classList.add("wrong");
          tried = true;
          apiRef.comboReset();
          msg.className = "qmsg no";
          msg.textContent = "从个位乘起，满几十进几，进位要加";
          setTimeout(function () { o.classList.remove("wrong"); tried = false; }, 1600);
        }
      });
    });
    box.querySelector(".qnext").addEventListener("click", function () {
      quizDone["q" + (idx + 1)] = true;
      renderQuiz();
    });
  }

  /* ========== S5 Boss ========== */
  function startBoss() {
    var box = document.getElementById("boss-quiz");
    if (!box) { return; }
    box.innerHTML = '<div class="q">16 × 3 = ?</div>' +
      '<div class="opts">' +
      '<div class="opt" data-ok="1">48</div>' +
      '<div class="opt" data-ok="0">38</div>' +
      '<div class="opt" data-ok="0">84</div>' +
      "</div><div class='qmsg'></div>";
    var rs = document.getElementById("result-stars");
    var tried = false;
    box.querySelectorAll(".opt").forEach(function (o) {
      o.addEventListener("click", function () {
        if (tried) { return; }
        var ok = o.getAttribute("data-ok") === "1";
        var msg = box.querySelector(".qmsg");
        if (ok) {
          o.classList.add("right");
          box.querySelectorAll(".opt").forEach(function (x) { x.classList.add("locked"); });
          apiRef.addStars(2); apiRef.comboHit();
          msg.className = "qmsg ok";
          msg.textContent = "Boss 击败！⭐ +2 笔算乘法你掌握啦！";
          if (rs) {
            var n = apiRef.stars();
            rs.innerHTML = "🏆 共获得 <b>" + n + "</b> 颗星" +
              (n >= 8 ? "（全部拿下！）" : n >= 5 ? "（很不错！）" : "（下次再来！）");
          }
        } else {
          o.classList.add("wrong");
          tried = true;
          apiRef.comboReset();
          msg.className = "qmsg no";
          msg.textContent = "6×3=18 写 8 进 1；1×3+1=4 → 48";
          setTimeout(function () { o.classList.remove("wrong"); tried = false; }, 1800);
        }
      });
    });
  }

  /* ========== 启动 ========== */
  function onEnterStep(step, api) {
    apiRef = api;
    if (step.id === "s2") { runV1(); }
    if (step.id === "s3") { runV2(); }
    if (step.id === "s4") { startQuiz(); }
    if (step.id === "s5") { startBoss(); }
  }

  PlayerCore.init({
    steps: steps,
    parent: {
      summary: "笔算乘法从个位乘起，哪一位满几十就向前一位进几，进位别忘了加。",
      attention: "孩子进位后忘了加、或位置没对齐；竖式要「数位对齐、从个位算起」。",
      tip: "本课约 8 分钟；先做不进位的建立信心，再攻进位的。"
    },
    onEnterStep: onEnterStep,
    settings: { autoStopSteps: [3, 4], pauseMs: 2500 }
  });
})();
</script>
</body>
</html>
