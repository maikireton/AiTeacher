<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>连续进位与 0 的乘法 · AI 教师</title>
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="../assets/course.css">
<style>
  .v-wrap { margin: 12px 0; text-align: center; }
  .vert { display: inline-block; text-align: right; background: var(--card); border: 2px solid var(--border); border-radius: 14px; padding: 18px 24px; font-size: 30px; font-weight: 800; font-family: "SF Mono", Menlo, Consolas, monospace; }
  .v-row { display: flex; justify-content: flex-end; gap: 6px; align-items: center; }
  .v-num { width: 34px; height: 38px; line-height: 38px; text-align: center; border-radius: 6px; transition: all .3s; }
  .v-num.hl { background: #fff3bf; outline: 2px solid #ffa940; }
  .v-num.res { background: #e0f2e9; outline: 2px solid #8bc34a; }
  .v-line { border-top: 3px solid var(--accent-deep); margin: 8px 0; }
  .v-carry { font-size: 15px; color: #e26d6d; font-weight: 800; width: 20px; opacity: 0; transition: opacity .3s; }
  .v-carry.show { opacity: 1; }
  .v-msg { font-size: 16px; font-weight: 700; min-height: 26px; margin-top: 10px; color: var(--accent-deep); }
  .v-rule { display: inline-block; background: #e8f6ff; border: 1px solid #91caff; color: #0b5e91; border-radius: 10px; padding: 6px 14px; font-size: 15px; font-weight: 700; margin-top: 8px; }
  .z-box { margin: 10px 0; }
  .z-row { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; font-size: 26px; font-weight: 800; }
  .z-item { background: var(--card); border: 2px solid var(--border); border-radius: 12px; padding: 10px 16px; opacity: 0; transition: all .4s; }
  .z-item.show { opacity: 1; }
  .z-item.hl { border-color: #d97706; background: #fff7e6; }
</style>
</head>
<body>
<div class="container">
  <header class="topbar">
    <a class="btn-home" href="index.html">← 数学</a>
    <span class="brand">连续进位与 0 的乘法 <small>3年级·上册</small></span>
  </header>

  <div class="player">
    <div class="task-line" id="task-line"></div>
    <div class="stage" id="stage"></div>
    <div class="dots" id="dots"></div>
    <div class="controls">
      <button class="cbtn" id="btn-prev">上一步</button>
      <button class="cbtn" id="btn-auto">▶ 自动播放</button>
      <button class="cbtn" id="btn-voice">🔊 语音</button>
      <button class="cbtn main" id="btn-next">下一步</button>
    </div>
    <div class="score-row" id="score-row"></div>
  </div>

  <details class="parent-panel">
    <summary>家长模式（点击展开）</summary>
    <div class="pbody">
      <p><b>本课一句话总结：</b>连续进位：进位的数要接着加；0 乘任何数都得 0；因数中间/末尾有 0 要处理好占位与补 0。</p>
      <p><b>孩子容易走神的地方：</b>连续进位时漏加、中间 0 漏乘、末尾 0 忘补；这三类都建议竖式逐步练。</p>
      <p><b>建议：</b>本课约 9 分钟；每类问题各练一道，养成"进位先写、算完检查"的习惯。</p>
    </div>
  </details>

  <footer class="foot">
    <div>AI 教师 · 示范课件 math-3-112</div>
  </footer>
</div>

<script src="../assets/voice.js"></script>
<script src="../assets/player-core.js"></script>
<script>
(function () {
  "use strict";
  var apiRef = null;

  /* ========== 五段式步骤 ========== */
  var steps = [
    {
      id: "s1",
      title: "情境引入",
      task: "咱们这一步要做的：看看进位加进位、0 乘数怎么办！",
      voice: "有的乘法，个位进到十位，十位又要进到百位，这叫连续进位。还有 0 乘任何数，会得到几？今天两个大难题一起解决。",
      body: function () {
        return '' +
          '<h2>两个大难题</h2>' +
          '<p class="big">47 × 8 = ?　　<span style="color:#d97706">0 × 5 = ?</span></p>' +
          '<div class="hint">👆 连续进位 + 0 的乘法</div>';
      }
    },
    {
      id: "s2",
      title: "连续进位动画",
      task: "咱们这一步要做的：看动画学会一步一步进位！",
      voice: "看动画。四十七乘八。个位：七乘八等于五十六，写六进五。十位：四乘八等于三十二，加上进位的五，等于三十七，写七进三。百位就是三。结果是三百七十六！",
      body: function () {
        return '' +
          '<h2>看动画：47 × 8（连续进位）</h2>' +
          '<div class="v-wrap" id="v1"></div>' +
          '<div class="v-msg" id="v1-msg">准备开始…</div>' +
          '<div class="v-rule">进位的数要接着加上去</div>';
      }
    },
    {
      id: "s3",
      title: "0 的乘法动画",
      task: "咱们这一步要做的：看动画记住「0 乘任何数都得 0」！",
      voice: "看动画。零乘五等于几？零！五乘零也是零。记住：零和任何数相乘都得零。再看二百零五乘三：二乘三得六，中间的零乘三得零要占位，五乘三得十五。结果是六百一十五。",
      body: function () {
        return '' +
          '<h2>看动画：0 的乘法</h2>' +
          '<div class="z-box" id="z1">' +
          '<div class="z-row">' +
          '<span class="z-item">0 × 5 = 0</span>' +
          '<span class="z-item">5 × 0 = 0</span>' +
          '<span class="z-item">任何数 × 0 = 0</span>' +
          "</div>" +
          "</div>" +
          '<div class="v-msg" id="z1-msg" style="margin-top:10px">准备开始…</div>' +
          '<div class="v-rule">0 和任何数相乘都得 0；中间有 0 要占位</div>';
      }
    },
    {
      id: "s4",
      title: "互动练习",
      task: "咱们这一步要做的：连闯 3 道难题！",
      voice: "现在考考你！连续进位和零的乘法。",
      body: function () {
        return '' +
          '<h2>闯关练习</h2>' +
          '<div class="quiz" id="quiz"></div>';
      }
    },
    {
      id: "s5",
      title: "Boss 关",
      task: "咱们这一步要做的：算末尾带 0 的乘法，领奖！",
      voice: "Boss 来啦！二百五十乘四。先算二十五乘四等于一百，末尾再补一个零，等于一千！",
      body: function () {
        return '' +
          '<h2>Boss 关：250 × 4 = ?</h2>' +
          '<div class="quiz" id="boss-quiz"></div>' +
          '<div class="result-big" id="result-stars"></div>';
      }
    }
  ];

  /* S2: 47×8 连续进位 */
  function runV1() {
    var box = document.getElementById("v1");
    box.innerHTML = '<div class="vert">' +
      '<div class="v-row"><span class="v-carry" data-i="car2">3</span><span class="v-carry" data-i="car1">5</span></div>' +
      '<div class="v-row"><span class="v-num" data-i="a">4</span><span class="v-num" data-i="b">7</span></div>' +
      '<div class="v-row"><span class="v-op">×</span><span class="v-num" data-i="c">8</span></div>' +
      '<div class="v-line"></div>' +
      '<div class="v-row"><span class="v-num" data-i="d">?</span><span class="v-num" data-i="e">?</span><span class="v-num" data-i="f">?</span></div>' +
      "</div>";
    var msg = document.getElementById("v1-msg");
    setTimeout(function () { box.querySelector('[data-i="b"]').classList.add("hl"); if (msg) { msg.textContent = "① 个位：7 × 8 = 56 → 写 6，进 5"; } }, 800);
    setTimeout(function () {
      box.querySelector('[data-i="f"]').textContent = "6"; box.querySelector('[data-i="f"]').classList.add("res");
      box.querySelector('[data-i="car1"]').classList.add("show");
      box.querySelector('[data-i="b"]').classList.remove("hl");
    }, 2600);
    setTimeout(function () { box.querySelector('[data-i="a"]').classList.add("hl"); if (msg) { msg.textContent = "② 十位：4×8=32 + 进位5 = 37 → 写 7，再进 3"; } }, 3900);
    setTimeout(function () {
      box.querySelector('[data-i="e"]').textContent = "7"; box.querySelector('[data-i="e"]').classList.add("res");
      box.querySelector('[data-i="car2"]').classList.add("show");
      box.querySelector('[data-i="a"]').classList.remove("hl");
    }, 5700);
    setTimeout(function () {
      box.querySelector('[data-i="d"]').textContent = "3"; box.querySelector('[data-i="d"]').classList.add("res");
      if (msg) { msg.textContent = "✅ 47 × 8 = 376（连续进位）"; }
    }, 7000);
  }

  /* S3: 0 的乘法 */
  function runZ1() {
    var items = document.querySelectorAll("#z1 .z-item");
    var msg = document.getElementById("z1-msg");
    items.forEach(function (it, i) {
      setTimeout(function () {
        it.classList.add("show");
        if (msg) { msg.textContent = "记住：0 和任何数相乘都得 0（" + (i + 1) + "/3）"; }
      }, 600 + i * 900);
    });
    setTimeout(function () { if (msg) { msg.textContent = "✅ 再算 205×3：2×3=6，0×3=0 占位，5×3=15 → 615"; } }, 3600);
  }

  /* ========== S4 练习 ========== */
  var QUIZ = [
    { q: "0 × 7 = ?", right: "0", opts: ["0", "7", "70"] },
    { q: "36 × 5 = ?", right: "180", opts: ["180", "150", "185"] },
    { q: "206 × 3 = ?", right: "618", opts: ["618", "68", "608"] }
  ];
  var quizDone = { q1: false, q2: false, q3: false };
  function startQuiz() {
    quizDone = { q1: false, q2: false, q3: false };
    renderQuiz();
  }
  function renderQuiz() {
    var box = document.getElementById("quiz");
    if (!box) { return; }
    var idx = -1;
    ["q1", "q2", "q3"].forEach(function (k, i) { if (!quizDone[k] && idx === -1) { idx = i; } });
    if (idx === -1) { box.innerHTML = '<div class="q">全部完成！⭐ 你真棒</div>'; return; }
    var q = QUIZ[idx];
    box.innerHTML = '<div class="q">第 ' + (idx + 1) + " 题：" + q.q + "</div>" +
      '<div class="opts">' + q.opts.map(function (o) {
        return '<div class="opt" data-ok="' + (o === q.right ? "1" : "0") + '">' + o + "</div>";
      }).join("") + "</div>" +
      "<div class='qmsg'></div><button class='qnext' disabled>下一题</button>";
    var tried = false;
    var opts = box.querySelectorAll(".opt");
    opts.forEach(function (o) {
      o.addEventListener("click", function () {
        if (tried) { return; }
        var ok = o.getAttribute("data-ok") === "1";
        var msg = box.querySelector(".qmsg");
        if (ok) {
          o.classList.add("right");
          opts.forEach(function (x) { x.classList.add("locked"); });
          apiRef.addStars(1); apiRef.comboHit();
          msg.className = "qmsg ok";
          msg.textContent = "对啦！⭐ +1" + (apiRef.state.combo >= 2 ? "（连击 +" + apiRef.state.combo + "）" : "");
          box.querySelector(".qnext").disabled = false;
        } else {
          o.classList.add("wrong");
          tried = true;
          apiRef.comboReset();
          msg.className = "qmsg no";
          msg.textContent = "0 乘任何数得 0；进位要加；中间 0 要占位";
          setTimeout(function () { o.classList.remove("wrong"); tried = false; }, 1700);
        }
      });
    });
    box.querySelector(".qnext").addEventListener("click", function () {
      quizDone["q" + (idx + 1)] = true;
      renderQuiz();
    });
  }

  /* ========== S5 Boss ========== */
  function startBoss() {
    var box = document.getElementById("boss-quiz");
    if (!box) { return; }
    box.innerHTML = '<div class="q">250 × 4 = ?</div>' +
      '<div class="opts">' +
      '<div class="opt" data-ok="1">1000</div>' +
      '<div class="opt" data-ok="0">100</div>' +
      '<div class="opt" data-ok="0">900</div>' +
      "</div><div class='qmsg'></div>";
    var rs = document.getElementById("result-stars");
    var tried = false;
    box.querySelectorAll(".opt").forEach(function (o) {
      o.addEventListener("click", function () {
        if (tried) { return; }
        var ok = o.getAttribute("data-ok") === "1";
        var msg = box.querySelector(".qmsg");
        if (ok) {
          o.classList.add("right");
          box.querySelectorAll(".opt").forEach(function (x) { x.classList.add("locked"); });
          apiRef.addStars(2); apiRef.comboHit();
          msg.className = "qmsg ok";
          msg.textContent = "Boss 击败！⭐ +2 0 的乘法你掌握啦！";
          if (rs) {
            var n = apiRef.stars();
            rs.innerHTML = "🏆 共获得 <b>" + n + "</b> 颗星" +
              (n >= 8 ? "（全部拿下！）" : n >= 5 ? "（很不错！）" : "（下次再来！）");
          }
        } else {
          o.classList.add("wrong");
          tried = true;
          apiRef.comboReset();
          msg.className = "qmsg no";
          msg.textContent = "25×4=100，末尾补 1 个 0 → 1000";
          setTimeout(function () { o.classList.remove("wrong"); tried = false; }, 1700);
        }
      });
    });
  }

  /* ========== 启动 ========== */
  function onEnterStep(step, api) {
    apiRef = api;
    if (step.id === "s2") { runV1(); }
    if (step.id === "s3") { runZ1(); }
    if (step.id === "s4") { startQuiz(); }
    if (step.id === "s5") { startBoss(); }
  }

  PlayerCore.init({
    steps: steps,
    parent: {
      summary: "连续进位：进位的数要接着加；0 乘任何数都得 0；因数中间/末尾有 0 要处理好占位与补 0。",
      attention: "孩子连续进位时漏加、中间 0 漏乘、末尾 0 忘补；这三类都建议竖式逐步练。",
      tip: "本课约 9 分钟；每类问题各练一道，养成「进位先写、算完检查」的习惯。"
    },
    onEnterStep: onEnterStep,
    settings: { autoStopSteps: [3, 4], pauseMs: 2500 }
  });
})();
</script>
</body>
</html>
