<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小数的加法和减法 · AI 教师</title>
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="../assets/course.css">
<style>
  .ja-box { margin: 12px 0; }
  .ja-tip { font-size: 15px; font-weight: 700; min-height: 26px; margin: 8px 0; color: var(--accent-deep); }
  .ja-rule { display: inline-block; background: #e8f6ff; border: 1px solid #91caff; color: #0b5e91; border-radius: 10px; padding: 6px 14px; font-size: 15px; font-weight: 700; margin-top: 8px; }
  .ldiv-wrap { display: flex; justify-content: center; }
  .ldiv { font-family: "SFMono-Regular", Consolas, monospace; font-size: 22px; line-height: 1.75; background: #fff; border: 2px solid var(--border); border-radius: 12px; padding: 16px 26px; margin: 0; }
  .ja-step { font-size: 22px; font-weight: 800; text-align: center; min-height: 34px; color: #2e7d32; }
  .ja-expr { font-size: 28px; font-weight: 800; color: #d97706; text-align: center; margin: 8px 0; }
</style>
</head>
<body>
<div class="container">
  <header class="topbar">
    <a class="btn-home" href="index.html">← 数学</a>
    <span class="brand">小数的加法和减法 <small>4年级·下册</small></span>
  </header>

  <div class="player">
    <div class="task-line" id="task-line"></div>
    <div class="stage" id="stage"></div>
    <div class="dots" id="dots"></div>
    <div class="controls">
      <button class="cbtn" id="btn-prev">上一步</button>
      <button class="cbtn" id="btn-auto">▶ 自动播放</button>
      <button class="cbtn" id="btn-voice">🔊 语音</button>
      <button class="cbtn main" id="btn-next">下一步</button>
    </div>
    <div class="score-row" id="score-row"></div>
  </div>

  <details class="parent-panel">
    <summary>家长模式（点击展开）</summary>
    <div class="pbody">
      <p><b>本课一句话总结：</b>小数加减法：先把小数点对齐（数位对齐），再按整数加减法算，结果里点上小数点。</p>
      <p><b>孩子容易走神的地方：</b>把小数点对齐当成末位对齐（5.3+2.45 错位）；强调"小数点对齐，数位就对齐了"。</p>
      <p><b>建议：</b>本课约 8 分钟；列竖式前先大声说"小数点对齐！"。</p>
    </div>
  </details>

  <footer class="foot">
    <div>AI 教师 · 示范课件 math-4-044</div>
  </footer>
</div>

<script src="../assets/voice.js"></script>
<script src="../assets/player-core.js"></script>
<script src="../assets/record.js"></script>
<script>
(function () {
  "use strict";
  var apiRef = null;

  /* ========== 五段式步骤 ========== */
  var steps = [
    {
      id: "s1",
      title: "情境引入",
      task: "咱们这一步要做的：想想 2.5+1.3 怎么列竖式！",
      voice: "买苹果花了 2.5 元，买香蕉花了 1.3 元，一共多少钱？列竖式要先让小数点对齐。今天学小数加减法。",
      body: function () {
        return '' +
          '<h2>付钱算账</h2>' +
          '<p class="ja-expr">2.5 + 1.3 = ?</p>' +
          '<div class="hint">👆 小数点对齐，数位就对齐</div>';
      }
    },
    {
      id: "s2",
      title: "小数加法竖式动画",
      task: "咱们这一步要做的：看动画 2.5+1.3 竖式！",
      voice: "看动画。2.5 加 1.3 列竖式。小数点要对齐！十分位 5 加 3 等于 8，个位 2 加 1 等于 3，结果是 3.8。",
      body: function () {
        return '' +
          '<h2>看动画：2.5 + 1.3 = 3.8</h2>' +
          '<div class="ja-box" id="d1">' +
          '<div class="ldiv-wrap"><pre class="ldiv" id="ldiv1"></pre></div>' +
          "</div>" +
          '<div class="ja-tip" id="d1-tip">准备开始…</div>' +
          '<div class="ja-rule">小数点对齐 → 按整数算 → 结果点小数点</div>';
      }
    },
    {
      id: "s3",
      title: "小数减法竖式动画",
      task: "咱们这一步要做的：看动画 3.2−1.4 要借位！",
      voice: "看动画。3.2 减 1.4 列竖式，小数点对齐。十分位 2 减 4 不够，从个位借 1，变成 12 减 4 等于 8。个位 3 借走 1 剩 2，2 减 1 等于 1。结果是 1.8。",
      body: function () {
        return '' +
          '<h2>看动画：3.2 − 1.4 = 1.8（借位）</h2>' +
          '<div class="ja-box" id="d2">' +
          '<div class="ldiv-wrap"><pre class="ldiv" id="ldiv2"></pre></div>' +
          "</div>" +
          '<div class="ja-tip" id="d2-tip">准备开始…</div>' +
          '<div class="ja-rule">不够减要借位，和整数减法一样</div>';
      }
    },
    {
      id: "s4",
      title: "互动练习",
      task: "咱们这一步要做的：连闯 3 道小数加减题！",
      voice: "现在考考你！小数加减法。",
      body: function () {
        return '' +
          '<h2>闯关练习</h2>' +
          '<div class="quiz" id="quiz"></div>';
      }
    },
    {
      id: "s5",
      title: "Boss 关",
      task: "咱们这一步要做的：算 4.5+2.65，领奖！",
      voice: "Boss 来啦！4.5 加 2.65。小数点对齐，4.5 后面补一个 0 变成 4.50。50 加 65 等于 115，进 1。结果是 7.15！",
      body: function () {
        return '' +
          '<h2>Boss 关：4.5 + 2.65 = ?</h2>' +
          '<div class="quiz" id="boss-quiz"></div>' +
          '<div class="result-big" id="result-stars"></div>';
      }
    }
  ];

  function runLines(id, lines, tips, tipsDone) {
    var ldiv = document.getElementById(id);
    var tip = document.getElementById(id === "ldiv1" ? "d1-tip" : "d2-tip");
    ldiv.textContent = "";
    lines.forEach(function (line, i) {
      setTimeout(function () {
        ldiv.textContent = (ldiv.textContent ? ldiv.textContent + "\n" : "") + line;
        if (tip) { tip.textContent = tips[Math.min(i, tips.length - 1)]; }
      }, 1100 * (i + 1));
    });
  }
  function runD1() {
    runLines("ldiv1", [
      "    2 . 5",
      "  + 1 . 3",
      "  --------",
      "    3 . 8"
    ], ["① 小数点对齐（红点）", "② 十分位 5+3=8", "③ 个位 2+1=3", "✅ 2.5 + 1.3 = 3.8"]);
  }
  function runD2() {
    runLines("ldiv2", [
      "    3 . 2",
      "  - 1 . 4",
      "  --------",
      "    1 . 8"
    ], ["① 小数点对齐", "② 十分位 2−4 不够 → 借位：12−4=8", "③ 个位 3−1（借走1）=2−1=1", "✅ 3.2 − 1.4 = 1.8"]);
  }

  /* ========== S4 练习 ========== */
  var QUIZ = [
    { q: "1.2 + 2.3 = ?", right: "3.5", opts: ["3.5", "3.05", "35"] },
    { q: "5.6 − 2.2 = ?", right: "3.4", opts: ["3.4", "3.8", "7.8"] },
    { q: "3.1 − 1.6 = ?（要借位）", right: "1.5", opts: ["1.5", "2.5", "2.1"] }
  ];
  var quizDone = { q1: false, q2: false, q3: false };
  function startQuiz() {
    quizDone = { q1: false, q2: false, q3: false };
    renderQuiz();
  }
  function renderQuiz() {
    var box = document.getElementById("quiz");
    if (!box) { return; }
    var idx = -1;
    ["q1", "q2", "q3"].forEach(function (k, i) { if (!quizDone[k] && idx === -1) { idx = i; } });
    if (idx === -1) { box.innerHTML = '<div class="q">全部完成！⭐ 你真棒</div>'; return; }
    var q = QUIZ[idx];
    box.innerHTML = '<div class="q">第 ' + (idx + 1) + " 题：" + q.q + "</div>" +
      '<div class="opts">' + q.opts.map(function (o) {
        return '<div class="opt" data-ok="' + (o === q.right ? "1" : "0") + '">' + o + "</div>";
      }).join("") + "</div>" +
      "<div class='qmsg'></div><button class='qnext' disabled>下一题</button>";
    var tried = false;
    var opts = box.querySelectorAll(".opt");
    opts.forEach(function (o) {
      o.addEventListener("click", function () {
        if (tried) { return; }
        var ok = o.getAttribute("data-ok") === "1";
        var msg = box.querySelector(".qmsg");
        if (ok) {
          o.classList.add("right");
          opts.forEach(function (x) { x.classList.add("locked"); });
          apiRef.addStars(1); apiRef.comboHit();
          msg.className = "qmsg ok";
          msg.textContent = "对啦！⭐ +1" + (apiRef.state.combo >= 2 ? "（连击 +" + apiRef.state.combo + "）" : "");
          box.querySelector(".qnext").disabled = false;
        } else {
          o.classList.add("wrong");
          tried = true;
          apiRef.comboReset();
          msg.className = "qmsg no";
          msg.textContent = "小数点对齐，按整数算，不够减要借位";
          setTimeout(function () { o.classList.remove("wrong"); tried = false; }, 1800);
        }
      });
    });
    box.querySelector(".qnext").addEventListener("click", function () {
      quizDone["q" + (idx + 1)] = true;
      renderQuiz();
    });
  }

  /* ========== S5 Boss ========== */
  function startBoss() {
    var box = document.getElementById("boss-quiz");
    if (!box) { return; }
    box.innerHTML = '<div class="q">4.5 + 2.65 = ?</div>' +
      '<div class="opts">' +
      '<div class="opt" data-ok="1">7.15</div>' +
      '<div class="opt" data-ok="0">7.10</div>' +
      '<div class="opt" data-ok="0">6.15</div>' +
      "</div><div class='qmsg'></div>";
    var rs = document.getElementById("result-stars");
    var tried = false;
    box.querySelectorAll(".opt").forEach(function (o) {
      o.addEventListener("click", function () {
        if (tried) { return; }
        var ok = o.getAttribute("data-ok") === "1";
        var msg = box.querySelector(".qmsg");
        if (ok) {
          o.classList.add("right");
          box.querySelectorAll(".opt").forEach(function (x) { x.classList.add("locked"); });
          apiRef.addStars(2); apiRef.comboHit();
          msg.className = "qmsg ok";
          msg.textContent = "Boss 击败！⭐ +2 小数加减你掌握啦！";
          if (rs) {
            var n = apiRef.stars();
            rs.innerHTML = "🏆 共获得 <b>" + n + "</b> 颗星" +
              (n >= 8 ? "（全部拿下！）" : n >= 5 ? "（很不错！）" : "（下次再来！）");
          }
        } else {
          o.classList.add("wrong");
          tried = true;
          apiRef.comboReset();
          msg.className = "qmsg no";
          msg.textContent = "4.50 + 2.65：0.50+0.65=1.15 进 1 → 7.15";
          setTimeout(function () { o.classList.remove("wrong"); tried = false; }, 1900);
        }
      });
    });
  }

  /* ========== 启动 ========== */
  function onEnterStep(step, api) {
    apiRef = api;
    if (step.id === "s2") { runD1(); }
    if (step.id === "s3") { runD2(); }
    if (step.id === "s4") { startQuiz(); }
    if (step.id === "s5") { startBoss(); }
  }

  PlayerCore.init({
    steps: steps,
    parent: {
      summary: "小数加减法：先把小数点对齐（数位对齐），再按整数加减法算，结果里点上小数点。",
      attention: "孩子容易把小数点对齐当成末位对齐（5.3+2.45 错位）；强调「小数点对齐，数位就对齐了」。",
      tip: "本课约 8 分钟；列竖式前先大声说「小数点对齐！」。"
    },
    onEnterStep: onEnterStep,
    settings: { autoStopSteps: [3, 4], pauseMs: 2500 }
  });
})();
</script>
</body>
</html>
