<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小数的初步认识 · AI 教师</title>
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="../assets/course.css">
<style>
  .dm-box { margin: 12px 0; }
  .dm-tip { font-size: 15px; font-weight: 700; min-height: 26px; margin: 8px 0; color: var(--accent-deep); }
  .dm-rule { display: inline-block; background: #e8f6ff; border: 1px solid #91caff; color: #0b5e91; border-radius: 10px; padding: 6px 14px; font-size: 15px; font-weight: 700; margin-top: 8px; }
  .strip { display: flex; width: 220px; height: 26px; border: 2px solid var(--border); border-radius: 6px; overflow: hidden; margin: 4px auto; }
  .strip .c { flex: 1; background: #eef2f7; border-right: 1px solid #fff; transition: background .3s; }
  .strip .c:last-child { border-right: none; }
  .strip .c.fill { background: linear-gradient(180deg,#7eb6ff,#4a7fe0); }
  .strip .c.hot { background: linear-gradient(180deg,#ffd591,#ffa940); }
  .strip-row { display: flex; justify-content: center; align-items: center; gap: 14px; margin: 6px 0; flex-wrap: wrap; }
  .strip-col { text-align: center; min-width: 120px; }
  .strip-lab { font-size: 18px; font-weight: 800; color: #d97706; }
  .cmp-sym { font-size: 34px; font-weight: 800; color: var(--accent-deep); }
</style>
</head>
<body>
<div class="container">
  <header class="topbar">
    <a class="btn-home" href="index.html">← 数学</a>
    <span class="brand">小数的初步认识 <small>3年级·下册</small></span>
  </header>

  <div class="player">
    <div class="task-line" id="task-line"></div>
    <div class="stage" id="stage"></div>
    <div class="dots" id="dots"></div>
    <div class="controls">
      <button class="cbtn" id="btn-prev">上一步</button>
      <button class="cbtn" id="btn-auto">▶ 自动播放</button>
      <button class="cbtn" id="btn-voice">🔊 语音</button>
      <button class="cbtn main" id="btn-next">下一步</button>
    </div>
    <div class="score-row" id="score-row"></div>
  </div>

  <details class="parent-panel">
    <summary>家长模式（点击展开）</summary>
    <div class="pbody">
      <p><b>本课一句话总结：</b>把 1 平均分成 10 份，1 份是 1/10 = 0.1；小数比较大小：先比整数部分，再比十分位；0.5 就是 5 个 0.1。</p>
      <p><b>孩子容易走神的地方：</b>小数的读法（0.3 读"零点三"不是"零三"）和 0.1/0.01 混淆；用"10 格条"形象理解十分位。</p>
      <p><b>建议：</b>本课约 8 分钟；用刻度尺/10 格条找 0.1~0.9，再玩比大小。</p>
    </div>
  </details>

  <footer class="foot">
    <div>AI 教师 · 示范课件 math-3-006</div>
  </footer>
</div>

<script src="../assets/voice.js"></script>
<script src="../assets/player-core.js"></script>
<script>
(function () {
  "use strict";
  var apiRef = null;

  function strip(fills, hot) {
    var h = "";
    for (var i = 0; i < 10; i++) {
      var cls = fills.indexOf(i) >= 0 ? "fill" : "";
      if (hot && fills.indexOf(i) >= 0) { cls = "hot"; }
      h += '<span class="c ' + cls + '"></span>';
    }
    return '<div class="strip">' + h + "</div>";
  }

  /* ========== 五段式步骤 ========== */
  var steps = [
    {
      id: "s1",
      title: "情境引入",
      task: "咱们这一步要做的：想想身高 1.3 米怎么读！",
      voice: "你的身高 1.3 米，这个 1.3 就是小数，读作一点三。今天认识小数！",
      body: function () {
        return '' +
          '<h2>小数在哪里</h2>' +
          '<p>📏 身高 <b>1.3 米</b>、体温 <b>36.5℃</b>、价格 <b>0.5 元</b> —— 都是小数。</p>' +
          '<div class="hint">👆 小数点把整数部分和小数部分分开</div>';
      }
    },
    {
      id: "s2",
      title: "十分之几变小数动画",
      task: "咱们这一步要做的：看动画发现 3/10 = 0.3！",
      voice: "看动画。一条彩带平均分成 10 份，每一份是十分之一，写成小数是零点一。取 3 份就是十分之三，写成小数是零点三。",
      body: function () {
        return '' +
          '<h2>看动画：3/10 = 0.3</h2>' +
          '<div class="dm-box" id="d1">' +
          '<div class="strip-row">' +
          '<div class="strip-col"><div id="s1-strip"></div><div class="strip-lab" id="s1-lab">? /10</div></div>' +
          "</div>" +
          "</div>" +
          '<div class="dm-tip" id="d1-tip">准备开始…</div>' +
          '<div class="dm-rule">1/10 = 0.1；取几份就是 0.几</div>';
      }
    },
    {
      id: "s3",
      title: "小数比大小动画",
      task: "咱们这一步要做的：看动画学会比小数大小！",
      voice: "看动画。0.5 是 5 格，0.3 是 3 格，格子多的更大，所以 0.5 大于 0.3。再比 0.8 和 0.6，0.8 有 8 格，更大！",
      body: function () {
        return '' +
          '<h2>看动画：小数比大小</h2>' +
          '<div class="dm-box" id="d2">' +
          '<div class="strip-row">' +
          '<div class="strip-col"><div id="s2a"></div><div class="strip-lab">0.5</div></div>' +
          '<span class="cmp-sym" id="sym1">?</span>' +
          '<div class="strip-col"><div id="s2b"></div><div class="strip-lab">0.3</div></div>' +
          "</div>" +
          '<div class="strip-row">' +
          '<div class="strip-col"><div id="s3a"></div><div class="strip-lab">0.8</div></div>' +
          '<span class="cmp-sym" id="sym2">?</span>' +
          '<div class="strip-col"><div id="s3b"></div><div class="strip-lab">0.6</div></div>' +
          "</div>" +
          "</div>" +
          '<div class="dm-tip" id="d2-tip">准备开始…</div>' +
          '<div class="dm-rule">先比整数部分，再比十分位（格子多的大）</div>';
      }
    },
    {
      id: "s4",
      title: "互动练习",
      task: "咱们这一步要做的：连闯 3 道小数题！",
      voice: "现在考考你！小数。",
      body: function () {
        return '' +
          '<h2>闯关练习</h2>' +
          '<div class="quiz" id="quiz"></div>';
      }
    },
    {
      id: "s5",
      title: "Boss 关",
      task: "咱们这一步要做的：算 0.4 + 0.3，领奖！",
      voice: "Boss 来啦！0.4 加 0.3。4 个 0.1 加 3 个 0.1 等于 7 个 0.1，就是 0.7！",
      body: function () {
        return '' +
          '<h2>Boss 关：0.4 + 0.3 = ?</h2>' +
          '<div class="quiz" id="boss-quiz"></div>' +
          '<div class="result-big" id="result-stars"></div>';
      }
    }
  ];

  function runD1() {
    var tip = document.getElementById("d1-tip");
    var lab = document.getElementById("s1-lab");
    setTimeout(function () { document.getElementById("s1-strip").innerHTML = strip([0]); if (tip) { tip.textContent = "① 分成 10 份，取 1 份 = 1/10 = 0.1"; } }, 700);
    setTimeout(function () {
      document.getElementById("s1-strip").innerHTML = strip([0, 1, 2]);
      lab.textContent = "3/10 = 0.3";
      if (tip) { tip.textContent = "② 取 3 份 = 3/10 = 0.3 ✅"; }
    }, 2600);
    setTimeout(function () {
      document.getElementById("s1-strip").innerHTML = strip([0, 1, 2, 3, 4, 5, 6, 7]);
      lab.textContent = "7/10 = 0.7";
      if (tip) { tip.textContent = "③ 取 7 份 = 0.7 → 十分之几就是 0.几"; }
    }, 4400);
  }
  function runD2() {
    var tip = document.getElementById("d2-tip");
    setTimeout(function () {
      document.getElementById("s2a").innerHTML = strip([0, 1, 2, 3, 4]);
      document.getElementById("s2b").innerHTML = strip([0, 1, 2]);
      document.getElementById("sym1").textContent = ">";
      if (tip) { tip.textContent = "① 0.5 有 5 格，0.3 有 3 格 → 0.5 > 0.3"; }
    }, 700);
    setTimeout(function () {
      document.getElementById("s3a").innerHTML = strip([0, 1, 2, 3, 4, 5, 6, 7]);
      document.getElementById("s3b").innerHTML = strip([0, 1, 2, 3, 4, 5]);
      document.getElementById("sym2").textContent = ">";
      if (tip) { tip.textContent = "② 0.8 有 8 格，0.6 有 6 格 → 0.8 > 0.6"; }
    }, 2800);
    setTimeout(function () { if (tip) { tip.textContent = "✅ 十分位格子多的小数更大"; } }, 4600);
  }

  /* ========== S4 练习 ========== */
  var QUIZ = [
    { q: "十分之三用小数表示？", right: "0.3", opts: ["0.3", "3.0", "0.03"] },
    { q: "0.7 是几个 0.1？", right: "7 个", opts: ["7 个", "0.7 个", "70 个"] },
    { q: "0.5 和 0.8 谁大？", right: "0.8", opts: ["0.8", "0.5", "一样大"] }
  ];
  var quizDone = { q1: false, q2: false, q3: false };
  function startQuiz() {
    quizDone = { q1: false, q2: false, q3: false };
    renderQuiz();
  }
  function renderQuiz() {
    var box = document.getElementById("quiz");
    if (!box) { return; }
    var idx = -1;
    ["q1", "q2", "q3"].forEach(function (k, i) { if (!quizDone[k] && idx === -1) { idx = i; } });
    if (idx === -1) { box.innerHTML = '<div class="q">全部完成！⭐ 你真棒</div>'; return; }
    var q = QUIZ[idx];
    box.innerHTML = '<div class="q">第 ' + (idx + 1) + " 题：" + q.q + "</div>" +
      '<div class="opts">' + q.opts.map(function (o) {
        return '<div class="opt" data-ok="' + (o === q.right ? "1" : "0") + '">' + o + "</div>";
      }).join("") + "</div>" +
      "<div class='qmsg'></div><button class='qnext' disabled>下一题</button>";
    var tried = false;
    var opts = box.querySelectorAll(".opt");
    opts.forEach(function (o) {
      o.addEventListener("click", function () {
        if (tried) { return; }
        var ok = o.getAttribute("data-ok") === "1";
        var msg = box.querySelector(".qmsg");
        if (ok) {
          o.classList.add("right");
          opts.forEach(function (x) { x.classList.add("locked"); });
          apiRef.addStars(1); apiRef.comboHit();
          msg.className = "qmsg ok";
          msg.textContent = "对啦！⭐ +1" + (apiRef.state.combo >= 2 ? "（连击 +" + apiRef.state.combo + "）" : "");
          box.querySelector(".qnext").disabled = false;
        } else {
          o.classList.add("wrong");
          tried = true;
          apiRef.comboReset();
          msg.className = "qmsg no";
          msg.textContent = "十分之几 = 0.几；比小数先比整数部分再比十分位";
          setTimeout(function () { o.classList.remove("wrong"); tried = false; }, 1700);
        }
      });
    });
    box.querySelector(".qnext").addEventListener("click", function () {
      quizDone["q" + (idx + 1)] = true;
      renderQuiz();
    });
  }

  /* ========== S5 Boss ========== */
  function startBoss() {
    var box = document.getElementById("boss-quiz");
    if (!box) { return; }
    box.innerHTML = '<div class="q">0.4 + 0.3 = ?</div>' +
      '<div class="opts">' +
      '<div class="opt" data-ok="1">0.7</div>' +
      '<div class="opt" data-ok="0">0.1</div>' +
      '<div class="opt" data-ok="0">7.0</div>' +
      "</div><div class='qmsg'></div>";
    var rs = document.getElementById("result-stars");
    var tried = false;
    box.querySelectorAll(".opt").forEach(function (o) {
      o.addEventListener("click", function () {
        if (tried) { return; }
        var ok = o.getAttribute("data-ok") === "1";
        var msg = box.querySelector(".qmsg");
        if (ok) {
          o.classList.add("right");
          box.querySelectorAll(".opt").forEach(function (x) { x.classList.add("locked"); });
          apiRef.addStars(2); apiRef.comboHit();
          msg.className = "qmsg ok";
          msg.textContent = "Boss 击败！⭐ +2 小数你掌握啦！";
          if (rs) {
            var n = apiRef.stars();
            rs.innerHTML = "🏆 共获得 <b>" + n + "</b> 颗星" +
              (n >= 8 ? "（全部拿下！）" : n >= 5 ? "（很不错！）" : "（下次再来！）");
          }
        } else {
          o.classList.add("wrong");
          tried = true;
          apiRef.comboReset();
          msg.className = "qmsg no";
          msg.textContent = "4 个 0.1 + 3 个 0.1 = 7 个 0.1 = 0.7";
          setTimeout(function () { o.classList.remove("wrong"); tried = false; }, 1600);
        }
      });
    });
  }

  /* ========== 启动 ========== */
  function onEnterStep(step, api) {
    apiRef = api;
    if (step.id === "s2") { runD1(); }
    if (step.id === "s3") { runD2(); }
    if (step.id === "s4") { startQuiz(); }
    if (step.id === "s5") { startBoss(); }
  }

  PlayerCore.init({
    steps: steps,
    parent: {
      summary: "把 1 平均分成 10 份，1 份是 1/10 = 0.1；小数比较大小：先比整数部分，再比十分位；0.5 就是 5 个 0.1。",
      attention: "孩子容易把 0.3 读错（应为「零点三」）并把 0.1/0.01 混淆；用「10 格条」形象理解十分位。",
      tip: "本课约 8 分钟；用刻度尺/10 格条找 0.1~0.9，再玩比大小。"
    },
    onEnterStep: onEnterStep,
    settings: { autoStopSteps: [3, 4], pauseMs: 2500 }
  });
})();
</script>
</body>
</html>
