<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>认识几分之一 · AI 教师</title>
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="../assets/course.css">
<style>
  .fc-box { margin: 12px 0; }
  .pizza-wrap { display: flex; justify-content: center; gap: 24px; align-items: center; flex-wrap: wrap; }
  .pizza { text-align: center; }
  .pizza svg { width: 150px; height: 150px; }
  .fc-label { font-size: 22px; font-weight: 800; min-height: 30px; }
  .fc-tip { font-size: 15px; font-weight: 700; min-height: 26px; margin: 8px 0; color: var(--accent-deep); }
  .fc-rule { display: inline-block; background: #e8f6ff; border: 1px solid #91caff; color: #0b5e91; border-radius: 10px; padding: 6px 14px; font-size: 15px; font-weight: 700; margin-top: 8px; }
  .frac { font-size: 30px; font-weight: 800; color: #d97706; }
</style>
</head>
<body>
<div class="container">
  <header class="topbar">
    <a class="btn-home" href="index.html">← 数学</a>
    <span class="brand">认识几分之一 <small>3年级·上册</small></span>
  </header>

  <div class="player">
    <div class="task-line" id="task-line"></div>
    <div class="stage" id="stage"></div>
    <div class="dots" id="dots"></div>
    <div class="controls">
      <button class="cbtn" id="btn-prev">上一步</button>
      <button class="cbtn" id="btn-auto">▶ 自动播放</button>
      <button class="cbtn" id="btn-voice">🔊 语音</button>
      <button class="cbtn main" id="btn-next">下一步</button>
    </div>
    <div class="score-row" id="score-row"></div>
  </div>

  <details class="parent-panel">
    <summary>家长模式（点击展开）</summary>
    <div class="pbody">
      <p><b>本课一句话总结：</b>把整体平均分成几份，每份就是它的几分之一（如平均分成 2 份，每份是 1/2）。关键是"平均分"。</p>
      <p><b>孩子容易走神的地方：</b>不平均分也说是几分之一；可强调"必须每份一样大"。</p>
      <p><b>建议：</b>本课约 8 分钟；切一个蛋糕/披萨，边切边问"现在是几分之一"。</p>
    </div>
  </details>

  <footer class="foot">
    <div>AI 教师 · 示范课件 math-3-116</div>
  </footer>
</div>

<script src="../assets/voice.js"></script>
<script src="../assets/player-core.js"></script>
<script>
(function () {
  "use strict";
  var apiRef = null;
  var NS = "http://www.w3.org/2000/svg";
  function svgEl(tag, attrs) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) { e.setAttribute(k, attrs[k]); }
    return e;
  }
  function slicePath(cx, cy, r, startDeg, endDeg) {
    var a1 = startDeg * Math.PI / 180, a2 = endDeg * Math.PI / 180;
    var x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
    var x2 = cx + r * Math.cos(a2), y2 = cy + r * Math.sin(a2);
    var large = (endDeg - startDeg) > 180 ? 1 : 0;
    return "M" + cx + " " + cy + " L" + x1.toFixed(1) + " " + y1.toFixed(1) + " A" + r + " " + r + " 0 " + large + " 1 " + x2.toFixed(1) + " " + y2.toFixed(1) + " Z";
  }
  function pizza(n, hlIdx) {
    var svg = svgEl("svg", { viewBox: "0 0 120 120", width: "120", height: "120" });
    for (var i = 0; i < n; i++) {
      var a1 = -90 + i * (360 / n), a2 = -90 + (i + 1) * (360 / n);
      var fill = i === hlIdx ? "#ffd591" : "#ffe9c2";
      var p = svgEl("path", { d: slicePath(60, 60, 52, a1, a2), fill: fill, stroke: "#e8890c", "stroke-width": 2 });
      svg.appendChild(p);
    }
    return svg;
  }

  /* ========== 五段式步骤 ========== */
  var steps = [
    {
      id: "s1",
      title: "情境引入",
      task: "咱们这一步要做的：看看披萨分给两个人！",
      voice: "一个披萨，要分给两个人，怎么分才公平？平均分成两块，一人一块，每块是二分之一！今天认识分数。",
      body: function () {
        return '' +
          '<h2>分披萨</h2>' +
          '<p>🍕 一个披萨平均分给 2 个人 → 每人 <span class="frac">1/2</span></p>' +
          '<div class="hint">👆 必须平均分！每份一样大</div>';
      }
    },
    {
      id: "s2",
      title: "认识 1/2",
      task: "咱们这一步要做的：看动画把披萨平均切成 2 份！",
      voice: "看动画。一个圆圆的披萨。把它平均切成两块，一刀下去，分成两份。每一份都是整个披萨的二分之一，写作一分之二，读作二分之一。",
      body: function () {
        return '' +
          '<h2>看动画：平均分成 2 份 = 1/2</h2>' +
          '<div class="fc-box" id="f1">' +
          '<div class="pizza-wrap">' +
          '<div class="pizza" id="pz1"></div>' +
          "</div>" +
          '<div class="fc-label" id="f1-label">🍕 一整个披萨</div>' +
          "</div>" +
          '<div class="fc-tip" id="f1-tip">准备开始…</div>' +
          '<div class="fc-rule">平均分成 2 份，每份是它的 1/2</div>';
      }
    },
    {
      id: "s3",
      title: "认识 1/4 和 1/3",
      task: "咱们这一步要做的：看动画发现分得越多每份越小！",
      voice: "看动画。披萨平均切成四份，每份是四分之一。再切一个，平均分成三份，每份是三分之一。你发现了吗？同样大的披萨，分得越多，每份就越小。",
      body: function () {
        return '' +
          '<h2>看动画：1/4 和 1/3</h2>' +
          '<div class="fc-box" id="f2">' +
          '<div class="pizza-wrap">' +
          '<div class="pizza" id="pz2"><div class="fc-label">1/4</div></div>' +
          '<div class="pizza" id="pz3"><div class="fc-label">1/3</div></div>' +
          "</div>" +
          "</div>" +
          '<div class="fc-tip" id="f2-tip">准备开始…</div>' +
          '<div class="fc-rule">平均分得越多，每份越小（1/4 比 1/3 小）</div>';
      }
    },
    {
      id: "s4",
      title: "互动练习",
      task: "咱们这一步要做的：连闯 3 道几分之一题！",
      voice: "现在考考你！平均分成几份，每份是几分之一。",
      body: function () {
        return '' +
          '<h2>闯关练习</h2>' +
          '<div class="quiz" id="quiz"></div>';
      }
    },
    {
      id: "s5",
      title: "Boss 关",
      task: "咱们这一步要做的：算平均分 8 份，领奖！",
      voice: "Boss 来啦！一个蛋糕平均分成八份，每份是几分之一？八分之一！",
      body: function () {
        return '' +
          '<h2>Boss 关：平均分 8 份</h2>' +
          '<div class="quiz" id="boss-quiz"></div>' +
          '<div class="result-big" id="result-stars"></div>';
      }
    }
  ];

  function runF1() {
    document.getElementById("pz1").appendChild(pizza(1, -1));
    var tip = document.getElementById("f1-tip");
    var label = document.getElementById("f1-label");
    setTimeout(function () { if (tip) { tip.textContent = "① 一个完整的披萨（1 个整体）"; } }, 800);
    setTimeout(function () {
      document.getElementById("pz1").innerHTML = "";
      document.getElementById("pz1").appendChild(pizza(2, 0));
      label.innerHTML = '每份是 <span class="frac">1/2</span>';
      if (tip) { tip.textContent = "② 平均切成 2 份，高亮的一份是 1/2"; }
    }, 2600);
    setTimeout(function () { if (tip) { tip.textContent = "✅ 平均分成 2 份 → 每份是 1/2（二分之一）"; } }, 4800);
  }
  function runF2() {
    document.getElementById("pz2").appendChild(pizza(4, 0));
    document.getElementById("pz3").appendChild(pizza(3, 0));
    var tip = document.getElementById("f2-tip");
    setTimeout(function () { if (tip) { tip.textContent = "① 平均切成 4 份，每份是 1/4"; } }, 900);
    setTimeout(function () { if (tip) { tip.textContent = "② 平均切成 3 份，每份是 1/3"; } }, 2800);
    setTimeout(function () { if (tip) { tip.textContent = "✅ 同样大的披萨：分成 4 份的每份，比分成 3 份的每份小"; } }, 4800);
  }

  /* ========== S4 练习 ========== */
  var QUIZ = [
    { q: "把蛋糕平均分成 4 份，每份是？", right: "1/4", opts: ["1/4", "1/2", "1/8"] },
    { q: "把蛋糕平均分成 2 份，每份是？", right: "1/2", opts: ["1/2", "1/4", "2/1"] },
    { q: "1/2 和 1/4 谁大？", right: "1/2", opts: ["1/2", "1/4", "一样大"] }
  ];
  var quizDone = { q1: false, q2: false, q3: false };
  function startQuiz() {
    quizDone = { q1: false, q2: false, q3: false };
    renderQuiz();
  }
  function renderQuiz() {
    var box = document.getElementById("quiz");
    if (!box) { return; }
    var idx = -1;
    ["q1", "q2", "q3"].forEach(function (k, i) { if (!quizDone[k] && idx === -1) { idx = i; } });
    if (idx === -1) { box.innerHTML = '<div class="q">全部完成！⭐ 你真棒</div>'; return; }
    var q = QUIZ[idx];
    box.innerHTML = '<div class="q">第 ' + (idx + 1) + " 题：" + q.q + "</div>" +
      '<div class="opts">' + q.opts.map(function (o) {
        return '<div class="opt" data-ok="' + (o === q.right ? "1" : "0") + '">' + o + "</div>";
      }).join("") + "</div>" +
      "<div class='qmsg'></div><button class='qnext' disabled>下一题</button>";
    var tried = false;
    var opts = box.querySelectorAll(".opt");
    opts.forEach(function (o) {
      o.addEventListener("click", function () {
        if (tried) { return; }
        var ok = o.getAttribute("data-ok") === "1";
        var msg = box.querySelector(".qmsg");
        if (ok) {
          o.classList.add("right");
          opts.forEach(function (x) { x.classList.add("locked"); });
          apiRef.addStars(1); apiRef.comboHit();
          msg.className = "qmsg ok";
          msg.textContent = "对啦！⭐ +1" + (apiRef.state.combo >= 2 ? "（连击 +" + apiRef.state.combo + "）" : "");
          box.querySelector(".qnext").disabled = false;
        } else {
          o.classList.add("wrong");
          tried = true;
          apiRef.comboReset();
          msg.className = "qmsg no";
          msg.textContent = "平均分成几份，每份就是几分之一";
          setTimeout(function () { o.classList.remove("wrong"); tried = false; }, 1500);
        }
      });
    });
    box.querySelector(".qnext").addEventListener("click", function () {
      quizDone["q" + (idx + 1)] = true;
      renderQuiz();
    });
  }

  /* ========== S5 Boss ========== */
  function startBoss() {
    var box = document.getElementById("boss-quiz");
    if (!box) { return; }
    box.innerHTML = '<div class="q">蛋糕平均分成 8 份，每份是？</div>' +
      '<div class="opts">' +
      '<div class="opt" data-ok="1">1/8</div>' +
      '<div class="opt" data-ok="0">1/4</div>' +
      '<div class="opt" data-ok="0">1/2</div>' +
      "</div><div class='qmsg'></div>";
    var rs = document.getElementById("result-stars");
    var tried = false;
    box.querySelectorAll(".opt").forEach(function (o) {
      o.addEventListener("click", function () {
        if (tried) { return; }
        var ok = o.getAttribute("data-ok") === "1";
        var msg = box.querySelector(".qmsg");
        if (ok) {
          o.classList.add("right");
          box.querySelectorAll(".opt").forEach(function (x) { x.classList.add("locked"); });
          apiRef.addStars(2); apiRef.comboHit();
          msg.className = "qmsg ok";
          msg.textContent = "Boss 击败！⭐ +2 几分之一你掌握啦！";
          if (rs) {
            var n = apiRef.stars();
            rs.innerHTML = "🏆 共获得 <b>" + n + "</b> 颗星" +
              (n >= 8 ? "（全部拿下！）" : n >= 5 ? "（很不错！）" : "（下次再来！）");
          }
        } else {
          o.classList.add("wrong");
          tried = true;
          apiRef.comboReset();
          msg.className = "qmsg no";
          msg.textContent = "平均分成 8 份 → 每份是 1/8";
          setTimeout(function () { o.classList.remove("wrong"); tried = false; }, 1500);
        }
      });
    });
  }

  /* ========== 启动 ========== */
  function onEnterStep(step, api) {
    apiRef = api;
    if (step.id === "s2") { runF1(); }
    if (step.id === "s3") { runF2(); }
    if (step.id === "s4") { startQuiz(); }
    if (step.id === "s5") { startBoss(); }
  }

  PlayerCore.init({
    steps: steps,
    parent: {
      summary: "把整体平均分成几份，每份就是它的几分之一（如平均分成 2 份，每份是 1/2）。关键是「平均分」。",
      attention: "孩子容易不平均分也说是几分之一；可强调「必须每份一样大」。",
      tip: "本课约 8 分钟；切一个蛋糕/披萨，边切边问「现在是几分之一」。"
    },
    onEnterStep: onEnterStep,
    settings: { autoStopSteps: [3, 4], pauseMs: 2500 }
  });
})();
</script>
</body>
</html>
