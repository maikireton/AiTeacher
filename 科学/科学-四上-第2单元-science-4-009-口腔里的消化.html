<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>口腔里的消化 · AI 教师</title>
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="../assets/course.css">
<style>
  .mouth-row { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin: 10px 0; }
  .mouth-card { background: var(--card); border: 2px solid var(--border); border-radius: 14px; padding: 14px 18px; min-width: 150px; }
  .mouth-card b { font-size: 18px; }
  .mouth-card .li { font-size: 13px; color: var(--text-2); text-align: left; margin-top: 6px; line-height: 1.8; }
  .chew { display: inline-block; font-size: 64px; }
  .chew-anim { animation: chew .6s ease-in-out infinite; }
  @keyframes chew { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
  .bite { display: inline-block; font-size: 60px; transition: all .3s; }
  .bite.flat { transform: translateY(10px) scale(1.1,.7); }
  .btn-lab { min-height: 44px; padding: 0 20px; border-radius: 12px; border: none; background: var(--accent-deep); color: #fff; font-size: 15px; cursor: pointer; margin: 6px; }
  .fc-tip { font-size: 14px; font-weight: 700; color: var(--accent-deep); min-height: 22px; margin-top: 8px; }
</style>
</head>
<body>
<div class="container">
  <header class="topbar">
    <a class="btn-home" href="index.html">← 自然科学</a>
    <span class="brand">口腔里的消化 <small>4年级·上册</small></span>
  </header>

  <div class="player">
    <div class="task-line" id="task-line"></div>
    <div class="stage" id="stage"></div>
    <div class="dots" id="dots"></div>
    <div class="controls">
      <button class="cbtn" id="btn-prev">上一步</button>
      <button class="cbtn" id="btn-auto">▶ 自动播放</button>
      <button class="cbtn" id="btn-voice">🔊 语音</button>
      <button class="cbtn main" id="btn-next">下一步</button>
    </div>
    <div class="score-row" id="score-row"></div>
  </div>

  <details class="parent-panel">
    <summary>家长模式（点击展开）</summary>
    <div class="pbody">
      <p><b>本课一句话总结：</b>消化的第一站是口腔：牙齿把食物嚼碎（物理变化），唾液把淀粉分解（化学变化），舌头帮忙搅拌吞咽。嚼得越细，后面消化越轻松。</p>
      <p><b>孩子容易走神的地方：</b>抽象概念多。可让孩子吃一口馒头慢慢嚼，感受「越嚼越甜」——那是唾液在分解淀粉，直观又有趣。</p>
      <p><b>建议：</b>本课约 8 分钟；重点说清「嚼碎是第一步」，培养细嚼慢咽的好习惯。</p>
    </div>
  </details>

  <footer class="foot">
    <div>AI 教师 · 自然科学 science-4-009</div>
  </footer>
</div>

<script src="../assets/voice.js"></script>
<script src="../assets/player-core.js"></script>
<script>
(function () {
  "use strict";
  var apiRef = null;

  var steps = [
    {
      id: "s1",
      title: "情境引入",
      task: "咱们这一步要做的：咬一口馒头慢慢嚼，发现奇怪的事！",
      voice: "拿起一小块馒头，放进嘴里，先别急着咽，慢慢嚼、慢慢嚼……咦，怎么越嚼越甜？馒头明明是淡的呀！这个「甜味」是从哪里来的？今天就来解开消化的第一站——口腔的秘密。",
      body: function () {
        return '' +
          '<h2>越嚼越甜的馒头</h2>' +
          '<div class="chew chew-anim">😋</div>' +
          '<div class="fc-tip" id="s1-tip">馒头越嚼越甜，是谁在帮忙？</div>';
      }
    },
    {
      id: "s2",
      title: "动画讲解",
      task: "咱们这一步要做的：认识口腔里的三位消化小帮手！",
      voice: "口腔里有三个小帮手在帮忙消化。第一个，牙齿——把大块食物嚼碎嚼细；第二个，舌头——搅拌食物，帮助吞咽；第三个，唾液——里面有一种「魔法」，能把米饭馒头里的淀粉变成甜甜的糖。嚼得越细，后面消化越轻松。",
      body: function () {
        return '' +
          '<h2>口腔三帮手</h2>' +
          '<div class="mouth-row" id="mrow">' +
            '<div class="mouth-card"><b>🦷 牙齿</b><div class="li">嚼碎大块食物<br>嚼得越细越好</div></div>' +
            '<div class="mouth-card"><b>👅 舌头</b><div class="li">搅拌食物<br>帮助吞咽</div></div>' +
            '<div class="mouth-card"><b>💧 唾液</b><div class="li">把淀粉变甜<br>分解食物</div></div>' +
          '</div>' +
          '<div class="fc-tip" id="s2-tip">准备开始…</div>';
      }
    },
    {
      id: "s3",
      title: "例题演示",
      task: "咱们这一步要做的：亲手「嚼一嚼」，看食物怎么变碎变小！",
      voice: "来！点一下「咬一口」，大馒头被牙齿切碎；再点「嚼一嚼」，食物越来越小、越来越碎，最后和唾液混在一起，变成了软软的食团，顺着喉咙滑下去。这就是口腔消化的全过程。",
      body: function () {
        return '' +
          '<h2>食物大变身</h2>' +
          '<div>' +
            '<div class="bite" id="bite">🍞</div>' +
          '</div>' +
          '<div>' +
            '<button class="btn-lab" id="btn-bite">咬一口</button>' +
            '<button class="btn-lab" id="btn-chew">嚼一嚼</button>' +
          '</div>' +
          '<div class="fc-tip" id="s3-tip">把大馒头嚼成软软的食团！</div>';
      }
    },
    {
      id: "s4",
      title: "互动练习",
      task: "咱们这一步要做的：连闯 3 关，当口腔小卫士！",
      voice: "考考你！关于口腔里的消化，你能答对吗？答对拿星星！",
      body: function () {
        return '' +
          '<h2>闯关练习</h2>' +
          '<div class="quiz" id="quiz"></div>';
      }
    },
    {
      id: "s5",
      title: "要点小结",
      task: "咱们这一步要做的：破最后的谜案，拿走大奖励！",
      voice: "最后一关！小明吃饭狼吞虎咽，几口就把饭咽下去。他这样做对吗？不对！不嚼碎就咽下去，后面的胃和小肠就要加班，很难把大块食物消化掉。细嚼慢咽，才是对消化系统最好的照顾！",
      body: function () {
        return '' +
          '<h2>要点小结</h2>' +
          '<div class="mouth-card" style="width:auto"><b>口腔 = 消化第一站</b><div class="li">牙齿嚼碎 · 舌头搅拌 · 唾液分解淀粉<br>细嚼慢咽，对胃和小肠好</div></div>' +
          '<div class="quiz" id="boss-quiz"></div>' +
          '<div class="result-big" id="result-stars"></div>';
      }
    }
  ];

  /* ---------- S2 ---------- */
  function runS2() {
    var cards = document.querySelectorAll("#mrow .mouth-card");
    var tip = document.getElementById("s2-tip");
    cards.forEach(function (c, i) {
      setTimeout(function () {
        c.style.borderColor = "#6b8fd8"; c.style.background = "rgba(155,187,244,.14)";
        var msgs = ["牙齿把食物嚼碎", "舌头搅拌、帮吞咽", "唾液把淀粉变成糖"];
        if (tip) { tip.textContent = msgs[i]; }
      }, 900 + i * 1600);
    });
    setTimeout(function () { if (tip) { tip.textContent = "✅ 牙齿 + 舌头 + 唾液，配合默契！"; } }, 900 + 3 * 1600);
  }

  /* ---------- S3 咀嚼互动 ---------- */
  function runS3() {
    var bite = document.getElementById("bite");
    var tip = document.getElementById("s3-tip");
    var chewed = 0;
    document.getElementById("btn-bite").addEventListener("click", function () {
      bite.textContent = "🍞";
      bite.classList.remove("flat");
      setTimeout(function () { bite.classList.add("flat"); }, 200);
      if (tip) { tip.textContent = "牙齿把大馒头切碎！"; }
    });
    document.getElementById("btn-chew").addEventListener("click", function () {
      chewed++;
      var faces = ["🍚", "🥣", "💧"];
      if (chewed < 3) { bite.textContent = faces[chewed - 1]; }
      else { bite.textContent = "🥣"; }
      var msgs = ["嚼碎中…食物变小了！", "越嚼越细，和唾液混在一起", "变成软软的食团，准备滑下去！"];
      if (tip) { tip.textContent = msgs[Math.min(chewed - 1, 2)]; }
    });
  }

  /* ---------- S4 练习 ---------- */
  var QUIZ = [
    { q: "口腔里负责把食物嚼碎的是？", right: "牙齿", opts: ["牙齿", "鼻子", "耳朵"] },
    { q: "馒头越嚼越甜，是因为？", right: "唾液把淀粉变成了糖", opts: ["馒头本来就是甜的", "唾液把淀粉变成了糖", "牙齿把糖变多了"] },
    { q: "舌头在口腔里的作用是？", right: "搅拌食物，帮助吞咽", opts: ["把食物变甜", "搅拌食物，帮助吞咽", "把食物变热"] }
  ];
  var quizDone = { q1: false, q2: false, q3: false };
  function startQuiz() {
    quizDone = { q1: false, q2: false, q3: false };
    renderQuiz();
  }
  function renderQuiz() {
    var box = document.getElementById("quiz");
    if (!box) { return; }
    var idx = -1;
    ["q1", "q2", "q3"].forEach(function (k, i) { if (!quizDone[k] && idx === -1) { idx = i; } });
    if (idx === -1) { box.innerHTML = '<div class="q">全部完成！⭐ 你真棒</div>'; return; }
    var q = QUIZ[idx];
    box.innerHTML = '<div class="q">第 ' + (idx + 1) + " 题：" + q.q + "</div>" +
      '<div class="opts">' + q.opts.map(function (o) {
        return '<div class="opt" data-ok="' + (o === q.right ? "1" : "0") + '">' + o + "</div>";
      }).join("") + "</div>" +
      "<div class='qmsg'></div><button class='qnext' disabled>下一题</button>";
    var tried = false;
    box.querySelectorAll(".opt").forEach(function (o) {
      o.addEventListener("click", function () {
        if (tried) { return; }
        var ok = o.getAttribute("data-ok") === "1";
        var msg = box.querySelector(".qmsg");
        if (ok) {
          o.classList.add("right");
          box.querySelectorAll(".opt").forEach(function (x) { x.classList.add("locked"); });
          apiRef.addStars(1); apiRef.comboHit();
          msg.className = "qmsg ok";
          msg.textContent = "对啦！⭐ +1" + (apiRef.state.combo >= 2 ? "（连击 +" + apiRef.state.combo + "）" : "");
          box.querySelector(".qnext").disabled = false;
        } else {
          o.classList.add("wrong");
          tried = true;
          apiRef.comboReset();
          msg.className = "qmsg no";
          msg.textContent = "想想口腔三帮手：牙齿、舌头、唾液";
          setTimeout(function () { o.classList.remove("wrong"); tried = false; }, 1400);
        }
      });
    });
    box.querySelector(".qnext").addEventListener("click", function () {
      quizDone["q" + (idx + 1)] = true;
      renderQuiz();
    });
  }

  /* ---------- S5 Boss ---------- */
  function startBoss() {
    var box = document.getElementById("boss-quiz");
    if (!box) { return; }
    box.innerHTML = '<div class="q">Boss 题：为什么吃饭要细嚼慢咽？</div>' +
      '<div class="opts">' +
      '<div class="opt" data-ok="1">嚼碎了，后面的胃和小肠才消化得动</div>' +
      '<div class="opt" data-ok="0">为了多花时间</div>' +
      '<div class="opt" data-ok="0">嚼碎后食物会变没</div>' +
      "</div><div class='qmsg'></div>";
    var rs = document.getElementById("result-stars");
    var tried = false;
    box.querySelectorAll(".opt").forEach(function (o) {
      o.addEventListener("click", function () {
        if (tried) { return; }
        var ok = o.getAttribute("data-ok") === "1";
        var msg = box.querySelector(".qmsg");
        if (ok) {
          o.classList.add("right");
          box.querySelectorAll(".opt").forEach(function (x) { x.classList.add("locked"); });
          apiRef.addStars(2); apiRef.comboHit();
          msg.className = "qmsg ok";
          msg.textContent = "Boss 击败！⭐ +2 你是口腔小卫士！";
          if (rs) {
            var n = apiRef.stars();
            rs.innerHTML = "🏆 共获得 <b>" + n + "</b> 颗星" +
              (n >= 8 ? "（全部拿下！）" : n >= 5 ? "（很不错！）" : "（下次再来！）");
          }
        } else {
          o.classList.add("wrong");
          tried = true;
          apiRef.comboReset();
          msg.className = "qmsg no";
          msg.textContent = "嚼细一点，后面的消化器官才轻松";
          setTimeout(function () { o.classList.remove("wrong"); tried = false; }, 1500);
        }
      });
    });
  }

  function onEnterStep(step, api) {
    apiRef = api;
    if (step.id === "s1") { /* 静态 */ }
    if (step.id === "s2") { runS2(); }
    if (step.id === "s3") { runS3(); }
    if (step.id === "s4") { startQuiz(); }
    if (step.id === "s5") { startBoss(); }
  }

  PlayerCore.init({
    steps: steps,
    parent: {
      summary: "口腔=消化第一站：牙齿嚼碎、舌头搅拌、唾液分解淀粉（越嚼越甜）；细嚼慢咽好。",
      attention: "抽象概念多；让孩子吃口馒头慢慢嚼，感受「越嚼越甜」的唾液作用。",
      tip: "本课约 8 分钟；把「细嚼慢咽」变成生活习惯，吃饭时提醒孩子多嚼几下。"
    },
    onEnterStep: onEnterStep,
    settings: { autoStopSteps: [3, 4], pauseMs: 2500 }
  });
})();
</script>
</body>
</html>
