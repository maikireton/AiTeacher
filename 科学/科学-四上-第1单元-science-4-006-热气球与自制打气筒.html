<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>热气球与自制打气筒 · AI 教师</title>
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="../assets/course.css">
<style>
  .balloon { display: inline-block; font-size: 80px; transition: transform 1.2s ease; }
  .balloon.up { transform: translateY(-70px); }
  .flame { display: inline-block; font-size: 46px; }
  .btn-lab { min-height: 44px; padding: 0 20px; border-radius: 12px; border: none; background: var(--accent-deep); color: #fff; font-size: 15px; cursor: pointer; margin: 6px; }
  .btn-lab:active { opacity: .85; }
  .design-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin: 10px 0; }
  .design-card { background: var(--card); border: 2px solid var(--border); border-radius: 14px; padding: 12px 16px; min-width: 150px; font-size: 14px; font-weight: 700; }
  .design-card small { display: block; font-weight: 400; color: var(--text-2); margin-top: 4px; }
  .fc-tip { font-size: 14px; font-weight: 700; color: var(--accent-deep); min-height: 22px; margin-top: 8px; }
</style>
</head>
<body>
<div class="container">
  <header class="topbar">
    <a class="btn-home" href="index.html">← 自然科学</a>
    <span class="brand">热气球与自制打气筒 <small>4年级·上册</small></span>
  </header>

  <div class="player">
    <div class="task-line" id="task-line"></div>
    <div class="stage" id="stage"></div>
    <div class="dots" id="dots"></div>
    <div class="controls">
      <button class="cbtn" id="btn-prev">上一步</button>
      <button class="cbtn" id="btn-auto">▶ 自动播放</button>
      <button class="cbtn" id="btn-voice">🔊 语音</button>
      <button class="cbtn main" id="btn-next">下一步</button>
    </div>
    <div class="score-row" id="score-row"></div>
  </div>

  <details class="parent-panel">
    <summary>家长模式（点击展开）</summary>
    <div class="pbody">
      <p><b>本课一句话总结：</b>工程课！用「热空气上升」做热气球小实验、用「空气可压缩」设计打气筒。核心不是记住原理，而是体验「设计→制作→测试→改进」的工程师流程。</p>
      <p><b>孩子容易走神的地方：</b>动手前没想清楚就乱做。陪学时先让他说「我要做什么、用什么材料、怎么测试」，做完再问「哪里可以改进」。</p>
      <p><b>建议：</b>本课约 10 分钟；在家可用塑料袋+吹风机（低温）做热气球，用矿泉水瓶+气球做简易打气筒，注意安全、家长陪护。</p>
    </div>
  </details>

  <footer class="foot">
    <div>AI 教师 · 自然科学 science-4-006</div>
  </footer>
</div>

<script src="../assets/voice.js"></script>
<script src="../assets/player-core.js"></script>
<script src="../assets/record.js"></script>
<script>
(function () {
  "use strict";
  var apiRef = null;

  var steps = [
    {
      id: "s1",
      title: "情境引入",
      task: "咱们这一步要做的：认识热气球，猜它为什么能飞上天！",
      voice: "你看过热气球吗？大大的气囊，下面还有一个火把在烧。火把把空气烧热了，热空气就带着气球往上升。你猜，是热空气在帮忙，还是别的什么？今天我们就当小工程师，亲手做一做、试一试！",
      body: function () {
        return '' +
          '<h2>热气球为什么能飞？</h2>' +
          '<div class="balloon" id="b1">🎈</div>' +
          '<div class="flame">🔥</div>' +
          '<div class="fc-tip" id="s1-tip">火把加热空气，气球往上飘？</div>';
      }
    },
    {
      id: "s2",
      title: "动画讲解",
      task: "咱们这一步要做的：亲手加热空气，看热气球升起来！",
      voice: "来当小工程师！点一下「加热空气」，热空气变轻上升，把气球顶上去；点「关火」，空气变冷，气球慢慢落下来。记住：热空气上升，冷空气下降，这就是热气球的秘密。",
      body: function () {
        return '' +
          '<h2>热气球小实验</h2>' +
          '<div>' +
            '<div class="balloon" id="balloon">🎈</div>' +
            '<div class="flame" id="flame">🔥</div>' +
          '</div>' +
          '<div>' +
            '<button class="btn-lab" id="btn-heat">🔥 加热空气</button>' +
            '<button class="btn-lab" id="btn-cool">❄️ 关火变冷</button>' +
          '</div>' +
          '<div class="fc-tip" id="s2-tip">点加热，看气球飞起来！</div>';
      }
    },
    {
      id: "s3",
      title: "例题演示",
      task: "咱们这一步要做的：当小工程师，设计一个「自制打气筒」！",
      voice: "现在用上「空气可压缩」的本领，设计打气筒。打气筒的工作：活塞往下压，把空气压进轮胎；活塞往上提，再吸进新空气。你设计的打气筒要用哪些材料？矿泉水瓶、气球、软管……然后还要测试：能不能把气球吹起来？",
      body: function () {
        return '' +
          '<h2>设计自制打气筒</h2>' +
          '<div class="design-row">' +
            '<div class="design-card">📐 设计<small>画草图、选材料</small></div>' +
            '<div class="design-card">🛠️ 制作<small>矿泉水瓶+气球+软管</small></div>' +
            '<div class="design-card">🧪 测试<small>能不能把气球吹起来</small></div>' +
            '<div class="design-card">🔧 改进<small>哪里漏气、再修一修</small></div>' +
          '</div>' +
          '<div class="fc-tip" id="s3-tip">工程师四步：设计 → 制作 → 测试 → 改进</div>';
      }
    },
    {
      id: "s4",
      title: "互动练习",
      task: "咱们这一步要做的：连闯 3 关，当合格小工程师！",
      voice: "考考你！热气球和打气筒的秘密，你搞清楚了吗？答对拿星星！",
      body: function () {
        return '' +
          '<h2>闯关练习</h2>' +
          '<div class="quiz" id="quiz"></div>';
      }
    },
    {
      id: "s5",
      title: "要点小结",
      task: "咱们这一步要做的：挑战工程师终极大奖！",
      voice: "最后一关！小明做的打气筒漏气，气球吹不起来。作为工程师，你第一步应该怎么做？当然是先检查哪里漏气，再想办法改进！记住：工程师不怕失败，失败了就找原因、再改进。加油，拿下大奖！",
      body: function () {
        return '' +
          '<h2>工程师小结</h2>' +
          '<div class="design-row">' +
            '<div class="design-card">热空气上升<small>热气球的秘密</small></div>' +
            '<div class="design-card">空气可压缩<small>打气筒的秘密</small></div>' +
            '<div class="design-card">先测再改<small>工程师的流程</small></div>' +
          '</div>' +
          '<div class="quiz" id="boss-quiz"></div>' +
          '<div class="result-big" id="result-stars"></div>';
      }
    }
  ];

  /* ---------- S2 热气球互动 ---------- */
  function runS2() {
    var balloon = document.getElementById("balloon");
    var flame = document.getElementById("flame");
    var tip = document.getElementById("s2-tip");
    var up = false;
    document.getElementById("btn-heat").addEventListener("click", function () {
      up = true;
      balloon.classList.add("up");
      flame.style.transform = "scale(1.25)";
      if (tip) { tip.textContent = "热空气变轻上升，气球飞起来啦！"; }
    });
    document.getElementById("btn-cool").addEventListener("click", function () {
      up = false;
      balloon.classList.remove("up");
      flame.style.transform = "scale(1)";
      if (tip) { tip.textContent = "空气变冷，气球慢慢落下来"; }
    });
  }

  /* ---------- S3 ---------- */
  function runS3() {
    var tip = document.getElementById("s3-tip");
    if (tip) { tip.textContent = "工程师四步：设计 → 制作 → 测试 → 改进，缺一不可"; }
  }

  /* ---------- S4 练习 ---------- */
  var QUIZ = [
    { q: "热气球升起来，靠的是？", right: "热空气变轻上升", opts: ["气球很漂亮", "热空气变轻上升", "风从下面吹"] },
    { q: "自制打气筒能吹起气球，靠的是空气的什么本领？", right: "可以被压缩", opts: ["可以被压缩", "无色无味", "能变成水"] },
    { q: "工程师做完东西后，最重要的是？", right: "测试并改进", opts: ["赶紧收起来", "测试并改进", "放在一边不管"] }
  ];
  var quizDone = { q1: false, q2: false, q3: false };
  function startQuiz() {
    quizDone = { q1: false, q2: false, q3: false };
    renderQuiz();
  }
  function renderQuiz() {
    var box = document.getElementById("quiz");
    if (!box) { return; }
    var idx = -1;
    ["q1", "q2", "q3"].forEach(function (k, i) { if (!quizDone[k] && idx === -1) { idx = i; } });
    if (idx === -1) { box.innerHTML = '<div class="q">全部完成！⭐ 你真棒</div>'; return; }
    var q = QUIZ[idx];
    box.innerHTML = '<div class="q">第 ' + (idx + 1) + " 题：" + q.q + "</div>" +
      '<div class="opts">' + q.opts.map(function (o) {
        return '<div class="opt" data-ok="' + (o === q.right ? "1" : "0") + '">' + o + "</div>";
      }).join("") + "</div>" +
      "<div class='qmsg'></div><button class='qnext' disabled>下一题</button>";
    var tried = false;
    box.querySelectorAll(".opt").forEach(function (o) {
      o.addEventListener("click", function () {
        if (tried) { return; }
        var ok = o.getAttribute("data-ok") === "1";
        var msg = box.querySelector(".qmsg");
        if (ok) {
          o.classList.add("right");
          box.querySelectorAll(".opt").forEach(function (x) { x.classList.add("locked"); });
          apiRef.addStars(1); apiRef.comboHit();
          msg.className = "qmsg ok";
          msg.textContent = "对啦！⭐ +1" + (apiRef.state.combo >= 2 ? "（连击 +" + apiRef.state.combo + "）" : "");
          box.querySelector(".qnext").disabled = false;
        } else {
          o.classList.add("wrong");
          tried = true;
          apiRef.comboReset();
          msg.className = "qmsg no";
          msg.textContent = "想想热气球和打气筒的原理再选";
          setTimeout(function () { o.classList.remove("wrong"); tried = false; }, 1400);
        }
      });
    });
    box.querySelector(".qnext").addEventListener("click", function () {
      quizDone["q" + (idx + 1)] = true;
      renderQuiz();
    });
  }

  /* ---------- S5 Boss ---------- */
  function startBoss() {
    var box = document.getElementById("boss-quiz");
    if (!box) { return; }
    box.innerHTML = '<div class="q">Boss 题：自制的打气筒漏气、气球吹不起来，第一步应该？</div>' +
      '<div class="opts">' +
      '<div class="opt" data-ok="1">检查哪里漏气，想办法改进</div>' +
      '<div class="opt" data-ok="0">丢掉重做一个</div>' +
      '<div class="opt" data-ok="0">用嘴吹就行</div>' +
      "</div><div class='qmsg'></div>";
    var rs = document.getElementById("result-stars");
    var tried = false;
    box.querySelectorAll(".opt").forEach(function (o) {
      o.addEventListener("click", function () {
        if (tried) { return; }
        var ok = o.getAttribute("data-ok") === "1";
        var msg = box.querySelector(".qmsg");
        if (ok) {
          o.classList.add("right");
          box.querySelectorAll(".opt").forEach(function (x) { x.classList.add("locked"); });
          apiRef.addStars(2); apiRef.comboHit();
          msg.className = "qmsg ok";
          msg.textContent = "Boss 击败！⭐ +2 你是优秀小工程师！";
          if (rs) {
            var n = apiRef.stars();
            rs.innerHTML = "🏆 共获得 <b>" + n + "</b> 颗星" +
              (n >= 8 ? "（全部拿下！）" : n >= 5 ? "（很不错！）" : "（下次再来！）");
          }
        } else {
          o.classList.add("wrong");
          tried = true;
          apiRef.comboReset();
          msg.className = "qmsg no";
          msg.textContent = "工程师不怕失败：先找原因，再改进！";
          setTimeout(function () { o.classList.remove("wrong"); tried = false; }, 1500);
        }
      });
    });
  }

  function onEnterStep(step, api) {
    apiRef = api;
    if (step.id === "s1") { /* 静态 */ }
    if (step.id === "s2") { runS2(); }
    if (step.id === "s3") { runS3(); }
    if (step.id === "s4") { startQuiz(); }
    if (step.id === "s5") { startBoss(); }
  }

  PlayerCore.init({
    steps: steps,
    parent: {
      summary: "工程课：热空气上升做热气球、空气可压缩做打气筒；体验设计→制作→测试→改进流程。",
      attention: "孩子易「没想清就动手、失败就放弃」；引导先设计再动手，失败后找原因再改进。",
      tip: "本课约 10 分钟；可在家用塑料袋+低温吹风机做热气球（家长陪护）。"
    },
    onEnterStep: onEnterStep,
    settings: { autoStopSteps: [3, 4], pauseMs: 2500 }
  });
})();
</script>
</body>
</html>
