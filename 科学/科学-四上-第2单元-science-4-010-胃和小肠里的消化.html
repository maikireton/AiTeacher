<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>胃和小肠里的消化 · AI 教师</title>
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="../assets/course.css">
<style>
  .organ-row { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin: 10px 0; }
  .organ-card { background: var(--card); border: 2px solid var(--border); border-radius: 14px; padding: 14px 18px; min-width: 200px; opacity: .35; transition: all .4s; }
  .organ-card.on { opacity: 1; border-color: #6b8fd8; background: rgba(155,187,244,.14); transform: translateY(-3px); }
  .organ-card b { font-size: 18px; }
  .organ-card .li { font-size: 13px; color: var(--text-2); text-align: left; margin-top: 6px; line-height: 1.8; }
  .trip { font-size: 30px; }
  .fc-tip { font-size: 14px; font-weight: 700; color: var(--accent-deep); min-height: 22px; margin-top: 8px; }
</style>
</head>
<body>
<div class="container">
  <header class="topbar">
    <a class="btn-home" href="index.html">← 自然科学</a>
    <span class="brand">胃和小肠里的消化 <small>4年级·上册</small></span>
  </header>

  <div class="player">
    <div class="task-line" id="task-line"></div>
    <div class="stage" id="stage"></div>
    <div class="dots" id="dots"></div>
    <div class="controls">
      <button class="cbtn" id="btn-prev">上一步</button>
      <button class="cbtn" id="btn-auto">▶ 自动播放</button>
      <button class="cbtn" id="btn-voice">🔊 语音</button>
      <button class="cbtn main" id="btn-next">下一步</button>
    </div>
    <div class="score-row" id="score-row"></div>
  </div>

  <details class="parent-panel">
    <summary>家长模式（点击展开）</summary>
    <div class="pbody">
      <p><b>本课一句话总结：</b>食物经食道滑进胃：胃像「搅拌机」，用胃酸和蠕动把食物变成糊糊；小肠像「吸管工厂」，把营养吸进血液送全身；大肠再回收水分，剩下的排出体外。</p>
      <p><b>孩子容易走神的地方：</b>「胃和小肠」看不见。可用「搅拌机」「吸管工厂」的比喻帮孩子建立画面，强调「小肠是营养吸收的主场」。</p>
      <p><b>建议：</b>本课约 8 分钟；吃饭规律、不暴饮暴食，就是对胃和小肠的爱护。</p>
    </div>
  </details>

  <footer class="foot">
    <div>AI 教师 · 自然科学 science-4-010</div>
  </footer>
</div>

<script src="../assets/voice.js"></script>
<script src="../assets/player-core.js"></script>
<script src="../assets/record.js"></script>
<script>
(function () {
  "use strict";
  var apiRef = null;

  var steps = [
    {
      id: "s1",
      title: "情境引入",
      task: "咱们这一步要做的：追着食物，看它滑进食道后去了哪里！",
      voice: "上节课我们嚼碎了食物，把它咽下去。可食物滑进喉咙之后，去了哪里？它走过一段长长的「滑梯」——食道，然后来到了一个像「大口袋」的地方。你猜那个大口袋是哪里？",
      body: function () {
        return '' +
          '<h2>食物要去哪里？</h2>' +
          '<div class="trip">🍙 → 食道 → ？</div>' +
          '<div class="fc-tip" id="s1-tip">顺着食道往下，食物会遇到谁？</div>';
      }
    },
    {
      id: "s2",
      title: "动画讲解",
      task: "咱们这一步要做的：认识胃——身体里的「搅拌机」！",
      voice: "食物滑进食道后，来到了胃。胃就像一个强壮的「搅拌机」！它里面有胃酸，能帮助消化；胃壁还会一伸一缩地蠕动，把食物搅呀搅，搅成软软的糊糊。在胃里待两三个小时，食物就变成了「食糜」。",
      body: function () {
        return '' +
          '<h2>胃：身体里的搅拌机</h2>' +
          '<div class="organ-row" id="grow">' +
            '<div class="organ-card"><b>🫀 胃</b><div class="li">像搅拌机<br>胃酸 + 蠕动<br>把食物搅成糊糊</div></div>' +
          '</div>' +
          '<div class="fc-tip" id="s2-tip">准备开始…</div>';
      }
    },
    {
      id: "s3",
      title: "例题演示",
      task: "咱们这一步要做的：认识小肠和大肠——营养的「吸管工厂」！",
      voice: "胃把食物搅成糊糊后，送进了小肠。小肠像一根很长的吸管，上面有好多小绒毛，像无数根小吸管，把营养吸进血液里，运到全身各处。营养被吸走后，剩下的残渣到了大肠，大肠回收水分，最后把残渣排出体外。",
      body: function () {
        return '' +
          '<h2>小肠 + 大肠：营养工厂</h2>' +
          '<div class="organ-row" id="srow">' +
            '<div class="organ-card"><b>🌀 小肠</b><div class="li">长长的吸管<br>吸收营养进血液</div></div>' +
            '<div class="organ-card"><b>🌊 大肠</b><div class="li">回收水分<br>残渣排出体外</div></div>' +
          '</div>' +
          '<div class="fc-tip" id="s3-tip">准备开始…</div>';
      }
    },
    {
      id: "s4",
      title: "互动练习",
      task: "咱们这一步要做的：连闯 3 关，当消化小侦探！",
      voice: "考考你！关于胃和小肠的消化，你能答对吗？答对拿星星！",
      body: function () {
        return '' +
          '<h2>闯关练习</h2>' +
          '<div class="quiz" id="quiz"></div>';
      }
    },
    {
      id: "s5",
      title: "要点小结",
      task: "咱们这一步要做的：破最后的谜案，拿走大奖励！",
      voice: "最后一关！小明一顿饭吃得又快又撑，结果肚子不舒服。为什么？因为胃一次装太多、来不及消化，就会难受。记住：胃像搅拌机、小肠像吸管工厂，规律吃饭、细嚼慢咽，它们才开心！",
      body: function () {
        return '' +
          '<h2>要点小结</h2>' +
          '<div class="trip">食道 → 胃(搅拌) → 小肠(吸收) → 大肠(回收水分)</div>' +
          '<div class="hint">营养从食物里被小肠吸走，送到全身 🧬</div>' +
          '<div class="quiz" id="boss-quiz"></div>' +
          '<div class="result-big" id="result-stars"></div>';
      }
    }
  ];

  /* ---------- S2 胃 ---------- */
  function runS2() {
    var cards = document.querySelectorAll("#grow .organ-card");
    var tip = document.getElementById("s2-tip");
    cards.forEach(function (c, i) {
      setTimeout(function () {
        c.classList.add("on");
        var msgs = ["胃像搅拌机，胃酸帮助消化", "胃壁蠕动，把食物搅成糊糊", "食物变成食糜，准备去小肠"];
        if (tip) { tip.textContent = msgs[i]; }
      }, 900 + i * 1700);
    });
  }

  /* ---------- S3 小肠+大肠 ---------- */
  function runS3() {
    var cards = document.querySelectorAll("#srow .organ-card");
    var tip = document.getElementById("s3-tip");
    cards.forEach(function (c, i) {
      setTimeout(function () {
        c.classList.add("on");
        var msgs = ["小肠：长长的吸管，吸收营养进血液", "大肠：回收水分，残渣排出体外"];
        if (tip) { tip.textContent = msgs[i]; }
      }, 900 + i * 1700);
    });
    setTimeout(function () { if (tip) { tip.textContent = "✅ 小肠是营养吸收的主场！"; } }, 900 + 2 * 1700);
  }

  /* ---------- S4 练习 ---------- */
  var QUIZ = [
    { q: "食物经食道后，先来到哪个器官？", right: "胃", opts: ["胃", "小肠", "心脏"] },
    { q: "胃把食物变成糊糊，靠的是？", right: "胃酸和胃壁蠕动", opts: ["胃酸和胃壁蠕动", "牙齿", "空气"] },
    { q: "身体吸收营养的主要场所是？", right: "小肠", opts: ["小肠", "大脑", "指甲"] }
  ];
  var quizDone = { q1: false, q2: false, q3: false };
  function startQuiz() {
    quizDone = { q1: false, q2: false, q3: false };
    renderQuiz();
  }
  function renderQuiz() {
    var box = document.getElementById("quiz");
    if (!box) { return; }
    var idx = -1;
    ["q1", "q2", "q3"].forEach(function (k, i) { if (!quizDone[k] && idx === -1) { idx = i; } });
    if (idx === -1) { box.innerHTML = '<div class="q">全部完成！⭐ 你真棒</div>'; return; }
    var q = QUIZ[idx];
    box.innerHTML = '<div class="q">第 ' + (idx + 1) + " 题：" + q.q + "</div>" +
      '<div class="opts">' + q.opts.map(function (o) {
        return '<div class="opt" data-ok="' + (o === q.right ? "1" : "0") + '">' + o + "</div>";
      }).join("") + "</div>" +
      "<div class='qmsg'></div><button class='qnext' disabled>下一题</button>";
    var tried = false;
    box.querySelectorAll(".opt").forEach(function (o) {
      o.addEventListener("click", function () {
        if (tried) { return; }
        var ok = o.getAttribute("data-ok") === "1";
        var msg = box.querySelector(".qmsg");
        if (ok) {
          o.classList.add("right");
          box.querySelectorAll(".opt").forEach(function (x) { x.classList.add("locked"); });
          apiRef.addStars(1); apiRef.comboHit();
          msg.className = "qmsg ok";
          msg.textContent = "对啦！⭐ +1" + (apiRef.state.combo >= 2 ? "（连击 +" + apiRef.state.combo + "）" : "");
          box.querySelector(".qnext").disabled = false;
        } else {
          o.classList.add("wrong");
          tried = true;
          apiRef.comboReset();
          msg.className = "qmsg no";
          msg.textContent = "想想路线：胃(搅拌)→小肠(吸收)→大肠(回收水分)";
          setTimeout(function () { o.classList.remove("wrong"); tried = false; }, 1400);
        }
      });
    });
    box.querySelector(".qnext").addEventListener("click", function () {
      quizDone["q" + (idx + 1)] = true;
      renderQuiz();
    });
  }

  /* ---------- S5 Boss ---------- */
  function startBoss() {
    var box = document.getElementById("boss-quiz");
    if (!box) { return; }
    box.innerHTML = '<div class="q">Boss 题：食物营养被吸收进血液，发生在哪里？</div>' +
      '<div class="opts">' +
      '<div class="opt" data-ok="1">小肠（吸管工厂）</div>' +
      '<div class="opt" data-ok="0">牙齿</div>' +
      '<div class="opt" data-ok="0">耳朵</div>' +
      "</div><div class='qmsg'></div>";
    var rs = document.getElementById("result-stars");
    var tried = false;
    box.querySelectorAll(".opt").forEach(function (o) {
      o.addEventListener("click", function () {
        if (tried) { return; }
        var ok = o.getAttribute("data-ok") === "1";
        var msg = box.querySelector(".qmsg");
        if (ok) {
          o.classList.add("right");
          box.querySelectorAll(".opt").forEach(function (x) { x.classList.add("locked"); });
          apiRef.addStars(2); apiRef.comboHit();
          msg.className = "qmsg ok";
          msg.textContent = "Boss 击败！⭐ +2 你是消化小侦探！";
          if (rs) {
            var n = apiRef.stars();
            rs.innerHTML = "🏆 共获得 <b>" + n + "</b> 颗星" +
              (n >= 8 ? "（全部拿下！）" : n >= 5 ? "（很不错！）" : "（下次再来！）");
          }
        } else {
          o.classList.add("wrong");
          tried = true;
          apiRef.comboReset();
          msg.className = "qmsg no";
          msg.textContent = "小肠绒毛像无数小吸管，吸收营养进血液";
          setTimeout(function () { o.classList.remove("wrong"); tried = false; }, 1500);
        }
      });
    });
  }

  function onEnterStep(step, api) {
    apiRef = api;
    if (step.id === "s2") { runS2(); }
    if (step.id === "s3") { runS3(); }
    if (step.id === "s4") { startQuiz(); }
    if (step.id === "s5") { startBoss(); }
  }

  PlayerCore.init({
    steps: steps,
    parent: {
      summary: "食道→胃(搅拌成糊糊)→小肠(吸收营养进血液)→大肠(回收水分、排出残渣)。",
      attention: "用「搅拌机」「吸管工厂」比喻帮孩子建立画面，强调小肠是吸收主场。",
      tip: "本课约 8 分钟；提醒孩子规律吃饭、不暴饮暴食，就是爱护胃和小肠。"
    },
    onEnterStep: onEnterStep,
    settings: { autoStopSteps: [3, 4], pauseMs: 2500 }
  });
})();
</script>
</body>
</html>
