<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>空气占据空间 · AI 教师</title>
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="../assets/course.css">
<style>
  .cup { margin: 14px auto; width: 100%; max-width: 560px; }
  .water-tank { position: relative; width: 260px; height: 180px; margin: 0 auto; border: 3px solid #7fb8e0; border-radius: 12px 12px 4px 4px; background: linear-gradient(#bfe0f7, #7fb8e0); overflow: hidden; }
  .bubble { position: absolute; bottom: 20px; border-radius: 50%; background: rgba(255,255,255,.9); animation: rise 1.6s linear infinite; }
  @keyframes rise { from { transform: translateY(0); opacity: .95; } to { transform: translateY(-140px); opacity: 0; } }
  .cup-ico { display: inline-block; font-size: 64px; }
  .seq { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 10px 0; }
  .seq-card { background: #f6f8fc; border: 2px solid var(--border); border-radius: 14px; padding: 12px 14px; width: 150px; font-size: 14px; font-weight: 700; opacity: .35; transition: all .4s; }
  .seq-card.on { opacity: 1; border-color: var(--accent-deep); background: rgba(155,187,244,.14); transform: translateY(-3px); }
  .seq-card small { display: block; font-weight: 400; color: var(--text-2); margin-top: 4px; }
  .fc-tip { font-size: 14px; font-weight: 700; color: var(--accent-deep); min-height: 22px; margin-top: 8px; }
</style>
</head>
<body>
<div class="container">
  <header class="topbar">
    <a class="btn-home" href="index.html">← 自然科学</a>
    <span class="brand">空气占据空间 <small>4年级·上册</small></span>
  </header>

  <div class="player">
    <div class="task-line" id="task-line"></div>
    <div class="stage" id="stage"></div>
    <div class="dots" id="dots"></div>
    <div class="controls">
      <button class="cbtn" id="btn-prev">上一步</button>
      <button class="cbtn" id="btn-auto">▶ 自动播放</button>
      <button class="cbtn" id="btn-voice">🔊 语音</button>
      <button class="cbtn main" id="btn-next">下一步</button>
    </div>
    <div class="score-row" id="score-row"></div>
  </div>

  <details class="parent-panel">
    <summary>家长模式（点击展开）</summary>
    <div class="pbody">
      <p><b>本课一句话总结：</b>空气也占地方！「倒扣水杯入水」实验证明：瓶子里的空气占着位置，水才进不去。空气是被「请」出去的，不是被「赶」走的。</p>
      <p><b>孩子容易走神的地方：</b>以为「空瓶子里什么都没有」。可带孩子做实验：竖直倒扣（水进不去）→ 倾斜（气泡冒出，水进入），亲眼看到空气被挤走。</p>
      <p><b>建议：</b>本课约 8 分钟；重点是动手做实验并说清「为什么水进不去」，而不是背结论。</p>
    </div>
  </details>

  <footer class="foot">
    <div>AI 教师 · 自然科学 science-4-002</div>
  </footer>
</div>

<script src="../assets/voice.js"></script>
<script src="../assets/player-core.js"></script>
<script src="../assets/record.js"></script>
<script>
(function () {
  "use strict";
  var apiRef = null;

  var steps = [
    {
      id: "s1",
      title: "情境引入",
      task: "咱们这一步要做的：猜一猜，空瓶子里到底有没有东西！",
      voice: "桌上有个空瓶子，很多人说它是空的。可我把它倒扣进水里，奇怪的事发生了：水竟然进不去！你猜猜，是什么东西挡住了水？",
      body: function () {
        return '' +
          '<h2>空瓶子是空的吗？</h2>' +
          '<div class="cup">' +
            '<div class="cup-ico">🧴</div><span style="font-size:60px">→</span><div class="cup-ico">🫙</div>' +
            '<div class="fc-tip" id="s1-tip">倒扣进水里，会发生什么？</div>' +
          '</div>' +
          '<div class="hint">先猜一猜，再往下看实验 👇</div>';
      }
    },
    {
      id: "s2",
      title: "动画讲解",
      task: "咱们这一步要做的：看「倒扣水杯」实验，发现空气占地方！",
      voice: "看实验！把装满空气的瓶子竖直倒扣进水里，水只进了一点点，就被顶住了。为什么？因为瓶子里的空气占据了空间，把水挡在外面。如果把瓶子倾斜，就能看到咕嘟咕嘟的气泡冒出来——那是空气跑出来了，水这才挤进去。你看，空气真的占了地方！",
      body: function () {
        return '' +
          '<h2>倒扣水杯实验</h2>' +
          '<div class="water-tank" id="tank"></div>' +
          '<div class="fc-tip" id="s2-tip">准备开始…</div>';
      }
    },
    {
      id: "s3",
      title: "例题演示",
      task: "咱们这一步要做的：看三步实验步骤，说出每一步发生了什么！",
      voice: "来，把实验拆成三步。第一步，瓶子竖直倒扣，水只进一点点——空气挡住水。第二步，瓶子慢慢倾斜，气泡冒出来——空气跑了。第三步，瓶子完全倾斜，水全部进去——空气跑光了。你发现了吗？空气是被请出去的，不是被赶走的。",
      body: function () {
        return '' +
          '<h2>实验三步曲</h2>' +
          '<div class="seq" id="seq">' +
            '<div class="seq-card">① 竖直倒扣<small>水进不去，空气挡住</small></div>' +
            '<div class="seq-card">② 慢慢倾斜<small>气泡冒出，空气跑走</small></div>' +
            '<div class="seq-card">③ 完全倾斜<small>水全进去，空气跑光</small></div>' +
          '</div>' +
          '<div class="fc-tip" id="s3-tip">准备开始…</div>';
      }
    },
    {
      id: "s4",
      title: "互动练习",
      task: "咱们这一步要做的：连闯 3 关，当实验小判官！",
      voice: "考考你！下面这些问题，你能答对吗？答对拿星星！",
      body: function () {
        return '' +
          '<h2>闯关练习</h2>' +
          '<div class="quiz" id="quiz"></div>';
      }
    },
    {
      id: "s5",
      title: "要点小结",
      task: "咱们这一步要做的：破最后的谜案，拿走大奖励！",
      voice: "最后一关！把纸团塞进杯底，杯子竖直倒扣进水里，再拿出来——你猜纸团是干的还是湿的？答案是干的！因为杯子里的空气把水挡住了，纸团没碰到水。这就是空气占据空间的威力！",
      body: function () {
        return '' +
          '<h2>要点小结</h2>' +
          '<div class="seq-card on" style="width:auto;opacity:1">空气占据空间 = 占着地方，把别的东西挡在外面</div>' +
          '<div class="hint">「空的」东西里，常常藏着看不见的空气 💨</div>' +
          '<div class="quiz" id="boss-quiz"></div>' +
          '<div class="result-big" id="result-stars"></div>';
      }
    }
  ];

  /* ---------- S1 ---------- */
  function runS1() {
    var tip = document.getElementById("s1-tip");
    setTimeout(function () { if (tip) { tip.textContent = "猜到了吗？是空气在挡着！"; } }, 2200);
  }

  /* ---------- S2 水箱实验动画 ---------- */
  function runS2() {
    var tank = document.getElementById("tank");
    var tip = document.getElementById("s2-tip");
    if (!tank) { return; }
    tank.innerHTML =
      '<div class="bubble" style="left:80px;width:18px;height:18px"></div>' +
      '<div class="bubble" style="left:120px;width:12px;height:12px;animation-delay:.5s"></div>' +
      '<div class="bubble" style="left:160px;width:22px;height:22px;animation-delay:.9s"></div>';
    if (tip) { tip.textContent = "咕嘟咕嘟……空气冒出来，水挤进去！"; }
  }

  /* ---------- S3 三步动画 ---------- */
  function runS3() {
    var cards = document.querySelectorAll("#seq .seq-card");
    var tip = document.getElementById("s3-tip");
    cards.forEach(function (c, i) {
      setTimeout(function () {
        c.classList.add("on");
        var msgs = ["水进不去——空气挡住水", "气泡冒出来——空气跑走", "水全进去——空气跑光了"];
        if (tip) { tip.textContent = msgs[i]; }
      }, 1000 + i * 1700);
    });
    setTimeout(function () { if (tip) { tip.textContent = "✅ 空气是被「请」出去的！"; } }, 1000 + 3 * 1700);
  }

  /* ---------- S4 练习 ---------- */
  var QUIZ = [
    { q: "把装满空气的瓶子竖直倒扣进水里，水会？", right: "只进一点点，被空气挡住", opts: ["只进一点点，被空气挡住", "一下子全进去", "水变热了"] },
    { q: "瓶子倾斜时冒出的气泡是什么？", right: "跑出来的空气", opts: ["水里的鱼吐的泡", "跑出来的空气", "瓶子里的小石头"] },
    { q: "要让水全部进入瓶子，应该？", right: "把瓶子倾斜，让空气跑出去", opts: ["把瓶子放正", "把瓶子倾斜，让空气跑出去", "把瓶子变重"] }
  ];
  var quizDone = { q1: false, q2: false, q3: false };
  function startQuiz() {
    quizDone = { q1: false, q2: false, q3: false };
    renderQuiz();
  }
  function renderQuiz() {
    var box = document.getElementById("quiz");
    if (!box) { return; }
    var idx = -1;
    ["q1", "q2", "q3"].forEach(function (k, i) { if (!quizDone[k] && idx === -1) { idx = i; } });
    if (idx === -1) { box.innerHTML = '<div class="q">全部完成！⭐ 你真棒</div>'; return; }
    var q = QUIZ[idx];
    box.innerHTML = '<div class="q">第 ' + (idx + 1) + " 题：" + q.q + "</div>" +
      '<div class="opts">' + q.opts.map(function (o) {
        return '<div class="opt" data-ok="' + (o === q.right ? "1" : "0") + '">' + o + "</div>";
      }).join("") + "</div>" +
      "<div class='qmsg'></div><button class='qnext' disabled>下一题</button>";
    var tried = false;
    box.querySelectorAll(".opt").forEach(function (o) {
      o.addEventListener("click", function () {
        if (tried) { return; }
        var ok = o.getAttribute("data-ok") === "1";
        var msg = box.querySelector(".qmsg");
        if (ok) {
          o.classList.add("right");
          box.querySelectorAll(".opt").forEach(function (x) { x.classList.add("locked"); });
          apiRef.addStars(1); apiRef.comboHit();
          msg.className = "qmsg ok";
          msg.textContent = "对啦！⭐ +1" + (apiRef.state.combo >= 2 ? "（连击 +" + apiRef.state.combo + "）" : "");
          box.querySelector(".qnext").disabled = false;
        } else {
          o.classList.add("wrong");
          tried = true;
          apiRef.comboReset();
          msg.className = "qmsg no";
          msg.textContent = "想想实验：空气占着地方，水才进不去";
          setTimeout(function () { o.classList.remove("wrong"); tried = false; }, 1400);
        }
      });
    });
    box.querySelector(".qnext").addEventListener("click", function () {
      quizDone["q" + (idx + 1)] = true;
      renderQuiz();
    });
  }

  /* ---------- S5 Boss ---------- */
  function startBoss() {
    var box = document.getElementById("boss-quiz");
    if (!box) { return; }
    box.innerHTML = '<div class="q">Boss 题：把干纸团塞进杯底，杯子竖直倒扣进水里，拿出来纸团会？</div>' +
      '<div class="opts">' +
      '<div class="opt" data-ok="1">还是干的，空气挡住了水</div>' +
      '<div class="opt" data-ok="0">全湿透了</div>' +
      '<div class="opt" data-ok="0">纸团自己飞出来</div>' +
      "</div><div class='qmsg'></div>";
    var rs = document.getElementById("result-stars");
    var tried = false;
    box.querySelectorAll(".opt").forEach(function (o) {
      o.addEventListener("click", function () {
        if (tried) { return; }
        var ok = o.getAttribute("data-ok") === "1";
        var msg = box.querySelector(".qmsg");
        if (ok) {
          o.classList.add("right");
          box.querySelectorAll(".opt").forEach(function (x) { x.classList.add("locked"); });
          apiRef.addStars(2); apiRef.comboHit();
          msg.className = "qmsg ok";
          msg.textContent = "Boss 击败！⭐ +2 你是实验小高手！";
          if (rs) {
            var n = apiRef.stars();
            rs.innerHTML = "🏆 共获得 <b>" + n + "</b> 颗星" +
              (n >= 8 ? "（全部拿下！）" : n >= 5 ? "（很不错！）" : "（下次再来！）");
          }
        } else {
          o.classList.add("wrong");
          tried = true;
          apiRef.comboReset();
          msg.className = "qmsg no";
          msg.textContent = "想想：杯子里的空气把水挡住了，纸团碰不到水";
          setTimeout(function () { o.classList.remove("wrong"); tried = false; }, 1500);
        }
      });
    });
  }

  function onEnterStep(step, api) {
    apiRef = api;
    if (step.id === "s1") { runS1(); }
    if (step.id === "s2") { runS2(); }
    if (step.id === "s3") { runS3(); }
    if (step.id === "s4") { startQuiz(); }
    if (step.id === "s5") { startBoss(); }
  }

  PlayerCore.init({
    steps: steps,
    parent: {
      summary: "空气占据空间：倒扣水杯水进不去，倾斜后气泡冒出、水才进入；空气占着地方挡水。",
      attention: "孩子易把「空瓶子」当成真空无一物；重点做竖直/倾斜对比实验，看气泡说结论。",
      tip: "本课约 8 分钟；可在家用水盆+杯子复现实验，让孩子当小老师讲解。"
    },
    onEnterStep: onEnterStep,
    settings: { autoStopSteps: [3, 4], pauseMs: 2500 }
  });
})();
</script>
</body>
</html>
