<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>习作：记一次游戏 · AI 教师</title>
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="../assets/course.css">
<style>
  .gstep { display: flex; align-items: center; gap: 14px; background: #fff; border: 2px solid #e4e3dd; border-radius: 14px; padding: 12px 16px; margin: 8px 0; max-width: 600px; width: 100%; opacity: .3; transform: translateY(10px); transition: all .6s ease; text-align: left; }
  .gstep.on { opacity: 1; transform: translateY(0); }
  .gstep .gnum { font-size: 22px; font-weight: 800; color: #6b8fd8; min-width: 34px; }
  .gstep .gname { font-size: 16px; font-weight: 800; color: #2c5a9e; }
  .gstep .gtxt { font-size: 14px; color: #555; line-height: 1.6; }
  .emoji-big { font-size: 42px; }
</style>
</head>
<body>
<div class="container">
  <header class="topbar">
    <a class="btn-home" href="index.html">← 语文</a>
    <span class="brand">习作：记一次游戏 <small>4年级·上册</small></span>
  </header>

  <div class="player">
    <div class="task-line" id="task-line"></div>
    <div class="stage" id="stage"></div>
    <div class="dots" id="dots"></div>
    <div class="controls">
      <button class="cbtn" id="btn-prev">上一步</button>
      <button class="cbtn" id="btn-auto">▶ 自动播放</button>
      <button class="cbtn" id="btn-voice">🔊 语音</button>
      <button class="cbtn main" id="btn-next">下一步</button>
    </div>
    <div class="score-row" id="score-row"></div>
  </div>

  <details class="parent-panel">
    <summary>家长模式（点击展开）</summary>
    <div class="pbody">
      <p id="parent-summary"><b>本课一句话总结：</b>记一次游戏按"游戏前→游戏中→游戏后"写：先写怎么玩，再写过程（动作+语言+心理），最后写心情和感受。</p>
      <p id="parent-attention"><b>孩子容易走神的地方：</b>只写"我们玩得很开心"；可提示写出最紧张的 1 个瞬间。</p>
      <p id="parent-tip"><b>建议：</b>本课约 8 分钟；先让孩子回忆最近一次游戏，说说"最紧张的时候"。</p>
    </div>
  </details>

  <footer class="foot">
    <div>AI 教师 · 语文 chinese-4-013</div>
  </footer>
</div>

<script src="../assets/voice.js"></script>
<script src="../assets/player-core.js"></script>
<script src="../assets/record.js"></script>
<script>
(function () {
  "use strict";
  var apiRef = null;

  var steps = [
    {
      id: "s1",
      title: "情境引入",
      task: "咱们这一步要做的：回忆你最爱玩的游戏！",
      voice: "老鹰捉小鸡、丢沙包、捉迷藏……你肯定玩过好多游戏！如果要把最好玩的一次写下来，让别人看了也想去玩，你会怎么写？今天学三步，把游戏写得又清楚又好玩！",
      body: function () {
        return '' +
          '<h2>最好玩的一次游戏 🎮</h2>' +
          '<div style="font-size:44px">🦅 🐔 ⚽</div>' +
          '<div class="fc-tip" id="s1-tip">准备开始…</div>' +
          '<div class="hint">写游戏 = 游戏前 + 游戏中 + 游戏后</div>';
      }
    },
    {
      id: "s2",
      title: "动画讲解",
      task: "咱们这一步要做的：看写游戏的三段流程！",
      voice: "看动画。写一次游戏分三段。游戏前：先写游戏名字、怎么玩、规则是什么。游戏中：写最精彩的过程，谁做了什么、说了什么、心里怎么想。游戏后：写结果和心情。三段写完，读者就像亲眼看了一场游戏！",
      body: function () {
        return '' +
          '<h2>写游戏三段</h2>' +
          '<div class="gstep" data-i="0"><span class="gnum">①</span><div><div class="gname">游戏前</div><div class="gtxt">名字、玩法、规则</div></div></div>' +
          '<div class="gstep" data-i="1"><span class="gnum">②</span><div><div class="gname">游戏中</div><div class="gtxt">过程最精彩：动作+语言+心理</div></div></div>' +
          '<div class="gstep" data-i="2"><span class="gnum">③</span><div><div class="gname">游戏后</div><div class="gtxt">结果 + 心情和感受</div></div></div>' +
          '<div class="fc-tip" id="s2-tip">准备开始…</div>';
      }
    },
    {
      id: "s3",
      title: "例题演示",
      task: "咱们这一步要做的：看“老鹰捉小鸡”怎么写！",
      voice: "看例题。写老鹰捉小鸡。游戏前：我当老鹰，小明当母鸡，其他人当小鸡。游戏中：我左扑右抓，母鸡张开双臂护住小鸡，我大喊“看你往哪跑！”小鸡们吓得尖叫。游戏后：我们玩得满头大汗，开心极了！你看，三段很清楚！",
      body: function () {
        return '' +
          '<h2>示范：老鹰捉小鸡</h2>' +
          '<div class="gstep" data-i="0"><span class="gnum">①</span><div><div class="gname">游戏前</div><div class="gtxt">我当老鹰，小明当母鸡，其余人当小鸡。</div></div></div>' +
          '<div class="gstep" data-i="1"><span class="gnum">②</span><div><div class="gname">游戏中</div><div class="gtxt">我左扑右抓，大喊“看你往哪跑！”小鸡们吓得尖叫，母鸡赶紧护住。</div></div></div>' +
          '<div class="gstep" data-i="2"><span class="gnum">③</span><div><div class="gname">游戏后</div><div class="gtxt">我们玩得满头大汗，开心极了，约定明天再玩。</div></div></div>' +
          '<div class="fc-tip" id="s3-tip">准备开始…</div>';
      }
    },
    {
      id: "s4",
      title: "互动练习",
      task: "咱们这一步要做的：闯三关，练写游戏！",
      voice: "现在考考你！记一次游戏要注意什么，过程怎么写，心情怎么写。",
      body: function () {
        return '' +
          '<h2>闯关练习</h2>' +
          '<div class="quiz" id="quiz"></div>';
      }
    },
    {
      id: "s5",
      title: "要点小结",
      task: "咱们这一步要做的：Boss 关选心理，领星星！",
      voice: "最后总结！记一次游戏三段：游戏前、游戏中、游戏后。游戏中写动作、语言、心理，游戏最精彩。Boss 关来了！",
      body: function () {
        return '' +
          '<h2>要点小结</h2>' +
          '<div class="gstep" style="opacity:1;transform:none"><span class="gnum">★</span><div><div class="gname">写游戏</div><div class="gtxt">游戏前（玩法）→ 游戏中（动作+语言+心理）→ 游戏后（心情）</div></div></div>' +
          '<div class="quiz" id="boss-quiz"></div>' +
          '<div class="result-big" id="result-stars"></div>';
      }
    }
  ];

  function lightG(sel, tipId, msgs) {
    var gs = document.querySelectorAll(sel);
    var tip = document.getElementById(tipId);
    gs.forEach(function (g, i) {
      setTimeout(function () {
        g.classList.add("on");
        if (tip && msgs[i]) { tip.textContent = msgs[i]; }
      }, 900 + i * 1800);
    });
    setTimeout(function () { if (tip && msgs[msgs.length - 1]) { tip.textContent = "✅ " + msgs[msgs.length - 1]; } }, 900 + gs.length * 1800);
  }
  function runS1() {
    var tip = document.getElementById("s1-tip");
    setTimeout(function () { if (tip) { tip.textContent = "选一次最好玩的游戏回忆一下"; } }, 1300);
    setTimeout(function () { if (tip) { tip.textContent = "✅ 三段流程，游戏写得又清又好玩！"; } }, 2800);
  }
  function runS2() { lightG("#s2 .gstep", "s2-tip", ["① 游戏前：名字、玩法、规则", "② 游戏中：动作+语言+心理", "③ 游戏后：结果+心情", "三段齐，游戏写得清！"]); }
  function runS3() { lightG("#s3 .gstep", "s3-tip", ["① 游戏前：我是老鹰", "② 游戏中：左扑右抓喊声一片", "③ 游戏后：开心约定再玩", "示范写完了！"]); }

  /* ---------- S4 练习 ---------- */
  var QUIZ = [
    { q: "记一次游戏，游戏前要先写？", right: "游戏名字和玩法", opts: ["游戏名字和玩法", "直接写结果", "只写心情"] },
    { q: "把“游戏中”写精彩，可以写？", right: "动作、语言、心理", opts: ["动作、语言、心理", "只写天气", "只写名字"] },
    { q: "“我紧张得心都要跳出来了”属于？", right: "心理描写", opts: ["心理描写", "动作描写", "语言描写"] }
  ];
  var quizDone = { q1: false, q2: false, q3: false };
  function startQuiz() {
    quizDone = { q1: false, q2: false, q3: false };
    renderQuiz();
  }
  function renderQuiz() {
    var box = document.getElementById("quiz");
    if (!box) { return; }
    var idx = -1;
    ["q1", "q2", "q3"].forEach(function (k, i) { if (!quizDone[k] && idx === -1) { idx = i; } });
    if (idx === -1) { box.innerHTML = '<div class="q">全部完成！⭐ 你真棒</div>'; return; }
    var q = QUIZ[idx];
    box.innerHTML = '<div class="q">第 ' + (idx + 1) + " 题：" + q.q + "</div>" +
      '<div class="opts">' + q.opts.map(function (o) {
        return '<div class="opt" data-ok="' + (o === q.right ? "1" : "0") + '">' + o + "</div>";
      }).join("") + "</div>" +
      "<div class='qmsg'></div><button class='qnext' disabled>下一题</button>";
    var tried = false;
    box.querySelectorAll(".opt").forEach(function (o) {
      o.addEventListener("click", function () {
        if (tried) { return; }
        var ok = o.getAttribute("data-ok") === "1";
        var msg = box.querySelector(".qmsg");
        if (ok) {
          o.classList.add("right");
          box.querySelectorAll(".opt").forEach(function (x) { x.classList.add("locked"); });
          apiRef.addStars(1); apiRef.comboHit();
          msg.className = "qmsg ok";
          msg.textContent = "对啦！⭐ +1" + (apiRef.state.combo >= 2 ? "（连击 +" + apiRef.state.combo + "）" : "");
          box.querySelector(".qnext").disabled = false;
        } else {
          o.classList.add("wrong");
          tried = true;
          apiRef.comboReset();
          msg.className = "qmsg no";
          msg.textContent = "动作=做了什么；语言=说了什么；心理=心里怎么想";
          setTimeout(function () { o.classList.remove("wrong"); tried = false; }, 2000);
        }
      });
    });
    box.querySelector(".qnext").addEventListener("click", function () {
      quizDone["q" + (idx + 1)] = true;
      renderQuiz();
    });
  }

  /* ---------- S5 Boss ---------- */
  function startBoss() {
    var box = document.getElementById("boss-quiz");
    if (!box) { return; }
    box.innerHTML = '<div class="q">Boss 关：“‘快跑！’我喊道，撒腿就冲了过去”里，有哪种描写？</div>' +
      '<div class="opts">' +
      '<div class="opt" data-ok="1">语言 + 动作</div>' +
      '<div class="opt" data-ok="0">只有心理</div>' +
      '<div class="opt" data-ok="0">只有环境</div>' +
      "</div><div class='qmsg'></div>";
    var rs = document.getElementById("result-stars");
    var tried = false;
    box.querySelectorAll(".opt").forEach(function (o) {
      o.addEventListener("click", function () {
        if (tried) { return; }
        var ok = o.getAttribute("data-ok") === "1";
        var msg = box.querySelector(".qmsg");
        if (ok) {
          o.classList.add("right");
          box.querySelectorAll(".opt").forEach(function (x) { x.classList.add("locked"); });
          apiRef.addStars(2); apiRef.comboHit();
          msg.className = "qmsg ok";
          msg.textContent = "Boss 击败！⭐ +2 写游戏你掌握啦！";
          if (rs) {
            var n = apiRef.stars();
            rs.innerHTML = "🏆 共获得 <b>" + n + "</b> 颗星" +
              (n >= 9 ? "（全部拿下！）" : n >= 6 ? "（很不错！）" : "（下次再来！）");
          }
        } else {
          o.classList.add("wrong");
          tried = true;
          apiRef.comboReset();
          msg.className = "qmsg no";
          msg.textContent = "“快跑！”是语言，“撒腿冲”是动作";
          setTimeout(function () { o.classList.remove("wrong"); tried = false; }, 1600);
        }
      });
    });
  }

  /* ---------- 启动 ---------- */
  function onEnterStep(step, api) {
    apiRef = api;
    if (step.id === "s1") { runS1(); }
    if (step.id === "s2") { runS2(); }
    if (step.id === "s3") { runS3(); }
    if (step.id === "s4") { startQuiz(); }
    if (step.id === "s5") { startBoss(); }
  }

  PlayerCore.init({
    steps: steps,
    parent: {
      summary: "记一次游戏三段：游戏前（玩法）、游戏中（动作+语言+心理）、游戏后（心情感受）。",
      attention: "孩子易只写“很开心”；提示写出最紧张的瞬间。",
      tip: "本课约 8 分钟；先回忆游戏，说说最紧张的时候再写。"
    },
    onEnterStep: onEnterStep,
    settings: { autoStopSteps: [3, 4], pauseMs: 2500 }
  });
})();
</script>
</body>
</html>
