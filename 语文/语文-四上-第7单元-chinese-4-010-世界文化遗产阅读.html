<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>世界文化遗产阅读 · AI 教师</title>
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="../assets/course.css">
<style>
  .site { display: flex; align-items: center; gap: 16px; background: #fff; border: 2px solid #e4e3dd; border-radius: 14px; padding: 14px 16px; margin: 10px 0; max-width: 600px; width: 100%; opacity: .3; transform: translateX(-12px); transition: all .6s ease; text-align: left; }
  .site.on { opacity: 1; transform: translateX(0); }
  .site .emoji { font-size: 40px; min-width: 52px; text-align: center; }
  .site .sname { font-size: 17px; font-weight: 800; color: #2c5a9e; }
  .site .sinfo { font-size: 14px; color: #555; line-height: 1.6; }
  .method { display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 800; margin: 4px 4px 0 0; }
  .m1 { background: rgba(82,196,26,.14); color: #3a9411; }
  .m2 { background: rgba(250,173,20,.2); color: #a0671a; }
  .m3 { background: rgba(155,187,244,.25); color: #2c5a9e; }
</style>
</head>
<body>
<div class="container">
  <header class="topbar">
    <a class="btn-home" href="index.html">← 语文</a>
    <span class="brand">世界文化遗产阅读 <small>4年级·上册</small></span>
  </header>

  <div class="player">
    <div class="task-line" id="task-line"></div>
    <div class="stage" id="stage"></div>
    <div class="dots" id="dots"></div>
    <div class="controls">
      <button class="cbtn" id="btn-prev">上一步</button>
      <button class="cbtn" id="btn-auto">▶ 自动播放</button>
      <button class="cbtn" id="btn-voice">🔊 语音</button>
      <button class="cbtn main" id="btn-next">下一步</button>
    </div>
    <div class="score-row" id="score-row"></div>
  </div>

  <details class="parent-panel">
    <summary>家长模式（点击展开）</summary>
    <div class="pbody">
      <p><b>本课一句话总结：</b>世界遗产单元读三处：长城、颐和园、秦兵马俑。说明文常用三种说明方法：列数字、作比较、打比方，让介绍更清楚。</p>
      <p><b>孩子容易走神的地方：</b>记不住三处遗产/分不清说明方法；可用口诀"数(数字)比(比较)打(比方)"记忆。</p>
      <p><b>建议：</b>本课约 8 分钟；看完让孩子说说身边物品用哪种说明方法介绍。</p>
    </div>
  </details>

  <footer class="foot">
    <div>AI 教师 · 语文 chinese-4-010</div>
  </footer>
</div>

<script src="../assets/voice.js"></script>
<script src="../assets/player-core.js"></script>
<script>
(function () {
  "use strict";
  var apiRef = null;

  var steps = [
    {
      id: "s1",
      title: "情境引入",
      task: "咱们这一步要做的：环游世界遗产，当小导游！",
      voice: "你知道吗？我们国家有很多世界文化遗产，全世界都出名！长城、颐和园、秦兵马俑……今天你当小导游，去认识它们，还要学会作者是怎么把遗产介绍清楚的。",
      body: function () {
        return '' +
          '<h2>世界遗产小导游 🧭</h2>' +
          '<div style="font-size:46px;letter-spacing:8px">🏯 🛕 🗿</div>' +
          '<div class="fc-tip" id="s1-tip">准备开始…</div>' +
          '<div class="hint">作者用"说明方法"把遗产介绍清楚</div>';
      }
    },
    {
      id: "s2",
      title: "动画讲解",
      task: "咱们这一步要做的：认识三处世界遗产！",
      voice: "看动画。第一站长城，像一条巨龙盘在山间，全长一万三千多里。第二站颐和园，有长廊、万寿山、昆明湖，是皇家园林。第三站秦兵马俑，几千个陶俑整整齐齐站成军队，每个表情都不一样。三处都是世界遗产！",
      body: function () {
        return '' +
          '<h2>三处世界遗产</h2>' +
          '<div class="site" data-i="0"><span class="emoji">🏯</span><div><div class="sname">长城</div><div class="sinfo">像一条巨龙盘在群山之间，全长一万三千多里</div></div></div>' +
          '<div class="site" data-i="1"><span class="emoji">🛕</span><div><div class="sname">颐和园</div><div class="sinfo">皇家园林：长廊、万寿山、昆明湖</div></div></div>' +
          '<div class="site" data-i="2"><span class="emoji">🗿</span><div><div class="sname">秦兵马俑</div><div class="sinfo">上千陶俑排成军队，神态各异</div></div></div>' +
          '<div class="fc-tip" id="s2-tip">准备开始…</div>';
      }
    },
    {
      id: "s3",
      title: "例题演示",
      task: "咱们这一步要做的：认识三种说明方法！",
      voice: "看例题。介绍世界遗产，作者常用三种说明方法。第一种，列数字：长城全长一万三千多里，用数字说话。第二种，作比较：城墙像一条长龙，跟熟悉的东西比。第三种，打比方：用比喻把东西说清楚。记住口诀：数、比、打！",
      body: function () {
        return '' +
          '<h2>三种说明方法</h2>' +
          '<div class="site" data-i="0" style="opacity:1;transform:none"><span class="emoji">🔢</span><div><div class="sname">列数字</div><div class="sinfo">“全长一万三千多里” —— 用具体数字</div><span class="method m1">列数字</span></div></div>' +
          '<div class="site" data-i="1" style="opacity:1;transform:none"><span class="emoji">⚖️</span><div><div class="sname">作比较</div><div class="sinfo">“像一条巨龙” —— 和熟悉的事物比</div><span class="method m2">作比较</span></div></div>' +
          '<div class="site" data-i="2" style="opacity:1;transform:none"><span class="emoji">🎨</span><div><div class="sname">打比方</div><div class="sinfo">“像利剑” —— 用比喻说清楚</div><span class="method m3">打比方</span></div></div>' +
          '<div class="fc-tip" id="s3-tip">准备开始…</div>' +
          '<div class="hint">口诀：数（数字）、比（比较）、打（比方）</div>';
      }
    },
    {
      id: "s4",
      title: "互动练习",
      task: "咱们这一步要做的：闯三关，辨说明方法！",
      voice: "现在考考你！给你一句介绍世界遗产的话，你要判断它用了哪种说明方法。",
      body: function () {
        return '' +
          '<h2>闯关练习</h2>' +
          '<div class="quiz" id="quiz"></div>';
      }
    },
    {
      id: "s5",
      title: "要点小结",
      task: "咱们这一步要做的：Boss 关辨方法，领星星！",
      voice: "最后总结！世界遗产三处：长城、颐和园、秦兵马俑。说明方法三种：列数字、作比较、打比方。记住口诀数比打，说明文就读懂了！Boss 关来了！",
      body: function () {
        return '' +
          '<h2>要点小结</h2>' +
          '<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0">' +
          '<span class="method m1">列数字</span><span class="method m2">作比较</span><span class="method m3">打比方</span>' +
          '</div>' +
          '<div class="quiz" id="boss-quiz"></div>' +
          '<div class="result-big" id="result-stars"></div>';
      }
    }
  ];

  function runS1() {
    var tip = document.getElementById("s1-tip");
    setTimeout(function () { if (tip) { tip.textContent = "🏯 长城：巨龙盘山"; } }, 1200);
    setTimeout(function () { if (tip) { tip.textContent = "🛕 颐和园：皇家园林"; } }, 2400);
    setTimeout(function () { if (tip) { tip.textContent = "🗿 秦兵马俑：陶俑军队"; } }, 3600);
    setTimeout(function () { if (tip) { tip.textContent = "✅ 出发！学学作者怎么介绍它们！"; } }, 4800);
  }
  function runS2() {
    var sites = document.querySelectorAll("#s2 .site");
    var tip = document.getElementById("s2-tip");
    var msgs = ["① 长城：像巨龙，长一万三千多里", "② 颐和园：皇家园林", "③ 秦兵马俑：上千陶俑"];
    sites.forEach(function (s, i) {
      setTimeout(function () {
        s.classList.add("on");
        if (tip) { tip.textContent = msgs[i]; }
      }, 900 + i * 1900);
    });
    setTimeout(function () { if (tip) { tip.textContent = "✅ 三处遗产都认识啦！"; } }, 900 + sites.length * 1900);
  }
  function runS3() {
    var tip = document.getElementById("s3-tip");
    var msgs = ["① 列数字：用具体数字说话", "② 作比较：和熟悉的东西比", "③ 打比方：用比喻说清楚", "口诀：数、比、打！"];
    msgs.forEach(function (m, i) {
      setTimeout(function () { if (tip) { tip.textContent = m; } }, 1300 + i * 2200);
    });
  }

  /* ---------- S4 练习 ---------- */
  var QUIZ = [
    { q: "“秦兵马俑坑总面积约 2 万平方米”用了哪种方法？", right: "列数字", opts: ["列数字", "作比较", "打比方"] },
    { q: "“颐和园的昆明湖像一面镜子”用了哪种？", right: "打比方", opts: ["打比方", "列数字", "作比较"] },
    { q: "“它比三个操场还大”用了哪种？", right: "作比较", opts: ["作比较", "列数字", "打比方"] }
  ];
  var quizDone = { q1: false, q2: false, q3: false };
  function startQuiz() {
    quizDone = { q1: false, q2: false, q3: false };
    renderQuiz();
  }
  function renderQuiz() {
    var box = document.getElementById("quiz");
    if (!box) { return; }
    var idx = -1;
    ["q1", "q2", "q3"].forEach(function (k, i) { if (!quizDone[k] && idx === -1) { idx = i; } });
    if (idx === -1) { box.innerHTML = '<div class="q">全部完成！⭐ 你真棒</div>'; return; }
    var q = QUIZ[idx];
    box.innerHTML = '<div class="q">第 ' + (idx + 1) + " 题：" + q.q + "</div>" +
      '<div class="opts">' + q.opts.map(function (o) {
        return '<div class="opt" data-ok="' + (o === q.right ? "1" : "0") + '">' + o + "</div>";
      }).join("") + "</div>" +
      "<div class='qmsg'></div><button class='qnext' disabled>下一题</button>";
    var tried = false;
    box.querySelectorAll(".opt").forEach(function (o) {
      o.addEventListener("click", function () {
        if (tried) { return; }
        var ok = o.getAttribute("data-ok") === "1";
        var msg = box.querySelector(".qmsg");
        if (ok) {
          o.classList.add("right");
          box.querySelectorAll(".opt").forEach(function (x) { x.classList.add("locked"); });
          apiRef.addStars(1); apiRef.comboHit();
          msg.className = "qmsg ok";
          msg.textContent = "对啦！⭐ +1" + (apiRef.state.combo >= 2 ? "（连击 +" + apiRef.state.combo + "）" : "");
          box.querySelector(".qnext").disabled = false;
        } else {
          o.classList.add("wrong");
          tried = true;
          apiRef.comboReset();
          msg.className = "qmsg no";
          msg.textContent = "数=列数字；比=作比较；像=打比方";
          setTimeout(function () { o.classList.remove("wrong"); tried = false; }, 1800);
        }
      });
    });
    box.querySelector(".qnext").addEventListener("click", function () {
      quizDone["q" + (idx + 1)] = true;
      renderQuiz();
    });
  }

  /* ---------- S5 Boss ---------- */
  function startBoss() {
    var box = document.getElementById("boss-quiz");
    if (!box) { return; }
    box.innerHTML = '<div class="q">Boss 关：“城墙顶上铺着方砖，十分平整，像很宽的马路”用了？</div>' +
      '<div class="opts">' +
      '<div class="opt" data-ok="1">作比较</div>' +
      '<div class="opt" data-ok="0">列数字</div>' +
      '<div class="opt" data-ok="0">没方法</div>' +
      "</div><div class='qmsg'></div>";
    var rs = document.getElementById("result-stars");
    var tried = false;
    box.querySelectorAll(".opt").forEach(function (o) {
      o.addEventListener("click", function () {
        if (tried) { return; }
        var ok = o.getAttribute("data-ok") === "1";
        var msg = box.querySelector(".qmsg");
        if (ok) {
          o.classList.add("right");
          box.querySelectorAll(".opt").forEach(function (x) { x.classList.add("locked"); });
          apiRef.addStars(2); apiRef.comboHit();
          msg.className = "qmsg ok";
          msg.textContent = "Boss 击败！⭐ +2 说明方法你掌握啦！";
          if (rs) {
            var n = apiRef.stars();
            rs.innerHTML = "🏆 共获得 <b>" + n + "</b> 颗星" +
              (n >= 9 ? "（全部拿下！）" : n >= 6 ? "（很不错！）" : "（下次再来！）");
          }
        } else {
          o.classList.add("wrong");
          tried = true;
          apiRef.comboReset();
          msg.className = "qmsg no";
          msg.textContent = "“像很宽的马路”是和马路比 → 作比较";
          setTimeout(function () { o.classList.remove("wrong"); tried = false; }, 1600);
        }
      });
    });
  }

  /* ---------- 启动 ---------- */
  function onEnterStep(step, api) {
    apiRef = api;
    if (step.id === "s1") { runS1(); }
    if (step.id === "s2") { runS2(); }
    if (step.id === "s3") { runS3(); }
    if (step.id === "s4") { startQuiz(); }
    if (step.id === "s5") { startBoss(); }
  }

  PlayerCore.init({
    steps: steps,
    parent: {
      summary: "世界遗产三处：长城、颐和园、秦兵马俑。说明方法三招：列数字、作比较、打比方（口诀：数比打）。",
      attention: "孩子易分不清说明方法；用口诀“数比打”记忆。",
      tip: "本课约 8 分钟；让孩子用说明方法介绍身边物品。"
    },
    onEnterStep: onEnterStep,
    settings: { autoStopSteps: [3, 4], pauseMs: 2500 }
  });
})();
</script>
</body>
</html>
