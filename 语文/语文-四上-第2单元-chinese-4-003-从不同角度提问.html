<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>从不同角度提问 · AI 教师</title>
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="../assets/course.css">
<style>
  .qcard { display: flex; align-items: center; gap: 14px; background: #fff; border: 2px solid #e4e3dd; border-radius: 14px; padding: 14px 16px; margin: 10px 0; cursor: pointer; transition: all .3s; text-align: left; }
  .qcard:hover { border-color: #6b8fd8; }
  .qcard.on { border-color: #6b8fd8; background: rgba(155,187,244,.14); }
  .qcard .qmark { font-size: 26px; font-weight: 800; color: #6b8fd8; min-width: 40px; text-align: center; }
  .qcard .qbody { font-size: 16px; color: #333; font-weight: 600; }
  .angle { display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 700; margin: 4px 4px 0 0; }
  .a1 { background: rgba(82,196,26,.14); color: #3a9411; }
  .a2 { background: rgba(250,173,20,.18); color: #b07900; }
  .a3 { background: rgba(155,187,244,.22); color: #4a6cb0; }
</style>
</head>
<body>
<div class="container">
  <header class="topbar">
    <a class="btn-home" href="index.html">← 语文</a>
    <span class="brand">从不同角度提问 <small>4年级·上册</small></span>
  </header>

  <div class="player">
    <div class="task-line" id="task-line"></div>
    <div class="stage" id="stage"></div>
    <div class="dots" id="dots"></div>
    <div class="controls">
      <button class="cbtn" id="btn-prev">上一步</button>
      <button class="cbtn" id="btn-auto">▶ 自动播放</button>
      <button class="cbtn" id="btn-voice">🔊 语音</button>
      <button class="cbtn main" id="btn-next">下一步</button>
    </div>
    <div class="score-row" id="score-row"></div>
  </div>

  <details class="parent-panel">
    <summary>家长模式（点击展开）</summary>
    <div class="pbody">
      <p><b>本课一句话总结：</b>边读边从三个角度提问：①针对内容（写了什么/为什么）②针对写法（怎么写的/为什么这样写）③联系生活与启示（对我有什么用）。</p>
      <p><b>孩子容易走神的地方：</b>只问"是什么"不问"为什么"；可约定每次读书至少提 3 个问题，每个角度 1 个。</p>
      <p><b>建议：</b>本课约 8 分钟；读课文时鼓励孩子大胆提问，问题没有标准答案，敢问就加分。</p>
    </div>
  </details>

  <footer class="foot">
    <div>AI 教师 · 语文 chinese-4-003</div>
  </footer>
</div>

<script src="../assets/voice.js"></script>
<script src="../assets/player-core.js"></script>
<script>
(function () {
  "use strict";
  var apiRef = null;

  var steps = [
    {
      id: "s1",
      title: "情境引入",
      task: "咱们这一步要做的：当个“提问小侦探”！",
      voice: "你发现了吗？会读书的孩子，都会边读边提问。读完一篇文章，能问出好问题，才算真正读懂了。今天，我们学三把提问的钥匙，从三个角度问出好问题！",
      body: function () {
        return '' +
          '<h2>提问小侦探 🔍</h2>' +
          '<div class="qcard"><span class="qmark">?</span><span class="qbody">读文章时，你能问出“好问题”吗？</span></div>' +
          '<div class="fc-tip" id="s1-tip">准备开始…</div>' +
          '<div class="hint">问题问得越多、越深，读得越明白</div>';
      }
    },
    {
      id: "s2",
      title: "动画讲解",
      task: "咱们这一步要做的：认识三把提问的钥匙！",
      voice: "看动画。第一把钥匙，针对内容提问，比如：文章写了什么？为什么？第二把钥匙，针对写法提问，比如：作者为什么这样写？用了什么好方法？第三把钥匙，联系生活提问，比如：这对我有什么启发？三把钥匙，三个角度！",
      body: function () {
        return '' +
          '<h2>三把提问的钥匙</h2>' +
          '<div class="qcard" data-i="0"><span class="qmark">🔑1</span><span class="qbody">针对内容：写了什么？为什么？</span></div>' +
          '<div class="qcard" data-i="1"><span class="qmark">🔑2</span><span class="qbody">针对写法：怎么写的？为什么这样写？</span></div>' +
          '<div class="qcard" data-i="2"><span class="qmark">🔑3</span><span class="qbody">联系生活：对我有什么启发？</span></div>' +
          '<div class="fc-tip" id="s2-tip">准备开始…</div>';
      }
    },
    {
      id: "s3",
      title: "例题演示",
      task: "咱们这一步要做的：给《蝙蝠和雷达》的问题分分类！",
      voice: "看例题。我们学《蝙蝠和雷达》，可以问三个问题。第一个：蝙蝠是怎么用嘴和耳朵探路的？这是内容问题。第二个：作者为什么拿蝙蝠和雷达对比来写？这是写法问题。第三个：雷达还能用在什么地方？这是联系生活。你看，三个角度的问题都不一样！",
      body: function () {
        return '' +
          '<h2>《蝙蝠和雷达》三个角度的问题</h2>' +
          '<div class="qcard" data-i="0"><span class="qmark">1</span><span class="qbody">蝙蝠是怎样用嘴和耳朵探路的？</span><span class="angle a1">内容</span></div>' +
          '<div class="qcard" data-i="1"><span class="qmark">2</span><span class="qbody">作者为什么拿蝙蝠和雷达对比来写？</span><span class="angle a2">写法</span></div>' +
          '<div class="qcard" data-i="2"><span class="qmark">3</span><span class="qbody">雷达还能用在哪些地方？</span><span class="angle a3">联系生活</span></div>' +
          '<div class="fc-tip" id="s3-tip">准备开始…</div>';
      }
    },
    {
      id: "s4",
      title: "互动练习",
      task: "咱们这一步要做的：把问题放进正确的“钥匙孔”！",
      voice: "现在考考你！给你一个问题，你要判断它属于哪个角度：内容、写法，还是联系生活。",
      body: function () {
        return '' +
          '<h2>闯关练习</h2>' +
          '<div class="quiz" id="quiz"></div>';
      }
    },
    {
      id: "s5",
      title: "要点小结",
      task: "咱们这一步要做的：Boss 关辨角度，领星星！",
      voice: "最后总结！提问三把钥匙：内容、写法、联系生活。以后每读一篇文章，就从这三个角度各问一个问题，你就是提问小侦探啦！Boss 关来了！",
      body: function () {
        return '' +
          '<h2>要点小结</h2>' +
          '<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0">' +
          '<span class="angle a1">内容</span><span class="angle a2">写法</span><span class="angle a3">联系生活</span>' +
          '</div>' +
          '<div class="quiz" id="boss-quiz"></div>' +
          '<div class="result-big" id="result-stars"></div>';
      }
    }
  ];

  /* ---------- 卡片依次点亮 ---------- */
  function lightCards(containerId, tipId, texts) {
    var cards = document.querySelectorAll(containerId + " .qcard");
    var tip = document.getElementById(tipId);
    cards.forEach(function (c, i) {
      setTimeout(function () {
        c.classList.add("on");
        if (tip && texts[i]) { tip.textContent = texts[i]; }
      }, 900 + i * 1600);
    });
    setTimeout(function () { if (tip && texts[texts.length - 1]) { tip.textContent = "✅ " + texts[texts.length - 1]; } }, 900 + (cards.length) * 1600);
  }

  function runS1() { lightCards("", "s1-tip", ["准备开始…", "试试看，你能问出几个问题？"]); }
  function runS2() {
    lightCards("#none", "s2-tip", ["① 内容：写了什么、为什么", "② 写法：怎么写的", "③ 联系生活：对我有什么用", "三把钥匙要记牢！"]);
  }
  function runS3() {
    lightCards("#none", "s3-tip", ["① 内容问题", "② 写法问题", "③ 联系生活问题", "三个角度都能问！"]);
  }

  /* ---------- S4 练习 ---------- */
  var QUIZ = [
    { q: "“《观潮》为什么按时间顺序写？”这个问题从哪个角度问？", right: "写法", opts: ["写法", "内容", "联系生活"] },
    { q: "“潮水为什么这么大？”从哪个角度问？", right: "内容", opts: ["内容", "写法", "联系生活"] },
    { q: "“学了《蝙蝠和雷达》，我能发明什么新东西？”从哪个角度？", right: "联系生活", opts: ["联系生活", "写法", "内容"] }
  ];
  var quizDone = { q1: false, q2: false, q3: false };
  function startQuiz() {
    quizDone = { q1: false, q2: false, q3: false };
    renderQuiz();
  }
  function renderQuiz() {
    var box = document.getElementById("quiz");
    if (!box) { return; }
    var idx = -1;
    ["q1", "q2", "q3"].forEach(function (k, i) { if (!quizDone[k] && idx === -1) { idx = i; } });
    if (idx === -1) { box.innerHTML = '<div class="q">全部完成！⭐ 你真棒</div>'; return; }
    var q = QUIZ[idx];
    box.innerHTML = '<div class="q">第 ' + (idx + 1) + " 题：" + q.q + "</div>" +
      '<div class="opts">' + q.opts.map(function (o) {
        return '<div class="opt" data-ok="' + (o === q.right ? "1" : "0") + '">' + o + "</div>";
      }).join("") + "</div>" +
      "<div class='qmsg'></div><button class='qnext' disabled>下一题</button>";
    var tried = false;
    box.querySelectorAll(".opt").forEach(function (o) {
      o.addEventListener("click", function () {
        if (tried) { return; }
        var ok = o.getAttribute("data-ok") === "1";
        var msg = box.querySelector(".qmsg");
        if (ok) {
          o.classList.add("right");
          box.querySelectorAll(".opt").forEach(function (x) { x.classList.add("locked"); });
          apiRef.addStars(1); apiRef.comboHit();
          msg.className = "qmsg ok";
          msg.textContent = "对啦！⭐ +1" + (apiRef.state.combo >= 2 ? "（连击 +" + apiRef.state.combo + "）" : "");
          box.querySelector(".qnext").disabled = false;
        } else {
          o.classList.add("wrong");
          tried = true;
          apiRef.comboReset();
          msg.className = "qmsg no";
          msg.textContent = "问“为什么这样写”是写法；问“写了什么”是内容；问“对我有什么用”是联系生活";
          setTimeout(function () { o.classList.remove("wrong"); tried = false; }, 2200);
        }
      });
    });
    box.querySelector(".qnext").addEventListener("click", function () {
      quizDone["q" + (idx + 1)] = true;
      renderQuiz();
    });
  }

  /* ---------- S5 Boss ---------- */
  function startBoss() {
    var box = document.getElementById("boss-quiz");
    if (!box) { return; }
    box.innerHTML = '<div class="q">Boss 关：“作者用‘千万匹白色战马’来比喻，为什么这么写？”从哪个角度？</div>' +
      '<div class="opts">' +
      '<div class="opt" data-ok="1">写法</div>' +
      '<div class="opt" data-ok="0">内容</div>' +
      '<div class="opt" data-ok="0">联系生活</div>' +
      "</div><div class='qmsg'></div>";
    var rs = document.getElementById("result-stars");
    var tried = false;
    box.querySelectorAll(".opt").forEach(function (o) {
      o.addEventListener("click", function () {
        if (tried) { return; }
        var ok = o.getAttribute("data-ok") === "1";
        var msg = box.querySelector(".qmsg");
        if (ok) {
          o.classList.add("right");
          box.querySelectorAll(".opt").forEach(function (x) { x.classList.add("locked"); });
          apiRef.addStars(2); apiRef.comboHit();
          msg.className = "qmsg ok";
          msg.textContent = "Boss 击败！⭐ +2 提问小侦探就是你！";
          if (rs) {
            var n = apiRef.stars();
            rs.innerHTML = "🏆 共获得 <b>" + n + "</b> 颗星" +
              (n >= 9 ? "（全部拿下！）" : n >= 6 ? "（很不错！）" : "（下次再来！）");
          }
        } else {
          o.classList.add("wrong");
          tried = true;
          apiRef.comboReset();
          msg.className = "qmsg no";
          msg.textContent = "问“为什么这么写、用了什么方法”是写法角度";
          setTimeout(function () { o.classList.remove("wrong"); tried = false; }, 1500);
        }
      });
    });
  }

  /* ---------- 启动 ---------- */
  function onEnterStep(step, api) {
    apiRef = api;
    if (step.id === "s1") { runS1(); }
    if (step.id === "s2") { runS2(); }
    if (step.id === "s3") { runS3(); }
    if (step.id === "s4") { startQuiz(); }
    if (step.id === "s5") { startBoss(); }
  }

  PlayerCore.init({
    steps: steps,
    parent: {
      summary: "边读边从三个角度提问：内容（写了什么/为什么）、写法（怎么写的）、联系生活（对我有什么用）。",
      attention: "孩子容易只问“是什么”；约定每次读书三个角度各问一个问题。",
      tip: "本课约 8 分钟；读课文时让孩子大胆提问，问题没有标准答案。"
    },
    onEnterStep: onEnterStep,
    settings: { autoStopSteps: [3, 4], pauseMs: 2500 }
  });
})();
</script>
</body>
</html>
