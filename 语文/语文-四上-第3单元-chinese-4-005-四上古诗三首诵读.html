<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>四上古诗三首诵读 · AI 教师</title>
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="../assets/course.css">
<style>
  .poem { background: #fdf6e9; border: 2px solid #f0d9a8; border-radius: 16px; padding: 18px 22px; margin: 10px 0; max-width: 560px; width: 100%; }
  .poem .pt { font-size: 18px; font-weight: 800; color: #8a5a10; margin-bottom: 6px; }
  .poem .pa { font-size: 13px; color: #a07f3f; margin-bottom: 10px; }
  .poem .pl { font-size: 18px; line-height: 2; color: #4a3a10; font-weight: 600; letter-spacing: 1px; }
  .line-hl { display: inline-block; background: rgba(250,173,20,.2); border-radius: 6px; padding: 0 4px; transition: all .5s; }
  .scene { font-size: 40px; letter-spacing: 8px; min-height: 50px; }
  .fill { display: inline-block; min-width: 90px; border-bottom: 3px dashed #c9a75c; color: #b0531f; font-weight: 800; text-align: center; }
</style>
</head>
<body>
<div class="container">
  <header class="topbar">
    <a class="btn-home" href="index.html">← 语文</a>
    <span class="brand">四上古诗三首 <small>4年级·上册</small></span>
  </header>

  <div class="player">
    <div class="task-line" id="task-line"></div>
    <div class="stage" id="stage"></div>
    <div class="dots" id="dots"></div>
    <div class="controls">
      <button class="cbtn" id="btn-prev">上一步</button>
      <button class="cbtn" id="btn-auto">▶ 自动播放</button>
      <button class="cbtn" id="btn-voice">🔊 语音</button>
      <button class="cbtn main" id="btn-next">下一步</button>
    </div>
    <div class="score-row" id="score-row"></div>
  </div>

  <details class="parent-panel">
    <summary>家长模式（点击展开）</summary>
    <div class="pbody">
      <p id="parent-summary"><b>本课一句话总结：</b>三首古诗：《暮江吟》写傍晚江景（露似真珠月似弓）；《题西林壁》讲"当局者迷"的道理（不识庐山真面目，只缘身在此山中）；《雪梅》讲各有所长（梅逊雪白，雪输梅香）。</p>
      <p id="parent-attention"><b>孩子容易走神的地方：</b>只背不悟诗意；可让诗句配画面，边想画面边背。</p>
      <p id="parent-tip"><b>建议：</b>本课约 8 分钟；鼓励孩子把每首诗读熟并用自己的话讲诗意。</p>
    </div>
  </details>

  <footer class="foot">
    <div>AI 教师 · 语文 chinese-4-005</div>
  </footer>
</div>

<script src="../assets/voice.js"></script>
<script src="../assets/player-core.js"></script>
<script>
(function () {
  "use strict";
  var apiRef = null;

  var steps = [
    {
      id: "s1",
      title: "情境引入",
      task: "咱们这一步要做的：当小诗人，诵读三首古诗！",
      voice: "这单元有三首古诗等着你。第一首写傍晚的江景，第二首讲看山的道理，第三首说梅花和雪谁更美。我们一首一首来，读熟它，还要懂它的意思！",
      body: function () {
        return '' +
          '<h2>小诗人闯关 📜</h2>' +
          '<div class="poem">' +
          '<div class="pt">三首诗的名片</div>' +
          '<div class="scene" id="s1-scene">🌇 ⛰️ 🌸</div>' +
          '</div>' +
          '<div class="fc-tip" id="s1-tip">准备开始…</div>' +
          '<div class="hint">读熟 + 懂意思 = 真会古诗</div>';
      }
    },
    {
      id: "s2",
      title: "动画讲解",
      task: "咱们这一步要做的：看《暮江吟》的美丽画面！",
      voice: "看动画。傍晚，一道残阳铺在江面上，江水一半碧绿，一半通红。九月初三的夜晚多可爱呀，露珠像珍珠，月牙儿像弯弓。一边读诗，一边想画面，诗就更美了！",
      body: function () {
        return '' +
          '<h2>《暮江吟》[唐]白居易</h2>' +
          '<div class="poem" id="s2-poem">' +
          '<div class="pt">暮江吟</div>' +
          '<div class="pa">唐 · 白居易</div>' +
          '<div class="pl">一道残阳铺水中，<br>半江瑟瑟半江红。<br>可怜九月初三夜，<br>露似真珠月似弓。</div>' +
          '</div>' +
          '<div class="scene" id="s2-scene">🌇</div>' +
          '<div class="fc-tip" id="s2-tip">准备开始…</div>';
      }
    },
    {
      id: "s3",
      title: "例题演示",
      task: "咱们这一步要做的：找《题西林壁》里的道理！",
      voice: "看例题。苏轼站在庐山里看山，横着看是山岭，侧着看是山峰，远近高低都不一样。他感叹：认不清庐山真面目，是因为自己就在山里呀！这句话告诉我们的道理是——当局者迷，站在局外才看得清。",
      body: function () {
        return '' +
          '<h2>《题西林壁》[宋]苏轼</h2>' +
          '<div class="poem">' +
          '<div class="pt">题西林壁</div>' +
          '<div class="pa">宋 · 苏轼</div>' +
          '<div class="pl">横看成岭侧成峰，远近高低各不同。<br>不识庐山真面目，只缘身在此山中。</div>' +
          '</div>' +
          '<div class="scene" id="s3-scene">⛰️</div>' +
          '<div class="fc-tip" id="s3-tip">准备开始…</div>' +
          '<div class="hint">道理：当局者迷，旁观者清</div>';
      }
    },
    {
      id: "s4",
      title: "互动练习",
      task: "咱们这一步要做的：闯三关，填诗句、懂诗意！",
      voice: "现在考考你！诗句填空和诗意理解，看看你是不是真懂这三首诗。",
      body: function () {
        return '' +
          '<h2>闯关练习</h2>' +
          '<div class="quiz" id="quiz"></div>';
      }
    },
    {
      id: "s5",
      title: "要点小结",
      task: "咱们这一步要做的：Boss 关辨诗意，领星星！",
      voice: "最后总结！《暮江吟》写江景，《题西林壁》讲道理，《雪梅》比长短。读诗要想画面、懂意思。Boss 关来了！",
      body: function () {
        return '' +
          '<h2>要点小结</h2>' +
          '<div class="poem"><div class="pt">三首诗·三句话</div><div class="pl">暮江吟：江景美<br>题西林壁：当局者迷<br>雪梅：各有所长</div></div>' +
          '<div class="quiz" id="boss-quiz"></div>' +
          '<div class="result-big" id="result-stars"></div>';
      }
    }
  ];

  function runS1() {
    var sc = document.getElementById("s1-scene");
    var tip = document.getElementById("s1-tip");
    var seq = ["🌇 暮江吟：傍晚的江", "⛰️ 题西林壁：看山的道理", "🌸 雪梅：梅与雪比美"];
    seq.forEach(function (s, i) {
      setTimeout(function () { sc.textContent = seq[i]; if (tip) { tip.textContent = s; } }, 1200 + i * 1800);
    });
    setTimeout(function () { if (tip) { tip.textContent = "✅ 三首诗，读起来！"; } }, 7200);
  }

  function runS2() {
    var scene = document.getElementById("s2-scene");
    var tip = document.getElementById("s2-tip");
    var lines = document.querySelectorAll("#s2-poem .pl");
    setTimeout(function () { scene.textContent = "🌇"; if (tip) { tip.textContent = "① 一道残阳铺水中，半江红"; } }, 1000);
    setTimeout(function () { scene.textContent = "🌇🌊"; if (tip) { tip.textContent = "② 江水一半碧绿一半红"; } }, 2600);
    setTimeout(function () { scene.textContent = "🌙✨"; if (tip) { tip.textContent = "③ 露似真珠月似弓——夜晚的江"; } }, 4300);
    setTimeout(function () { if (tip) { tip.textContent = "✅ 读诗想画面，诗就活了！"; } }, 6000);
  }

  function runS3() {
    var scene = document.getElementById("s3-scene");
    var tip = document.getElementById("s3-tip");
    var angles = ["⛰️", "🏔️", "🗻"];
    angles.forEach(function (a, i) {
      setTimeout(function () { scene.textContent = a; if (tip) { tip.textContent = (i === 0 ? "① 横看成岭" : i === 1 ? "② 侧看成峰" : "③ 远近高低各不同"); } }, 1000 + i * 1500);
    });
    setTimeout(function () { if (tip) { tip.textContent = "✅ 当局者迷——跳出来才看得清！"; } }, 6200);
  }

  /* ---------- S4 练习 ---------- */
  var QUIZ = [
    { q: "“半江瑟瑟半江红”写的是什么时候的景色？", right: "傍晚", opts: ["傍晚", "清晨", "中午"] },
    { q: "“不识庐山真面目，只缘身在此山中”告诉我们？", right: "当局者迷，站得远才看得清", opts: ["当局者迷，站得远才看得清", "山很高", "庐山很神秘"] },
    { q: "《雪梅》里“梅须逊雪三分白”，意思是？", right: "梅花没有雪白", opts: ["梅花没有雪白", "雪没有梅香", "梅雪一样白"] }
  ];
  var quizDone = { q1: false, q2: false, q3: false };
  function startQuiz() {
    quizDone = { q1: false, q2: false, q3: false };
    renderQuiz();
  }
  function renderQuiz() {
    var box = document.getElementById("quiz");
    if (!box) { return; }
    var idx = -1;
    ["q1", "q2", "q3"].forEach(function (k, i) { if (!quizDone[k] && idx === -1) { idx = i; } });
    if (idx === -1) { box.innerHTML = '<div class="q">全部完成！⭐ 你真棒</div>'; return; }
    var q = QUIZ[idx];
    box.innerHTML = '<div class="q">第 ' + (idx + 1) + " 题：" + q.q + "</div>" +
      '<div class="opts">' + q.opts.map(function (o) {
        return '<div class="opt" data-ok="' + (o === q.right ? "1" : "0") + '">' + o + "</div>";
      }).join("") + "</div>" +
      "<div class='qmsg'></div><button class='qnext' disabled>下一题</button>";
    var tried = false;
    box.querySelectorAll(".opt").forEach(function (o) {
      o.addEventListener("click", function () {
        if (tried) { return; }
        var ok = o.getAttribute("data-ok") === "1";
        var msg = box.querySelector(".qmsg");
        if (ok) {
          o.classList.add("right");
          box.querySelectorAll(".opt").forEach(function (x) { x.classList.add("locked"); });
          apiRef.addStars(1); apiRef.comboHit();
          msg.className = "qmsg ok";
          msg.textContent = "对啦！⭐ +1" + (apiRef.state.combo >= 2 ? "（连击 +" + apiRef.state.combo + "）" : "");
          box.querySelector(".qnext").disabled = false;
        } else {
          o.classList.add("wrong");
          tried = true;
          apiRef.comboReset();
          msg.className = "qmsg no";
          msg.textContent = "回看诗意提示再想想";
          setTimeout(function () { o.classList.remove("wrong"); tried = false; }, 1500);
        }
      });
    });
    box.querySelector(".qnext").addEventListener("click", function () {
      quizDone["q" + (idx + 1)] = true;
      renderQuiz();
    });
  }

  /* ---------- S5 Boss ---------- */
  function startBoss() {
    var box = document.getElementById("boss-quiz");
    if (!box) { return; }
    box.innerHTML = '<div class="q">Boss 关：三首诗里，哪首是写“景物的美”？</div>' +
      '<div class="opts">' +
      '<div class="opt" data-ok="1">《暮江吟》</div>' +
      '<div class="opt" data-ok="0">《题西林壁》</div>' +
      '<div class="opt" data-ok="0">《雪梅》</div>' +
      "</div><div class='qmsg'></div>";
    var rs = document.getElementById("result-stars");
    var tried = false;
    box.querySelectorAll(".opt").forEach(function (o) {
      o.addEventListener("click", function () {
        if (tried) { return; }
        var ok = o.getAttribute("data-ok") === "1";
        var msg = box.querySelector(".qmsg");
        if (ok) {
          o.classList.add("right");
          box.querySelectorAll(".opt").forEach(function (x) { x.classList.add("locked"); });
          apiRef.addStars(2); apiRef.comboHit();
          msg.className = "qmsg ok";
          msg.textContent = "Boss 击败！⭐ +2 三首诗你掌握啦！";
          if (rs) {
            var n = apiRef.stars();
            rs.innerHTML = "🏆 共获得 <b>" + n + "</b> 颗星" +
              (n >= 9 ? "（全部拿下！）" : n >= 6 ? "（很不错！）" : "（下次再来！）");
          }
        } else {
          o.classList.add("wrong");
          tried = true;
          apiRef.comboReset();
          msg.className = "qmsg no";
          msg.textContent = "《暮江吟》写江景之美，另外两首讲道理/比长短";
          setTimeout(function () { o.classList.remove("wrong"); tried = false; }, 1800);
        }
      });
    });
  }

  /* ---------- 启动 ---------- */
  function onEnterStep(step, api) {
    apiRef = api;
    if (step.id === "s1") { runS1(); }
    if (step.id === "s2") { runS2(); }
    if (step.id === "s3") { runS3(); }
    if (step.id === "s4") { startQuiz(); }
    if (step.id === "s5") { startBoss(); }
  }

  PlayerCore.init({
    steps: steps,
    parent: {
      summary: "三首古诗：暮江吟（写江景）、题西林壁（当局者迷）、雪梅（各有所长）。读诗要想画面、懂意思。",
      attention: "孩子容易只背不悟；可让诗句配画面边想边背。",
      tip: "本课约 8 分钟；让孩子把每首诗读熟并讲诗意。"
    },
    onEnterStep: onEnterStep,
    settings: { autoStopSteps: [3, 4], pauseMs: 2500 }
  });
})();
</script>
</body>
</html>
