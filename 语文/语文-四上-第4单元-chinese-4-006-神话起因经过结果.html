<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>神话：把握起因经过结果 · AI 教师</title>
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="../assets/course.css">
<style>
  .story-card { background: #fff; border: 2px solid #e4e3dd; border-radius: 16px; padding: 16px 18px; margin: 10px 0; max-width: 600px; width: 100%; opacity: .3; transform: translateY(12px); transition: all .6s ease; }
  .story-card.on { opacity: 1; transform: translateY(0); }
  .story-card .s-tag { display: inline-block; padding: 3px 12px; border-radius: 999px; font-size: 13px; font-weight: 800; margin-bottom: 8px; color: #fff; }
  .story-card .s-txt { font-size: 15px; color: #444; line-height: 1.7; }
  .tag-y { background: #6b8fd8; }
  .tag-g { background: #52a16b; }
  .tag-o { background: #e08a3c; }
</style>
</head>
<body>
<div class="container">
  <header class="topbar">
    <a class="btn-home" href="index.html">← 语文</a>
    <span class="brand">神话：把握起因经过结果 <small>4年级·上册</small></span>
  </header>

  <div class="player">
    <div class="task-line" id="task-line"></div>
    <div class="stage" id="stage"></div>
    <div class="dots" id="dots"></div>
    <div class="controls">
      <button class="cbtn" id="btn-prev">上一步</button>
      <button class="cbtn" id="btn-auto">▶ 自动播放</button>
      <button class="cbtn" id="btn-voice">🔊 语音</button>
      <button class="cbtn main" id="btn-next">下一步</button>
    </div>
    <div class="score-row" id="score-row"></div>
  </div>

  <details class="parent-panel">
    <summary>家长模式（点击展开）</summary>
    <div class="pbody">
      <p id="parent-summary"><b>本课一句话总结：</b>读神话抓"起因→经过→结果"：起因是为什么，经过是怎么做，结果是最后怎样。抓住三要素就能复述故事。</p>
      <p id="parent-attention"><b>孩子容易走神的地方：</b>只顾听故事不抓结构；可读完让他用"起因/经过/结果"三个词各说一句。</p>
      <p id="parent-tip"><b>建议：</b>本课约 8 分钟；用《盘古开天地》《精卫填海》等熟悉神话练复述。</p>
    </div>
  </details>

  <footer class="foot">
    <div>AI 教师 · 语文 chinese-4-006</div>
  </footer>
</div>

<script src="../assets/voice.js"></script>
<script src="../assets/player-core.js"></script>
<script>
(function () {
  "use strict";
  var apiRef = null;

  var steps = [
    {
      id: "s1",
      title: "情境引入",
      task: "咱们这一步要做的：读神话故事，当故事大王！",
      voice: "神话故事特别神奇：盘古开天地、女娲补天、精卫填海……读完一个神话，你能讲给别人听吗？想讲好故事，先要抓住三件事：起因、经过、结果！",
      body: function () {
        return '' +
          '<h2>神话故事真神奇 ⚡</h2>' +
          '<div style="font-size:44px;letter-spacing:10px">🗿 🐦 🏔️</div>' +
          '<div class="fc-tip" id="s1-tip">准备开始…</div>' +
          '<div class="hint">讲故事三宝：起因 → 经过 → 结果</div>';
      }
    },
    {
      id: "s2",
      title: "动画讲解",
      task: "咱们这一步要做的：认识故事的“三明治”结构！",
      voice: "看动画。一个完整的故事就像三明治。第一层，起因：事情为什么发生。中间，经过：主人公做了什么，最精彩的部分。第三层，结果：最后怎么样了。三明治夹好，故事就完整啦！",
      body: function () {
        return '' +
          '<h2>故事三明治 🥪</h2>' +
          '<div class="story-card" data-i="0"><span class="s-tag tag-y">① 起因</span><div class="s-txt">事情为什么发生？（开头）</div></div>' +
          '<div class="story-card" data-i="1"><span class="s-tag tag-g">② 经过</span><div class="s-txt">主人公做了什么？（最精彩）</div></div>' +
          '<div class="story-card" data-i="2"><span class="s-tag tag-o">③ 结果</span><div class="s-txt">最后怎么样了？（结尾）</div></div>' +
          '<div class="fc-tip" id="s2-tip">准备开始…</div>';
      }
    },
    {
      id: "s3",
      title: "例题演示",
      task: "咱们这一步要做的：给《盘古开天地》贴上三段标签！",
      voice: "看例题。盘古的故事分三段。起因：天地混沌一片，盘古沉睡。经过：盘古劈开天地，头顶天脚踏地，撑了很久。结果：盘古倒下，身体化作万物——呼出的气变风云，眼睛变日月。你看，故事就完整了！",
      body: function () {
        return '' +
          '<h2>《盘古开天地》三段式</h2>' +
          '<div class="story-card" data-i="0"><span class="s-tag tag-y">起因</span><div class="s-txt">天地混沌一片，盘古在黑暗中沉睡。</div></div>' +
          '<div class="story-card" data-i="1"><span class="s-tag tag-g">经过</span><div class="s-txt">盘古劈开天地，头顶天、脚踏地，一直撑到天地分开。</div></div>' +
          '<div class="story-card" data-i="2"><span class="s-tag tag-o">结果</span><div class="s-txt">盘古倒下，身体化作万物：气成风云，眼成日月。</div></div>' +
          '<div class="fc-tip" id="s3-tip">准备开始…</div>';
      }
    },
    {
      id: "s4",
      title: "互动练习",
      task: "咱们这一步要做的：判断三段各是什么！",
      voice: "现在考考你！给你故事里的一句话，你要判断它是起因、经过，还是结果。",
      body: function () {
        return '' +
          '<h2>闯关练习</h2>' +
          '<div class="quiz" id="quiz"></div>';
      }
    },
    {
      id: "s5",
      title: "要点小结",
      task: "咱们这一步要做的：Boss 关定“经过”，领星星！",
      voice: "最后总结！读神话抓三要素：起因、经过、结果。抓住它们，你就能把故事完整讲给别人听，就是故事大王啦！Boss 关来了！",
      body: function () {
        return '' +
          '<h2>要点小结</h2>' +
          '<div class="story-card on" style="opacity:1;transform:none"><span class="s-tag tag-y">起因</span><span class="s-tag tag-g" style="margin-left:6px">经过</span><span class="s-tag tag-o" style="margin-left:6px">结果</span><div class="s-txt" style="margin-top:6px">三要素齐全 = 故事讲得清</div></div>' +
          '<div class="quiz" id="boss-quiz"></div>' +
          '<div class="result-big" id="result-stars"></div>';
      }
    }
  ];

  function runS1() {
    var tip = document.getElementById("s1-tip");
    setTimeout(function () { if (tip) { tip.textContent = "🗿 盘古开天地：巨人劈开混沌"; } }, 1000);
    setTimeout(function () { if (tip) { tip.textContent = "🐦 精卫填海：小鸟誓填大海"; } }, 2400);
    setTimeout(function () { if (tip) { tip.textContent = "✅ 想讲好故事？记住三要素！"; } }, 3800);
  }

  function lightCards(sel, tipId, texts) {
    var cards = document.querySelectorAll(sel);
    var tip = document.getElementById(tipId);
    cards.forEach(function (c, i) {
      setTimeout(function () {
        c.classList.add("on");
        if (tip && texts[i]) { tip.textContent = texts[i]; }
      }, 900 + i * 1700);
    });
    setTimeout(function () { if (tip && texts[texts.length - 1]) { tip.textContent = "✅ " + texts[texts.length - 1]; } }, 900 + cards.length * 1700);
  }
  function runS2() { lightCards("#s2 .story-card", "s2-tip", ["① 起因：为什么发生", "② 经过：做了什么（最精彩）", "③ 结果：最后怎样", "三明治夹好，故事完整！"]); }
  function runS3() { lightCards("#s3 .story-card", "s3-tip", ["① 起因：天地混沌，盘古沉睡", "② 经过：劈天开地，顶天立地", "③ 结果：化作万物", "盘古的故事讲完啦！"]); }

  /* ---------- S4 练习 ---------- */
  var QUIZ = [
    { q: "“精卫想填平大海”在故事里是？", right: "起因", opts: ["起因", "经过", "结果"] },
    { q: "“女娲日夜炼石补天”是？", right: "经过", opts: ["经过", "起因", "结果"] },
    { q: "“天地分开，不再合拢”是盘古故事的？", right: "结果", opts: ["结果", "起因", "经过"] }
  ];
  var quizDone = { q1: false, q2: false, q3: false };
  function startQuiz() {
    quizDone = { q1: false, q2: false, q3: false };
    renderQuiz();
  }
  function renderQuiz() {
    var box = document.getElementById("quiz");
    if (!box) { return; }
    var idx = -1;
    ["q1", "q2", "q3"].forEach(function (k, i) { if (!quizDone[k] && idx === -1) { idx = i; } });
    if (idx === -1) { box.innerHTML = '<div class="q">全部完成！⭐ 你真棒</div>'; return; }
    var q = QUIZ[idx];
    box.innerHTML = '<div class="q">第 ' + (idx + 1) + " 题：" + q.q + "</div>" +
      '<div class="opts">' + q.opts.map(function (o) {
        return '<div class="opt" data-ok="' + (o === q.right ? "1" : "0") + '">' + o + "</div>";
      }).join("") + "</div>" +
      "<div class='qmsg'></div><button class='qnext' disabled>下一题</button>";
    var tried = false;
    box.querySelectorAll(".opt").forEach(function (o) {
      o.addEventListener("click", function () {
        if (tried) { return; }
        var ok = o.getAttribute("data-ok") === "1";
        var msg = box.querySelector(".qmsg");
        if (ok) {
          o.classList.add("right");
          box.querySelectorAll(".opt").forEach(function (x) { x.classList.add("locked"); });
          apiRef.addStars(1); apiRef.comboHit();
          msg.className = "qmsg ok";
          msg.textContent = "对啦！⭐ +1" + (apiRef.state.combo >= 2 ? "（连击 +" + apiRef.state.combo + "）" : "");
          box.querySelector(".qnext").disabled = false;
        } else {
          o.classList.add("wrong");
          tried = true;
          apiRef.comboReset();
          msg.className = "qmsg no";
          msg.textContent = "为什么=起因；做了什么=经过；最后怎样=结果";
          setTimeout(function () { o.classList.remove("wrong"); tried = false; }, 1800);
        }
      });
    });
    box.querySelector(".qnext").addEventListener("click", function () {
      quizDone["q" + (idx + 1)] = true;
      renderQuiz();
    });
  }

  /* ---------- S5 Boss ---------- */
  function startBoss() {
    var box = document.getElementById("boss-quiz");
    if (!box) { return; }
    box.innerHTML = '<div class="q">Boss 关：“精卫不分日夜地衔石填海”是故事的？</div>' +
      '<div class="opts">' +
      '<div class="opt" data-ok="1">经过</div>' +
      '<div class="opt" data-ok="0">起因</div>' +
      '<div class="opt" data-ok="0">结果</div>' +
      "</div><div class='qmsg'></div>";
    var rs = document.getElementById("result-stars");
    var tried = false;
    box.querySelectorAll(".opt").forEach(function (o) {
      o.addEventListener("click", function () {
        if (tried) { return; }
        var ok = o.getAttribute("data-ok") === "1";
        var msg = box.querySelector(".qmsg");
        if (ok) {
          o.classList.add("right");
          box.querySelectorAll(".opt").forEach(function (x) { x.classList.add("locked"); });
          apiRef.addStars(2); apiRef.comboHit();
          msg.className = "qmsg ok";
          msg.textContent = "Boss 击败！⭐ +2 故事三要素你掌握啦！";
          if (rs) {
            var n = apiRef.stars();
            rs.innerHTML = "🏆 共获得 <b>" + n + "</b> 颗星" +
              (n >= 9 ? "（全部拿下！）" : n >= 6 ? "（很不错！）" : "（下次再来！）");
          }
        } else {
          o.classList.add("wrong");
          tried = true;
          apiRef.comboReset();
          msg.className = "qmsg no";
          msg.textContent = "“衔石填海”是精卫正在做的事 → 经过";
          setTimeout(function () { o.classList.remove("wrong"); tried = false; }, 1500);
        }
      });
    });
  }

  /* ---------- 启动 ---------- */
  function onEnterStep(step, api) {
    apiRef = api;
    if (step.id === "s1") { runS1(); }
    if (step.id === "s2") { runS2(); }
    if (step.id === "s3") { runS3(); }
    if (step.id === "s4") { startQuiz(); }
    if (step.id === "s5") { startBoss(); }
  }

  PlayerCore.init({
    steps: steps,
    parent: {
      summary: "读神话抓三要素：起因（为什么）、经过（做了什么）、结果（最后怎样）；抓住就能复述。",
      attention: "孩子易只听故事不抓结构；读完让他用三要素各说一句。",
      tip: "本课约 8 分钟；用熟悉的神话练复述。"
    },
    onEnterStep: onEnterStep,
    settings: { autoStopSteps: [3, 4], pauseMs: 2500 }
  });
})();
</script>
</body>
</html>
