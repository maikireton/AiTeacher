<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>闯关地图 · AI 教师</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  .map-title { font-size: 26px; font-weight: 800; margin: 18px 0 4px; text-align: center; }
  .map-tip { text-align: center; font-size: 13px; color: var(--text-2); margin-bottom: 18px; }

  .map-subj { margin: 0 0 18px; }
  .map-subj-name {
    font-size: 15px; font-weight: 700; color: #fff; background: var(--accent-deep);
    border-radius: 10px; padding: 6px 12px; margin-bottom: 8px; display: inline-block;
  }
  .map-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 8px; }
  .map-cell {
    border: 1.5px dashed var(--border); border-radius: 12px; padding: 8px 6px;
    text-align: center; background: #fff; min-height: 64px; display: flex;
    flex-direction: column; align-items: center; justify-content: center;
  }
  .map-cell.done { border: 1.5px solid var(--green); background: rgba(82,196,26,.10); }
  .map-cell-check { font-size: 18px; font-weight: 800; color: var(--green); line-height: 1.2; min-height: 22px; }
  .map-cell-name { font-size: 13px; font-weight: 700; color: var(--text); line-height: 1.4; }
  .map-cell-meta { font-size: 11px; color: var(--text-2); margin-top: 2px; }

  .week-title { font-size: 16px; font-weight: 800; margin: 20px 0 8px; text-align: center; }
  .week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; max-width: 640px; margin: 0 auto; }
  .week-cell { border: 1.5px dashed var(--border); border-radius: 12px; min-height: 72px; display: flex; align-items: center; justify-content: center; }
  .week-day { font-size: 13px; font-weight: 700; color: var(--text-2); }
  .foot-note { text-align: center; font-size: 12px; color: var(--text-2); margin: 18px 0 30px; }

  .print-bar { text-align: center; margin: 16px 0; }
  .btn-print {
    min-height: 48px; padding: 0 28px; border: none; border-radius: 12px;
    background: var(--accent-deep); color: #fff; font-size: 15px; font-weight: 700; cursor: pointer;
  }
  .btn-print:active { opacity: .85; }

  @media print {
    .topbar, .print-bar, .btn-print { display: none !important; }
    body { background: #fff; }
    .map-cell { break-inside: avoid; }
    .map-grid { grid-template-columns: repeat(5, 1fr); }
  }
</style>
</head>
<body>
<div class="container">
  <header class="topbar">
    <a class="btn-home" href="index.html">← 主页</a>
    <span class="brand">闯关地图 <small>打印贴墙，学一个点亮一个</small></span>
  </header>

  <div class="map-title">我的四科闯关地图</div>
  <div class="map-tip">每学完一个知识点，就用彩笔把它点亮（打勾 / 涂满）。每天学完，在下面打卡格打个勾。</div>

  <div id="map-subjects"></div>

  <div class="week-title">本周打卡</div>
  <div class="week-grid" id="map-week"></div>
  <div class="foot-note">连续 7 天打卡，可以找爸爸妈妈兑换一个小奖励！</div>

  <div class="print-bar"><button class="btn-print" id="btn-print" type="button">打印 / 保存为图片</button></div>
</div>

<script src="assets/knowledge-base.js"></script>
<script src="assets/kb-utils.js"></script>
<script src="assets/record.js"></script>
<script>
(function () {
  "use strict";
  try {
    var util = window.KB, KB = window.KNOWLEDGE_BASE;
    if (!util || !KB) { return; }
    var rec = window.Record || null;

    /* 四科知识点地图：只列已制作完成的课件 */
    var subjEl = document.getElementById("map-subjects");
    var html = "";
    KB.subjects.forEach(function (s) {
      var kps = util.bySubject(s.id)
        .filter(function (k) { return k.status === "已完成" && k.file; })
        .sort(function (a, b) {
          if (a.grade !== b.grade) { return a.grade - b.grade; }
          return a.id < b.id ? -1 : 1;
        });
      if (!kps.length) { return; }
      html += '<div class="map-subj"><div class="map-subj-name">' + s.name + " · 已点亮 " +
        kps.filter(function (k) { return rec && rec.records(k.id).length > 0; }).length + "/" + kps.length +
        "</div><div class='map-grid'>";
      kps.forEach(function (k) {
        var done = rec && rec.records(k.id).length > 0;
        html += '<div class="map-cell' + (done ? " done" : "") + '">';
        html += '<div class="map-cell-check">' + (done ? "✓" : "") + "</div>";
        html += '<div class="map-cell-name">' + k.name + "</div>";
        html += '<div class="map-cell-meta">' + k.grade + "年级·" + (k.term || "") + "</div>";
        html += "</div>";
      });
      html += "</div></div>";
    });
    subjEl.innerHTML = html;

    /* 本周打卡：周一 ~ 周日 */
    var weekEl = document.getElementById("map-week");
    var days = ["周一", "周二", "周三", "周四", "周五", "周六", "周日"];
    var h2 = "";
    days.forEach(function (d) { h2 += '<div class="week-cell"><div class="week-day">' + d + "</div></div>"; });
    weekEl.innerHTML = h2;

    var bp = document.getElementById("btn-print");
    if (bp) { bp.addEventListener("click", function () { window.print(); }); }
  } catch (e) { console.error("[map] 渲染失败:", e); }
})();
</script>
</body>
</html>
