<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>设置 · AI 教师</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 14px; }
  .card h2 { font-size: 16px; margin-bottom: 4px; }
  .card .desc { font-size: 13px; color: var(--text-2); margin-bottom: 12px; }
  .field { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .field select {
    flex: 1 1 240px; min-width: 0; min-height: 44px; padding: 0 12px;
    border: 1px solid var(--border); border-radius: 12px; background: var(--card);
    font-size: 15px; color: var(--text); outline: none;
  }
  .field select:focus { border-color: var(--accent-deep); }
  .status { font-size: 13px; color: var(--text-2); margin-top: 10px; min-height: 20px; }
  .status.ok { color: var(--green); }
  .status.warn { color: #b07900; }
  .note { font-size: 12px; color: var(--text-2); background: rgba(0,0,0,.04); border-radius: 10px; padding: 10px 12px; margin-top: 12px; }
</style>
</head>
<body>
<div class="container">
  <header class="topbar">
    <a class="btn-home" href="index.html">← 主页</a>
    <span class="brand">设置</span>
  </header>

  <div class="card">
    <h2>语音 · 音色</h2>
    <div class="desc">课件讲解使用中文（普通话）语音。这里只提供<strong>简体中文（zh-cn）音色</strong>，选择后所有课件都会用这个声音讲解。</div>
    <div class="field">
      <select id="voice-select" aria-label="选择简体中文音色">
        <option value="">加载中…</option>
      </select>
    </div>
    <div class="status" id="voice-status"></div>
    <div class="note" id="voice-note"></div>
  </div>

  <div class="card">
    <h2>说明</h2>
    <div class="desc">
      <p>· 音色来自你电脑系统自带的简体中文（普通话）语音，数量取决于系统安装了哪些中文语音包。</p>
      <p>· 想换更多好听的声音：Windows 到「设置 → 时间和语言 → 语音」、macOS 到「系统设置 → 辅助功能 → 朗读内容」里添加中文语音。</p>
      <p>· 建议用 Chrome / Edge 浏览器打开课件，语音效果最好。</p>
    </div>
  </div>

  <footer class="foot">
    <div>AI 教师 · 设置</div>
  </footer>
</div>

<script>
(function () {
  "use strict";
  var SETTINGS_KEY = "aiTeacher:settings";
  var select = document.getElementById("voice-select");
  var statusEl = document.getElementById("voice-status");
  var noteEl = document.getElementById("voice-note");

  /* localStorage 安全读写（file:// 下部分浏览器受限，失败则降级内存） */
  var memSettings = null;
  function readSettings() {
    if (memSettings) { return memSettings; }
    try {
      var raw = window.localStorage.getItem(SETTINGS_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }
  function saveSettings(s) {
    memSettings = s;
    try { window.localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); } catch (e) { /* 降级：仅本次会话生效 */ }
  }

  var zhVoices = [];
  function collectVoices() {
    if (!("speechSynthesis" in window)) { return []; }
    var all = window.speechSynthesis.getVoices() || [];
    /* 只保留简体中文普通话（zh-cn）音色 */
    return all.filter(function (v) {
      return (v.lang || "").toLowerCase().indexOf("zh-cn") === 0;
    });
  }

  function render() {
    zhVoices = collectVoices();
    var saved = readSettings();
    var savedURI = saved && saved.voice ? saved.voice.uri : "";

    if (!zhVoices.length) {
      select.innerHTML = '<option value="">（未检测到简体中文音色）</option>';
      statusEl.className = "status warn";
      statusEl.textContent = "没有找到简体中文（zh-cn）语音。请换用 Chrome/Edge 浏览器，或在系统设置里添加中文语音后刷新本页。";
      noteEl.textContent = "当前设备可用的简体中文音色：0 个";
      return;
    }

    var html = "";
    var found = false;
    zhVoices.forEach(function (v) {
      var sel = v.voiceURI === savedURI ? " selected" : "";
      if (v.voiceURI === savedURI) { found = true; }
      var label = (v.name || v.voiceURI || "未知音色") + "（" + v.lang + "）";
      html += '<option value="' + v.voiceURI.replace(/"/g, "&quot;") + '"' + sel + ">" + label + "</option>";
    });
    select.innerHTML = html;
    // 保存的音色已不存在时回退到第一个
    if (savedURI && !found && zhVoices[0]) { select.value = zhVoices[0].voiceURI; }

    statusEl.className = "status";
    statusEl.textContent = "已选择：" + (select.options[select.selectedIndex] ? select.options[select.selectedIndex].text.split("（")[0] : "");
    noteEl.textContent = "当前设备可用的简体中文音色：" + zhVoices.length + " 个";
  }

  function pickVoice() {
    var uri = select.value;
    if (!uri) { return null; }
    for (var i = 0; i < zhVoices.length; i++) {
      if (zhVoices[i].voiceURI === uri) { return zhVoices[i]; }
    }
    return null;
  }

  /* 选择变化：保存 */
  select.addEventListener("change", function () {
    var v = pickVoice();
    var uri = v ? v.voiceURI : "";
    var name = v ? v.name : "";
    saveSettings({ voice: { uri: uri, name: name } });
    statusEl.className = "status ok";
    statusEl.textContent = "已保存音色：" + (name || uri || "默认");
  });

  /* voiceschanged 事件（语音列表异步加载） */
  if ("speechSynthesis" in window) {
    window.speechSynthesis.onvoiceschanged = function () { render(); };
  }
  render();
})();
</script>
</body>
</html>
