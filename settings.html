<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>设置 · AI 教师</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 14px; }
  .card h2 { font-size: 16px; margin-bottom: 4px; }
  .card .desc { font-size: 13px; color: var(--text-2); margin-bottom: 12px; }
  .field { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .field label { flex: 0 0 76px; font-size: 14px; font-weight: 700; color: var(--text); }
  .field select {
    flex: 1 1 240px; min-width: 0; min-height: 44px; padding: 0 12px;
    border: 1px solid var(--border); border-radius: 12px; background: var(--card);
    font-size: 15px; color: var(--text); outline: none;
  }
  .field select:focus { border-color: var(--accent-deep); }
  .btn { min-height: 44px; padding: 0 18px; border-radius: 12px; border: none; background: var(--accent-deep); color: #fff; font-size: 14px; cursor: pointer; }
  .btn:active { opacity: .85; }
  .status { font-size: 13px; color: var(--text-2); margin-top: 6px; min-height: 20px; }
  .status.ok { color: var(--green); }
  .status.warn { color: #b07900; }
  .note { font-size: 12px; color: var(--text-2); background: rgba(0,0,0,.04); border-radius: 10px; padding: 10px 12px; margin-top: 12px; }
</style>
</head>
<body>
<div class="container">
  <header class="topbar">
    <a class="btn-home" href="index.html">← 主页</a>
    <span class="brand">设置</span>
  </header>

  <div class="card">
    <h2>语音 · 音色</h2>
    <div class="desc">课件讲解支持中文（普通话）和英文。下面可以<strong>分别选择中文音色和英文音色</strong>，选择后所有课件都会用你选的声音讲解。</div>
    <div class="field">
      <label for="voice-zh">中文音色</label>
      <select id="voice-zh" aria-label="选择简体中文音色">
        <option value="">加载中…</option>
      </select>
      <button class="btn" id="btn-preview-zh" type="button">播放</button>
    </div>
    <div class="field">
      <label for="voice-en">英文音色</label>
      <select id="voice-en" aria-label="选择英文音色">
        <option value="">加载中…</option>
      </select>
      <button class="btn" id="btn-preview-en" type="button">播放</button>
    </div>
    <div class="status" id="voice-status"></div>
    <div class="note" id="voice-note"></div>
  </div>

  <div class="card">
    <h2>说明</h2>
    <div class="desc">
      <p>· 音色来自你电脑系统自带的语音，数量取决于系统安装了哪些语音包。</p>
      <p>· 想换更多好听的声音：Windows 到「设置 → 时间和语言 → 语音」、macOS 到「系统设置 → 辅助功能 → 朗读内容」里添加中文/英文语音。</p>
      <p>· 建议用 Chrome / Edge 浏览器打开课件，语音效果最好。</p>
    </div>
  </div>

  <footer class="foot">
    <div>AI 教师 · 设置</div>
  </footer>
</div>

<script>
(function () {
  "use strict";
  var SETTINGS_KEY = "aiTeacher:settings";
  var selZh = document.getElementById("voice-zh");
  var selEn = document.getElementById("voice-en");
  var statusEl = document.getElementById("voice-status");
  var noteEl = document.getElementById("voice-note");

  /* localStorage 安全读写（file:// 下部分浏览器受限，失败则降级内存） */
  var memSettings = null;
  function readSettings() {
    if (memSettings) { return memSettings; }
    try {
      var raw = window.localStorage.getItem(SETTINGS_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }
  function saveSettings(s) {
    memSettings = s;
    try { window.localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); } catch (e) { /* 降级：仅本次会话生效 */ }
  }

  var zhVoices = [], enVoices = [];
  function collectVoices() {
    if (!("speechSynthesis" in window)) { return; }
    var all = window.speechSynthesis.getVoices() || [];
    zhVoices = all.filter(function (v) { return (v.lang || "").toLowerCase().indexOf("zh") === 0; });
    enVoices = all.filter(function (v) { return (v.lang || "").toLowerCase().indexOf("en") === 0; });
  }

  function fillSelect(sel, list, savedURI) {
    if (!list.length) {
      sel.innerHTML = '<option value="">（未检测到音色）</option>';
      return;
    }
    var html = "";
    var found = false;
    list.forEach(function (v) {
      var selAttr = v.voiceURI === savedURI ? " selected" : "";
      if (v.voiceURI === savedURI) { found = true; }
      html += '<option value="' + v.voiceURI.replace(/"/g, "&quot;") + '"' + selAttr + ">" +
        (v.name || v.voiceURI || "未知音色") + "（" + v.lang + "）</option>";
    });
    sel.innerHTML = html;
    if (savedURI && !found && list[0]) { sel.value = list[0].voiceURI; }
  }

  function render() {
    collectVoices();
    var saved = readSettings();
    var savedZh = saved && saved.voice ? saved.voice.uri : "";
    var savedEn = saved && saved.voiceEn ? saved.voiceEn.uri : "";

    if (!zhVoices.length && !enVoices.length) {
      selZh.innerHTML = '<option value="">（未检测到语音）</option>';
      selEn.innerHTML = '<option value="">（未检测到语音）</option>';
      statusEl.className = "status warn";
      statusEl.textContent = "没有找到可用语音。请换用 Chrome/Edge 浏览器，或在系统设置里添加语音后刷新本页。";
      noteEl.textContent = "当前设备可用语音：中文 0 个 · 英文 0 个";
      return;
    }

    fillSelect(selZh, zhVoices, savedZh);
    fillSelect(selEn, enVoices, savedEn);

    var zhName = selZh.options[selZh.selectedIndex] ? selZh.options[selZh.selectedIndex].text.split("（")[0] : "默认";
    var enName = selEn.options[selEn.selectedIndex] ? selEn.options[selEn.selectedIndex].text.split("（")[0] : "默认";
    statusEl.className = "status";
    statusEl.textContent = "中文音色：" + zhName + "　·　英文音色：" + enName;
    noteEl.textContent = "当前设备可用音色：中文 " + zhVoices.length + " 个 · 英文 " + enVoices.length + " 个";
  }

  function pick(sel, list) {
    var uri = sel.value;
    if (!uri) { return null; }
    for (var i = 0; i < list.length; i++) {
      if (list[i].voiceURI === uri) { return list[i]; }
    }
    return null;
  }

  /* 试听：用当前选中的音色朗读测试句 */
  function preview(sel, list, text, fallbackLang) {
    var v = pick(sel, list);
    if (!v || !("speechSynthesis" in window)) { return; }
    try {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = v.lang || fallbackLang;
      u.voice = v;
      u.rate = 0.92;
      u.pitch = 1.05;
      window.speechSynthesis.speak(u);
    } catch (e) { /* 忽略 */ }
  }
  var btnZh = document.getElementById("btn-preview-zh");
  var btnEn = document.getElementById("btn-preview-en");
  if (btnZh) { btnZh.addEventListener("click", function () { preview(selZh, zhVoices, "你好，我是你的小老师。这个声音好不好听？", "zh-CN"); }); }
  if (btnEn) { btnEn.addEventListener("click", function () { preview(selEn, enVoices, "Hello! I am your little teacher. Do you like this voice?", "en-US"); }); }

  /* 选择变化：保存 */
  function onChange(sel, list, key) {
    var v = pick(sel, list);
    var s = readSettings() || {};
    s[key] = v ? { uri: v.voiceURI, name: v.name } : null;
    saveSettings(s);
    statusEl.className = "status ok";
    var label = key === "voiceEn" ? "英文音色" : "中文音色";
    statusEl.textContent = "已保存" + label + "：" + (v ? v.name : "默认");
  }
  selZh.addEventListener("change", function () { onChange(selZh, zhVoices, "voice"); });
  selEn.addEventListener("change", function () { onChange(selEn, enVoices, "voiceEn"); });

  /* voiceschanged 事件（语音列表异步加载） */
  if ("speechSynthesis" in window) {
    window.speechSynthesis.onvoiceschanged = function () { render(); };
  }
  render();
})();
</script>
</body>
</html>
